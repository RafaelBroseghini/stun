<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesseract</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300&family=IBM+Plex+Mono&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#f2f0ea}canvas{display:block;width:100%;height:100%}
.t{position:fixed;left:5vw;top:6vh;font:300 clamp(40px,7vw,110px)/.9 Newsreader,serif;color:#141414;letter-spacing:-.02em}.t small{display:block;font:12px 'IBM Plex Mono',monospace;letter-spacing:.12em;margin-top:16px;color:#555}
.pl{position:fixed;right:5vw;bottom:6vh;display:flex;gap:8px;font:12px 'IBM Plex Mono',monospace}.pl label{display:flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid #141414;border-radius:20px;cursor:pointer}.pl input{accent-color:#ff4a1c}</style></head><body>
<canvas id="c"></canvas><div class="t">Tesseract<small>a 4-cube rotating through the 3rd dimension we cannot see<br>16 vertices · 32 edges · 24 faces · 8 cells</small></div>
<div class="pl" id="pl"></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H;function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
const V=[];for(let i=0;i<16;i++)V.push([i&1?1:-1,i&2?1:-1,i&4?1:-1,i&8?1:-1]);const E=[];for(let i=0;i<16;i++)for(let j=i+1;j<16;j++){let d=0;for(let k=0;k<4;k++)if(V[i][k]!==V[j][k])d++;if(d===1)E.push([i,j])}
const planes={XW:[0,3,1],YW:[1,3,.7],ZW:[2,3,.5],XY:[0,1,.3]};const on={XW:true,YW:false,ZW:true,XY:true};const pl=document.getElementById('pl');
Object.keys(planes).forEach(k=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox" ${on[k]?'checked':''}> ${k}`;l.querySelector('input').onchange=e=>on[k]=e.target.checked;pl.appendChild(l)});
const ang={XW:0,YW:0,ZW:0,XY:0};
function f(){x.fillStyle='#f2f0ea';x.fillRect(0,0,W,H);for(const k in planes)if(on[k])ang[k]+=.006*planes[k][2];
const P=V.map(v=>{let p=v.slice();for(const k in planes){const [a,b]=planes[k],t=ang[k],ca=Math.cos(t),sa=Math.sin(t);const pa=p[a]*ca-p[b]*sa,pb=p[a]*sa+p[b]*ca;p[a]=pa;p[b]=pb}
const w=1/(2.6-p[3]);const q=[p[0]*w,p[1]*w,p[2]*w];const ry=.5,cy=Math.cos(ry),sy=Math.sin(ry);const X=q[0]*cy-q[2]*sy,Z=q[0]*sy+q[2]*cy;const z=1/(3-Z);const S=Math.min(W,H)*1.05;return[W*.58+X*z*S,H*.52+q[1]*z*S,p[3],Z]});
const es=E.map(([a,b])=>[a,b,(P[a][3]+P[b][3])/2]).sort((p,q)=>p[2]-q[2]);
for(const [a,b] of es){const w=(P[a][2]+P[b][2])/2;const inner=w>0;x.strokeStyle=inner?'#ff4a1c':'#141414';x.globalAlpha=.35+(w+1)/2*.65;x.lineWidth=(1+(w+1)*1.4)*dpr;x.beginPath();x.moveTo(P[a][0],P[a][1]);x.lineTo(P[b][0],P[b][1]);x.stroke()}
x.globalAlpha=1;for(const p of P){x.fillStyle=p[2]>0?'#ff4a1c':'#141414';x.beginPath();x.arc(p[0],p[1],(2+(p[2]+1)*2)*dpr,0,7);x.fill()}requestAnimationFrame(f)}f();
</script></body></html>
