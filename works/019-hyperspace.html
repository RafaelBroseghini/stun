<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hyperspace Corridor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;cursor:none;touch-action:none}
.hud{position:fixed;left:0;right:0;bottom:4vh;display:flex;justify-content:center;gap:6vw;color:#9fdcff;font:500 11px 'Chakra Petch',sans-serif;letter-spacing:.3em;text-transform:uppercase;pointer-events:none;text-shadow:0 0 8px rgba(80,180,255,.6)}
.hud b{display:block;font-size:22px;color:#fff;letter-spacing:.08em;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.sys{position:fixed;left:4vw;top:4vh;color:#9fdcff;font:500 11px/1.7 'Chakra Petch';letter-spacing:.3em;text-transform:uppercase;pointer-events:none;text-shadow:0 0 8px rgba(80,180,255,.6)}
.sys b{display:block;font:700 clamp(22px,3vw,36px)/1 'Chakra Petch';letter-spacing:.12em;color:#fff;margin:6px 0}
.sys.flash b{animation:fl .9s steps(2) 3}@keyframes fl{50%{opacity:.2}}
.frame{position:fixed;inset:2.5vh 2.5vw;pointer-events:none;border:1px solid rgba(159,220,255,.12);clip-path:polygon(0 0,8% 0,8% 1px,92% 1px,92% 0,100% 0,100% 100%,92% 100%,92% calc(100% - 1px),8% calc(100% - 1px),8% 100%,0 100%)}
.wo{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.tip{position:fixed;right:4vw;top:4vh;text-align:right;color:rgba(159,220,255,.6);font:400 10px/1.8 'Chakra Petch';letter-spacing:.28em;text-transform:uppercase;pointer-events:none}
@media (max-width:640px){.tip{display:none}.hud{gap:4vw}.hud b{font-size:17px}}
</style></head><body>
<canvas id="c"></canvas><div class="frame"></div><div class="wo" id="wo"></div>
<div class="sys" id="sys">Current system<b id="sn">Kepler Drift</b><span id="sd">G-class · 4 worlds</span></div>
<div class="tip">Steer with the cursor<br>Hold to spool the drive<br>Release at full charge to jump</div>
<div class="hud"><div>Velocity<b id="v">0.00 c</b></div><div>Heading<b id="h">000°</b></div><div>Drive<b id="s">CRUISE</b></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);let W,H,S=[],sp=3.2,cx=0,cy=0,tx=0,ty=0,mx=.5,my=.5,neb;
const names=[['Kepler Drift','G-class · 4 worlds',205],['Vashti Reach','M-dwarf · ringed giant',12],['Corvid Spur','Binary · ice moons',150],['Halcyon Deep','Blue giant · nebula',265],['Tamsin Gate','K-class · gas dwarf',38],['Ossuary Field','Pulsar · debris belt',300]];let si=0;
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;makeNeb()}
function makeNeb(){neb=document.createElement('canvas');neb.width=Math.ceil(W/3);neb.height=Math.ceil(H/3);const n=neb.getContext('2d');const h=names[si][2];for(let i=0;i<18;i++){const r=Math.random()*neb.width*.45+neb.width*.08,px=Math.random()*neb.width,py=Math.random()*neb.height;const g=n.createRadialGradient(px,py,0,px,py,r);const hh=h+(Math.random()*60-30);g.addColorStop(0,`hsla(${hh},70%,45%,.16)`);g.addColorStop(1,'hsla(0,0%,0%,0)');n.fillStyle=g;n.fillRect(0,0,neb.width,neb.height)}}
size();addEventListener('resize',size);
for(let i=0;i<2400;i++)S.push({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random(),h:190+Math.random()*80});
let planet={x:.35,y:-.18,r:.16,h:205,grow:0};
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight;tx=(mx-.5)*.6;ty=(my-.5)*.6});
let state='cruise',charge=0,hold=false,jt=0;const sE=document.getElementById('s');
addEventListener('pointerdown',()=>{hold=true;audio()});addEventListener('pointerup',release);addEventListener('pointercancel',release);
addEventListener('keydown',e=>{if(e.code==='Space'&&!hold){e.preventDefault();hold=true;audio()}});addEventListener('keyup',e=>{if(e.code==='Space')release()});
function release(){hold=false;if(state==='cruise'&&charge>=1){state='jump';jt=0}}
let ac,osc,og,lfo;function audio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();osc.type='sawtooth';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=320;og=ac.createGain();og.gain.value=0;osc.frequency.value=48;osc.connect(f).connect(og).connect(ac.destination);osc.start()}catch(e){}}
function arrive(){si=(si+1)%names.length;const n=names[si];document.getElementById('sn').textContent=n[0];document.getElementById('sd').textContent=n[1];const sy=document.getElementById('sys');sy.classList.remove('flash');void sy.offsetWidth;sy.classList.add('flash');makeNeb();planet={x:(Math.random()<.5?-1:1)*(.2+Math.random()*.25),y:(Math.random()-.5)*.4,r:.1+Math.random()*.12,h:n[2],grow:0,ring:Math.random()<.5};S.forEach(s=>s.h=n[2]-15+Math.random()*80)}
const wo=document.getElementById('wo');let last=performance.now();
function f(now){const dt=Math.min(50,now-last)/1000;last=now;cx+=(tx-cx)*.05;cy+=(ty-cy)*.05;
let tsp=3.2;if(state==='cruise'){if(hold){charge=Math.min(1,charge+dt*.55);tsp=3.2+charge*7}else charge=Math.max(0,charge-dt*.8);sE.textContent=charge>=1?'READY':hold?'SPOOL '+Math.round(charge*100)+'%':'CRUISE'}
else if(state==='jump'){jt+=dt;tsp=70;charge=0;sE.textContent='JUMP';wo.style.opacity=jt<.12?1-jt/.12:0;if(jt>2.3){state='arrive';jt=0;arrive();wo.style.transition='opacity .6s';wo.style.opacity=.9;setTimeout(()=>{wo.style.opacity=0},60)}}
else{jt+=dt;tsp=1.4;sE.textContent='ARRIVED';if(jt>2.5){state='cruise';wo.style.transition=''}}
sp+=(tsp-sp)*(state==='jump'?.05:.03);
if(og){og.gain.setTargetAtTime(.02+Math.min(.07,sp/300),ac.currentTime,.1);osc.frequency.setTargetAtTime(40+sp*4+charge*60,ac.currentTime,.1)}
x.fillStyle=`rgba(2,0,14,${Math.max(.08,.42-Math.min(.34,sp/60))})`;x.fillRect(0,0,W,H);
if(state!=='jump'){x.globalAlpha=.6;x.drawImage(neb,-cx*W*.1-W*.05,-cy*H*.1-H*.05,W*1.1,H*1.1);x.globalAlpha=1}
// planet
if(state!=='jump'){planet.grow+=dt*.004;const pr=Math.min(W,H)*(planet.r+planet.grow),px=W/2+(planet.x-cx*.6)*W,py=H/2+(planet.y-cy*.6)*H;
const g=x.createRadialGradient(px-pr*.4,py-pr*.4,pr*.1,px,py,pr);g.addColorStop(0,`hsl(${planet.h},55%,62%)`);g.addColorStop(.7,`hsl(${planet.h},60%,22%)`);g.addColorStop(1,`hsl(${planet.h},70%,6%)`);x.fillStyle=g;x.beginPath();x.arc(px,py,pr,0,7);x.fill();
x.strokeStyle=`hsla(${planet.h},80%,70%,.35)`;x.lineWidth=4*dpr;x.beginPath();x.arc(px,py,pr+2*dpr,3.4,5.6);x.stroke();
if(planet.ring){x.save();x.translate(px,py);x.rotate(-.35);x.strokeStyle=`hsla(${planet.h+30},50%,75%,.5)`;x.lineWidth=pr*.06;x.beginPath();x.ellipse(0,0,pr*1.9,pr*.42,0,Math.PI,Math.PI*2);x.stroke();x.restore()}}
const F=Math.min(W,H)*.6;
for(const s of S){const pz=s.z;s.z-=.002*sp*(dt*60);if(s.z<=.01){s.z=1;s.x=(Math.random()-.5)*2;s.y=(Math.random()-.5)*2;continue}
const k=F/s.z,X=W/2+(s.x-cx)*k,Y=H/2+(s.y-cy)*k,pk=F/pz,PX=W/2+(s.x-cx)*pk,PY=H/2+(s.y-cy)*pk;if(X<0||X>W||Y<0||Y>H)continue;
const b=1-s.z;x.strokeStyle=`hsla(${s.h+sp*2},${60+Math.min(30,sp)}%,${60+b*35}%,${Math.min(1,b+.25)})`;x.lineWidth=(b*2.6+.6)*dpr;x.lineCap='round';x.beginPath();x.moveTo(PX,PY);x.lineTo(X,Y);x.stroke()}
if(state==='jump'){// tunnel rings
for(let i=0;i<14;i++){const z=((i/14-now*.0006)%1+1)%1+.02;const r=Math.min(W,H)*.08/z;x.strokeStyle=`hsla(${names[(si+1)%names.length][2]},90%,70%,${(1-z)*.35})`;x.lineWidth=(1-z)*6*dpr;x.beginPath();x.arc(W/2-cx*W*.2,H/2-cy*H*.2,r,0,7);x.stroke()}}
if(sp>4){const g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*.35);g.addColorStop(0,`rgba(160,220,255,${Math.min(.3,sp/120)})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}
// reticle + charge ring
const rx=mx*W,ry=my*H,R=26*dpr;x.strokeStyle='rgba(159,220,255,.7)';x.lineWidth=1.2*dpr;x.beginPath();for(let q=0;q<4;q++){const a=q*Math.PI/2+.3;x.moveTo(rx+Math.cos(a)*R,ry+Math.sin(a)*R);x.arc(rx,ry,R,a,a+.95)}x.stroke();
x.beginPath();x.moveTo(rx-6*dpr,ry);x.lineTo(rx+6*dpr,ry);x.moveTo(rx,ry-6*dpr);x.lineTo(rx,ry+6*dpr);x.stroke();
if(charge>0){x.strokeStyle=charge>=1?'#fff':'#5fd0ff';x.shadowColor='#5fd0ff';x.shadowBlur=12*dpr;x.lineWidth=3*dpr;x.beginPath();x.arc(rx,ry,R+8*dpr,-Math.PI/2,-Math.PI/2+charge*Math.PI*2);x.stroke();x.shadowBlur=0}
document.getElementById('v').textContent=(state==='jump'?(9.2+Math.random()*.6).toFixed(2)+' wf':(sp/14*.99).toFixed(2)+' c');document.getElementById('h').textContent=String(Math.round((cx*300+360)%360)).padStart(3,'0')+'°';requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
