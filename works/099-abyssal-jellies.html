<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abyssal Jellies</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@300;600&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#01040d}canvas{display:block;width:100%;height:100%}
.t{position:fixed;left:5vw;bottom:6vh;color:#bfe9ff;font:300 13px 'Cormorant Unicase',serif;letter-spacing:.3em}.t b{display:block;font-weight:600;font-size:clamp(26px,4vw,52px);letter-spacing:.08em}</style></head><body>
<canvas id="c"></canvas><div class="t"><b>The Midnight Zone</b>1,000 – 4,000 m · no sunlight reaches here · your cursor is a lantern · click to startle them</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H,snow;function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;snow=Array.from({length:240},()=>[Math.random()*W,Math.random()*H,Math.random()])}size();addEventListener('resize',size);
const J=Array.from({length:7},(_,i)=>{const s=(30+Math.random()*50)*dpr;const j={x:Math.random()*innerWidth*dpr,y:(.2+Math.random()*.7)*innerHeight*dpr,s,h:[190,280,320,170,210,300,250][i],ph:Math.random()*6,vy:0,T:[]};for(let k=0;k<9;k++){const seg=[];for(let m=0;m<16;m++)seg.push({x:j.x,y:j.y+m*6*dpr,px:j.x,py:j.y+m*6*dpr});j.T.push(seg)}return j});
let mx=-1,my=-1,flash=0;addEventListener('pointermove',e=>{mx=e.clientX*dpr;my=e.clientY*dpr});addEventListener('pointerdown',()=>{flash=1;J.forEach(j=>{j.vy-=(3+Math.random()*3)*dpr;j.x+=(Math.random()-.5)*20*dpr})});
function f(t){x.fillStyle='rgba(1,4,13,.35)';x.fillRect(0,0,W,H);flash*=.95;if(mx>0){const lg=x.createRadialGradient(mx,my,0,mx,my,160*dpr);lg.addColorStop(0,'rgba(150,220,255,.16)');lg.addColorStop(1,'rgba(150,220,255,0)');x.fillStyle=lg;x.fillRect(mx-160*dpr,my-160*dpr,320*dpr,320*dpr)}x.fillStyle='rgba(180,220,255,.35)';for(const s of snow){s[1]+=.2*s[2]*dpr;s[0]+=Math.sin(t*.0005+s[2]*9)*.2;if(s[1]>H)s[1]=0;x.fillRect(s[0],s[1],s[2]*1.6*dpr,s[2]*1.6*dpr)}
x.globalCompositeOperation='lighter';for(const j of J){const p=Math.sin(t*.0025+j.ph),pulse=Math.max(0,p);j.vy=j.vy*.96-pulse*.12*dpr+.03*dpr;j.y+=j.vy;j.x+=Math.sin(t*.0004+j.ph)*.3*dpr;if(mx>0){j.x+=(mx-j.x)*.0025;j.y+=(my-j.y)*.0012}if(j.y<-j.s*2){j.y=H+j.s*2;j.T.forEach(s=>s.forEach(q=>{q.y=j.y;q.py=j.y}))}
const w=j.s*(1+.18*p),h=j.s*(.8-.15*p);
j.T.forEach((seg,k)=>{const ax=j.x+(k/(j.T.length-1)-.5)*w*1.6,ay=j.y+h*.1;seg[0].x=ax;seg[0].y=ay;for(let m=1;m<seg.length;m++){const q=seg[m];const vx=(q.x-q.px)*.9,vy=(q.y-q.py)*.9;q.px=q.x;q.py=q.y;q.x+=vx+Math.sin(t*.002+m*.4+k)*.15*dpr;q.y+=vy+.25*dpr}
for(let it=0;it<2;it++)for(let m=1;m<seg.length;m++){const a=seg[m-1],q=seg[m];const dx=q.x-a.x,dy=q.y-a.y,d=Math.hypot(dx,dy)||1,L=(k%3?6:9)*dpr;const df=(d-L)/d;q.x-=dx*df;q.y-=dy*df}
x.strokeStyle=`hsla(${j.h},90%,70%,.35)`;x.lineWidth=(k%3?1:2)*dpr;x.beginPath();seg.forEach((q,m)=>m?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.stroke()});
const g=x.createRadialGradient(j.x,j.y-h*.2,0,j.x,j.y,w*1.4);g.addColorStop(0,`hsla(${j.h},90%,${75+flash*15}%,${.55+flash*.4})`);g.addColorStop(.5,`hsla(${j.h},90%,55%,.18)`);g.addColorStop(1,'hsla(0,0%,0%,0)');x.fillStyle=g;x.beginPath();x.arc(j.x,j.y,w*1.4,0,7);x.fill();
x.fillStyle=`hsla(${j.h},80%,70%,.25)`;x.strokeStyle=`hsla(${j.h},95%,80%,.8)`;x.lineWidth=1.5*dpr;x.beginPath();x.moveTo(j.x-w,j.y+h*.1);x.bezierCurveTo(j.x-w,j.y-h*1.3,j.x+w,j.y-h*1.3,j.x+w,j.y+h*.1);for(let k=0;k<=8;k++){x.lineTo(j.x+w-(k/8)*w*2,j.y+h*.1+(k%2?h*.18:0))}x.fill();x.stroke();
x.strokeStyle=`hsla(${j.h+40},100%,85%,.6)`;x.beginPath();for(let k=0;k<4;k++){x.moveTo(j.x,j.y-h*.6);x.quadraticCurveTo(j.x+(k-1.5)*w*.4,j.y-h*.2,j.x+(k-1.5)*w*.3,j.y+h*.05)}x.stroke()}x.globalCompositeOperation='source-over';requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
