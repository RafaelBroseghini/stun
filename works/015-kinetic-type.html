<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinetic Type</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@700&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{--bg:#1d1bd0;--fg:#fff;--ac:#ff7ad9;background:var(--bg);font-family:Anton,Impact,sans-serif;transition:background .5s;cursor:pointer;user-select:none;-webkit-user-select:none}
body.s1{--bg:#0d0d0d;--fg:#e8ff3a;--ac:#ff4d2e}body.s2{--bg:#f3ecdf;--fg:#111;--ac:#e8352c}body.s3{--bg:#ff4f1f;--fg:#ffe9d6;--ac:#1d1bd0}
.stage{position:fixed;inset:-12vh -10vw;display:flex;flex-direction:column;justify-content:center;transform:rotate(-6deg)}
.r{white-space:nowrap;font-size:16.5vh;line-height:.95;text-transform:uppercase;will-change:transform;transform-origin:center;transition:color .3s}
.r .tr{display:inline-block;will-change:transform}
.r span{display:inline-block;padding-right:.3em}
.r.o{color:transparent;-webkit-text-stroke:2px var(--fg)}.r.a{color:var(--ac)}.r.f{color:var(--fg)}
.r.hot{color:var(--fg);-webkit-text-stroke:0}.r.o.hot{color:var(--ac)}
.badge{position:fixed;right:5vw;bottom:6vh;width:min(22vw,180px);aspect-ratio:1;pointer-events:none;mix-blend-mode:difference}
.badge svg{width:100%;height:100%;fill:#fff;font:700 12px 'Space Mono',monospace;letter-spacing:.25em}
.hud{position:fixed;left:5vw;bottom:6vh;font:700 11px/1.7 'Space Mono',monospace;letter-spacing:.2em;color:#fff;mix-blend-mode:difference;text-transform:uppercase;pointer-events:none}
.hud b{display:block;font:400 42px/1 Anton;letter-spacing:0;font-variant-numeric:tabular-nums}
.intro{position:fixed;inset:0;background:var(--fg);transform-origin:top;animation:wipe 1s .1s cubic-bezier(.8,0,.2,1) forwards;pointer-events:none;z-index:9}@keyframes wipe{to{transform:scaleY(0)}}
</style></head><body><div class="intro"></div>
<div class="stage" id="st"></div>
<div class="badge"><svg viewBox="0 0 200 200" id="bd"><defs><path id="cp" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs><text><textPath href="#cp">SCROLL · FLING · CLICK · KINETIC · RESTLESS · </textPath></text><circle cx="100" cy="100" r="8"/></svg></div>
<div class="hud">Velocity<b id="vv">1.00</b>scroll to accelerate · click to recolour</div>
<script>
const rows=['Motion is the message','Every letter wants to run','Speed · weight · rhythm','Type in perpetual transit','Read me if you can','Kinetic · restless · loud','The page never sits still'];
const st=document.getElementById('st'),R=[];
rows.forEach((t,i)=>{const r=document.createElement('div');r.className='r '+(i%4===3?'f':i%3===2?'a':i%2===0?'o':'f');const tr=document.createElement('div');tr.className='tr';tr.innerHTML=`<span>${t} —&nbsp;</span>`.repeat(5);r.appendChild(tr);st.appendChild(r);R.push({r,tr,x:-Math.random()*400,sp:(1.1+i*.17)*(i%2?-1:1),w:0})});
function measure(){R.forEach(o=>o.w=o.tr.firstChild.getBoundingClientRect().width/Math.cos(6*Math.PI/180))}
document.fonts.ready.then(measure);measure();addEventListener('resize',measure);
let boost=0,vel=1,py=-1,scheme=0,rot=0;
addEventListener('wheel',e=>{boost+=e.deltaY*.02},{passive:true});
let ty=null;addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});addEventListener('touchmove',e=>{const y=e.touches[0].clientY;boost+=(ty-y)*.08;ty=y},{passive:true});
addEventListener('pointermove',e=>py=e.clientY);addEventListener('pointerleave',()=>py=-1);
addEventListener('click',()=>{scheme=(scheme+1)%4;document.body.className=scheme?'s'+scheme:'';boost+=14});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')boost+=10;if(e.key==='ArrowLeft')boost-=10;if(e.key==='Enter')document.body.click()});
const vv=document.getElementById('vv'),bd=document.getElementById('bd');let last=performance.now();
(function f(now){const dt=Math.min(50,now-last)/16.67;last=now;boost*=Math.pow(.94,dt);boost=Math.max(-60,Math.min(60,boost));vel=1+boost*.12;
R.forEach((o,i)=>{const rr=o.r.getBoundingClientRect();const cy=rr.top+rr.height/2;const near=py>=0?Math.max(0,1-Math.abs(cy-py)/(rr.height*.9)):0;
const sp=o.sp*vel*(1+near*2.5);o.x+=sp*dt;if(o.w){o.x=((o.x%o.w)-o.w)%o.w}
const sk=Math.max(-22,Math.min(22,-sp*1.4));o.tr.style.transform=`translate3d(${o.x}px,0,0) skewX(${sk}deg)`;o.r.style.transform=`scaleY(${1+near*.18})`;o.r.classList.toggle('hot',near>.55)});
rot+=vel*.6*dt;bd.style.transform=`rotate(${rot}deg)`;vv.textContent=Math.abs(vel).toFixed(2);requestAnimationFrame(f)})(last);
</script></body></html>
