<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moiré Interference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;800&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#fff;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}
.t{position:fixed;left:24px;top:20px;font:800 clamp(26px,4vw,56px)/1 Inconsolata,monospace;color:#111;background:#fff;padding:6px 10px;pointer-events:none}.t small{display:block;font-weight:400;font-size:12px;letter-spacing:.15em;margin-top:6px}
.ui{position:fixed;right:20px;top:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;font:400 11px Inconsolata,monospace;letter-spacing:.12em}
.row{display:flex;gap:4px;align-items:center;background:#fff;padding:4px}.row span{width:5.5em}.row button{font:800 11px Inconsolata;letter-spacing:.08em;padding:5px 8px;border:1.5px solid #111;background:#fff;cursor:pointer}.row button[aria-pressed="true"]{background:#111;color:#fff}
.k{position:fixed;left:24px;bottom:20px;font:400 11px/1.7 Inconsolata;letter-spacing:.12em;background:#fff;padding:6px 10px;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div class="t">moiré<small id="rd">two gratings · 0.6° apart · drag the top sheet</small></div>
<div class="ui"><div class="row" id="ra"><span>SHEET A</span></div><div class="row" id="rb"><span>SHEET B</span></div><div class="row" id="rc"><span>INK</span></div></div>
<div class="k">drag · slide sheet B &nbsp; wheel · rotate it &nbsp; shift-wheel · change pitch</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);let W,H;
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
const PAT=['rings','lines','spokes','dots'],INK=[['cmyk','#00b3c7','#ff2e88'],['mono','#111','#111'],['sunset','#ff7a00','#4a2bff']];let pa=0,pb=0,ik=0;
const mk=(id,arr,cur,cb)=>{const el=document.getElementById(id);arr.forEach((a,i)=>{const b=document.createElement('button');b.textContent=Array.isArray(a)?a[0]:a;b.setAttribute('aria-pressed',i===cur);b.onclick=()=>{cb(i);[...el.querySelectorAll('button')].forEach((o,k)=>o.setAttribute('aria-pressed',k===i))};el.appendChild(b)})};
mk('ra',PAT,0,i=>pa=i);mk('rb',PAT,0,i=>pb=i);mk('rc',INK,0,i=>ik=i);
let bx=0,by=0,ba=.6*Math.PI/180,tbx=0,tby=0,pitch=7,drag=null,auto=true;
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,bx:tbx,by:tby};auto=false});c.addEventListener('pointermove',e=>{if(!drag)return;tbx=drag.bx+(e.clientX-drag.x)*dpr;tby=drag.by+(e.clientY-drag.y)*dpr});c.addEventListener('pointerup',()=>drag=null);
c.addEventListener('wheel',e=>{e.preventDefault();auto=false;if(e.shiftKey)pitch=Math.max(4,Math.min(16,pitch+(e.deltaY>0?.5:-.5)));else ba+=(e.deltaY>0?1:-1)*.2*Math.PI/180},{passive:false});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')ba-=.2*Math.PI/180;if(e.key==='ArrowRight')ba+=.2*Math.PI/180});
function sheet(kind,col,sp){x.strokeStyle=col;x.fillStyle=col;const R=Math.hypot(W,H);
if(kind===0){x.lineWidth=sp*.42;for(let r=sp;r<R;r+=sp){x.beginPath();x.arc(0,0,r,0,7);x.stroke()}}
else if(kind===1){x.lineWidth=sp*.46;x.beginPath();for(let i=-R;i<R;i+=sp){x.moveTo(i,-R);x.lineTo(i,R)}x.stroke()}
else if(kind===2){const n=Math.round(R*2*Math.PI/sp/14);for(let i=0;i<n;i++){const a=i/n*Math.PI*2,a2=a+Math.PI/n;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*R,Math.sin(a)*R);x.lineTo(Math.cos(a2)*R,Math.sin(a2)*R);x.closePath();x.fill()}}
else{const tl=document.createElement('canvas');tl.width=tl.height=Math.round(sp);const tg=tl.getContext('2d');tg.fillStyle=col;tg.beginPath();tg.arc(sp/2,sp/2,sp*.3,0,7);tg.fill();x.fillStyle=x.createPattern(tl,'repeat');x.fillRect(-R,-R,R*2,R*2)}}
let t0=performance.now();
function f(now){const t=(now-t0)/1000;if(auto){tbx=Math.sin(t*.3)*W*.08;tby=Math.cos(t*.23)*H*.06}bx+=(tbx-bx)*.15;by+=(tby-by)*.15;
x.globalCompositeOperation='source-over';x.fillStyle='#fff';x.fillRect(0,0,W,H);const sp=pitch*dpr;const I=INK[ik];x.globalCompositeOperation='multiply';
x.save();x.translate(W/2,H/2);sheet(pa,I[1],sp);x.restore();
x.save();x.translate(W/2+bx,H/2+by);x.rotate(ba);sheet(pb,I[2],sp*(pa===pb?1:1.03));
// the acetate's edge
x.globalCompositeOperation='source-over';x.strokeStyle='rgba(0,0,0,.12)';x.lineWidth=2*dpr;x.strokeRect(-W*.42,-H*.4,W*.84,H*.8);x.restore();
document.getElementById('rd').textContent=`two gratings · ${(ba*180/Math.PI).toFixed(1)}° apart · offset ${Math.round(Math.hypot(bx,by)/dpr)} px`;
requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
