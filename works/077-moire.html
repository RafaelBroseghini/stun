<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moiré Interference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;800&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}
.t{position:fixed;left:24px;top:20px;font:800 clamp(26px,4vw,56px)/1 Inconsolata,monospace;color:#111;background:#fff;padding:6px 10px}.t small{display:block;font-weight:400;font-size:12px;letter-spacing:.15em;margin-top:6px}</style></head><body>
<canvas id="c"></canvas><div class="t">moiré<small>two gratings · 0.6° apart · move to slide</small></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H,mx=.5,my=.5;
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});
function rings(cx,cy,col,sp){x.strokeStyle=col;x.lineWidth=sp*.45;const R=Math.hypot(W,H);for(let r=sp;r<R;r+=sp){x.beginPath();x.arc(cx,cy,r,0,7);x.stroke()}}
function lines(ang,col,sp){x.save();x.translate(W/2,H/2);x.rotate(ang);x.strokeStyle=col;x.lineWidth=sp*.5;const R=Math.hypot(W,H);x.beginPath();for(let i=-R;i<R;i+=sp){x.moveTo(i,-R);x.lineTo(i,R)}x.stroke();x.restore()}
function f(t){t*=.001;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.globalCompositeOperation='multiply';const sp=7*dpr;
rings(W*.5+Math.sin(t*.3)*W*.05,H*.5,'#00b3c7',sp);rings(W*mx,H*my,'#ff2e88',sp);lines(t*.05,'rgba(255,200,0,.9)',sp*1.15);lines(-t*.05+.01,'rgba(40,40,60,.55)',sp*1.15);
x.globalCompositeOperation='source-over';requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
