<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Year of Daylight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>:root{--bg:#f5f0e6;--fg:#1d1a2e;--day:#f3b23c;--night:#1d1a2e;--mute:#8b8478}
*{margin:0;box-sizing:border-box}html,body{min-height:100%}body{background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans',sans-serif;display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:100vh}
.ch{display:grid;place-items:center;padding:2vh}svg{width:min(92vh,100%);height:auto}
aside{padding:5vh 28px;display:flex;flex-direction:column;gap:18px;border-left:1px solid #d8d0c2}h1{font:700 clamp(28px,3vw,42px)/1 Fraunces,serif;letter-spacing:-.02em}h1 small{display:block;font-weight:300;font-size:16px;margin-top:8px;color:var(--mute)}
.cities{display:flex;flex-wrap:wrap;gap:6px}.cities button{font:600 13px 'IBM Plex Sans';padding:8px 12px;border-radius:20px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}.cities button.on{background:var(--fg);color:var(--bg)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px;font-variant-numeric:tabular-nums}.kv b{font-weight:600;text-align:right}
text{font-family:'IBM Plex Sans',sans-serif;fill:var(--fg)}@media(max-width:860px){body{grid-template-columns:1fr}aside{border:0;padding:16px}}</style></head><body>
<div class="ch"><svg id="s" viewBox="-260 -260 520 520"></svg></div>
<aside><h1>A Year of Daylight<small>Hours of sun for every day, plotted around the clock face of the year.</small></h1><div class="cities" id="ct"></div><div class="kv" id="kv"></div>
<p style="font-size:12px;color:var(--mute);line-height:1.5">Computed from solar declination with −0.833° refraction correction. Times are local solar time (noon = sun highest), so they ignore time zones and daylight saving.</p></aside>
<script>
const C=[['Tromsø',69.65],['Reykjavík',64.15],['Edinburgh',55.95],['Lisbon',38.72],['Singapore',1.35],['Cape Town',-33.92],['Ushuaia',-54.8]];let cur=3;
const s=document.getElementById('s'),NS='http://www.w3.org/2000/svg',el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);s.appendChild(e);return e};
function day(lat,n){const d=23.44*Math.sin(2*Math.PI*(284+n)/365)*Math.PI/180,L=lat*Math.PI/180;const ch=(Math.sin(-.833*Math.PI/180)-Math.sin(L)*Math.sin(d))/(Math.cos(L)*Math.cos(d));if(ch<=-1)return 24;if(ch>=1)return 0;return 2*Math.acos(ch)*180/Math.PI/15}
const fmt=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return `${String(H).padStart(2,'0')}:${String(M%60).padStart(2,'0')}`};
function draw(){s.innerHTML='';const lat=C[cur][1];const r0=70,r1=240;const rad=h=>r0+(r1-r0)*h/24;
for(let h=0;h<=24;h+=6){el('circle',{r:rad(h),fill:'none',stroke:'#d8d0c2','stroke-dasharray':h%12?'2 4':''});if(h)el('text',{x:4,y:-rad(h)-3,'font-size':9,fill:'#8b8478'}).textContent=h+' h'}
const today=new Date(),n0=Math.floor((today-new Date(today.getFullYear(),0,0))/864e5);let mx=0,mn=24,mxd=0,mnd=0;
for(let n=1;n<=365;n++){const h=day(lat,n);if(h>mx){mx=h;mxd=n}if(h<mn){mn=h;mnd=n}const a=(n/365)*Math.PI*2-Math.PI/2,a2=((n+1)/365)*Math.PI*2-Math.PI/2;const rise=12-h/2,set=12+h/2;
const path=(ra,rb,col)=>{const p=`M${Math.cos(a)*ra} ${Math.sin(a)*ra}L${Math.cos(a)*rb} ${Math.sin(a)*rb}L${Math.cos(a2)*rb} ${Math.sin(a2)*rb}L${Math.cos(a2)*ra} ${Math.sin(a2)*ra}Z`;el('path',{d:p,fill:col})};
path(rad(0),rad(rise),'#1d1a2e');path(rad(rise),rad(set),`hsl(${38+Math.sin(n/365*Math.PI)*0},85%,${50+h}%)`);path(rad(set),rad(24),'#2d2946')}
['J','F','M','A','M','J','J','A','S','O','N','D'].forEach((m,i)=>{const a=((i+.5)/12)*Math.PI*2-Math.PI/2;const t=el('text',{x:Math.cos(a)*252,y:Math.sin(a)*252+4,'text-anchor':'middle','font-size':11,'font-weight':600});t.textContent=m;const b=(i/12)*Math.PI*2-Math.PI/2;el('line',{x1:Math.cos(b)*r0,y1:Math.sin(b)*r0,x2:Math.cos(b)*(r1+4),y2:Math.sin(b)*(r1+4),stroke:'#f5f0e6','stroke-width':1.2})});
const a=(n0/365)*Math.PI*2-Math.PI/2;el('line',{x1:Math.cos(a)*(r0-6),y1:Math.sin(a)*(r0-6),x2:Math.cos(a)*(r1+10),y2:Math.sin(a)*(r1+10),stroke:'#e2462f','stroke-width':2.5});
el('circle',{r:r0-8,fill:'#f5f0e6'});const t1=el('text',{y:-8,'text-anchor':'middle','font-size':30,'font-weight':700,style:'font-family:Fraunces,serif'});const ht=day(lat,n0);t1.textContent=fmt(ht);const t2=el('text',{y:14,'text-anchor':'middle','font-size':10,fill:'#8b8478'});t2.textContent='DAYLIGHT TODAY';const t3=el('text',{y:30,'text-anchor':'middle','font-size':11,'font-weight':600});t3.textContent=C[cur][0];
const dt=n=>new Date(2026,0,n).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
document.getElementById('kv').innerHTML=`<span>Latitude</span><b>${Math.abs(lat).toFixed(2)}° ${lat>=0?'N':'S'}</b><span>Today</span><b>${fmt(ht)} h</b><span>Sunrise / sunset (solar)</span><b>${fmt(12-ht/2)} / ${fmt(12+ht/2)}</b><span>Longest day · ${dt(mxd)}</span><b>${fmt(mx)} h</b><span>Shortest day · ${dt(mnd)}</span><b>${fmt(mn)} h</b>`}
const ct=document.getElementById('ct');C.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c[0];b.onclick=()=>{cur=i;[...ct.children].forEach(o=>o.classList.toggle('on',o===b));draw()};ct.appendChild(b)});ct.children[cur].classList.add('on');draw();
</script></body></html>
