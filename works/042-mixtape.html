<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Summer Mixtape 94</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik+Mono+One&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#ff9bb3 repeating-linear-gradient(45deg,transparent 0 30px,rgba(255,255,255,.12) 30px 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;font-family:'Rubik Mono One',monospace}
.tape{position:relative;width:min(640px,92vw);aspect-ratio:1.6;border-radius:18px;background:#2b2b33;box-shadow:0 30px 50px rgba(120,20,60,.4),inset 0 2px 0 #4a4a55;padding:4%;transform:rotate(-3deg)}
.screw{position:absolute;width:3%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#999,#444);box-shadow:inset 0 0 0 1px #222}.screw::after{content:"";position:absolute;left:15%;right:15%;top:45%;height:10%;background:#222}
.label{position:relative;height:66%;border-radius:8px;background:linear-gradient(#fff6d8 0 22%,#ff5f7e 22% 30%,#fff6d8 30% 34%,#ffb03b 34% 42%,#fff6d8 42%);padding:3% 5%;overflow:hidden}
.label h2{font:400 clamp(16px,3.6vw,30px) 'Permanent Marker',cursive;color:#2433a8;transform:rotate(-1.5deg)}.label .side{position:absolute;right:5%;top:4%;font-size:clamp(14px,3vw,26px);color:#2b2b33}
.win{position:absolute;left:18%;right:18%;top:48%;height:40%;border-radius:40px;background:#1a1a1f;box-shadow:inset 0 3px 8px #000;overflow:hidden}
.win::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.15),transparent 40%);pointer-events:none}
.reel{position:absolute;top:50%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#ddd 0 26%,transparent 27%),radial-gradient(circle,#5a3a22 0 60%,#3d2716 100%);transition:width .3s linear}
.hub{position:absolute;top:50%;width:12%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#eee;animation:spin 2s linear infinite;animation-play-state:var(--ps)}
.hub::before{content:"";position:absolute;inset:18%;background:repeating-conic-gradient(#eee 0 30deg,#333 30deg 60deg);border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 30%,#000 31%);mask:radial-gradient(circle,transparent 30%,#000 31%)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(-360deg)}}
.bot{position:absolute;left:26%;right:26%;bottom:0;height:20%;background:#3a3a44;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}.bot i{position:absolute;bottom:20%;width:7%;aspect-ratio:1;border-radius:50%;background:#1a1a1f}
.deck{display:flex;gap:10px}.deck button{font:400 14px 'Rubik Mono One';padding:14px 20px;border:0;border-radius:10px;background:#2b2b33;color:#fff6d8;cursor:pointer;box-shadow:0 6px 0 #111}.deck button:active,.deck button.on{transform:translateY(4px);box-shadow:0 2px 0 #111;background:#2433a8}
.tr{font:400 clamp(16px,2.5vw,22px) 'Permanent Marker',cursive;color:#2b2b33;text-align:center;min-height:1.5em}</style></head><body>
<div class="tape" id="tape" style="--ps:running"><span class="screw" style="left:2%;top:4%"></span><span class="screw" style="right:2%;top:4%"></span><span class="screw" style="left:2%;bottom:4%"></span><span class="screw" style="right:2%;bottom:4%"></span>
<div class="label"><h2>summer mix '94 ♥ for J.</h2><span class="side">A</span><div class="win"><div class="reel" id="r1" style="left:27%"></div><div class="reel" id="r2" style="left:73%"></div><div class="hub" style="left:27%"></div><div class="hub" style="left:73%"></div></div></div>
<div class="bot"><i style="left:12%"></i><i style="right:12%"></i></div></div>
<div class="tr" id="tr"></div><div class="deck"><button id="rw" aria-label="rewind">◀◀</button><button id="pl" class="on" aria-label="play">▶</button><button id="st" aria-label="stop">■</button><button id="ff" aria-label="fast forward">▶▶</button></div>
<script>
const T=['1. the long drive to the coast','2. that song from the ferry','3. your sister’s favourite','4. rain on the tin roof','5. 3am, kitchen floor','6. the one we danced to'];let pos=.18,sp=1;
const r1=document.getElementById('r1'),r2=document.getElementById('r2'),tape=document.getElementById('tape'),tr=document.getElementById('tr');
function draw(){r1.style.width=(84-pos*44)+'%';r2.style.width=(40+pos*44)+'%';tr.textContent='♪ '+T[Math.min(T.length-1,Math.floor(pos*T.length))];tape.style.setProperty('--ps',sp?'running':'paused');document.querySelectorAll('.hub').forEach(h=>h.style.animationDuration=(Math.abs(sp)>1?.4:2)+'s');document.querySelectorAll('.hub').forEach(h=>h.style.animationDirection=sp<0?'reverse':'normal')}
setInterval(()=>{pos=Math.max(0,Math.min(1,pos+sp*.0015));if(pos<=0||pos>=1)sp=0;draw()},100);
const set=(v,id)=>{sp=v;document.querySelectorAll('.deck button').forEach(b=>b.classList.toggle('on',b.id===id))};
document.getElementById('pl').onclick=()=>set(1,'pl');document.getElementById('st').onclick=()=>set(0,'st');document.getElementById('ff').onclick=()=>set(8,'ff');document.getElementById('rw').onclick=()=>set(-8,'rw');draw();
</script></body></html>
