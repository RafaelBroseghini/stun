<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night Drive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@500&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:linear-gradient(#0d0221 0%,#261447 38%,#6b1a6b 52%,#ff2a6d 58%,#0d0221 58.2%);perspective:320px;font-family:Orbitron,sans-serif}
.stars{position:absolute;inset:0 0 45% 0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 10%,#fff,transparent),radial-gradient(1px 1px at 85% 40%,#fff,transparent),radial-gradient(1px 1px at 10% 15%,#fff,transparent),radial-gradient(1px 1px at 55% 35%,#fff9,transparent);background-size:300px 200px;opacity:.8}
.sun{position:absolute;left:50%;top:22vh;width:min(46vh,70vw);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:linear-gradient(#fff36e 10%,#ff9a3c 45%,#ff2a6d 80%);
-webkit-mask:linear-gradient(#000 50%,transparent 50%,transparent 53%,#000 53%,#000 60%,transparent 60%,transparent 64%,#000 64%,#000 70%,transparent 70%,transparent 75%,#000 75%,#000 80%,transparent 80%,transparent 86%,#000 86%,#000 90%,transparent 90%);mask:linear-gradient(#000 50%,transparent 50%,transparent 53%,#000 53%,#000 60%,transparent 60%,transparent 64%,#000 64%,#000 70%,transparent 70%,transparent 75%,#000 75%,#000 80%,transparent 80%,transparent 86%,#000 86%,#000 90%,transparent 90%);filter:drop-shadow(0 0 40px #ff2a6d)}
.glow{position:absolute;left:50%;top:28vh;width:90vh;height:60vh;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,42,109,.35),transparent);pointer-events:none}
svg{position:absolute;left:0;width:100%;top:calc(58% - 18vh);height:18vh}
.floor{position:absolute;left:-50%;right:-50%;top:58%;height:100vh;transform-origin:top;transform:rotateX(78deg);background-image:linear-gradient(90deg,#ff2a6d 2px,transparent 2px),linear-gradient(#05d9e8 2px,transparent 2px);background-size:60px 60px;background-color:#0d0221;animation:run .6s linear infinite;box-shadow:inset 0 40px 80px #0d0221}
@keyframes run{to{background-position:0 60px}}
.fade{position:absolute;left:0;right:0;top:58%;height:12vh;background:linear-gradient(#0d0221,transparent)}
h1{position:absolute;left:0;right:0;top:9vh;text-align:center;font:400 clamp(40px,10vw,140px)/1 Monoton,cursive;color:#fff;background:linear-gradient(#e0f7ff 30%,#05d9e8 50%,#7700a6 52%,#ff2a6d 80%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 12px rgba(5,217,232,.6))}
p{position:absolute;bottom:5vh;left:0;right:0;text-align:center;color:#05d9e8;letter-spacing:.6em;font-size:12px;text-shadow:0 0 8px #05d9e8}</style></head><body>
<div class="stars"></div><div class="glow"></div><div class="sun"></div>
<svg viewBox="0 0 1000 100" preserveAspectRatio="none"><polygon points="0,100 80,40 150,70 240,10 330,60 400,30 470,100" fill="#170a33" stroke="#ff2a6d" stroke-width="1.5"/><polygon points="530,100 600,35 680,65 760,15 850,55 920,30 1000,60 1000,100" fill="#170a33" stroke="#05d9e8" stroke-width="1.5"/></svg>
<div class="floor"></div><div class="fade"></div><h1>Night Drive</h1><p>Exit 88 · 3 a.m. · 128 bpm</p>
</body></html>
