<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velmora Metro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;800&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#f7f7f2;font-family:'Hanken Grotesk',sans-serif;color:#1a1a1a;display:grid;grid-template-columns:minmax(0,1fr) 250px}
svg{width:100%;height:100vh}.ln{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s}.dim .ln{opacity:.15}.dim .ln.hl{opacity:1}
.st{fill:#fff;stroke:#1a1a1a;stroke-width:3}.ix{fill:#fff;stroke:#1a1a1a;stroke-width:3.5}text{font-size:12px;font-weight:500;fill:#1a1a1a}.tr{fill:#fff;stroke:#1a1a1a;stroke-width:2}
aside{padding:28px 22px;border-left:1px solid #ddd;display:flex;flex-direction:column;gap:14px;background:#fff}aside h1{font-weight:800;font-size:28px;line-height:1}aside h1 small{display:block;font-weight:500;font-size:13px;color:#777;margin-top:6px}
.lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;cursor:pointer;padding:6px 8px;border-radius:8px}.lg:hover{background:#f2f2ee}.lg i{width:34px;height:10px;border-radius:5px}.lg span{font-weight:500;color:#777;font-size:12px;margin-left:auto}
@media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:1fr auto}aside{flex-direction:row;flex-wrap:wrap;padding:10px;border:0}aside h1{display:none}svg{height:70vh}}</style></head><body>
<svg id="s" viewBox="0 0 1000 700"><g id="lines"></g><g id="trains"></g><g id="stations"></g></svg>
<aside><h1>Velmora Metro<small>Network map · winter timetable</small></h1><div id="lg"></div><div style="font-size:12px;color:#777;margin-top:auto">○ station &nbsp; ◎ interchange<br>Trains every 4 min, 05:30–00:40</div></aside>
<script>
const ST={'Pier Gate':[80,520],'Saltmarket':[190,520],'Old Quay':[300,520],'Lantern Sq':[420,400],'Cathedral':[540,400],'Velmora Central':[660,400],'Mint St':[760,300],'Northfield':[860,300],'Airport':[950,300],'Orchard Hill':[200,80],'Glasshouse':[200,180],'Ropewalk':[270,250],'Tannery':[540,520],'Weir':[540,620],'South Docks':[540,680],'West End':[60,250],'Fennel Rd':[170,250],'Gallery':[400,250],'University':[660,230],'Observatory':[730,160],'Kestrel Park':[900,160],'Marsh Lane':[150,670],'Exchange':[420,520],'Brewery':[660,520],'Riverside':[760,620],'East Mills':[950,620],'Theatre':[420,300]};
const L=[{n:'Harbour',c:'#e4002b',r:['Pier Gate','Saltmarket','Old Quay','Lantern Sq','Cathedral','Velmora Central','Mint St','Northfield','Airport']},
{n:'Orchard',c:'#00843d',r:['Orchard Hill','Glasshouse','Ropewalk','Lantern Sq','Tannery','Weir','South Docks']},
{n:'Silk',c:'#7b2cbf',r:['West End','Fennel Rd','Ropewalk','Gallery',[510,250],'Velmora Central','University','Observatory','Kestrel Park']},
{n:'River',c:'#0072ce',r:['Marsh Lane','Old Quay','Exchange','Tannery','Brewery','Riverside','East Mills']},
{n:'Circle',c:'#f2a900',r:['Theatre','Mint St','Riverside','Weir',[420,620],'Exchange','Lantern Sq','Theatre']}];
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const use={};L.forEach(l=>{const pts=l.r.map(r=>typeof r==='string'?ST[r]:r);const p=el('path',{d:'M'+pts.map(q=>q.join(' ')).join('L'),class:'ln',stroke:l.c},$('lines'));l.p=p;l.len=p.getTotalLength();const names=l.r.filter(r=>typeof r==='string');new Set(names).forEach(n=>(use[n]=use[n]||new Set()).add(l.n));
const g=document.createElement('div');g.className='lg';g.innerHTML=`<i style="background:${l.c}"></i>${l.n}<span>${new Set(names).size} stations</span>`;g.onmouseenter=()=>{$('s').classList.add('dim');L.forEach(o=>o.p.classList.toggle('hl',o===l))};g.onmouseleave=()=>$('s').classList.remove('dim');$('lg').appendChild(g)});
Object.entries(ST).forEach(([n,[x,y]])=>{const ix=use[n]&&use[n].size>1;el('circle',{cx:x,cy:y,r:ix?11:6,class:ix?'ix':'st'},$('stations'));const t=el('text',{x:x+(ix?14:10),y:y-(ix?12:9),'font-weight':ix?800:500},$('stations'));t.textContent=n});
const T=[];L.forEach(l=>{for(let k=0;k<3;k++)T.push({l,u:k/3,d:k%2?1:-1,e:el('circle',{r:5,class:'tr'},$('trains'))})});
function f(){for(const t of T){t.u=(t.u+.0007*t.d+1)%1;const p=t.l.p.getPointAtLength(t.u*t.l.len);t.e.setAttribute('cx',p.x);t.e.setAttribute('cy',p.y);t.e.setAttribute('stroke',t.l.c)}requestAnimationFrame(f)}f();
</script></body></html>
