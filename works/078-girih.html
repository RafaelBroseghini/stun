<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Girih Tilework</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Lora:ital@1&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#0d1f3c;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none}
.c{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg,#0d1f3c);border:3px solid #d9b45a;outline:8px solid var(--bg,#0d1f3c);padding:3vh 4vw;text-align:center;color:#f1e4c3;box-shadow:0 0 0 11px #d9b45a,0 30px 60px rgba(0,0,0,.5);transition:background .8s,outline-color .8s;pointer-events:none;animation:in 1.4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes in{from{opacity:0;transform:translate(-50%,-46%)}}
.c h1{font:700 clamp(30px,5vw,64px)/1.1 Amiri,serif;background:linear-gradient(100deg,#b8913f 20%,#fff3c4 40%,#d9b45a 50%,#b8913f 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}@keyframes sh{to{background-position:-300% 0}}
.c p{font:italic 16px Lora,serif;opacity:.85}
.nm{position:fixed;left:24px;bottom:20px;font:italic 15px Lora;color:#f1e4c3;opacity:.8;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div class="c" id="cd"><h1>گره · Girih</h1><p>eight-fold stars and crosses, after the tilework of Isfahan<br><small style="opacity:.7">move to send light across the glaze · click to re-glaze · wheel to zoom</small></p></div>
<div class="nm" id="nm">Glaze: lapis &amp; turquoise</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);let W,H;
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
const PL=[['#1d4f8f','#2aa6a0','#b3362c',44,'#0d1f3c','lapis & turquoise'],['#2f6b3a','#e8a33d','#7a1f3d',350,'#10241a','malachite & saffron'],['#5a2a7a','#f2c14e','#1d7a8a',190,'#1a0f24','amethyst & gold'],['#b8432e','#21436b','#e9d7a8',38,'#2a1410','terracotta & indigo']];let pi=0,prev=0,wave=null,zoom=1,tz=1;
let mx=innerWidth*dpr/2,my=innerHeight*dpr/2;addEventListener('pointermove',e=>{mx=e.clientX*dpr;my=e.clientY*dpr});
let ac;function clink(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[1046,1318,1568].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.07;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.4);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+1.5)})}catch(e){}}
c.addEventListener('click',e=>{prev=pi;pi=(pi+1)%PL.length;wave={x:e.clientX*dpr,y:e.clientY*dpr,r:0};clink();document.body.style.background=PL[pi][4];document.getElementById('cd').style.setProperty('--bg',PL[pi][4]);document.getElementById('nm').textContent='Glaze: '+PL[pi][5]});
c.addEventListener('wheel',e=>{e.preventDefault();tz=Math.max(.6,Math.min(2.2,tz*(e.deltaY>0?.92:1.08)))},{passive:false});
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();c.dispatchEvent(new MouseEvent('click',{clientX:innerWidth/2,clientY:innerHeight/2}))}});
function star(cx,cy,R,rot){const p=[];for(let i=0;i<16;i++){const a=rot+i*Math.PI/8,r=i%2?R*.62:R;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p}
const path=(p)=>{x.beginPath();p.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.closePath()};
// craquelure, drawn once per size
let crk;function mkCrack(){crk=document.createElement('canvas');crk.width=W;crk.height=H;const g=crk.getContext('2d');g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=.7*dpr;for(let i=0;i<260;i++){let px=Math.random()*W,py=Math.random()*H,a=Math.random()*6.28;g.beginPath();g.moveTo(px,py);for(let k=0;k<8;k++){a+=(Math.random()-.5)*1.2;px+=Math.cos(a)*14*dpr;py+=Math.sin(a)*14*dpr;g.lineTo(px,py)}g.stroke()}}mkCrack();addEventListener('resize',mkCrack);
function f(t){t*=.001;zoom+=(tz-zoom)*.1;const S=Math.min(W,H)/5.2*zoom,R=S*.5;const ox=W/2%S,oy=H/2%S;if(wave)wave.r+=S*.16;
x.fillStyle=PL[pi][4];x.fillRect(0,0,W,H);
for(let j=-1;j*S<H+S;j++)for(let i=-1;i*S<W+S;i++){const cx=i*S+ox,cy=j*S+oy;const pl=wave&&Math.hypot(cx-wave.x,cy-wave.y)>wave.r?PL[prev]:PL[pi];const dd=Math.hypot(cx-mx,cy-my);const sh=.5+.5*Math.sin(t*2.4-dd/S*1.1);
x.fillStyle=pl[0];path([[cx+S/2,cy],[cx+S,cy+S/2],[cx+S/2,cy+S],[cx,cy+S/2]]);x.fill();
const s=star(cx,cy,R*.92,Math.PI/16);x.fillStyle=`hsl(${pl[3]+sh*6},${60+sh*20}%,${48+sh*14}%)`;path(s);x.fill();const s2=star(cx,cy,R*.5,Math.PI/16);x.fillStyle=pl[1];path(s2);x.fill();
x.fillStyle='#f1e4c3';x.beginPath();x.arc(cx,cy,R*.14,0,7);x.fill();
const cr=[];for(let k=0;k<4;k++){const a=k*Math.PI/2;cr.push([cx+S/2+Math.cos(a)*R*.5,cy+S/2+Math.sin(a)*R*.5]);cr.push([cx+S/2+Math.cos(a+Math.PI/4)*R*.2,cy+S/2+Math.sin(a+Math.PI/4)*R*.2])}x.fillStyle=pl[2];path(cr);x.fill();
// glaze highlight: a soft specular spot that slides with the light
const hx=cx-(mx-cx)*.08,hy=cy-(my-cy)*.08;const g=x.createRadialGradient(hx-R*.3,hy-R*.3,0,hx-R*.3,hy-R*.3,R*.7);g.addColorStop(0,`rgba(255,255,255,${.28*Math.exp(-dd/(S*3))+.05})`);g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;path(s);x.fill();
x.strokeStyle='#e8cf8a';x.lineWidth=2.4*dpr*zoom;path(s);x.stroke();path(s2);x.stroke();path(cr);x.stroke();
x.strokeStyle='rgba(241,228,195,.5)';x.lineWidth=1.2*dpr;for(let k=0;k<8;k++){const a=Math.PI/16+k*Math.PI/4;x.beginPath();x.moveTo(cx+Math.cos(a)*R*.92,cy+Math.sin(a)*R*.92);x.lineTo(cx+Math.cos(a)*S*.72,cy+Math.sin(a)*S*.72);x.stroke()}}
if(wave){x.strokeStyle='rgba(255,243,196,.6)';x.lineWidth=3*dpr;x.beginPath();x.arc(wave.x,wave.y,wave.r,0,7);x.stroke();if(wave.r>Math.hypot(W,H))wave=null}
x.globalCompositeOperation='multiply';x.drawImage(crk,0,0);x.globalCompositeOperation='source-over';
const v=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=v;x.fillRect(0,0,W,H);
requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
