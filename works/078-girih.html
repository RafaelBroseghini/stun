<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Girih Tilework</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Lora:ital@1&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#0d1f3c}canvas{display:block;width:100%;height:100%}
.c{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#0d1f3c;border:3px solid #d9b45a;outline:8px solid #0d1f3c;padding:3vh 4vw;text-align:center;color:#f1e4c3;box-shadow:0 0 0 11px #d9b45a}
.c h1{font:700 clamp(30px,5vw,64px)/1.1 Amiri,serif}.c p{font:italic 16px Lora,serif;opacity:.85}</style></head><body>
<canvas id="c"></canvas><div class="c"><h1>گره · Girih</h1><p>eight-fold stars and crosses, after the tilework of Isfahan<br><small style="opacity:.7">move to send light across the tiles · click to re-glaze</small></p></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H;
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
const PL=[['#1d4f8f','#2aa6a0','#b3362c',44,'#0d1f3c'],['#2f6b3a','#e8a33d','#7a1f3d',350,'#10241a'],['#5a2a7a','#f2c14e','#1d7a8a',190,'#1a0f24'],['#b8432e','#21436b','#e9d7a8',38,'#2a1410']];let pi=0,pl=PL[0],mx=innerWidth*dpr/2,my=innerHeight*dpr/2;
addEventListener('pointermove',e=>{mx=e.clientX*dpr;my=e.clientY*dpr});addEventListener('click',()=>{pi=(pi+1)%PL.length;pl=PL[pi];document.body.style.background=pl[4];document.querySelector('.c').style.background=pl[4]});document.body.style.cursor='pointer';
function star(cx,cy,R,rot){const p=[];for(let i=0;i<16;i++){const a=rot+i*Math.PI/8,r=i%2?R*.62:R;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p}
const path=(p)=>{x.beginPath();p.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.closePath()};
function f(t){t*=.001;const S=Math.min(W,H)/5.2,R=S*.5;x.fillStyle=pl[4];x.fillRect(0,0,W,H);
for(let j=-1;j*S<H+S;j++)for(let i=-1;i*S<W+S;i++){const cx=i*S,cy=j*S;const sh=.5+.5*Math.sin(t*2.4-Math.hypot(cx-mx,cy-my)/S*1.1);
x.fillStyle=pl[0];path([[cx+S/2,cy],[cx+S,cy+S/2],[cx+S/2,cy+S],[cx,cy+S/2]]);x.fill();
const s=star(cx,cy,R*.92,Math.PI/16);x.fillStyle=`hsl(${pl[3]+sh*6},${60+sh*20}%,${48+sh*14}%)`;path(s);x.fill();const s2=star(cx,cy,R*.5,Math.PI/16);x.fillStyle=pl[1];path(s2);x.fill();x.fillStyle='#f1e4c3';x.beginPath();x.arc(cx,cy,R*.14,0,7);x.fill();
const cr=[];for(let k=0;k<4;k++){const a=k*Math.PI/2;cr.push([cx+S/2+Math.cos(a)*R*.5,cy+S/2+Math.sin(a)*R*.5]);cr.push([cx+S/2+Math.cos(a+Math.PI/4)*R*.2,cy+S/2+Math.sin(a+Math.PI/4)*R*.2])}x.fillStyle=pl[2];path(cr);x.fill();
x.strokeStyle='#f1e4c3';x.lineWidth=2.4*dpr;path(s);x.stroke();path(s2);x.stroke();path(cr);x.stroke();
x.strokeStyle='rgba(241,228,195,.5)';x.lineWidth=1.2*dpr;for(let k=0;k<8;k++){const a=Math.PI/16+k*Math.PI/4;x.beginPath();x.moveTo(cx+Math.cos(a)*R*.92,cy+Math.sin(a)*R*.92);x.lineTo(cx+Math.cos(a)*S*.72,cy+Math.sin(a)*S*.72);x.stroke()}}requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
