<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora over the Fjord</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#020611}canvas{display:block;width:100%;height:100%}
.t{position:fixed;left:6vw;bottom:7vh;color:#d9fbe9;font:italic 600 clamp(28px,5vw,72px)/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.01em;text-shadow:0 0 30px rgba(80,255,180,.35)}
.t small{display:block;margin-top:14px;font:400 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.25em;text-transform:uppercase;color:#7fb8a3;font-style:normal}</style></head><body>
<canvas id="c"></canvas><div class="t">Nordlys<small>69.65°N 18.96°E · Kp index 6 · 23:41 local</small></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,hz,stars=[],dpr=Math.min(devicePixelRatio,2);
const P=new Uint8Array(512);for(let i=0;i<256;i++)P[i]=i;for(let i=255;i>0;i--){const j=Math.random()*(i+1)|0;[P[i],P[j]]=[P[j],P[i]]}for(let i=0;i<256;i++)P[i+256]=P[i];
const fd=t=>t*t*t*(t*(t*6-15)+10),lp=(a,b,t)=>a+t*(b-a),gr=(h,x,y)=>((h&1)?-x:x)+((h&2)?-y:y);
function N(x,y){let X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);const u=fd(x),v=fd(y),a=P[X]+Y,b=P[X+1]+Y;return lp(lp(gr(P[a],x,y),gr(P[b],x-1,y),u),lp(gr(P[a+1],x,y-1),gr(P[b+1],x-1,y-1),u),v)}
const spr=[];[['#3dffa8','#1dd3b0','rgba(140,60,255,0)'],['#7dff7a','#2bd99a','rgba(255,60,180,0)'],['#b07cff','#5ef0c8','rgba(80,40,255,0)']].forEach(cs=>{const s=document.createElement('canvas');s.width=1;s.height=256;const g=s.getContext('2d'),gg=g.createLinearGradient(0,256,0,0);gg.addColorStop(0,'rgba(0,0,0,0)');gg.addColorStop(.04,cs[0]);gg.addColorStop(.25,cs[1]);gg.addColorStop(1,cs[2]);g.fillStyle=gg;g.fillRect(0,0,1,256);spr.push(s)});
let mtn=[];
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;hz=H*.72;stars=Array.from({length:420},()=>({x:Math.random()*W,y:Math.random()*hz,r:Math.random()*1.3*dpr+.2,p:Math.random()*6}));
mtn=[0,1].map(l=>{const pts=[];for(let i=0;i<=120;i++){const u=i/120;pts.push(hz-(Math.abs(N(u*(3+l*4)+l*9,1.3))*H*(.32-l*.14))-Math.max(0,N(u*12+l,7))*H*.04)}return pts})}
size();addEventListener('resize',size);
function frame(t){t/=1000;const g=x.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#01030b');g.addColorStop(.6,'#03122a');g.addColorStop(1,'#0b3a4a');x.globalCompositeOperation='source-over';x.fillStyle=g;x.fillRect(0,0,W,hz);
for(const s of stars){x.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.3+s.p));x.fillStyle='#fff';x.fillRect(s.x,s.y,s.r,s.r)}x.globalAlpha=1;
x.globalCompositeOperation='lighter';const step=3*dpr;
for(let r=0;r<3;r++){const base=hz*(.42+r*.1),amp=H*(.12-r*.02);for(let px=0;px<W;px+=step){const u=px/W;const y=base+N(u*2.2+r*5,t*.08+r)*amp*2+Math.sin(u*9+t*.4+r)*amp*.25;const n=N(u*18+r*3,t*.35);const h=(H*(.18+r*.05))*(.6+n);const a=Math.max(0,.15+N(u*5-t*.12,r+t*.05)*1.3)*(.55-r*.1);if(a<=0)continue;x.globalAlpha=Math.min(a,.9);x.drawImage(spr[r],px,y-h,step*1.6,h)}}
x.globalAlpha=1;x.globalCompositeOperation='source-over';
mtn.forEach((m,l)=>{x.beginPath();x.moveTo(0,hz);m.forEach((y,i)=>x.lineTo(i/120*W,y));x.lineTo(W,hz);x.closePath();x.fillStyle=l?'#03080f':'#071420';x.fill()});
x.save();x.translate(0,hz*2);x.scale(1,-1);x.globalAlpha=.42;x.drawImage(c,0,0,W,hz,0,0,W,hz);x.restore();
const wg=x.createLinearGradient(0,hz,0,H);wg.addColorStop(0,'rgba(2,10,20,.35)');wg.addColorStop(1,'rgba(1,3,8,.96)');x.fillStyle=wg;x.fillRect(0,hz,W,H-hz);
x.globalAlpha=.08;x.fillStyle='#bff';for(let i=0;i<40;i++){const yy=hz+Math.pow(Math.random(),2)*(H-hz);x.fillRect(Math.random()*W,yy,Math.random()*80*dpr,dpr)}x.globalAlpha=1;
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
