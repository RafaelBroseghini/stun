<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Current</title>
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#f4f1ea;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.l{position:fixed;right:20px;bottom:16px;background:#f4f1ea;padding:8px 12px;font:600 11px/1.5 Helvetica,Arial,sans-serif;letter-spacing:.12em;color:#111;border:2px solid #111;pointer-events:none}
.ui{position:fixed;left:20px;bottom:16px;display:flex;gap:6px}.ui button{font:600 11px Helvetica,Arial,sans-serif;letter-spacing:.1em;padding:8px 10px;border:2px solid #111;background:#f4f1ea;color:#111;cursor:pointer}.ui button[aria-pressed="true"]{background:#111;color:#f4f1ea}
</style></head><body>
<canvas id="c"></canvas><div class="l" id="lb">CURRENT, NO. 4 · EMULSION ON CANVAS · MOVE TO DISTURB</div>
<div class="ui" id="ui"><button data-p="0" aria-pressed="true">Black</button><button data-p="1">Cataract</button><button data-p="2">Ra</button><button data-p="3">Night</button><button id="fz">Freeze</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);let W,H,m={x:.5,y:.5},tm={x:.5,y:.5},gap=11,frz=false,T=0,ripples=[];
const PAL=[['#f4f1ea',['#111']],['#efe8da',['#d23b2e','#1c8a8f']],['#f2e6d0',['#2b4b8a','#e07a2e','#7a3a6a','#3e8a5a']],['#0b0b10',['#f4f1ea']]];let pi=0;
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
addEventListener('pointermove',e=>{tm.x=e.clientX/innerWidth;tm.y=e.clientY/innerHeight});
c.addEventListener('pointerdown',e=>{ripples.push({x:e.clientX*dpr,y:e.clientY*dpr,r:0,a:1});hum()});
c.addEventListener('wheel',e=>{e.preventDefault();gap=Math.max(6,Math.min(22,gap+(e.deltaY>0?1:-1)))},{passive:false});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pi=+b.dataset.p;document.querySelectorAll('[data-p]').forEach(o=>o.setAttribute('aria-pressed',o===b));const n=['CURRENT, NO. 4','CATARACT, NO. 2','RA, NO. 7','NOCTURNE'][pi];document.getElementById('lb').textContent=`${n} · EMULSION ON CANVAS · MOVE TO DISTURB`;document.getElementById('lb').style.background=PAL[pi][0];document.getElementById('lb').style.color=pi===3?'#f4f1ea':'#111';document.body.style.background=PAL[pi][0]});
document.getElementById('fz').onclick=e=>{frz=!frz;e.target.setAttribute('aria-pressed',frz)};
addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=4)document.querySelector(`[data-p="${n-1}"]`).click();if(e.key===' '){e.preventDefault();document.getElementById('fz').click()}});
let ac;function hum(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();o.frequency.value=110;o2.frequency.value=113;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.06,ac.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1.8);o.connect(g);o2.connect(g);g.connect(ac.destination);o.start();o2.start();o.stop(ac.currentTime+1.9);o2.stop(ac.currentTime+1.9)}catch(e){}}
let last=performance.now();
function f(now){const dt=(now-last)/1000;last=now;if(!frz)T+=dt;const t=T;m.x+=(tm.x-m.x)*.05;m.y+=(tm.y-m.y)*.05;const P=PAL[pi];x.fillStyle=P[0];x.fillRect(0,0,W,H);const n=Math.floor(H/(gap*dpr)),step=H/n,mx=m.x*W,my=m.y*H,R=Math.min(W,H)*.35;
for(const rp of ripples){rp.r+=14*dpr;rp.a*=.97}ripples=ripples.filter(r=>r.a>.03);
const disp=(X,y)=>{const dx=X-mx,dy=y-my,d=Math.hypot(dx,dy),b=Math.exp(-(d*d)/(R*R))*R*.35;let off=(dy/(d+1))*b;for(const rp of ripples){const dd=Math.hypot(X-rp.x,y-rp.y);const k=Math.exp(-Math.pow((dd-rp.r)/(40*dpr),2))*rp.a;off+=k*30*dpr*Math.sign(y-rp.y)}return off};
for(let k=0;k<n;k+=2){x.fillStyle=P[1][(k/2)%P[1].length];x.beginPath();const st=6*dpr;
for(let X=0;X<=W;X+=st){const y=k*step;const w=Math.sin(X/W*Math.PI*3+t+k*.02)*step*2.2*Math.sin(t*.3+X/W*2);const yy=y+w+disp(X,y);X?x.lineTo(X,yy):x.moveTo(X,yy)}
for(let X=W;X>=0;X-=st){const y=(k+1)*step;const w=Math.sin(X/W*Math.PI*3+t+(k+1)*.02)*step*2.2*Math.sin(t*.3+X/W*2);const th=1+Math.sin(X/W*Math.PI*2+k*.15+t*.7)*.55;x.lineTo(X,y+w+disp(X,y)-(1-th)*step*.6)}x.closePath();x.fill()}
requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
