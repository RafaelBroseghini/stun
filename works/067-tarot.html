<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Lantern Tarot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 0,#4a1f5e,#1a0b24 70%);color:#f0d9a0;font-family:'Cormorant Garamond',serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;min-height:100vh;padding:3vh 16px;overflow-x:hidden;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(40% 35% at 50% 100%,rgba(255,170,80,var(--cf,.18)),transparent 70%)}
canvas#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
h1{position:relative;font:700 clamp(22px,3.4vw,44px) 'Cinzel Decorative',serif;letter-spacing:.05em;text-align:center;text-shadow:0 0 30px rgba(240,217,160,.3)}h1 small{display:block;font:italic 500 18px 'Cormorant Garamond';letter-spacing:.05em;opacity:.8;margin-top:6px}
.table{position:relative;width:min(900px,100%);height:clamp(260px,46vh,420px);perspective:1400px}
.cd{position:absolute;left:50%;top:50%;width:clamp(110px,18vw,200px);aspect-ratio:.58;margin-left:calc(clamp(110px,18vw,200px)/-2);margin-top:calc(clamp(110px,18vw,200px)/.58/-2);transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.fl{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.7,.2,1)}.cd.f .fl{transform:rotateY(180deg)}
.cd.dealt:hover:not(.f) .fl{transform:translateY(-10px) rotateZ(-2deg)}
.fa{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;overflow:hidden;border:2px solid #c9a14a;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.bk{background:#2a1238;background-image:repeating-conic-gradient(from 0deg at 50% 50%,rgba(201,161,74,.3) 0 5deg,transparent 5deg 15deg),radial-gradient(circle,#3a1a4c,#1a0b24);display:grid;place-items:center}
.bk::after{content:"";width:46%;aspect-ratio:1;border:2px solid #c9a14a;transform:rotate(45deg);box-shadow:0 0 0 8px #2a1238,0 0 0 10px #c9a14a}
.fr{transform:rotateY(180deg);background:linear-gradient(#f4e6c4,#e8d3a3);color:#2a1238;display:flex;flex-direction:column;align-items:center;padding:8% 6%}
.fr::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);background-size:300% 100%;background-position:100% 0;transition:background-position 1.2s}.cd.f .fr::after{background-position:-100% 0}
.fr svg{width:100%;flex:1}.fr b{font:700 clamp(10px,1.3vw,14px) 'Cinzel Decorative',serif;letter-spacing:.06em;border-top:1.5px solid #2a1238;padding-top:6%;width:100%;text-align:center}.fr i{font-size:clamp(10px,1.1vw,13px);opacity:.7}
.cd.rev .fr svg,.cd.rev .fr b{transform:rotate(180deg)}
.read{position:relative;max-width:680px;text-align:center;font:italic 500 clamp(17px,1.6vw,22px)/1.5 'Cormorant Garamond',serif;min-height:5em}.read b{font-style:normal;color:#ffe0a0}
.btns{position:relative;display:flex;gap:10px}.btns button{font:700 12px 'Cinzel Decorative';letter-spacing:.1em;color:#1a0b24;background:linear-gradient(#f0d9a0,#c9a14a);border:0;padding:10px 18px;border-radius:99px;cursor:pointer;box-shadow:0 6px 20px rgba(201,161,74,.25)}.btns button:disabled{opacity:.4;cursor:default}
.pos{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font:italic 500 14px 'Cormorant Garamond';opacity:.7;white-space:nowrap}
</style></head><body><canvas id="dust"></canvas>
<h1>The Lantern Tarot<small>Past · Present · Path</small></h1>
<div class="table" id="tb"></div>
<div class="btns"><button id="sh">Shuffle</button><button id="dl">Deal three</button></div>
<div class="read" id="rd">Shuffle the deck, then deal. Turn each card when you are ready.</div>
<script>
const G='#2a1238',Au='#c9a14a';
const C=[{n:'I · The Lantern',m:'A light carried alone through a long dark stretch. You kept going when you could not see far.',r:'You have been carrying a light for someone who no longer needs it. Set it down.',s:`<circle cx="50" cy="20" r="6" fill="none" stroke="${G}" stroke-width="2"/><path d="M50 26v8M36 34h28l-4 40H40z" fill="${Au}" stroke="${G}" stroke-width="2"/><circle cx="50" cy="54" r="9" fill="#fff3c4"/><path d="M50 46c4 4 4 10 0 14-4-4-4-10 0-14z" fill="#e8622b"/><path d="M20 120c10-20 20-24 30-24s20 4 30 24" fill="none" stroke="${G}" stroke-width="2"/>`},
{n:'XII · The Tide',m:'What left is returning, changed. Do not build on the sand line you drew yesterday.',r:'You are waiting for something that has already come back. Look again.',s:`<circle cx="50" cy="30" r="16" fill="#fff3c4" stroke="${G}" stroke-width="2"/><circle cx="57" cy="26" r="14" fill="#e8d3a3"/>`+[0,1,2,3,4].map(i=>`<path d="M5 ${70+i*12}q11-10 22 0t22 0t22 0t22 0" fill="none" stroke="${i%2?Au:G}" stroke-width="2"/>`).join('')},
{n:'XVII · The Moth',m:'You will be drawn toward a brighter thing. Go, but keep your wings.',r:'The flame you circle is not the light you think it is.',s:`<path d="M50 40c-30-30-46-6-40 14 6 18 26 14 40 2 14 12 34 16 40-2 6-20-10-44-40-14z" fill="${Au}" stroke="${G}" stroke-width="2"/><path d="M50 56c-20 10-30 34-16 40 10 4 14-10 16-22 2 12 6 26 16 22 14-6 4-30-16-40z" fill="#e8622b" stroke="${G}" stroke-width="2"/><path d="M50 30v66" stroke="${G}" stroke-width="4" stroke-linecap="round"/><circle cx="30" cy="40" r="5" fill="${G}"/><circle cx="70" cy="40" r="5" fill="${G}"/>`},
{n:'IV · The Key',m:'A door you thought was a wall. The lock was always on your side.',r:'You hold the key and keep asking who has it.',s:`<circle cx="50" cy="34" r="16" fill="none" stroke="${G}" stroke-width="5"/><circle cx="50" cy="34" r="6" fill="${Au}"/><path d="M50 50v56M50 86h14M50 98h10" stroke="${G}" stroke-width="5" stroke-linecap="round"/>`},
{n:'IX · The Owl',m:'Listen longer than is comfortable. The answer speaks quietly, and late.',r:'You have heard it already. You simply did not like it.',s:`<path d="M30 40c0-18 40-18 40 0v40c0 14-40 14-40 0z" fill="${Au}" stroke="${G}" stroke-width="2"/><circle cx="41" cy="48" r="8" fill="#fff3c4" stroke="${G}" stroke-width="2"/><circle cx="59" cy="48" r="8" fill="#fff3c4" stroke="${G}" stroke-width="2"/><circle cx="41" cy="48" r="3" fill="${G}"/><circle cx="59" cy="48" r="3" fill="${G}"/><path d="M47 58l3 5 3-5z" fill="#e8622b"/><path d="M30 26l6 10M70 26l-6 10" stroke="${G}" stroke-width="3"/><path d="M14 104h72" stroke="${G}" stroke-width="3"/>`},
{n:'XIV · The Mountain',m:'Slow, then steady, then suddenly above the clouds.',r:'You are climbing someone else’s mountain.',s:`<path d="M8 110L40 40l14 22 12-18 26 66z" fill="${Au}" stroke="${G}" stroke-width="2"/><path d="M40 40l8 16-8-4-6 6z" fill="#fff"/><path d="M10 74c14-4 26 2 40-2s30 2 42-2" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>`},
{n:'XX · The Well',m:'Go down, not out. What you need is underneath what you have.',r:'You have been drawing from an empty well. Find the spring.',s:`<ellipse cx="50" cy="44" rx="30" ry="8" fill="none" stroke="${G}" stroke-width="2"/><path d="M20 44v50c0 8 60 8 60 0V44" fill="${Au}" stroke="${G}" stroke-width="2"/><path d="M50 10v36" stroke="${G}" stroke-width="2"/><path d="M42 10h16" stroke="${G}" stroke-width="3"/><circle cx="50" cy="44" r="4" fill="#3a6aa8"/>`},
{n:'XXI · The Comet',m:'Something rare is passing through. It will not wait to be understood.',r:'Not every bright thing is meant to be caught.',s:`<circle cx="66" cy="34" r="10" fill="#fff3c4" stroke="${G}" stroke-width="2"/><path d="M58 40L14 96M62 44L26 104M54 36L10 82" stroke="${Au}" stroke-width="3" stroke-linecap="round"/><g fill="${G}"><circle cx="20" cy="30" r="1.4"/><circle cx="82" cy="80" r="1.4"/><circle cx="40" cy="20" r="1"/><circle cx="76" cy="106" r="1"/></g>`}];
const tb=document.getElementById('tb'),rd=document.getElementById('rd');const POS=['Past','Present','Path'];let deck=[],dealt=[],cards=[];
let ac;function chime(n){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[0,7,12].forEach((s,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.09;o.type='sine';o.frequency.value=330*Math.pow(2,(s+n*2)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+2);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+2.1)})}catch(e){}}
function swish(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*.12,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.sin(i/d.length*Math.PI);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=3000;g.gain.value=.08;s.connect(f).connect(g).connect(ac.destination);s.start()}catch(e){}}
function build(){tb.innerHTML='';cards=[];deck=C.map((c,i)=>i);for(let i=0;i<C.length;i++){const d=document.createElement('div');d.className='cd';d.innerHTML=`<div class="fl"><div class="fa bk"></div><div class="fa fr"><svg viewBox="0 0 100 125">${C[i].s}</svg><b>${C[i].n}</b></div></div>`;d.style.transform=`translate(${i*.6}px,${-i*.6}px) rotate(${(Math.random()-.5)*4}deg)`;tb.appendChild(d);cards.push(d)}}
function shuffle(){dealt=[];cards.forEach(c=>{c.classList.remove('f','dealt','rev');c.onclick=null;const p=c.querySelector('.pos');if(p)p.remove()});rd.innerHTML='The deck is warm. Deal when you are ready.';
for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}
cards.forEach((c,i)=>{setTimeout(()=>{swish();c.style.transform=`translate(${(i%2?1:-1)*(80+Math.random()*60)}px,${(Math.random()-.5)*40}px) rotate(${(Math.random()-.5)*30}deg)`;setTimeout(()=>{c.style.transform=`translate(${deck.indexOf(i)*.6}px,${-deck.indexOf(i)*.6}px) rotate(${(Math.random()-.5)*4}deg)`;c.style.zIndex=deck.indexOf(i)},420)},i*70)})}
function deal(){if(dealt.length)shuffle();const W=tb.clientWidth,step=Math.min(W*.31,240);[0,1,2].forEach(k=>{setTimeout(()=>{const ci=deck[deck.length-1-k];const c=cards[ci];swish();c.style.zIndex=100+k;c.classList.add('dealt');if(Math.random()<.25)c.classList.add('rev');c.style.transform=`translate(${(k-1)*step}px,0) rotate(${(k-1)*3}deg)`;const p=document.createElement('div');p.className='pos';p.textContent=POS[k];p.style.bottom='-30px';c.appendChild(p);dealt.push({ci,k});
c.onclick=()=>{if(c.classList.contains('f'))return;c.classList.add('f');chime(ci);const card=C[ci],rev=c.classList.contains('rev');const lines=dealt.filter(d=>cards[d.ci].classList.contains('f')).sort((a,b)=>a.k-b.k).map(d=>{const cc=C[d.ci],rv=cards[d.ci].classList.contains('rev');return `<b>${POS[d.k]} — ${cc.n}${rv?' (reversed)':''}</b>: ${rv?cc.r:cc.m}`});rd.innerHTML=lines.join('<br>')}},k*360)},dealt.length?900:0)}
document.getElementById('sh').onclick=shuffle;document.getElementById('dl').onclick=deal;addEventListener('keydown',e=>{if(e.key==='s')shuffle();if(e.key==='d'||e.key===' '){e.preventDefault();deal()}});
build();setTimeout(()=>{shuffle();setTimeout(()=>{deal();setTimeout(()=>{const d=dealt[1];if(d)cards[d.ci].click()},1600)},1200)},500);
// candle dust motes and flicker
const cv=document.getElementById('dust'),x=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);const motes=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),v:.0002+Math.random()*.0005,s:Math.random()}));
(function f(t){if(cv.width!==innerWidth*dpr){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}x.clearRect(0,0,cv.width,cv.height);for(const m of motes){m.y-=m.v;m.x+=Math.sin(t*.001+m.s*9)*.0003;if(m.y<0){m.y=1;m.x=Math.random()}x.fillStyle=`rgba(255,220,150,${.15+m.s*.35})`;x.beginPath();x.arc(m.x*cv.width,m.y*cv.height,(1+m.s*2)*dpr,0,7);x.fill()}document.body.style.setProperty('--cf',(.16+.05*Math.sin(t*.011)*Math.sin(t*.0037)).toFixed(3));requestAnimationFrame(f)})(0);
</script></body></html>
