<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Lantern Tarot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{min-height:100%}body{background:radial-gradient(ellipse at 50% 0,#4a1f5e,#1a0b24 70%);color:#f0d9a0;font-family:'Cormorant Garamond',serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;min-height:100vh;padding:3vh 16px;overflow-x:hidden}
h1{font:700 clamp(22px,3.4vw,44px) 'Cinzel Decorative',serif;letter-spacing:.05em;text-align:center}h1 small{display:block;font:italic 500 18px 'Cormorant Garamond';letter-spacing:.05em;opacity:.8;margin-top:6px}
.row{display:flex;gap:clamp(10px,3vw,40px);perspective:1400px;flex-wrap:wrap;justify-content:center}
.cd{width:clamp(120px,22vw,240px);aspect-ratio:.58;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.7,.2,1);cursor:pointer}.cd.f{transform:rotateY(180deg)}.cd:hover:not(.f){transform:translateY(-10px)}
.fa{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;overflow:hidden;border:2px solid #c9a14a;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.bk{background:#2a1238;background-image:repeating-conic-gradient(from 0deg at 50% 50%,rgba(201,161,74,.3) 0 5deg,transparent 5deg 15deg),radial-gradient(circle,#3a1a4c,#1a0b24);display:grid;place-items:center}
.bk::after{content:"";width:46%;aspect-ratio:1;border:2px solid #c9a14a;transform:rotate(45deg);box-shadow:0 0 0 8px #2a1238,0 0 0 10px #c9a14a}
.fr{transform:rotateY(180deg);background:linear-gradient(#f4e6c4,#e8d3a3);color:#2a1238;display:flex;flex-direction:column;align-items:center;padding:8% 6%}
.fr svg{width:100%;flex:1}.fr b{font:700 clamp(10px,1.4vw,15px) 'Cinzel Decorative',serif;letter-spacing:.06em;border-top:1.5px solid #2a1238;padding-top:6%;width:100%;text-align:center}.fr i{font-size:clamp(10px,1.1vw,13px);opacity:.7}
.read{max-width:640px;text-align:center;font:italic 500 clamp(17px,1.6vw,22px)/1.45 'Cormorant Garamond',serif;min-height:4.5em}</style></head><body>
<h1>The Lantern Tarot<small>Past · Present · Path — turn each card</small></h1><div class="row" id="r"></div><div class="read" id="rd">Three cards lie face down. Begin with the one on the left.</div>
<script>
const C=[{n:'I · The Lantern',w:'what guided you',m:'A light carried alone through a long dark stretch. You kept going when you could not see far.',s:'<circle cx="50" cy="20" r="6" fill="none" stroke="#2a1238" stroke-width="2"/><path d="M50 26v8M36 34h28l-4 40H40z" fill="#c9a14a" stroke="#2a1238" stroke-width="2"/><circle cx="50" cy="54" r="9" fill="#fff3c4"/><path d="M50 46c4 4 4 10 0 14-4-4-4-10 0-14z" fill="#e8622b"/><path d="M20 120c10-20 20-24 30-24s20 4 30 24" fill="none" stroke="#2a1238" stroke-width="2"/><g stroke="#c9a14a" stroke-width="1.4">'+[...Array(12)].map((_,i)=>`<line x1="50" y1="54" x2="${50+Math.cos(i/12*6.28)*38}" y2="${54+Math.sin(i/12*6.28)*38}" stroke-dasharray="2 4"/>`).join('')+'</g>'},
{n:'XII · The Tide',w:'where you stand',m:'What left is returning, changed. Do not build on the sand line you drew yesterday.',s:'<circle cx="50" cy="30" r="16" fill="#fff3c4" stroke="#2a1238" stroke-width="2"/><circle cx="57" cy="26" r="14" fill="#e8d3a3"/>'+[0,1,2,3,4].map(i=>`<path d="M5 ${70+i*12}q11-10 22 0t22 0t22 0t22 0" fill="none" stroke="${i%2?'#c9a14a':'#2a1238'}" stroke-width="2"/>`).join('')},
{n:'XVII · The Moth',w:'the way ahead',m:'You will be drawn toward a brighter thing. Go, but keep your wings.',s:'<path d="M50 40c-30-30-46-6-40 14 6 18 26 14 40 2 14 12 34 16 40-2 6-20-10-44-40-14z" fill="#c9a14a" stroke="#2a1238" stroke-width="2"/><path d="M50 56c-20 10-30 34-16 40 10 4 14-10 16-22 2 12 6 26 16 22 14-6 4-30-16-40z" fill="#e8622b" stroke="#2a1238" stroke-width="2"/><path d="M50 30v66" stroke="#2a1238" stroke-width="4" stroke-linecap="round"/><path d="M48 30c-4-10-10-14-14-14M52 30c4-10 10-14 14-14" fill="none" stroke="#2a1238" stroke-width="1.5"/><circle cx="30" cy="40" r="5" fill="#2a1238"/><circle cx="70" cy="40" r="5" fill="#2a1238"/><g fill="#2a1238">'+[...Array(14)].map((_,i)=>`<circle cx="${8+i*6.5}" cy="${118+Math.sin(i)*3}" r="1"/>`).join('')+'</g>'}];
const r=document.getElementById('r');C.forEach((c,i)=>{const d=document.createElement('div');d.className='cd';d.innerHTML=`<div class="fa bk"></div><div class="fa fr"><svg viewBox="0 0 100 125">${c.s}</svg><b>${c.n}</b><i>${c.w}</i></div>`;d.onclick=()=>{d.classList.toggle('f');document.getElementById('rd').innerHTML=d.classList.contains('f')?`<b style="font-style:normal">${c.n}</b> — ${c.m}`:'Turn the card again.'};r.appendChild(d)});
setTimeout(()=>r.children[1].click(),600);
</script></body></html>
