<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sumi Ink in Water</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Cormorant+Garamond:ital@1&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#ece8de}canvas{display:block;width:100%;height:100%;position:fixed;inset:0;touch-action:none}
#c{cursor:crosshair}
.v{position:fixed;right:5vw;top:8vh;writing-mode:vertical-rl;font:800 clamp(30px,4.4vw,60px)/1.3 'Shippori Mincho',serif;color:#141414;letter-spacing:.24em;pointer-events:none;animation:ink 2.4s .3s both}
@keyframes ink{from{opacity:0;filter:blur(8px)}}
.v small{font:500 13px 'Shippori Mincho';letter-spacing:.4em;color:#7a2a20;margin-top:2em}
.en{position:fixed;left:5vw;bottom:7vh;font:italic 17px/1.5 'Cormorant Garamond',serif;color:#3a3530;pointer-events:none;max-width:34ch;animation:ink 2s 1s both}
.en b{display:block;font:500 10px 'Shippori Mincho';letter-spacing:.32em;text-transform:uppercase;font-style:normal;color:#7a2a20;margin-bottom:6px}
.seal{position:fixed;right:5vw;bottom:8vh;width:50px;height:50px;background:#b3261e;color:#ece8de;font:800 15px/1.1 'Shippori Mincho',serif;display:grid;place-items:center;text-align:center;border-radius:4px;box-shadow:inset 0 0 0 3px #b3261e,inset 0 0 0 4px rgba(236,232,222,.6);transform:rotate(-3deg);animation:stamp .5s 1.8s cubic-bezier(.2,.9,.3,1.5) both}
@keyframes stamp{from{transform:scale(2) rotate(-12deg);opacity:0}}
.inks{position:fixed;left:5vw;top:8vh;display:flex;gap:10px}
.inks button{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.15);transition:transform .25s cubic-bezier(.2,.9,.3,1.5)}
.inks button:hover{transform:scale(1.12)}.inks button.on{box-shadow:0 0 0 2px #ece8de,0 0 0 3px #141414}
.inks span{font:500 10px 'Shippori Mincho';letter-spacing:.3em;color:#5a524a;align-self:center;margin-left:4px}
@media (max-width:640px){.en{display:none}}
</style></head><body>
<canvas id="c"></canvas>
<div class="inks" id="inks"><span id="iname">墨 sumi</span></div>
<div class="v">墨流し<small>suminagashi</small></div>
<div class="en"><b>Floating ink</b>Click to let a drop of ink bloom on the water in rings. Drag to comb the surface. Choose an ink above; press space for a breath of wind.</div>
<div class="seal">墨<br>水</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);let W,H,paper;
const INKS=[['#141416','墨 sumi'],['#a8241c','朱 shu'],['#22385f','藍 ai'],['#5b6b3a','鶯 uguisu']];let ink=0;
const ib=document.getElementById('inks');INKS.forEach((k,i)=>{const b=document.createElement('button');b.style.background=k[0];b.setAttribute('aria-label',k[1]);b.onclick=e=>{e.stopPropagation();setInk(i)};ib.insertBefore(b,document.getElementById('iname'))});
function setInk(i){ink=i;[...ib.querySelectorAll('button')].forEach((b,j)=>b.classList.toggle('on',j===i));document.getElementById('iname').textContent=INKS[i][1]}setInk(0);
function makePaper(){paper=document.createElement('canvas');paper.width=W;paper.height=H;const p=paper.getContext('2d');p.fillStyle='#ece8de';p.fillRect(0,0,W,H);
for(let i=0;i<W*H/900;i++){p.strokeStyle=`rgba(${120+Math.random()*60},${110+Math.random()*50},${90+Math.random()*40},${Math.random()*.07})`;p.lineWidth=(.3+Math.random()*.7)*dpr;const x0=Math.random()*W,y0=Math.random()*H,a=Math.random()*6.28,l=(6+Math.random()*26)*dpr;p.beginPath();p.moveTo(x0,y0);p.quadraticCurveTo(x0+Math.cos(a+.6)*l*.5,y0+Math.sin(a+.6)*l*.5,x0+Math.cos(a)*l,y0+Math.sin(a)*l);p.stroke()}
const g=p.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(90,70,40,.16)');p.fillStyle=g;p.fillRect(0,0,W,H)}
let rings=[],drops=[];
function size(){const oW=W,oH=H;W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;makePaper();if(oW){const sx=W/oW,sy=H/oH;rings.forEach(r=>r.p.forEach(q=>{q[0]*=sx;q[1]*=sy}))}}
size();addEventListener('resize',size);
// marbling maths: a drop of radius R at C pushes every point P to C + (P-C)·sqrt(1 + R²/|P-C|²)
function drop(cx,cy,R,col,n=5){drops.push({cx,cy,a:R*R/44,f:44,col,n,k:0,ev:Math.max(2,Math.floor(44/n))})}
function ring(cx,cy,r,col,w){const n=Math.max(40,Math.round(r*.9));const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}rings.push({p,col,w});if(rings.length>64)rings.shift()}
function push(cx,cy,a){for(const r of rings)for(const q of r.p){const dx=q[0]-cx,dy=q[1]-cy,d2=dx*dx+dy*dy+1e-3;const s=Math.sqrt(1+a/d2);q[0]=cx+dx*s;q[1]=cy+dy*s}}
function comb(ax,ay,bx,by){const mx=bx-ax,my=by-ay,l=Math.hypot(mx,my);if(l<.5)return;const lam=60*dpr;for(const r of rings)for(const q of r.p){const dx=q[0]-bx,dy=q[1]-by,d=Math.hypot(dx,dy);const k=Math.exp(-d/lam)*.9;q[0]+=mx*k;q[1]+=my*k}}
function resample(r){const out=[];const P=r.p,n=P.length,max=7*dpr;for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];out.push(a);const d=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d>max&&out.length<1400){const k=Math.min(6,Math.floor(d/max));for(let j=1;j<=k;j++)out.push([a[0]+(b[0]-a[0])*j/(k+1),a[1]+(b[1]-a[1])*j/(k+1)])}}r.p=out}
let down=false,lx,ly,dx0,dy0,moved=0,wind=0;
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);down=true;lx=dx0=e.clientX*dpr;ly=dy0=e.clientY*dpr;moved=0});
c.addEventListener('pointermove',e=>{if(!down)return;const X=e.clientX*dpr,Y=e.clientY*dpr;moved+=Math.hypot(X-lx,Y-ly);comb(lx,ly,X,Y);lx=X;ly=Y});
c.addEventListener('pointerup',()=>{if(down&&moved<6*dpr){drop(dx0,dy0,(80+Math.random()*70)*dpr,INKS[ink][0],7+(Math.random()*4|0))}down=false});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();wind=1}const n=+e.key;if(n>=1&&n<=4)setInk(n-1)});
// opening composition
const seq=[[.4,.46,190,0],[.58,.56,130,0],[.46,.32,90,1],[.66,.38,100,0],[.3,.64,80,2],[.5,.5,60,0]];seq.forEach(([a,b,r,k],i)=>setTimeout(()=>drop(W*a,H*b,r*dpr,INKS[k][0],9),300+i*800));
setInterval(()=>{if(!down&&rings.length<60)drop(W*(.2+Math.random()*.6),H*(.2+Math.random()*.6),(50+Math.random()*50)*dpr,INKS[Math.random()<.2?1:0][0],5)},7000);
let t=0;function f(){t+=.004;
for(const d of drops){if(d.k%d.ev===0&&d.k<d.ev*d.n){const ci=d.k/d.ev;if(ci%2===0)ring(d.cx,d.cy,1.2*dpr,d.col,(5+Math.random()*5)*dpr)}push(d.cx,d.cy,d.a);d.k++}
drops=drops.filter(d=>d.k<d.f);
// slow drifting current, plus a breath of wind
wind*=.97;const wx=wind*2.4*dpr;
for(const r of rings){for(const q of r.p){const u=q[0]/W,v=q[1]/H;q[0]+=Math.sin(v*6+t*2)*.12*dpr+wx*Math.exp(-((v-.5)**2)*8);q[1]+=Math.cos(u*5+t*1.6)*.1*dpr}resample(r)}
x.drawImage(paper,0,0);x.lineJoin='round';
for(const r of rings){if(r.col.startsWith('rgba'))continue;x.strokeStyle=r.col;x.globalAlpha=.88;x.lineWidth=r.w;x.beginPath();const P=r.p;x.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++)x.lineTo(P[i][0],P[i][1]);x.closePath();x.stroke()}
x.globalAlpha=1;x.globalCompositeOperation='multiply';x.globalAlpha=.25;x.drawImage(paper,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';
requestAnimationFrame(f)}f();
</script></body></html>
