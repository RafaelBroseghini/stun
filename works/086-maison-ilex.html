<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuit d'Ambre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@300;500&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{min-height:100%}body{background:#e9cfc4;color:#4a1420;font-family:Jost,sans-serif;overflow-x:hidden}
nav{display:flex;justify-content:space-between;padding:22px 5vw;font-size:12px;letter-spacing:.3em;text-transform:uppercase}nav b{font:italic 400 22px 'Bodoni Moda',serif;letter-spacing:.05em;text-transform:none}
.h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;min-height:calc(100vh - 70px);padding:0 5vw;gap:4vw}
.bt{position:relative;height:min(74vh,90vw);aspect-ratio:.62;margin:auto}
.cap{position:absolute;left:30%;right:30%;top:0;height:22%;background:linear-gradient(90deg,#2a0a10,#6b2030 30%,#3a0e16 60%,#1a0508);border-radius:6px 6px 2px 2px}
.cap::after{content:"";position:absolute;left:10%;top:6%;width:14%;height:88%;background:linear-gradient(rgba(255,255,255,.35),transparent);border-radius:4px}
.neck{position:absolute;left:40%;right:40%;top:21%;height:6%;background:linear-gradient(90deg,#b88a4a,#f3d9a0,#9a6a30)}
.glass{position:absolute;left:0;right:0;top:26%;bottom:0;border-radius:24px 24px 30px 30px;background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.08) 20%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.28));box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 40px 60px -20px rgba(74,20,32,.5);overflow:hidden;backdrop-filter:blur(2px)}
.liq{position:absolute;left:5%;right:5%;bottom:4%;height:78%;border-radius:18px 18px 24px 24px;background:linear-gradient(#e89a3a,#c0561c 60%,#8a2a10);opacity:.92;animation:sl 6s ease-in-out infinite alternate}@keyframes sl{to{transform:skewY(-1.2deg)}}
.liq::before{content:"";position:absolute;left:0;right:0;top:0;height:6%;background:linear-gradient(#f8c27a,transparent);border-radius:50%}
.lbl{position:absolute;left:18%;right:18%;top:44%;padding:8% 0;background:#f4e6d6;text-align:center;border:1px solid #b88a4a}.lbl b{display:block;font:italic 400 clamp(16px,2vw,26px) 'Bodoni Moda',serif}.lbl small{font-size:9px;letter-spacing:.3em}
.shine{position:absolute;left:8%;top:5%;width:10%;height:80%;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0));border-radius:30px;filter:blur(2px)}
.tx h1{font:400 clamp(48px,7.5vw,120px)/.88 'Bodoni Moda',serif;letter-spacing:-.02em}.tx h1 em{display:block;font-style:italic;padding-left:.6em}
.tx p{font-weight:300;font-size:17px;line-height:1.6;max-width:40ch;margin:3vh 0}.notes{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #4a142055;margin:3vh 0}.notes div{padding:14px 10px 0 0;font-size:13px;line-height:1.6}.notes b{display:block;font-weight:500;font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.65;margin-bottom:4px}
.buy{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.buy button{background:#4a1420;color:#f4e6d6;border:0;padding:16px 34px;font:500 12px Jost;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;transition:.3s}.buy button:hover{background:#7a2030}.buy span{font:400 26px 'Bodoni Moda',serif}
.sz{display:flex;gap:8px}.sz button{background:none;color:#4a1420;border:1px solid #4a1420;padding:10px 14px;letter-spacing:.1em}.sz button.on{background:#4a1420;color:#f4e6d6}
@media(max-width:820px){.h{grid-template-columns:1fr;padding-bottom:6vh}.bt{height:60vh}}</style></head><body>
<nav><span>Parfums</span><b>Maison Ilex</b><span>Sac (<i id="n" style="font-style:normal">0</i>)</span></nav>
<section class="h"><div class="bt"><div class="cap"></div><div class="neck"></div><div class="glass"><div class="liq"></div><div class="lbl"><small>MAISON ILEX</small><b>Nuit d'Ambre</b><small>EAU DE PARFUM</small></div><div class="shine"></div></div></div>
<div class="tx"><h1>Nuit<em>d'Ambre</em></h1><p>Resin warmed on skin at the end of a long dinner. Labdanum and smoked tea, softened with fig leaf and the last of the candle.</p>
<div class="notes"><div><b>Tête</b>Fig leaf, pink pepper</div><div><b>Cœur</b>Smoked tea, iris</div><div><b>Fond</b>Labdanum, benzoin</div></div>
<div class="buy"><div class="sz" id="sz"><button data-p="98">30 ml</button><button class="on" data-p="165">50 ml</button><button data-p="240">100 ml</button></div><span id="pr">€165</span><button id="add">Add to bag</button></div></div></section>
<script>document.querySelectorAll('#sz button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#sz button').forEach(o=>o.classList.toggle('on',o===b));document.getElementById('pr').textContent='€'+b.dataset.p});let n=0;document.getElementById('add').onclick=e=>{document.getElementById('n').textContent=++n;e.target.textContent='Added';setTimeout(()=>e.target.textContent='Add to bag',1400)}</script>
</body></html>
