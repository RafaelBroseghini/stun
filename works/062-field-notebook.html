<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Notebook No. 9</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Reenie+Beanie&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{min-height:100%}
body{background:#4b3a2b radial-gradient(80% 70% at 50% 40%,#6a523c,#2e2219);display:grid;place-items:center;min-height:100vh;padding:3vh 16px 9vh;font-family:Caveat,cursive;color:#1f3a6b;overflow-x:hidden;user-select:none;-webkit-user-select:none}
.book{position:relative;width:min(1200px,100%,calc((100vh - 14vh)*1.5));aspect-ratio:1.5;perspective:2400px;animation:open 1.2s cubic-bezier(.2,.8,.2,1) both}@keyframes open{from{transform:rotateX(18deg) translateY(30px);opacity:0}}
.spread{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 30px 60px rgba(0,0,0,.5);border-radius:6px;overflow:hidden}
.pg{position:relative;padding:5% 6%;background:#f1ecdd;background-image:linear-gradient(rgba(70,110,160,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(70,110,160,.14) 1px,transparent 1px);background-size:22px 22px;overflow:hidden}
.pg.l{box-shadow:inset -30px 0 40px -20px rgba(0,0,0,.25)}.pg.r{box-shadow:inset 30px 0 40px -20px rgba(0,0,0,.25)}
.pg .no{position:absolute;bottom:3%;font:400 16px 'Reenie Beanie';color:#9a3b2b;opacity:.7}.pg.l .no{left:6%}.pg.r .no{right:6%}
h1{font-weight:700;font-size:clamp(24px,2.8vw,40px);line-height:1}.date{font-size:clamp(14px,1.4vw,20px);color:#9a3b2b}
p{font-size:clamp(14px,1.45vw,21px);line-height:1.25;margin-top:.8em;max-width:30ch}
svg.sk{position:absolute;overflow:visible}svg.sk path,svg.sk circle,svg.sk ellipse{fill:none;stroke:#2b2b2b;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l)}
.on svg.sk path,.on svg.sk circle,.on svg.sk ellipse{animation:draw 4s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
svg.sk .wash{stroke:none;fill:var(--w);opacity:0;stroke-dasharray:none}.on svg.sk .wash{animation:wash 2s 2.5s forwards}@keyframes wash{to{opacity:.35}}
.tape{position:absolute;width:90px;height:26px;background:rgba(240,220,140,.7);transform:rotate(-8deg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.photo{position:absolute;right:8%;top:8%;width:36%;aspect-ratio:1.2;background:linear-gradient(#93b5c9 0 45%,#4f6d4a 45%);border:8px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);transform:rotate(3deg)}
.photo::after{content:"";position:absolute;left:30%;top:28%;width:16%;aspect-ratio:1;border-radius:50%;background:#2b2b2b;box-shadow:12px 6px 0 -2px #2b2b2b}
.ring{position:absolute;width:150px;height:150px;border-radius:50%;border:10px solid rgba(120,70,20,.16);left:52%;bottom:6%;filter:blur(1px)}
.note{font-family:'Reenie Beanie',cursive;color:#9a3b2b;font-size:clamp(16px,1.6vw,24px);position:absolute;transform:rotate(-4deg)}
.leaf{position:absolute;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.25))}
table{border-collapse:collapse;margin-top:1em;font-size:clamp(14px,1.3vw,19px)}td{border-bottom:1px solid rgba(31,58,107,.3);padding:2px 14px 2px 0}
canvas.pen{position:absolute;inset:0;width:100%;height:100%;z-index:5;cursor:crosshair;touch-action:none}
.turn{position:absolute;top:0;bottom:0;left:50%;width:50%;transform-origin:left;transform-style:preserve-3d;z-index:20;transition:transform .9s cubic-bezier(.5,0,.3,1)}
.turn .pg{position:absolute;inset:0;backface-visibility:hidden}.turn .back{transform:rotateY(180deg)}
.turn.back-dir{left:0;transform-origin:right}
.bar{position:fixed;left:50%;bottom:2vh;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font:400 18px 'Reenie Beanie',cursive;color:#f1ecdd;z-index:30}
.bar button{font:700 16px Caveat;color:#2b2219;background:#f1ecdd;border:0;padding:5px 12px;border-radius:99px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}.bar button.ink{width:26px;height:26px;padding:0;border:3px solid #f1ecdd}.bar button[aria-pressed="true"]{outline:2px solid #fff;outline-offset:2px}
@media(max-width:760px){.book{aspect-ratio:.75}.spread{grid-template-columns:1fr}.spread .r{display:none}}
</style></head><body>
<div class="book" id="book"></div>
<div class="bar"><button id="pv">‹ turn back</button><span id="pn">1 / 3</span><button id="nx">turn over ›</button>&nbsp;&nbsp;<button class="ink" data-c="#2b2b2b" style="background:#2b2b2b" aria-pressed="true" aria-label="Graphite"></button><button class="ink" data-c="#9a3b2b" style="background:#9a3b2b" aria-label="Red pencil"></button><button class="ink" data-c="#1f3a6b" style="background:#1f3a6b" aria-label="Blue pen"></button><button class="ink" data-c="wash" style="background:radial-gradient(#7fb0a0,#4f8a7a)" aria-label="Watercolour"></button><button id="rub">rub out</button></div>
<script>
const SP=[[`<div class="date">Tues. 9 Sept — Loch Arkaig, 06:40</div><h1>The heron again</h1><p>Same bird as Sunday I think — notch in the left wing. Stood 41 minutes in the shallows without moving. Took a small trout at 07:21.</p><p>Wind SW, light. Mist lifting off the far shore by 7.</p><p>Bracken already turning at the edges.</p>
<svg class="sk" viewBox="0 0 300 260" style="left:8%;bottom:6%;width:62%"><path class="wash" style="--w:#8fb3c9" d="M10 230c60-20 200-20 280 0v20H10z"/><path style="--l:900" d="M140 40c10-12 30-10 34 4 3 10-8 18-16 22-12 6-8 30-6 52 2 26-4 52-22 66-14 10-40 12-52 4"/><path style="--l:200" d="M172 44l40 8-38 2"/><path style="--l:600" d="M130 120c-30 10-60 40-62 70 30-10 60-8 80-24"/><path style="--l:300" d="M120 200l-6 50M132 196l10 54M100 250h30M134 250h28"/><circle style="--l:30" cx="160" cy="44" r="2.6"/><path style="--l:300" d="M20 240c40-6 80 4 120 0s100-8 140 2"/></svg><span class="note" style="right:8%;bottom:30%">Ardea cinerea<br>↓ c. 90 cm</span>`,
`<div class="photo"></div><span class="tape" style="right:24%;top:5%"></span><h1 style="margin-top:2%">Lichens, N wall</h1><p style="max-width:22ch">Three kinds on the old sheep-fold. The orange one only on the south-facing stones.</p>
<svg class="sk" viewBox="0 0 400 200" style="left:6%;top:46%;width:86%"><ellipse class="wash" style="--w:#e8a33d" cx="70" cy="80" rx="46" ry="34"/><ellipse class="wash" style="--w:#a8b89a" cx="330" cy="80" rx="44" ry="30"/><ellipse style="--l:300" cx="70" cy="80" rx="46" ry="34"/><path style="--l:400" d="M40 80c10-10 20 10 30 0s20 10 30 0M50 64c8 4 14-6 22 0s14-4 22 2M48 98c10 4 20-4 30 2s18-4 26 0"/><ellipse style="--l:280" cx="200" cy="80" rx="40" ry="40"/><path style="--l:400" d="M200 40v80M160 80h80M172 52l56 56M228 52l-56 56"/><ellipse style="--l:300" cx="330" cy="80" rx="44" ry="30"/><path style="--l:300" d="M300 80q15-20 30 0t30 0"/><path style="--l:80" d="M60 140l10 20M200 140v20M330 140l-8 20"/></svg>
<p class="note" style="left:8%;bottom:14%">Xanthoria? · Lecanora · map lichen (Rhizocarpon) — check key at home!</p><div class="ring"></div>`],
[`<div class="date">Thurs. 11 Sept — bothy, 22:10</div><h1>Moth sheet</h1><p>Hung the white sheet off the door with the head-torch behind it. Within twenty minutes: eleven species, one I can’t name.</p><p>Fat drops of rain at 22:40. Packed up.</p>
<svg class="sk" viewBox="0 0 300 200" style="left:10%;bottom:8%;width:70%"><path class="wash" style="--w:#c9a37e" d="M150 100C110 40 40 50 50 100c10 40 70 40 100 0zM150 100c40-60 110-50 100 0-10 40-70 40-100 0z"/><path style="--l:600" d="M150 100C110 40 40 50 50 100c10 40 70 40 100 0zM150 100c40-60 110-50 100 0-10 40-70 40-100 0z"/><path style="--l:200" d="M150 70v80M150 70c-6-20-20-30-30-34M150 70c6-20 20-30 30-34"/><circle style="--l:60" cx="95" cy="92" r="9"/><circle style="--l:60" cx="205" cy="92" r="9"/></svg><span class="note" style="right:6%;top:52%">Angle Shades?<br>no — wings too pale</span>`,
`<h1>Tides &amp; weather</h1><table><tr><td>Fri</td><td>HW 06:12</td><td>4.1 m</td><td>☁ SW 3</td></tr><tr><td>Sat</td><td>HW 06:58</td><td>4.3 m</td><td>☂ W 5</td></tr><tr><td>Sun</td><td>HW 07:41</td><td>4.4 m</td><td>☼ NW 2</td></tr><tr><td>Mon</td><td>HW 08:20</td><td>4.2 m</td><td>☁ N 3</td></tr></table>
<p>Springs at the weekend — walk the sand bar to the island on Sunday, back before 11.</p><svg class="sk" viewBox="0 0 400 120" style="left:6%;bottom:12%;width:86%"><path style="--l:900" d="M0 60c25-40 50-40 75 0s50 40 75 0 50-40 75 0 50 40 75 0 50-40 75 0"/><path style="--l:400" d="M0 100h400"/></svg><span class="note" style="right:8%;bottom:4%">← moon full on the 14th</span>`],
[`<div class="date">Sat. 13 Sept — Glen Dessary</div><h1>Pressed &amp; kept</h1><p>Rowan leaf, a feather from the track (buzzard?), and a sprig of bell heather for M.</p>
<svg class="leaf" viewBox="0 0 200 200" style="left:10%;top:42%;width:40%"><g fill="#c25a2a" stroke="#7a2a10" stroke-width="1"><path d="M100 190V20"/>${[0,1,2,3,4,5].map(i=>`<path d="M100 ${40+i*24}c-30-10-50-2-60 8 20 8 40 6 60-8zM100 ${40+i*24}c30-10 50-2 60 8-20 8-40 6-60-8z"/>`).join('')}</g></svg>
<svg class="leaf" viewBox="0 0 80 240" style="right:12%;top:30%;width:14%"><path d="M40 230V20" stroke="#5a4a3a" stroke-width="2"/><path d="M40 30c-20 30-26 80-20 150 8-2 16-60 20-150zM40 30c20 30 26 80 20 150-8-2-16-60-20-150z" fill="#8a7a6a" opacity=".9"/><path d="M40 50l-14 20M40 80l-16 22M40 110l-16 24M40 60l14 20M40 92l16 22" stroke="#5a4a3a" stroke-width=".8"/></svg>`,
`<h1>Note to self</h1><p>Come back in May, when the sandpipers are here and the loch is high.</p><p>Bring: the better lens, more pencils, waxed jacket (!), a friend.</p><svg class="sk" viewBox="0 0 300 200" style="left:10%;bottom:12%;width:70%"><path class="wash" style="--w:#e8c07a" d="M60 140c20-60 160-60 180 0z"/><path style="--l:700" d="M60 140c20-60 160-60 180 0M40 140h220M150 80V40M120 60l60-20M180 60l-60-20"/><path style="--l:300" d="M90 170c20 10 100 10 120 0"/></svg><span class="note" style="left:10%;bottom:4%">— the end of No. 9 —</span>`]];
const book=document.getElementById('book');let cur=0;const canv=[];
function pageHTML(s,side,i){return `<div class="pg ${side}">${SP[s][side==='l'?0:1]}<span class="no">${s*2+(side==='l'?1:2)}</span></div>`}
function render(s){book.innerHTML=`<div class="spread on">${pageHTML(s,'l')}${pageHTML(s,'r')}</div>`;const sp=book.firstChild;sp.querySelectorAll('svg.sk path,svg.sk ellipse,svg.sk circle').forEach((p,i)=>p.style.animationDelay=(i*.12)+'s');
const cv=document.createElement('canvas');cv.className='pen';sp.appendChild(cv);setupPen(cv,s);document.getElementById('pn').textContent=`${s+1} / ${SP.length}`}
let ink='#2b2b2b';document.querySelectorAll('.ink').forEach(b=>b.onclick=()=>{ink=b.dataset.c;document.querySelectorAll('.ink').forEach(o=>o.setAttribute('aria-pressed',o===b))});
function setupPen(cv,s){const x=cv.getContext('2d'),d=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;if(canv[s])x.drawImage(canv[s],0,0,cv.width,cv.height);
let L=null;cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);L=[e.offsetX*d,e.offsetY*d]});cv.addEventListener('pointerup',()=>{L=null;canv[s]=cv});
cv.addEventListener('pointermove',e=>{if(!L)return;const X=e.offsetX*d,Y=e.offsetY*d;if(ink==='wash'){x.globalCompositeOperation='multiply';const g=x.createRadialGradient(X,Y,0,X,Y,22*d);g.addColorStop(0,'rgba(79,138,122,.08)');g.addColorStop(1,'rgba(79,138,122,0)');x.fillStyle=g;x.fillRect(X-22*d,Y-22*d,44*d,44*d);x.globalCompositeOperation='source-over'}else{for(let k=0;k<3;k++){x.strokeStyle=ink;x.globalAlpha=.25+Math.random()*.35;x.lineWidth=(.8+Math.random())*d;x.lineCap='round';x.beginPath();x.moveTo(L[0]+(Math.random()-.5)*d,L[1]+(Math.random()-.5)*d);x.lineTo(X+(Math.random()-.5)*d,Y+(Math.random()-.5)*d);x.stroke()}x.globalAlpha=1}L=[X,Y]});
cv.addEventListener('dblclick',()=>{x.clearRect(0,0,cv.width,cv.height);canv[s]=null})}
document.getElementById('rub').onclick=()=>{const cv=book.querySelector('canvas.pen');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);canv[cur]=null};
let ac;function rustle(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*Math.sin(i/dd.length*Math.PI)*.6;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=2200;f.Q.value=.5;g.gain.value=.15;s.connect(f).connect(g).connect(ac.destination);s.start()}catch(e){}}
let busy=false;function turn(dir){const n=cur+dir;if(busy||n<0||n>=SP.length)return;busy=true;rustle();const sp=book.firstChild;
if(dir>0){const nextL=document.createElement('div');nextL.innerHTML=pageHTML(n,'l');const leaf=document.createElement('div');leaf.className='turn';leaf.innerHTML=pageHTML(cur,'r')+`<div class="pg l back">${SP[n][0]}<span class="no">${n*2+1}</span></div>`;sp.querySelector('.r').innerHTML=new DOMParser().parseFromString(pageHTML(n,'r'),'text/html').body.firstChild.innerHTML;book.appendChild(leaf);requestAnimationFrame(()=>requestAnimationFrame(()=>leaf.style.transform='rotateY(-180deg)'))
setTimeout(()=>{cur=n;render(cur);busy=false},920)}
else{const leaf=document.createElement('div');leaf.className='turn back-dir';leaf.innerHTML=pageHTML(cur,'l')+`<div class="pg r back">${SP[n][1]}<span class="no">${n*2+2}</span></div>`;sp.querySelector('.l').innerHTML=new DOMParser().parseFromString(pageHTML(n,'l'),'text/html').body.firstChild.innerHTML;book.appendChild(leaf);requestAnimationFrame(()=>requestAnimationFrame(()=>leaf.style.transform='rotateY(180deg)'));setTimeout(()=>{cur=n;render(cur);busy=false},920)}}
document.getElementById('nx').onclick=()=>turn(1);document.getElementById('pv').onclick=()=>turn(-1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});
render(0);addEventListener('resize',()=>render(cur));
</script>
</body></html>
