<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Valley</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#ffe5c7;font-family:Sniglet,sans-serif}
.l{position:fixed;left:-6%;right:-6%;bottom:-6%;top:0;transition:transform .25s ease-out}.l svg{position:absolute;left:0;bottom:0;width:100%;height:100%;filter:drop-shadow(0 -6px 8px rgba(80,40,20,.22))}
.sun{position:fixed;left:62%;top:14%;width:min(22vh,30vw);aspect-ratio:1;border-radius:50%;background:#ff8a5b;box-shadow:0 0 0 18px rgba(255,138,91,.25),0 0 0 40px rgba(255,138,91,.12)}
.t{position:fixed;left:6vw;top:8vh;color:#5a2e3a;z-index:20}.t h1{font-weight:800;font-size:clamp(40px,7vw,100px);line-height:.85}.t p{font-size:16px;margin-top:10px;opacity:.8}
.cl{position:fixed;height:24px;background:#fff6ea;border-radius:20px;filter:drop-shadow(0 4px 4px rgba(80,40,20,.15));animation:d linear infinite}.cl::before{content:"";position:absolute;width:44%;height:200%;left:18%;bottom:30%;background:inherit;border-radius:50%}@keyframes d{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}</style></head><body>
<div class="sun"></div><div class="cl" style="width:140px;top:22%;animation-duration:70s;animation-delay:-30s"></div><div class="cl" style="width:90px;top:12%;animation-duration:90s;animation-delay:-70s"></div>
<div class="t"><h1>paper<br>valley</h1><p>seven sheets of card, one craft knife · move your cursor</p></div>
<div id="L"></div>
<script>
const cols=['#f9b98e','#f19a8a','#d97c8c','#b36487','#86507f','#5a3e6e','#3a2f55'];const L=document.getElementById('L');const layers=[];
cols.forEach((c,i)=>{const d=document.createElement('div');d.className='l';d.style.zIndex=i+1;const base=40+i*7.5,amp=10-i*.6;let p=`M0 100 L0 ${base}`;for(let k=0;k<=20;k++){const X=k*5,y=base+Math.sin(k*.9+i*1.7)*amp*.6+Math.sin(k*.33+i)*amp;p+=` Q${X-2.5} ${y-3} ${X} ${y}`}p+=' L100 100Z';
let extra='';if(i===3)for(let k=0;k<9;k++){const X=8+k*11+Math.sin(k)*3,y=base+Math.sin((X/5)*.9+i*1.7)*amp*.6+Math.sin((X/5)*.33+i)*amp-2;extra+=`<path d="M${X} ${y-9}L${X-2.4} ${y}L${X+2.4} ${y}Z" fill="#2f5a4a"/>`}
if(i===5){extra+=`<rect x="70" y="${base-6}" width="7" height="6" fill="#ffe5c7"/><path d="M69 ${base-6}L73.5 ${base-10}L78 ${base-6}Z" fill="#b3261e"/><rect x="72.5" y="${base-3.5}" width="1.6" height="1.6" fill="#ffc94a"/>`}
d.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${p}" fill="${c}"/>${extra}</svg>`;L.appendChild(d);layers.push(d)});
let tx=0,ty=0;addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5;layers.forEach((l,i)=>l.style.transform=`translate(${-tx*(i+1)*10}px,${-ty*(i+1)*5}px)`)});
</script></body></html>
