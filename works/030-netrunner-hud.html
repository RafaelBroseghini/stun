<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Netrunner HUD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{--c:#2ff3ff;--m:#ff2fa8;--y:#ffe14f;background:radial-gradient(ellipse at center,#0b1a2e,#04070f 70%);color:var(--c);font-family:'Share Tech Mono',monospace;cursor:none}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(transparent 0 2px,rgba(47,243,255,.03) 2px 3px);pointer-events:none}
.ring{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}.ring svg{display:block}
.r1{animation:rot 30s linear infinite}.r2{animation:rot 18s linear infinite reverse}.r3{animation:rot 50s linear infinite}@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.core{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-family:Rajdhani,sans-serif}.core b{display:block;font-size:clamp(40px,7vw,90px);font-weight:700;color:#fff;text-shadow:0 0 18px var(--c);line-height:1}.core span{letter-spacing:.4em;font-size:12px}
.p{position:fixed;width:min(300px,40vw);border:1px solid rgba(47,243,255,.35);padding:12px 14px;font-size:12px;line-height:1.6;background:rgba(4,12,24,.6);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.p h3{font:700 13px Rajdhani,sans-serif;letter-spacing:.3em;color:var(--m);margin-bottom:6px;display:flex;justify-content:space-between}.p h3 i{width:8px;height:8px;background:var(--m);animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.tl{left:3vw;top:4vh}.tr{right:3vw;top:4vh}.bl{left:3vw;bottom:4vh}.br{right:3vw;bottom:4vh}
.bar{height:6px;background:rgba(47,243,255,.15);margin:4px 0 8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--m));transition:width .5s}
#cur{position:fixed;width:60px;height:60px;border:1px solid var(--y);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 10px var(--y)}#cur::before,#cur::after{content:"";position:absolute;background:var(--y)}#cur::before{left:50%;top:-12px;bottom:-12px;width:1px}#cur::after{top:50%;left:-12px;right:-12px;height:1px}
#co{position:fixed;font-size:11px;color:var(--y);pointer-events:none}canvas{width:100%;height:60px;display:block}
@media(max-width:700px){.p{font-size:10px}.bl,.br{display:none}}</style></head><body>
<div class="ring r3"><svg width="720" height="720" viewBox="-360 -360 720 720" style="width:min(92vmin,720px);height:auto"><circle r="340" fill="none" stroke="#2ff3ff" stroke-opacity=".2" stroke-dasharray="2 8"/><circle r="320" fill="none" stroke="#2ff3ff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="120 40 20 40"/></svg></div>
<div class="ring r2"><svg viewBox="-260 -260 520 520" style="width:min(66vmin,520px);height:auto"><circle r="250" fill="none" stroke="#ff2fa8" stroke-width="6" stroke-dasharray="60 330" stroke-opacity=".8"/><circle r="232" fill="none" stroke="#2ff3ff" stroke-opacity=".35" stroke-dasharray="1 5" stroke-width="10"/></svg></div>
<div class="ring r1"><svg viewBox="-180 -180 360 360" style="width:min(46vmin,360px);height:auto"><circle r="170" fill="none" stroke="#2ff3ff" stroke-width="2" stroke-dasharray="200 30 10 30"/><path d="M0-180v24M0 180v-24M-180 0h24M180 0h-24" stroke="#ffe14f" stroke-width="2"/></svg></div>
<div class="core"><b id="pct">00%</b><span>ICE BREACH</span></div>
<div class="p tl"><h3>UPLINK <i></i></h3><div id="lg"></div></div>
<div class="p tr"><h3>VITALS <i></i></h3>NEURAL LOAD<div class="bar"><i id="b1" style="width:40%"></i></div>SYNAPTIC TEMP<div class="bar"><i id="b2" style="width:65%"></i></div>TRACE RISK<div class="bar"><i id="b3" style="width:20%"></i></div></div>
<div class="p bl"><h3>SIGNAL <i></i></h3><canvas id="sg"></canvas></div>
<div class="p br"><h3>TARGET <i></i></h3>KESTREL-DYNAMICS // SUBNET 7<br>NODE 0x3F:A1:9C · PORT 4433<br><span id="sc">--------</span></div>
<div id="cur"></div><div id="co"></div>
<script>
const $=i=>document.getElementById(i);const G='ABCDEF0123456789#$%&@';let p=0;
const lines=['handshake ok','spoofing mac','routing via 3 proxies','bypassing ice layer 1','injecting daemon','ice layer 2 cracked','decrypting vault','mirror established','payload staged','awaiting operator'];let li=0;
setInterval(()=>{p=Math.min(100,p+Math.random()*3);if(p>=100)p=0;$('pct').textContent=String(Math.floor(p)).padStart(2,'0')+'%';['b1','b2','b3'].forEach(b=>$(b).style.width=(20+Math.random()*75)+'%');$('sc').textContent=Array.from({length:24},()=>G[Math.random()*G.length|0]).join('')},300);
setInterval(()=>{const l=$('lg');l.innerHTML+='&gt; '+lines[li++%lines.length]+'<br>';const ls=l.innerHTML.split('<br>');if(ls.length>7)l.innerHTML=ls.slice(-7).join('<br>')},700);
addEventListener('pointermove',e=>{$('cur').style.left=e.clientX+'px';$('cur').style.top=e.clientY+'px';$('co').style.left=e.clientX+40+'px';$('co').style.top=e.clientY+30+'px';$('co').textContent=`X:${e.clientX} Y:${e.clientY} LOCK`});
$('cur').style.left='62%';$('cur').style.top='40%';
const cv=$('sg'),x=cv.getContext('2d');function f(t){cv.width=cv.clientWidth;cv.height=60;x.strokeStyle='#2ff3ff';x.lineWidth=1.5;x.beginPath();for(let i=0;i<cv.width;i++){const y=30+Math.sin(i*.08+t*.004)*12*Math.sin(i*.013+t*.001)+(Math.random()-.5)*4;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke();x.strokeStyle='#ff2fa8';x.beginPath();for(let i=0;i<cv.width;i++){const y=30+Math.cos(i*.05-t*.003)*18;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke();requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
