<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calibre 7 Chronograph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500&family=Libre+Baskerville:ital@1&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 40%,#2c3036,#0c0d0f 70%);display:grid;place-items:center;font-family:Oswald,sans-serif;color:#c9ccd1}
.w{width:min(86vmin,640px);aspect-ratio:1;position:relative;cursor:pointer}.w svg{width:100%;height:100%;filter:drop-shadow(0 30px 40px #000)}
.cap{position:fixed;left:5vw;bottom:6vh;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#8a9099}.cap b{display:block;font:italic 26px 'Libre Baskerville',serif;letter-spacing:0;text-transform:none;color:#e6e8eb;margin-bottom:6px}</style></head><body>
<div class="w" id="w" title="click to start / stop / reset the chronograph"><svg viewBox="-200 -200 400 400" id="s">
<defs><radialGradient id="case" cx=".35" cy=".3"><stop offset="0" stop-color="#f2f4f7"/><stop offset=".5" stop-color="#8d939b"/><stop offset="1" stop-color="#3a3f45"/></radialGradient>
<radialGradient id="dial" cx=".5" cy=".35"><stop offset="0" stop-color="#26364a"/><stop offset="1" stop-color="#0c1420"/></radialGradient>
<radialGradient id="sub"><stop offset="0" stop-color="#0a0f16"/><stop offset="1" stop-color="#1a2533"/></radialGradient>
<linearGradient id="hand" x1="0" x2="1"><stop offset="0" stop-color="#bfc5cc"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#8d939b"/></linearGradient></defs>
<rect x="-14" y="-200" width="28" height="30" rx="4" fill="url(#case)"/><rect x="178" y="-60" width="16" height="22" rx="3" fill="url(#case)" transform="rotate(-30)"/><rect x="178" y="38" width="16" height="22" rx="3" fill="url(#case)" transform="rotate(30)"/><rect x="186" y="-12" width="14" height="24" rx="3" fill="url(#case)"/>
<circle r="190" fill="url(#case)"/><circle r="176" fill="#15181c"/><g id="tachy"></g><circle r="150" fill="url(#dial)"/><g id="idx"></g>
<g transform="translate(0,-62)"><circle r="36" fill="url(#sub)" stroke="#3b4a5c"/><g id="s1"></g><line id="hm" y2="-30" stroke="#ff6a3d" stroke-width="2.4" stroke-linecap="round"/><circle r="3" fill="#ff6a3d"/></g>
<g transform="translate(-66,30)"><circle r="36" fill="url(#sub)" stroke="#3b4a5c"/><g id="s2"></g><line id="hs" y2="-30" stroke="#e6e8eb" stroke-width="2" stroke-linecap="round"/><circle r="3" fill="#e6e8eb"/></g>
<g transform="translate(66,30)"><circle r="36" fill="url(#sub)" stroke="#3b4a5c"/><g id="s3"></g><line id="hc" y2="-30" stroke="#ff6a3d" stroke-width="2" stroke-linecap="round"/><circle r="3" fill="#ff6a3d"/></g>
<rect x="96" y="-10" width="30" height="20" fill="#f2f0e8" stroke="#8d939b"/><text id="date" x="111" y="6" text-anchor="middle" font-family="Oswald" font-size="14" fill="#111">18</text>
<text y="100" text-anchor="middle" font-family="Libre Baskerville" font-style="italic" font-size="16" fill="#e6e8eb">Calibre 7</text><text y="116" text-anchor="middle" font-family="Oswald" font-size="7.5" letter-spacing="3" fill="#8a9bb0">AUTOMATIC · 100M</text>
<g id="H" style="filter:drop-shadow(3px 5px 3px rgba(0,0,0,.6))"><path d="M-6 20L-4 -80L0 -92L4 -80L6 20Z" fill="url(#hand)"/><path d="M-2 -40L0 -84L2 -40Z" fill="#cfe9ff"/></g>
<g id="M" style="filter:drop-shadow(4px 7px 3px rgba(0,0,0,.6))"><path d="M-4.5 24L-3 -128L0 -140L3 -128L4.5 24Z" fill="url(#hand)"/><path d="M-1.6 -60L0 -132L1.6 -60Z" fill="#cfe9ff"/></g>
<g id="S" style="filter:drop-shadow(5px 9px 3px rgba(0,0,0,.6))"><path d="M-1.2 36L-.8 -146L.8 -146L1.2 36Z" fill="#ff6a3d"/><circle cy="24" r="5" fill="#ff6a3d"/></g><circle r="6" fill="#d6d9de" stroke="#555"/></svg></div>
<div class="cap"><b>Calibre 7</b>Click the watch · start / stop / reset chronograph</div>
<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
for(let i=0;i<60;i++){const a=i*6,big=i%5===0;el('line',{x1:0,y1:-148,x2:0,y2:big?-132:-142,stroke:big?'#e6e8eb':'#6b7a8c','stroke-width':big?3:1,transform:`rotate(${a})`},$('idx'));if(big&&i%15){const r=118,t=(a-90)*Math.PI/180;el('text',{x:Math.cos(t)*r,y:Math.sin(t)*r+5,'text-anchor':'middle','font-size':14,'font-family':'Oswald',fill:'#e6e8eb'},$('idx')).textContent=i/5}}
for(let v=60;v<=500;v+=v<200?20:50){const a=360*60/v/60;el('line',{y1:-176,y2:-168,stroke:'#8a9099',transform:`rotate(${a})`},$('tachy'));const t=(a-90)*Math.PI/180;el('text',{x:Math.cos(t)*160,y:Math.sin(t)*160+3,'text-anchor':'middle','font-size':8,'font-family':'Oswald',fill:'#a9b0b8',transform:`rotate(${a} ${Math.cos(t)*160} ${Math.sin(t)*160})`},$('tachy')).textContent=v}
['s1','s2','s3'].forEach(s=>{for(let i=0;i<30;i++)el('line',{y1:-34,y2:i%5?-31:-27,stroke:'#6b7a8c','stroke-width':i%5?.6:1.2,transform:`rotate(${i*12})`},$(s))});
let st=0,run=false,acc=0,t0=0;$('w').onclick=()=>{if(!run&&acc===0){run=true;t0=performance.now()}else if(run){run=false;acc+=performance.now()-t0}else{acc=0}};
$('date').textContent=new Date().getDate();
function f(){const d=new Date(),ms=d.getMilliseconds(),s=d.getSeconds()+ms/1000,m=d.getMinutes()+s/60,h=d.getHours()%12+m/60;$('H').setAttribute('transform',`rotate(${h*30})`);$('M').setAttribute('transform',`rotate(${m*6})`);$('hs').setAttribute('transform',`rotate(${s*6})`);
const ce=acc+(run?performance.now()-t0:0),cs=ce/1000;$('S').setAttribute('transform',`rotate(${cs*6})`);$('hc').setAttribute('transform',`rotate(${(cs/60)%30*12})`);$('hm').setAttribute('transform',`rotate(${(cs/3600)%12*30})`);requestAnimationFrame(f)}f();
</script></body></html>
