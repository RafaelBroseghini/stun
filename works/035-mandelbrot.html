<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mandelbrot Dive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;cursor:zoom-in}
.i{position:fixed;left:16px;bottom:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#e7f0ff;font:12px/1.6 'IBM Plex Mono',monospace;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.15)}.i b{font-weight:600;color:#ffb86b}
.pal{position:fixed;right:16px;top:16px;display:flex;gap:6px}.pal button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;cursor:pointer}</style></head><body>
<canvas id="c"></canvas><div class="pal" id="pal"></div>
<div class="i">re <b id="re"></b><br>im <b id="im"></b><br>zoom <b id="z"></b>× · <span style="opacity:.7">click to dive · shift-click to rise</span></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,cx=-.7436438870371587,cy=.13182590420531198,sc=3.2,job=0,pi=0;
const pals=[[[.5,.5,.5],[.5,.5,.5],[1,1,1],[0,.1,.2]],[[.5,.5,.5],[.5,.5,.5],[1,.7,.4],[0,.15,.2]],[[.8,.5,.4],[.2,.4,.2],[2,1,1],[0,.25,.25]],[[.5,.5,.5],[.5,.5,.5],[1,1,.5],[.8,.9,.3]]];
const pe=document.getElementById('pal');pals.forEach((p,i)=>{const b=document.createElement('button');const col=t=>p.map((_,k)=>Math.round(255*(p[0][k]+p[1][k]*Math.cos(6.283*(p[2][k]*t+p[3][k])))));b.style.background=`linear-gradient(rgb(${col(.1)}),rgb(${col(.5)}))`;b.onclick=()=>{pi=i;render()};pe.appendChild(b)});
function size(){const d=Math.min(devicePixelRatio,1.5);W=c.width=innerWidth*d;H=c.height=innerHeight*d;render()}
function render(){const my=++job;const img=x.createImageData(W,1),p=pals[pi];const it=Math.min(3000,Math.floor(140+Math.log2(3.2/sc)*60));let y=0;
document.getElementById('re').textContent=cx.toFixed(12);document.getElementById('im').textContent=cy.toFixed(12);document.getElementById('z').textContent=(3.2/sc).toExponential(2);
function rows(){if(my!==job)return;const t0=performance.now();while(y<H&&performance.now()-t0<14){const ci=cy+(y/H-.5)*sc*H/W;for(let X=0;X<W;X++){const cr=cx+(X/W-.5)*sc;let zr=0,zi=0,n=0,zr2=0,zi2=0;
while(n<it&&zr2+zi2<256){zi=2*zr*zi+ci;zr=zr2-zi2+cr;zr2=zr*zr;zi2=zi*zi;n++}const o=X*4;if(n===it){img.data[o]=img.data[o+1]=img.data[o+2]=0}else{const sm=(n+1-Math.log2(Math.log2(zr2+zi2)/2))*.02;for(let k=0;k<3;k++)img.data[o+k]=255*(p[0][k]+p[1][k]*Math.cos(6.283*(p[2][k]*sm+p[3][k])))}img.data[o+3]=255}x.putImageData(img,0,y);y++}if(y<H)requestAnimationFrame(rows)}rows()}
c.addEventListener('click',e=>{const r=c.getBoundingClientRect();cx+=((e.clientX-r.left)/r.width-.5)*sc;cy+=((e.clientY-r.top)/r.height-.5)*sc*H/W;sc*=e.shiftKey?3:1/3;render()});
c.addEventListener('contextmenu',e=>{e.preventDefault();sc*=3;render()});sc=.012;size();addEventListener('resize',size);
</script></body></html>
