<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mandelbrot Dive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
canvas#c{display:block;width:100%;height:100%;cursor:zoom-in;touch-action:none}
.i{position:fixed;left:16px;bottom:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);color:#e7f0ff;font:12px/1.7 'IBM Plex Mono',monospace;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.i b{font-weight:600;color:#ffb86b;font-variant-numeric:tabular-nums}.i .p{height:2px;background:rgba(255,255,255,.12);margin-top:8px;border-radius:2px;overflow:hidden}.i .p u{display:block;height:100%;background:#ffb86b;transform-origin:left;transform:scaleX(0)}
.top{position:fixed;right:16px;top:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.pal{display:flex;gap:6px}.pal button{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.8);cursor:pointer;transition:transform .2s}.pal button:hover{transform:scale(1.15)}.pal button.on{border-color:#ffb86b;box-shadow:0 0 0 2px #000,0 0 0 3px #ffb86b}
.bm{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:420px}.bm button,.tg{font:400 11px 'IBM Plex Mono';color:#e7f0ff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:99px;cursor:pointer;backdrop-filter:blur(6px)}.bm button:hover,.tg:hover{border-color:#ffb86b}.tg[aria-pressed="true"]{background:#ffb86b;color:#000}
.jul{position:fixed;right:16px;bottom:16px;width:170px;height:170px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.25);background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .3s}
.jul canvas{width:100%;height:100%;display:block}.jul span{position:absolute;left:8px;top:6px;font:400 10px 'IBM Plex Mono';color:#e7f0ff;opacity:.8}
@media (max-width:640px){.jul{width:110px;height:110px;bottom:auto;top:110px}.bm{max-width:240px}}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><div class="pal" id="pal"></div><div class="bm" id="bm"><button data-b="-0.7436438870371587,0.13182590420531198,0.012">Seahorse</button><button data-b="0.2549870375144766,0.0005679790528465,0.004">Elephant</button><button data-b="-1.7497591451303665,0.0000000036,0.00004">Mini-brot</button><button data-b="-0.1015,0.9633,0.02">Spiral</button><button data-b="-0.5,0,3.2">Home</button><button class="tg" id="cy" aria-pressed="true">Cycle colours</button></div></div>
<div class="i">re <b id="re"></b><br>im <b id="im"></b><br>zoom <b id="z"></b>× · iter <b id="it"></b><br><span style="opacity:.7">click dive · shift/right-click rise · wheel zoom · drag pan</span><div class="p"><u id="pr"></u></div></div>
<div class="jul"><canvas id="j" width="170" height="170"></canvas><span>Julia set at cursor</span></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,cx=-.7436438870371587,cy=.13182590420531198,sc=.012,pi=0,cycle=true,off=0;
const pals=[[[.5,.5,.5],[.5,.5,.5],[1,1,1],[0,.1,.2]],[[.5,.5,.5],[.5,.5,.5],[1,.7,.4],[0,.15,.2]],[[.8,.5,.4],[.2,.4,.2],[2,1,1],[0,.25,.25]],[[.5,.5,.5],[.5,.5,.5],[1,1,.5],[.8,.9,.3]],[[.6,.4,.3],[.4,.3,.2],[1,1,1],[.0,.05,.1]]];
const LUTN=1024;let LUT=new Uint8Array(LUTN*3);function mkLut(){const p=pals[pi];for(let i=0;i<LUTN;i++){const t=i/LUTN;for(let k=0;k<3;k++)LUT[i*3+k]=Math.max(0,Math.min(255,255*(p[0][k]+p[1][k]*Math.cos(6.283*(p[2][k]*t+p[3][k])))))}}mkLut();
const pe=document.getElementById('pal');pals.forEach((p,i)=>{const b=document.createElement('button');const col=t=>p[0].map((_,k)=>Math.round(255*(p[0][k]+p[1][k]*Math.cos(6.283*(p[2][k]*t+p[3][k])))));b.style.background=`linear-gradient(rgb(${col(.1)}),rgb(${col(.5)}))`;b.className=i?'':'on';b.setAttribute('aria-label','Palette '+(i+1));b.onclick=()=>{pi=i;mkLut();[...pe.children].forEach(o=>o.classList.toggle('on',o===b))};pe.appendChild(b)});
let mu,img,snap=document.createElement('canvas'),sx=snap.getContext('2d'),anim=null;
function size(){W=c.width=innerWidth;H=c.height=innerHeight;mu=new Float32Array(W*H);img=x.createImageData(W,H);snap.width=W;snap.height=H;start()}
// progressive render: a coarse 4×4 pass, then the full pass
let pass=0,row=0,it=200,job=0;
function start(){job++;pass=0;row=0;it=Math.min(4000,Math.floor(160+Math.log2(3.2/sc)*70));document.getElementById('re').textContent=cx.toFixed(14);document.getElementById('im').textContent=cy.toFixed(14);document.getElementById('z').textContent=(3.2/sc).toExponential(2);document.getElementById('it').textContent=it}
function pix(cr,ci){let zr=0,zi=0,n=0,zr2=0,zi2=0;const q=(cr-.25)**2+ci*ci;if(q*(q+(cr-.25))<.25*ci*ci||(cr+1)**2+ci*ci<.0625)return -1;while(n<it&&zr2+zi2<256){zi=2*zr*zi+ci;zr=zr2-zi2+cr;zr2=zr*zr;zi2=zi*zi;n++}return n===it?-1:n+1-Math.log2(Math.log2(zr2+zi2)/2)}
function work(budget){const t0=performance.now();const st=pass===0?4:1;while(pass<2&&performance.now()-t0<budget){const y=row;const ci=cy+(y/H-.5)*sc*H/W;for(let X=0;X<W;X+=st){const v=pix(cx+(X/W-.5)*sc,ci);if(st>1){for(let dy=0;dy<st&&y+dy<H;dy++)for(let dx=0;dx<st&&X+dx<W;dx++)mu[(y+dy)*W+X+dx]=v}else mu[y*W+X]=v}row+=st;if(row>=H){pass++;row=0;if(pass===1)anim=null}}
document.getElementById('pr').style.transform=`scaleX(${pass>=2?1:(pass+row/H)/2})`}
function paint(){const d=img.data,o=Math.floor(off);for(let i=0;i<W*H;i++){const v=mu[i],k=i*4;if(v<0){d[k]=d[k+1]=d[k+2]=0}else{const li=((Math.floor(v*20)+o)%LUTN)*3;d[k]=LUT[li];d[k+1]=LUT[li+1];d[k+2]=LUT[li+2]}d[k+3]=255}x.putImageData(img,0,0)}
function zoomTo(nx,ny,k,px,py){sx.drawImage(c,0,0);anim={t:0,k,px,py};cx=nx;cy=ny;sc*=k;start()}
let drag=null,moved=0;
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,cx,cy};moved=0});
c.addEventListener('pointermove',e=>{jx=e.clientX;jy=e.clientY;jdirty=true;if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));if(moved>4){cx=drag.cx-dx/W*sc;cy=drag.cy-dy/W*sc;c.style.transform=`translate(${dx}px,${dy}px)`}});
c.addEventListener('pointerup',e=>{const d=drag;drag=null;if(!d)return;c.style.transform='';if(moved>4){sx.drawImage(c,0,0);anim={t:1,k:1,px:0,py:0,pan:[e.clientX-d.x,e.clientY-d.y]};start();return}
const r=c.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;const k=e.shiftKey||e.button===2?3:1/3;zoomTo(cx+(fx-.5)*sc,cy+(fy-.5)*sc*H/W,k,e.clientX,e.clientY)});
c.addEventListener('contextmenu',e=>{e.preventDefault();zoomTo(cx,cy,3,W/2,H/2)});
let wt=null;c.addEventListener('wheel',e=>{e.preventDefault();const k=e.deltaY>0?1.25:.8;const fx=e.clientX/W,fy=e.clientY/H;const px=cx+(fx-.5)*sc,py=cy+(fy-.5)*sc*H/W;sx.drawImage(c,0,0);anim={t:0,k,px:e.clientX,py:e.clientY,fast:1};sc*=k;cx=px-(fx-.5)*sc;cy=py-(fy-.5)*sc*H/W;start()},{passive:false});
document.querySelectorAll('#bm [data-b]').forEach(b=>b.onclick=()=>{const [a,bb,s]=b.dataset.b.split(',').map(Number);sx.drawImage(c,0,0);anim={t:.6,k:1,px:W/2,py:H/2};cx=a;cy=bb;sc=s;start()});
const cyB=document.getElementById('cy');cyB.onclick=()=>{cycle=!cycle;cyB.setAttribute('aria-pressed',cycle)};
addEventListener('keydown',e=>{if(e.key==='c'||e.key==='C')cyB.click();if(e.key==='+'||e.key==='=')zoomTo(cx,cy,1/2,W/2,H/2);if(e.key==='-')zoomTo(cx,cy,2,W/2,H/2)});
// Julia inset for the point under the cursor
const jc=document.getElementById('j'),jx2=jc.getContext('2d'),jimg=jx2.createImageData(170,170);let jx=-1,jy=-1,jdirty=true;
function julia(){if(!jdirty||jx<0)return;jdirty=false;const kr=cx+(jx/W-.5)*sc,ki=cy+(jy/H-.5)*sc*H/W;const d=jimg.data;for(let y=0;y<170;y++)for(let X=0;X<170;X++){let zr=(X/170-.5)*3.2,zi=(y/170-.5)*3.2,n=0;while(n<90&&zr*zr+zi*zi<16){const t=zr*zr-zi*zi+kr;zi=2*zr*zi+ki;zr=t;n++}const k=(y*170+X)*4;if(n===90){d[k]=d[k+1]=d[k+2]=0}else{const li=((n*12+Math.floor(off))%LUTN)*3;d[k]=LUT[li];d[k+1]=LUT[li+1];d[k+2]=LUT[li+2]}d[k+3]=255}jx2.putImageData(jimg,0,0)}
size();jx=W*.62;jy=H*.42;addEventListener('resize',size);
(function loop(){work(anim?9:12);if(cycle){off+=1.2;jdirty=true}
if(anim&&pass===0){anim.t=Math.min(1,anim.t+(anim.fast?.25:.06));const e=1-Math.pow(1-anim.t,3);x.fillStyle='#000';x.fillRect(0,0,W,H);x.save();if(anim.pan){x.translate(anim.pan[0],anim.pan[1])}else{const s=1+(1/anim.k-1)*e;const lt=anim.fast?0:e;x.translate(anim.px+(W/2-anim.px)*lt,anim.py+(H/2-anim.py)*lt);x.scale(s,s);x.translate(-anim.px,-anim.py)}x.drawImage(snap,0,0);x.restore()}
else paint();julia();requestAnimationFrame(loop)})();
</script></body></html>
