<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calacatta Oro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;800&family=Jost:wght@300&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#eee}canvas{position:fixed;inset:0;width:100%;height:100%;cursor:pointer}
.sheen{position:fixed;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 55%);background-size:300% 100%;animation:s 9s ease-in-out infinite;pointer-events:none;mix-blend-mode:soft-light}@keyframes s{0%{background-position:120% 0}100%{background-position:-60% 0}}
.l{position:fixed;left:5vw;bottom:7vh;color:#2a2622}.l h1{font:800 clamp(36px,6vw,96px)/.9 'Bodoni Moda',serif;letter-spacing:-.02em}.l p{font:300 13px Jost,sans-serif;letter-spacing:.35em;text-transform:uppercase;margin-top:14px}</style></head><body>
<canvas id="c"></canvas><div class="sheen"></div><div class="l"><h1>Calacatta<br>Oro</h1><p>Slab 0417 · Apuan Alps · click for a new cut</p></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let P;
const fd=t=>t*t*t*(t*(t*6-15)+10),lp=(a,b,t)=>a+t*(b-a),gr=(h,x,y)=>{h&=7;const u=h<4?x:y,v=h<4?y:x;return((h&1)?-u:u)+((h&2)?-2*v:2*v)};
function N(x,y){let X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);const u=fd(x),v=fd(y),a=P[X]+Y,b=P[X+1]+Y;return lp(lp(gr(P[a],x,y),gr(P[b],x-1,y),u),lp(gr(P[a+1],x,y-1),gr(P[b+1],x-1,y-1),u),v)}
const fbm=(x,y)=>{let s=0,a=.5;for(let i=0;i<5;i++){s+=a*N(x,y);x*=2.03;y*=2.03;a*=.5}return s};
function cut(){P=new Uint8Array(512);for(let i=0;i<256;i++)P[i]=i;for(let i=255;i>0;i--){const j=Math.random()*(i+1)|0;[P[i],P[j]]=[P[j],P[i]]}for(let i=0;i<256;i++)P[i+256]=P[i];
const s=Math.min(devicePixelRatio,2)*.55;const W=c.width=Math.floor(innerWidth*s),H=c.height=Math.floor(innerHeight*s);const img=x.createImageData(W,H),d=img.data;const sc=1.3/Math.max(W,H),ang=Math.random()*Math.PI;const ca=Math.cos(ang),sa=Math.sin(ang);
for(let y=0;y<H;y++)for(let X=0;X<W;X++){const u=(X*ca-y*sa)*sc,v=(X*sa+y*ca)*sc;const q1=fbm(u,v),q2=fbm(u+5.2,v+1.3);const r=fbm(u+3*q1+1.7,v+3*q2+9.2);
const vein=Math.pow(1-Math.abs(Math.sin((u*1.4+r*5)*Math.PI*.7)),7);const fine=Math.pow(1-Math.abs(Math.sin((v*3+r*9)*Math.PI)),16);const cloud=fbm(u*3,v*3)*.5+.5;
const o=(y*W+X)*4;let R=244-cloud*14,G=241-cloud*15,B=236-cloud*18;const gold=vein*(.8+q1);R=lp(R,196,Math.min(1,gold));G=lp(G,148,Math.min(1,gold));B=lp(B,62,Math.min(1,gold));const grey=fine*.7+vein*.35*(1-q1);R-=grey*110;G-=grey*108;B-=grey*100;
d[o]=R;d[o+1]=G;d[o+2]=B;d[o+3]=255}x.putImageData(img,0,0)}
cut();c.onclick=cut;let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(cut,300)});
</script></body></html>
