<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Low-Poly Flyover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Zetta:wght@300;700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#ffd9b3}canvas{display:block;width:100%;height:100%}
.t{position:fixed;left:0;right:0;top:6vh;text-align:center;color:#3b2b5a;font:300 11px 'Lexend Zetta',sans-serif;letter-spacing:.2em}.t b{display:block;font-weight:700;font-size:clamp(20px,3vw,40px);letter-spacing:.05em;margin-bottom:8px}</style></head><body>
<canvas id="c"></canvas><div class="t"><b>FJELLHEIM</b>ALT 2,400 M · GROUND SPEED 310 KM/H</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H;function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
const P=new Uint8Array(512);for(let i=0;i<256;i++)P[i]=i;for(let i=255;i>0;i--){const j=Math.random()*(i+1)|0;[P[i],P[j]]=[P[j],P[i]]}for(let i=0;i<256;i++)P[i+256]=P[i];
const fd=t=>t*t*t*(t*(t*6-15)+10),lp=(a,b,t)=>a+t*(b-a),gr=(h,x,y)=>{h&=7;const u=h<4?x:y,v=h<4?y:x;return((h&1)?-u:u)+((h&2)?-2*v:2*v)};
function N(x,y){let X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);const u=fd(x),v=fd(y),a=P[X]+Y,b=P[X+1]+Y;return lp(lp(gr(P[a],x,y),gr(P[b],x-1,y),u),lp(gr(P[a+1],x,y-1),gr(P[b+1],x-1,y-1),u),v)}
const h=(i,j)=>{const v=N(i*.09,j*.09)*1.4+N(i*.23,j*.23)*.4;const valley=Math.min(1,Math.abs(i)/6);return Math.max(-.35,v*valley*1.3+(Math.abs(i)/30))};
const GX=64,GZ=60,L=[.4,-.8,.45];const ll=Math.hypot(...L);L[0]/=ll;L[1]/=ll;L[2]/=ll;let z0=0;
function col(y,s){let c=y<-.3?[70,120,170]:y<-.15?[214,196,150]:y<.35?[96,150,90]:y<.75?[120,110,120]:[245,245,250];const k=.55+s*.6;return `rgb(${c[0]*k|0},${c[1]*k|0},${c[2]*k|0})`}
function proj(X,Y,Z){const cy=1.25,p=1/(Z+.0001);return[W/2+X*p*W*.55,H*.42-(Y-cy)*p*W*.55]}
function f(){z0+=.05;const g=x.createLinearGradient(0,0,0,H*.6);g.addColorStop(0,'#7c8fd6');g.addColorStop(.6,'#ffb4a2');g.addColorStop(1,'#ffd9b3');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#fff1d6';x.beginPath();x.arc(W*.5,H*.34,Math.min(W,H)*.07,0,7);x.fill();
const zf=Math.floor(z0),fr=z0-zf,T=.45;for(let k=GZ;k>=1;k--){const j=zf+k,Z=(k-fr)*T+.2;for(let i=-GX/2;i<GX/2;i++){const Xs=i*T,q=[[Xs,h(i,j),Z],[Xs+T,h(i+1,j),Z],[Xs+T,h(i+1,j+1),Z+T],[Xs,h(i,j+1),Z+T]];
for(const tri of [[q[0],q[1],q[2]],[q[0],q[2],q[3]]]){const a=tri[0],b=tri[1],cc=tri[2];const u=[b[0]-a[0],Math.max(b[1],-.3)-Math.max(a[1],-.3),b[2]-a[2]],v=[cc[0]-a[0],Math.max(cc[1],-.3)-Math.max(a[1],-.3),cc[2]-a[2]];let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const nl=Math.hypot(...n);n=n.map(e=>e/nl);const s=Math.max(0,-(n[0]*L[0]+n[1]*L[1]+n[2]*L[2]));
const ym=(a[1]+b[1]+cc[1])/3;const pts=tri.map(p=>proj(p[0],Math.max(p[1],-.3),p[2]));x.fillStyle=col(ym,ym<-.3?.8:s);x.beginPath();x.moveTo(...pts[0]);x.lineTo(...pts[1]);x.lineTo(...pts[2]);x.closePath();x.fill();x.strokeStyle=x.fillStyle;x.lineWidth=1;x.stroke()}}
const fog=Math.max(0,(k-GZ*.45)/(GZ*.55));if(fog>0){const y=proj(0,0,Z)[1];x.fillStyle=`rgba(255,200,180,${fog*.08})`;x.fillRect(0,0,W,y+40*dpr)}}
requestAnimationFrame(f)}f();
</script></body></html>
