<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caravan by Moonlight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Aref+Ruqaa:wght@700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:linear-gradient(#0b0c2a 0%,#1e1f55 45%,#5a3d6e 70%,#b4707a 82%);font-family:Marcellus,serif}
.stars{position:absolute;inset:0 0 40% 0;background-image:radial-gradient(1.2px 1.2px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 60%,#fffd,transparent),radial-gradient(1.5px 1.5px at 50% 10%,#fff,transparent),radial-gradient(1px 1px at 70% 40%,#fff,transparent),radial-gradient(1px 1px at 90% 70%,#fffc,transparent),radial-gradient(1px 1px at 20% 85%,#fff9,transparent),radial-gradient(1.3px 1.3px at 80% 15%,#fff,transparent);background-size:260px 180px;animation:tw 4s ease-in-out infinite alternate}@keyframes tw{to{opacity:.6}}
.moon{position:absolute;right:16%;top:12%;width:min(16vh,22vw);aspect-ratio:1;border-radius:50%;box-shadow:inset calc(min(16vh,22vw)*-.28) calc(min(16vh,22vw)*-.08) 0 0 #fff1c9;filter:drop-shadow(0 0 30px rgba(255,241,201,.5));transform:rotate(-20deg)}
.d{position:absolute;left:-20%;right:-20%;border-radius:50% 50% 0 0/100% 100% 0 0}
.d1{bottom:22%;height:40%;background:linear-gradient(170deg,#c48a6e,#6e3f4f 60%);left:-10%;right:30%}
.d2{bottom:16%;height:34%;background:linear-gradient(190deg,#d99c7a,#7a4655 55%);left:30%;right:-30%}
.d3{bottom:-10%;height:48%;background:linear-gradient(175deg,#e8b48c 0%,#a5606a 40%,#4a2740 100%);border-radius:60% 40% 0 0/100% 100% 0 0}
.d4{bottom:-28%;height:46%;background:linear-gradient(185deg,#f2c39a,#b06a6e 45%,#3a1f35);left:-40%;right:10%}
.car{position:absolute;bottom:37.4%;left:0;display:flex;gap:1.4vw;animation:walk 60s linear infinite -22s;align-items:flex-end}@keyframes walk{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}
.car svg{width:clamp(36px,5vw,70px);height:auto;animation:bob 1.1s ease-in-out infinite alternate}.car svg:nth-child(2){animation-delay:-.3s}.car svg:nth-child(3){animation-delay:-.6s}.car svg:nth-child(4){animation-delay:-.2s;width:clamp(24px,3vw,44px)}@keyframes bob{to{transform:translateY(-2px)}}
.shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,84%) var(--my,20%),rgba(255,241,201,.32),transparent 45%);mix-blend-mode:soft-light;z-index:5}.ss{position:absolute;height:2px;width:160px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(-28deg);transform-origin:left;pointer-events:none;animation:ss 1s ease-out forwards}@keyframes ss{from{opacity:1}to{opacity:0;translate:-420px 220px}}body{cursor:pointer}.moon{transition:left .8s cubic-bezier(.2,.8,.2,1),top .8s cubic-bezier(.2,.8,.2,1)}
.t{position:absolute;left:6vw;top:8vh;color:#f8dcc0}.t h1{font-family:'Aref Ruqaa',serif;font-size:clamp(34px,6vw,90px);line-height:1}.t p{letter-spacing:.35em;text-transform:uppercase;font-size:12px;margin-top:10px;opacity:.8}</style></head><body>
<div class="stars"></div><div class="moon"></div><div class="t"><h1>Rihla</h1><p>Erg Chebbi · second night · 11 km to the well · move the moon · click for a shooting star</p></div><div class="shine" id="sh"></div>
<div class="d d1"></div><div class="d d2"></div>
<div class="car" id="car"></div><div class="d d3"></div><div class="d d4"></div>
<script>
const camel='<svg viewBox="0 0 60 44"><path fill="#2a1630" d="M6 14c2-4 6-5 8-3 2 2 2 5 4 6 3-8 8-12 13-12 4 0 6 4 9 4 4 0 6-6 10-6 4 0 5 4 5 7l-2 0c0-2-1-3-3-3-3 0-4 6-6 10v5l2 18h-3l-2-15-3 0-1 15h-3l0-15c-6 1-12 1-16-1l-2 16h-3l1-17-2 1-1 16H5l2-18c-3-3-4-7-1-8z"/></svg>';
const man='<svg viewBox="0 0 20 44"><path fill="#2a1630" d="M10 2a4 4 0 110 8 4 4 0 010-8zM5 12h10l3 18h-4l-1 14h-2l-1-12-1 12H7l-1-14H2z"/></svg>';
document.getElementById('car').innerHTML=camel+camel+camel+man;
const mo=document.querySelector('.moon'),sh=document.getElementById('sh');addEventListener('pointermove',e=>{const x=e.clientX/innerWidth,y=Math.min(.42,e.clientY/innerHeight);mo.style.right='auto';mo.style.left=`calc(${x*100}% - min(8vh,11vw))`;mo.style.top=`calc(${y*100}% - min(8vh,11vw))`;sh.style.setProperty('--mx',x*100+'%');sh.style.setProperty('--my',y*100+'%')});
addEventListener('click',e=>{const s=document.createElement('i');s.className='ss';s.style.left=(e.clientX+60)+'px';s.style.top=Math.min(e.clientY,innerHeight*.45)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1100)});
</script></body></html>
