<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Horizon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;400;600&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.t{position:fixed;left:5vw;top:6vh;color:#ffd9a0;font:200 clamp(30px,5vw,72px)/1 'Exo 2',sans-serif;letter-spacing:.08em;pointer-events:none;animation:in 3s both}@keyframes in{from{opacity:0;letter-spacing:.3em}}
.t small{display:block;font:600 10px 'Exo 2';letter-spacing:.4em;margin-top:14px;color:#a88a6a}
.dil{position:fixed;right:5vw;top:6vh;text-align:right;color:#ffd9a0;font:400 10px/1.8 'Exo 2';letter-spacing:.3em;text-transform:uppercase;pointer-events:none}
.dil b{display:block;font:200 30px 'Exo 2';letter-spacing:.04em;color:#fff;font-variant-numeric:tabular-nums}.dil .p b{color:#ffb35c}
.dil i{display:block;width:180px;height:2px;background:rgba(255,217,160,.15);margin:6px 0 12px auto}.dil i u{display:block;height:100%;background:#ffb35c;margin-left:auto}
.k{position:fixed;left:5vw;bottom:5vh;color:#a88a6a;font:600 10px 'Exo 2';letter-spacing:.32em;text-transform:uppercase;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div class="t">Event Horizon<small>Schwarzschild radius 12 million km · nothing returns</small></div>
<div class="dil"><div>Your clock<b id="c1">00:00.0</b></div><div class="p">Probe at cursor · <span id="rr">∞</span> r<sub>s</sub><b id="c2">00:00.0</b></div><i><u id="du"></u></i><span id="df">time runs at 100%</span></div>
<div class="k">Move · send the probe closer &nbsp; Drag · tilt the disk &nbsp; Click · feed it</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);let W,H;const N=10000,P=[];
for(let i=0;i<N;i++){const r=1.6+Math.pow(Math.random(),1.8)*3.6;P.push({r,a:Math.random()*Math.PI*2,y:(Math.random()-.5)*.06*r,b:Math.random()})}
const stars=Array.from({length:700},()=>({a:Math.random()*Math.PI*2,d:Math.random(),m:Math.random()}));
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
let tl=.18,tt=.18,drag=null,mx=-1,my=-1,flare=0;
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={y:e.clientY,t:tt,moved:0}});
c.addEventListener('pointermove',e=>{mx=e.clientX*dpr;my=e.clientY*dpr;if(drag){drag.moved+=Math.abs(e.movementY||0);tt=Math.max(.03,Math.min(.6,drag.t+(e.clientY-drag.y)*.002))}});
c.addEventListener('pointerup',()=>{if(drag&&drag.moved<4)feed();drag=null});c.addEventListener('pointerleave',()=>{mx=-1});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();feed()}});
function feed(){flare=1;if(P.length>17000)P.splice(N,900);for(let i=0;i<900;i++)P.push({r:5.1+Math.random()*.6,a:Math.random()*Math.PI*2,y:(Math.random()-.5)*.3,b:1,f:1});rumble()}
let ac;function rumble(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(55,ac.currentTime);o.frequency.exponentialRampToValueAtTime(22,ac.currentTime+3);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=180;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+.2);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+3.2);o.connect(f).connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+3.3)}catch(e){}}
// Doppler-beamed colour: the side moving toward us is brighter and bluer
function col(r,b,dop){const t=(r-1.6)/3.6;const l=Math.min(96,(80-t*42+b*10)*(.65+dop*.5));return `hsla(${38-t*25+dop*14},100%,${l}%,${Math.min(1,(.9-t*.6)*(.5+dop*.7))})`}
let t1=0,t2=0,last=performance.now();const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0');
function f(now){const dt=(now-last)/1000;last=now;x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);tl+=(tt-tl)*.05;flare*=.97;const cx=W/2,cy=H*.52,U=Math.min(W,H)*.11,tilt=tl;
// background stars, pushed outward by lensing
for(const s of stars){const D=s.d*Math.max(W,H)*.75;const lens=D+U*U*3/(D+1);x.globalAlpha=s.m*.7;x.fillStyle='#fff';x.fillRect(cx+Math.cos(s.a)*lens,cy+Math.sin(s.a)*lens,dpr,dpr)}x.globalAlpha=1;
x.globalCompositeOperation='lighter';
// far half of the disk
for(const p of P){p.a+=.012/Math.pow(p.r,1.5);if(p.f){p.r-=.008;p.y*=.99;if(p.r<1.65){p.r=1.6+Math.pow(Math.random(),1.8)*3.6;p.f=0;p.b=Math.random()}}const s=Math.sin(p.a),co=Math.cos(p.a);if(s>0)continue;const X=cx+co*p.r*U,Y=cy+s*p.r*U*tilt+p.y*U;x.fillStyle=col(p.r,p.b,.5+co*.5);x.fillRect(X,Y,1.6*dpr,1.6*dpr)}
// the far disk bent over the top of the hole, and a fainter image beneath it
for(const p of P){const s=Math.sin(p.a),co=Math.cos(p.a);if(s>0||p.b<.35)continue;const lr=(1.15+(p.r-1.6)*.55)*U;const X=cx+co*lr,Y=cy-Math.abs(s)*lr*.95-U*.05;x.fillStyle=col(p.r,p.b*.7,.5+co*.5);x.fillRect(X,Y,1.3*dpr,1.3*dpr);if(p.b>.8){const Y2=cy+Math.abs(s)*lr*.55+U*.08;x.globalAlpha=.35;x.fillRect(cx+co*lr*.8,Y2,1.1*dpr,1.1*dpr);x.globalAlpha=1}}
x.globalCompositeOperation='source-over';
// photon ring and shadow
const g=x.createRadialGradient(cx,cy,U*.95,cx,cy,U*1.3);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.5,`rgba(255,210,140,${.55+flare*.4})`);g.addColorStop(.68,`rgba(255,150,60,${.15+flare*.2})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,U*1.35,0,7);x.fill();
x.fillStyle='#000';x.beginPath();x.arc(cx,cy,U,0,7);x.fill();
x.globalCompositeOperation='lighter';for(const p of P){const s=Math.sin(p.a),co=Math.cos(p.a);if(s<=0)continue;const X=cx+co*p.r*U,Y=cy+s*p.r*U*tilt+p.y*U;x.fillStyle=col(p.r,p.b,.5+co*.5);x.fillRect(X,Y,1.7*dpr,1.7*dpr)}
if(flare>.05){const fg=x.createRadialGradient(cx,cy,U,cx,cy,U*4);fg.addColorStop(0,`rgba(255,220,160,${flare*.35})`);fg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=fg;x.fillRect(0,0,W,H);
x.strokeStyle=`rgba(180,210,255,${flare*.6})`;x.lineWidth=2*dpr;x.beginPath();x.moveTo(cx,cy-U);x.lineTo(cx,cy-U*(1+flare*6));x.moveTo(cx,cy+U);x.lineTo(cx,cy+U*(1+flare*6));x.stroke()}
x.globalCompositeOperation='source-over';
// the probe and its slowed clock: dτ/dt = √(1 − rₛ/r)
let k=1,rr=Infinity;if(mx>=0){const d=Math.hypot(mx-cx,(my-cy))/U;rr=Math.max(1.0001,d);k=Math.sqrt(Math.max(0,1-1/rr));x.strokeStyle='rgba(255,179,92,.8)';x.lineWidth=1.2*dpr;x.beginPath();x.arc(mx,my,6*dpr,0,7);x.stroke();x.setLineDash([3*dpr,5*dpr]);x.strokeStyle='rgba(255,179,92,.3)';x.beginPath();x.arc(cx,cy,d*U,0,7);x.stroke();x.setLineDash([])
if(d<1){x.fillStyle='rgba(255,179,92,.9)';x.font=`${10*dpr}px "Exo 2"`;x.fillText('LOST',mx+10*dpr,my-8*dpr)}}
t1+=dt;t2+=dt*(rr<1.0001?0:k);document.getElementById('c1').textContent=fmt(t1);document.getElementById('c2').textContent=fmt(t2);document.getElementById('rr').textContent=rr===Infinity?'∞':rr.toFixed(2);document.getElementById('du').style.width=(k*100)+'%';document.getElementById('df').textContent=rr<=1.0001?'the probe has crossed — no signal':`time runs at ${(k*100).toFixed(1)}%`;
requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
