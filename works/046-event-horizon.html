<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Horizon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;600&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}
.t{position:fixed;left:5vw;top:6vh;color:#ffd9a0;font:200 clamp(30px,5vw,72px)/1 'Exo 2',sans-serif;letter-spacing:.08em}.t small{display:block;font:600 11px 'Exo 2';letter-spacing:.4em;margin-top:14px;color:#a88a6a}</style></head><body>
<canvas id="c"></canvas><div class="t">Event Horizon<small>Schwarzschild radius 12 million km · nothing returns</small></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H;const N=9000,P=[];
for(let i=0;i<N;i++){const r=1.6+Math.pow(Math.random(),1.8)*3.6;P.push({r,a:Math.random()*Math.PI*2,y:(Math.random()-.5)*.06*r,b:Math.random()})}
const stars=Array.from({length:600},()=>({a:Math.random()*Math.PI*2,d:Math.random(),m:Math.random()}));
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
function col(r,b,front){const t=(r-1.6)/3.6;const l=85-t*45+b*10;return `hsla(${38-t*25},100%,${l}%,${(.9-t*.6)*(front?1:.85)})`}
function f(){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);const cx=W/2,cy=H*.52,U=Math.min(W,H)*.11,tilt=.18;
for(const s of stars){const D=s.d*Math.max(W,H)*.75;const lens=D+U*U*3/(D+1);x.globalAlpha=s.m*.7;x.fillStyle='#fff';x.fillRect(cx+Math.cos(s.a)*lens,cy+Math.sin(s.a)*lens,dpr,dpr)}x.globalAlpha=1;
x.globalCompositeOperation='lighter';
for(const p of P){p.a+=.012/Math.pow(p.r,1.5);const s=Math.sin(p.a),co=Math.cos(p.a);if(s>0)continue;const X=cx+co*p.r*U,Y=cy+s*p.r*U*tilt+p.y*U;const dop=1+co*.5;x.fillStyle=col(p.r,p.b*dop);x.fillRect(X,Y,1.6*dpr,1.6*dpr)}
for(const p of P){const s=Math.sin(p.a),co=Math.cos(p.a);if(s>0)continue;const ang=Math.atan2(s*tilt,co);const lr=(1.15+(p.r-1.6)*.55)*U;const X=cx+Math.cos(p.a)*lr,Y=cy-Math.abs(Math.sin(p.a))*lr*.95-U*.05;x.fillStyle=col(p.r,p.b*.6);if(p.b>.4)x.fillRect(X,Y,1.3*dpr,1.3*dpr)}
x.globalCompositeOperation='source-over';
const g=x.createRadialGradient(cx,cy,U*.95,cx,cy,U*1.25);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.55,'rgba(255,200,120,.55)');g.addColorStop(.7,'rgba(255,150,60,.15)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,U*1.3,0,7);x.fill();
x.fillStyle='#000';x.beginPath();x.arc(cx,cy,U,0,7);x.fill();
x.globalCompositeOperation='lighter';for(const p of P){const s=Math.sin(p.a),co=Math.cos(p.a);if(s<=0)continue;const X=cx+co*p.r*U,Y=cy+s*p.r*U*tilt+p.y*U;const dop=1+co*.5;x.fillStyle=col(p.r,p.b*dop,1);x.fillRect(X,Y,1.7*dpr,1.7*dpr)}
x.globalCompositeOperation='source-over';requestAnimationFrame(f)}f();
</script></body></html>
