<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Observatory Holo Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@400;600&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 40%,#23213a,#0b0a14 70%);display:grid;place-items:center;perspective:1200px;font-family:Inter,sans-serif;color:#fff}
.card{--x:50%;--y:50%;--rx:0deg;--ry:0deg;position:relative;width:min(440px,86vw);aspect-ratio:1.586;border-radius:22px;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .1s;background:linear-gradient(135deg,#1c1c2e,#2b2a48);box-shadow:0 40px 80px rgba(0,0,0,.6);overflow:hidden;cursor:pointer}
.holo{position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ff8ad8 0%,#8affd0 6%,#8ad0ff 12%,#d08aff 18%,#ffe08a 24%,#ff8ad8 30%);background-size:300% 300%;background-position:var(--x) var(--y);mix-blend-mode:color-dodge;opacity:.55;filter:saturate(1.4)}
.holo2{position:absolute;inset:0;background:radial-gradient(circle at var(--x) var(--y),rgba(255,255,255,.65),transparent 40%);mix-blend-mode:overlay}
.grid{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.35) 1px,transparent 1.5px);background-size:14px 14px;-webkit-mask:linear-gradient(120deg,#000,transparent 60%);mask:linear-gradient(120deg,#000,transparent 60%);opacity:.5}
.c{position:absolute;inset:0;padding:7%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:start}.top b{font:700 clamp(12px,2.2vw,16px) Syncopate,sans-serif;letter-spacing:.2em;line-height:1.3}
.seal{width:clamp(44px,9vw,62px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center;font:700 9px Syncopate;letter-spacing:.1em;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.25),transparent)}
.chip{width:clamp(38px,8vw,52px);aspect-ratio:1.3;border-radius:8px;background:linear-gradient(135deg,#e8d08a,#a8873a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}.chip{background-image:linear-gradient(90deg,transparent 30%,rgba(0,0,0,.25) 30% 33%,transparent 33% 66%,rgba(0,0,0,.25) 66% 69%,transparent 69%),linear-gradient(135deg,#e8d08a,#a8873a)}
.num{font:400 clamp(15px,3vw,21px) Syncopate,sans-serif;letter-spacing:.14em}.bot{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;opacity:.85}.bot b{display:block;font-size:14px;letter-spacing:.06em;margin-top:3px}
.orbit{position:absolute;right:-18%;bottom:-40%;width:70%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.25);box-shadow:0 0 0 30px rgba(255,255,255,.04),0 0 0 60px rgba(255,255,255,.03)}
p.h{position:fixed;bottom:5vh;opacity:.6;font-size:12px;letter-spacing:.25em}</style></head><body>
<div class="card" id="cd"><div class="grid"></div><div class="orbit"></div><div class="holo"></div><div class="holo2"></div>
<div class="c"><div class="top"><b>KESTREL HILL<br>OBSERVATORY</b><div class="seal">EST<br>1891</div></div><div class="chip"></div><div class="num">0417 2291 0068 1891</div><div class="bot"><div>MEMBER<b>Tove Marsh</b></div><div>NIGHTS LOGGED<b>212</b></div><div>VALID<b>12 / 29</b></div></div></div></div>
<p class="h">MOVE ACROSS THE CARD TO CATCH THE LIGHT</p>
<script>
const c=document.getElementById('cd');function set(px,py){c.style.setProperty('--x',px*100+'%');c.style.setProperty('--y',py*100+'%');c.style.setProperty('--ry',(px-.5)*30+'deg');c.style.setProperty('--rx',(.5-py)*24+'deg')}
let auto=true;addEventListener('pointermove',e=>{auto=false;const r=c.getBoundingClientRect();set(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)))});
(function a(t){if(auto){set(.5+.4*Math.sin(t*.0008),.5+.35*Math.cos(t*.0011))}requestAnimationFrame(a)})(0);
</script></body></html>
