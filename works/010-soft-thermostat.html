<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Thermostat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;800&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{--bg:#e4e9f2;--hi:#ffffff;--lo:#b8c1d1;background:var(--bg);font-family:Nunito,system-ui,sans-serif;color:#5a6680;display:grid;place-items:center;user-select:none}
.wrap{display:flex;flex-direction:column;align-items:center;gap:34px}
.head{display:flex;justify-content:space-between;width:min(380px,88vw);align-items:center}.head h1{font-size:15px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.head span{font-size:13px}
.dial{position:relative;width:min(340px,80vw);aspect-ratio:1;border-radius:50%;background:var(--bg);box-shadow:20px 20px 50px var(--lo),-20px -20px 50px var(--hi);display:grid;place-items:center;touch-action:none;cursor:grab}
svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(135deg)}
.inner{width:62%;aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#f0f4fa,#d3dae6);box-shadow:inset 6px 6px 14px var(--lo),inset -6px -6px 14px var(--hi);display:flex;flex-direction:column;align-items:center;justify-content:center}
.temp{font-size:clamp(48px,14vw,76px);font-weight:300;color:#3c4760;line-height:1}.temp sup{font-size:.35em;vertical-align:top;position:relative;top:.3em}.lab{font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:6px}
.knob{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--bg);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi);left:50%;top:50%;margin:-15px}
.modes{display:flex;gap:18px}.modes button{width:74px;height:74px;border-radius:22px;border:0;background:var(--bg);box-shadow:8px 8px 18px var(--lo),-8px -8px 18px var(--hi);color:#7c88a3;font:600 11px Nunito,sans-serif;letter-spacing:.1em;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:.2s}
.modes button b{font-size:22px;font-weight:400}.modes button.on{box-shadow:inset 6px 6px 12px var(--lo),inset -6px -6px 12px var(--hi);color:var(--ac)}
.stats{display:flex;gap:40px;font-size:13px}.stats b{display:block;font-size:20px;color:#3c4760;font-weight:600}</style></head><body>
<div class="wrap"><div class="head"><h1>Living Room</h1><span id="clock"></span></div>
<div class="dial" id="d"><svg viewBox="0 0 200 200"><defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#53b7ff"/><stop offset=".5" stop-color="#ffb35c"/><stop offset="1" stop-color="#ff5c7a"/></linearGradient></defs><circle cx="100" cy="100" r="88" fill="none" stroke="#d3dae6" stroke-width="7" stroke-linecap="round" stroke-dasharray="414.7 553"/><circle id="arc" cx="100" cy="100" r="88" fill="none" stroke="url(#gr)" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 553"/></svg>
<div class="inner"><div class="temp" id="t">21<sup>°C</sup></div><div class="lab" id="lab">Heating to</div></div><div class="knob" id="k"></div></div>
<div class="modes" id="m"><button class="on" data-m="Heating to" style="--ac:#ff7a59"><b>☼</b>HEAT</button><button data-m="Cooling to" style="--ac:#53b7ff"><b>❄</b>COOL</button><button data-m="Eco hold" style="--ac:#41c49a"><b>❦</b>ECO</button></div>
<div class="stats"><div>Indoor<b>19.4°</b></div><div>Humidity<b>46%</b></div><div>Outside<b>7°</b></div></div></div>
<script>
const d=document.getElementById('d'),arc=document.getElementById('arc'),k=document.getElementById('k'),t=document.getElementById('t');let v=.55;const MIN=10,MAX=30;
function draw(){const L=414.7*v;arc.setAttribute('stroke-dasharray',L+' 553');const a=(135+270*v)*Math.PI/180,R=d.clientWidth*.44;k.style.transform=`translate(${Math.cos(a)*R}px,${Math.sin(a)*R}px)`;t.innerHTML=(MIN+(MAX-MIN)*v).toFixed(1).replace('.0','')+'<sup>°C</sup>'}
function set(e){const r=d.getBoundingClientRect();let a=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI;a=(a-135+720)%360;if(a>270)a=a>315?0:270;v=Math.round(a/270*40)/40;draw()}
d.addEventListener('pointerdown',e=>{d.setPointerCapture(e.pointerId);set(e);d.onpointermove=set});d.addEventListener('pointerup',()=>d.onpointermove=null);
document.querySelectorAll('#m button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#m button').forEach(o=>o.classList.remove('on'));b.classList.add('on');document.getElementById('lab').textContent=b.dataset.m});
addEventListener('resize',draw);draw();const ck=()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});ck();setInterval(ck,10000);
</script></body></html>
