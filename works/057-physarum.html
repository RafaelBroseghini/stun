<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physarum Network</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#06110d}canvas{display:block;width:100%;height:100%;image-rendering:auto;cursor:crosshair}
.t{position:fixed;left:24px;bottom:22px;background:rgba(6,17,13,.85);padding:12px 16px;border-radius:10px;color:#f7e36a;font:300 12px Unbounded,sans-serif;letter-spacing:.12em}.t b{display:block;font-weight:700;font-size:clamp(20px,2.6vw,34px);letter-spacing:.02em;margin-bottom:6px}</style></head><body>
<canvas id="c"></canvas><div class="t"><b>Physarum polycephalum</b>40,000 agents follow each other's trails · click to drop food</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,T,T2,img,A;const N=40000;
function init(){const s=.5;W=c.width=Math.floor(innerWidth*s);H=c.height=Math.floor(innerHeight*s);T=new Float32Array(W*H);T2=new Float32Array(W*H);img=x.createImageData(W,H);A=new Float32Array(N*3);
for(let i=0;i<N;i++){A[i*3]=Math.random()*W;A[i*3+1]=Math.random()*H;A[i*3+2]=Math.random()*Math.PI*2}}
init();addEventListener('resize',init);
c.addEventListener('click',e=>{const X=e.clientX/innerWidth*W|0,Y=e.clientY/innerHeight*H|0;for(let dy=-8;dy<=8;dy++)for(let dx=-8;dx<=8;dx++){const xx=X+dx,yy=Y+dy;if(xx>=0&&yy>=0&&xx<W&&yy<H)T[yy*W+xx]+=60}});
const SA=.45,SD=9,RA=.35,SP=1.1;const sense=(px,py)=>{const X=px|0,Y=py|0;return X<0||Y<0||X>=W||Y>=H?0:T[Y*W+X]};
function step(){for(let i=0;i<N;i++){const o=i*3;let px=A[o],py=A[o+1],a=A[o+2];const f=sense(px+Math.cos(a)*SD,py+Math.sin(a)*SD),l=sense(px+Math.cos(a-SA)*SD,py+Math.sin(a-SA)*SD),r=sense(px+Math.cos(a+SA)*SD,py+Math.sin(a+SA)*SD);
if(f<l&&f<r)a+=(Math.random()<.5?-1:1)*RA;else if(l>r)a-=RA;else if(r>l)a+=RA;px+=Math.cos(a)*SP;py+=Math.sin(a)*SP;if(px<1||px>=W-1||py<1||py>=H-1){a=Math.random()*Math.PI*2;px=Math.min(W-2,Math.max(1,px));py=Math.min(H-2,Math.max(1,py))}
A[o]=px;A[o+1]=py;A[o+2]=a;T[(py|0)*W+(px|0)]+=1.2}
for(let y=1;y<H-1;y++)for(let X=1;X<W-1;X++){const i=y*W+X;T2[i]=(T[i]*4+T[i-1]+T[i+1]+T[i-W]+T[i+W])/8*.94}[T,T2]=[T2,T]}
function draw(){const d=img.data;for(let i=0;i<W*H;i++){const v=Math.min(1,T[i]/9);const o=i*4;d[o]=6+v*v*241;d[o+1]=17+v*210+v*v*0;d[o+2]=13+v*40+(1-v)*v*120;d[o+3]=255}x.putImageData(img,0,0)}
for(let i=0;i<90;i++)step();function f(){step();step();draw();requestAnimationFrame(f)}f();
</script></body></html>
