<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boarding Pass LIS–HND</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,800&family=Libre+Barcode+39+Text&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:linear-gradient(135deg,#ffcf6b,#ff7e5f 50%,#5b3a8c);display:grid;place-items:center;font-family:Archivo,sans-serif;color:#1b1b2a}
.pass{display:flex;filter:drop-shadow(0 30px 40px rgba(40,10,60,.45));transform:rotate(-4deg);max-width:96vw}
.main,.stub{background:#fffdf7;position:relative}.main{width:min(560px,66vw);padding:28px 30px;border-radius:18px 0 0 18px;-webkit-mask:radial-gradient(circle at 100% 0,transparent 14px,#000 14.5px) top/100% 51% no-repeat,radial-gradient(circle at 100% 100%,transparent 14px,#000 14.5px) bottom/100% 51% no-repeat;mask:radial-gradient(circle at 100% 0,transparent 14px,#000 14.5px) top/100% 51% no-repeat,radial-gradient(circle at 100% 100%,transparent 14px,#000 14.5px) bottom/100% 51% no-repeat}
.stub{width:min(200px,26vw);padding:28px 20px;border-radius:0 18px 18px 0;border-left:2px dashed #c9c2b4;transition:transform .9s cubic-bezier(.3,.7,.2,1),opacity .9s;cursor:pointer;-webkit-mask:radial-gradient(circle at 0 0,transparent 14px,#000 14.5px) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,transparent 14px,#000 14.5px) bottom/100% 51% no-repeat;mask:radial-gradient(circle at 0 0,transparent 14px,#000 14.5px) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,transparent 14px,#000 14.5px) bottom/100% 51% no-repeat}
.stub.torn{transform:translate(60px,120px) rotate(18deg);opacity:.0}
.al{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-stretch:125%;letter-spacing:.08em;font-size:13px}.al i{font-style:normal;background:#1b1b2a;color:#ffcf6b;padding:4px 10px;border-radius:20px}
.rt{display:flex;align-items:center;justify-content:space-between;margin:22px 0}.rt b{display:block;font-weight:800;font-stretch:62%;font-size:clamp(48px,9vw,96px);line-height:.85}.rt small{font-size:12px;color:#7a7468;letter-spacing:.1em}
.pl{flex:1;height:2px;background:repeating-linear-gradient(90deg,#1b1b2a 0 6px,transparent 6px 12px);margin:0 16px;position:relative}.pl::after{content:"✈";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);font-size:26px;background:#fffdf7;padding:0 6px}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.gr div{font-size:10px;letter-spacing:.15em;color:#7a7468}.gr b{display:block;font-size:20px;color:#1b1b2a;letter-spacing:0;font-weight:800;margin-top:2px}
.bc{font-family:'Libre Barcode 39 Text',cursive;font-size:clamp(34px,5vw,54px);line-height:1;margin-top:18px;white-space:nowrap;overflow:hidden}
.stub .gr{grid-template-columns:1fr}.stub .rt b{font-size:clamp(28px,4vw,40px)}.hint{position:fixed;bottom:4vh;color:#fff;font-size:12px;letter-spacing:.3em}</style></head><body>
<div class="pass"><div class="main"><div class="al">AURORA PACIFIC <i>GROUP 2</i></div><div class="rt"><div><b>LIS</b><small>LISBON · 22:15</small></div><div class="pl"></div><div style="text-align:right"><b>HND</b><small>TOKYO · 19:40 +1</small></div></div>
<div class="gr"><div>PASSENGER<b>M. OKAFOR</b></div><div>FLIGHT<b>AP 811</b></div><div>GATE<b>B42</b></div><div>SEAT<b>23K</b></div><div>DATE<b>18 NOV</b></div><div>BOARDS<b>21:35</b></div><div>CLASS<b>Y</b></div><div>ZONE<b>2</b></div></div><div class="bc">*AP811LISHND23K*</div></div>
<div class="stub" id="stub" title="tear the stub"><div class="al">AP 811</div><div class="rt"><div><b>LIS→HND</b></div></div><div class="gr"><div>SEAT<b>23K</b></div><div>GATE<b>B42</b></div><div>BOARDS<b>21:35</b></div></div></div></div><div class="hint">TAP THE STUB TO TEAR IT OFF</div>
<script>const s=document.getElementById('stub');s.onclick=()=>{s.classList.add('torn');setTimeout(()=>s.classList.remove('torn'),2600)}</script>
</body></html>
