<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Dusk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#1a1c2c;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.t{position:fixed;left:0;right:0;top:7vh;text-align:center;font:clamp(12px,2.2vw,26px)/1.6 'Press Start 2P',monospace;color:#ffcd75;text-shadow:3px 3px 0 #5d275d;letter-spacing:.1em;pointer-events:none;transition:opacity 1s}
.t small{display:block;font-size:.42em;opacity:.8;margin-top:10px}.t small b{animation:bl 1s steps(1) infinite;font-weight:400}@keyframes bl{50%{opacity:0}}
.hud{position:fixed;left:3vw;bottom:3vh;font:clamp(8px,1vw,11px)/1.8 'Press Start 2P';color:#f4f4f4;text-shadow:2px 2px 0 #1a1c2c;pointer-events:none}
.hud b{color:#ffcd75;font-weight:400}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.12) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
</style></head><body>
<canvas id="c"></canvas><div class="scan"></div>
<div class="t" id="t">THE LONG WALK HOME<small><b>▶</b> HOLD → OR POINT RIGHT TO WALK · SPACE TO HOP</small></div>
<div class="hud">HOME IN <b id="km">2.40</b> KM<br><span id="ph">DUSK</span> · <span id="ff">0</span> FIREFLIES CAUGHT</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;
const SKY=[['#1a1c2c','#29366f','#3b5dc9','#5d275d','#b13e53','#ef7d57','#ffcd75'],['#0f1024','#1a1c3c','#29366f','#3b2a5a','#5d275d','#8a3a5a','#b13e53'],['#07070f','#0b0b1a','#141b3c','#1a1c3c','#202848','#29366f','#3b3a6a']];
function size(){H=150;W=Math.round(H*innerWidth/innerHeight);c.width=W;c.height=H;x.imageSmoothingEnabled=false;skyC=[0,1,2].map(mkSky)}
const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(42);
const hills=[0,1,2,3].map(k=>{const a=[];let y=0;for(let i=0;i<2048;i++){y+=(rnd()-.5)*(k+1)*.9;y*=.98;a.push(y)}return a});
const trees=Array.from({length:2048},()=>rnd());const stars=Array.from({length:110},()=>[rnd(),rnd()*.55,rnd()]);
let skyC;function mkSky(p){const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');const s=SKY[p];const seg=H*.62/(s.length-1);
for(let i=0;i<s.length-1;i++){for(let y=Math.floor(i*seg);y<(i+1)*seg;y++){const t=(y-i*seg)/seg;for(let X=0;X<W;X++){const th=(((X%4)*4+(y%4))*7%16)/16;g.fillStyle=t>th?s[i+1]:s[i];g.fillRect(X,y,1,1)}}}g.fillStyle=s[s.length-1];g.fillRect(0,Math.floor(H*.62),W,H);return cv}
size();addEventListener('resize',size);
const TOTAL=2400;let pos=0,spd=0,tsp=0,keys={},py=0,vy=0,caught=0,arrived=false;
addEventListener('pointermove',e=>{const u=e.clientX/innerWidth;tsp=u>.6?(u-.6)*2.4:u<.3?(u-.3)*2:0});addEventListener('pointerleave',()=>tsp=0);
addEventListener('pointerdown',e=>{hop();const u=e.clientX/innerWidth;if(u>.5)tsp=.8});
addEventListener('keydown',e=>{keys[e.key]=1;if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();hop()}});addEventListener('keyup',e=>keys[e.key]=0);
let ac;function blip(f,d=.06,v=.04){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.5,ac.currentTime+d);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02)}catch(e){}}
function hop(){if(py===0){vy=2.1;blip(330,.12,.05)}}
const flies=Array.from({length:18},()=>({x:rnd()*TOTAL,y:.55+rnd()*.25,p:rnd()*6,got:false}));
const lamps=Array.from({length:12},(_,i)=>200+i*190+rnd()*60);
let lastStep=0;
function f(){const t=performance.now()/1000;let want=tsp;if(keys.ArrowRight||keys.d)want=1;if(keys.ArrowLeft||keys.a)want=-.8;spd+=(want-spd)*.08;if(arrived)spd*=.9;pos=Math.max(0,Math.min(TOTAL,pos+spd*.9));
vy-=.14;py=Math.max(0,py+vy);if(py===0)vy=0;
const prog=pos/TOTAL;const phase=prog<.33?0:prog<.7?1:2;x.drawImage(skyC[phase],0,0);
document.getElementById('t').style.opacity=(pos>40&&pos<TOTAL-5)?0:1;
// stars brighten as night falls
for(const [sx,sy,ph] of stars){if(ph<.3+prog*.7&&Math.sin(t*2+ph*9)>-.3){x.fillStyle=ph>.85?'#ffcd75':'#f4f4f4';x.fillRect(Math.floor(((sx*W-pos*.02)%W+W)%W),Math.floor(sy*H*.55),1,1)}}
// sun sinks, moon rises
const sx=Math.floor(W*.7),sy=Math.floor(H*(.36+prog*.5));x.fillStyle=phase?'#ef7d57':'#ffcd75';for(let dy=-10;dy<=10;dy++){const w=Math.floor(Math.sqrt(100-dy*dy));x.fillRect(sx-w,sy+dy,w*2,1)}
if(prog>.3){const mx=Math.floor(W*.22),my=Math.floor(H*(.5-(prog-.3)*.55));x.fillStyle='#f4f4f4';for(let dy=-6;dy<=6;dy++){const w=Math.floor(Math.sqrt(36-dy*dy));x.fillRect(mx-w,my+dy,w*2,1)}x.fillStyle=SKY[phase][1];for(let dy=-6;dy<=6;dy++){const w=Math.floor(Math.sqrt(36-dy*dy));x.fillRect(mx-w+4,my+dy-1,w*2,1)}}
const HC=[[['#5d275d','#3b2a5a','#1d1838'],.45,.08],[['#3b2a5a','#2b2350','#141530'],.55,.2],[['#29366f','#1d2a5c','#101830'],.66,.45],[['#1a1c2c','#121424','#08080f'],.8,1]];
HC.forEach(([cols,base,sp],k)=>{const col=cols[phase];x.fillStyle=col;for(let X=0;X<W;X++){const i=((Math.floor(X+pos*sp)%2048)+2048)%2048;const y=Math.floor(H*base+hills[k][i]*(2+k));x.fillRect(X,y,1,H-y);if(k>=2&&trees[(i*3+k)%2048]>.86){const th=3+Math.floor(trees[i]*(k===3?10:5));for(let r=0;r<th;r++){const w=Math.floor((r/th)*(k===3?3:2));x.fillRect(X-w,y-th+r,w*2+1,1)}}}
if(k===2){// distant windows
for(let X=0;X<W;X+=1){const i=((Math.floor(X+pos*sp)%2048)+2048)%2048;if(trees[(i*7)%2048]>.985&&phase>0){const y=Math.floor(H*base+hills[k][i]*(2+k));x.fillStyle='#ffcd75';x.fillRect(X,y-2,1,1)}}}});
const wy=Math.floor(H*.86);x.fillStyle=SKY[phase][0];x.fillRect(0,wy,W,H-wy);for(let y=wy+1;y<H;y++){if(y%2)continue;for(let X=0;X<W;X+=1){const v=Math.sin(X*.3+y*.7+t*3+pos*.05);if(v>.85){x.fillStyle=Math.abs(X-sx)<14-(y-wy)*.3&&phase<2?'#ffcd75':'#3b5dc9';x.fillRect(X,y,2,1)}}}
// lamp posts along the path
const PX=Math.floor(W*.32);lamps.forEach(L=>{const X=Math.floor(PX+(L-pos));if(X<-4||X>W+4)return;x.fillStyle='#08080f';x.fillRect(X,wy-14,1,14);x.fillRect(X-1,wy-15,3,1);const lit=phase>0;x.fillStyle=lit?'#ffcd75':'#5d275d';x.fillRect(X-1,wy-14,3,2);if(lit&&Math.sin(t*20+L)>-.9){x.globalAlpha=.18;x.fillRect(X-4,wy-17,9,7);x.globalAlpha=.08;x.fillRect(X-7,wy-19,15,11);x.globalAlpha=1}});
// home
const hx=Math.floor(PX+(TOTAL+30-pos));if(hx<W+20){x.fillStyle='#08080f';x.fillRect(hx-10,wy-12,20,12);for(let r=0;r<8;r++)x.fillRect(hx-12+r,wy-12-r,24-r*2,1);x.fillRect(hx+5,wy-20,3,6);x.fillStyle='#ffcd75';x.fillRect(hx-6,wy-9,4,4);x.fillRect(hx+3,wy-9,4,4);x.fillStyle='#b13e53';x.fillRect(hx-1,wy-6,3,6);if(Math.sin(t*3)>0){x.fillStyle='#f4f4f4';x.globalAlpha=.5;x.fillRect(hx+6,wy-23-Math.floor(t*4)%6,1,1);x.globalAlpha=1}}
// fireflies
const ex=PX,ey=wy-6-Math.floor(py*4);flies.forEach(fl=>{if(fl.got)return;const X=Math.floor(PX+(fl.x-pos)+Math.sin(t+fl.p)*6),Y=Math.floor(H*fl.y+Math.cos(t*1.3+fl.p)*4);if(X<0||X>W)return;if(phase>0&&Math.sin(t*3+fl.p)>-.2){x.fillStyle='#e8ff7a';x.fillRect(X,Y,1,1);x.globalAlpha=.25;x.fillRect(X-1,Y-1,3,3);x.globalAlpha=1}if(Math.abs(X-ex)<3&&Math.abs(Y-ey)<6){fl.got=true;caught++;blip(880,.1,.04);document.getElementById('ff').textContent=caught}});
// walker
const moving=Math.abs(spd)>.05,step=moving?Math.floor(t*8*Math.min(2,.6+Math.abs(spd)))%2:0;if(moving&&py===0&&step!==lastStep){lastStep=step;blip(step?110:90,.03,.015)}
const by=wy-1-Math.floor(py*4),dir=spd<-.02?-1:1;x.fillStyle='#f4f4f4';x.fillRect(PX,by-8,2,2);x.fillStyle='#b13e53';x.fillRect(PX-1,by-6,4,3);
x.fillStyle='#ffcd75';const sc=Math.floor(Math.sin(t*6)*1);x.fillRect(PX-dir*2,by-6+sc,2,1);x.fillRect(PX-dir*3,by-5+sc,1,1);
x.fillStyle='#29366f';x.fillRect(PX+(step?-1:0),by-3,1,3);x.fillRect(PX+(step?2:1),by-3,1,3);
x.fillStyle=SKY[phase][0];x.globalAlpha=.5;x.fillRect(PX-1,wy+1,4,1);x.globalAlpha=1;
// birds at dusk, bats at night
for(let b=0;b<4;b++){const bx=Math.floor((t*8+b*37)%(W+20))-10,bby=Math.floor(H*.25+b*4+Math.sin(t*2+b)*2),w=Math.floor(t*(phase===2?12:5)+b)%2;x.fillStyle='#1a1c2c';x.fillRect(bx-1,bby-w,1,1);x.fillRect(bx,bby,1,1);x.fillRect(bx+1,bby-w,1,1)}
document.getElementById('km').textContent=((TOTAL-pos)/1000).toFixed(2);document.getElementById('ph').textContent=['DUSK','TWILIGHT','NIGHT'][phase];
if(pos>=TOTAL&&!arrived){arrived=true;[523,659,784,1046].forEach((n,i)=>setTimeout(()=>blip(n,.15,.05),i*140));const tt=document.getElementById('t');tt.innerHTML='HOME AT LAST<small>'+caught+' FIREFLIES IN YOUR POCKET · ← TO WALK BACK</small>';tt.style.opacity=1;setTimeout(()=>arrived=false,1500)}
requestAnimationFrame(f)}f();
</script></body></html>
