<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Torchlit Cave</title>

<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#050302;cursor:none}

svg.art{position:fixed;inset:0;width:100%;height:100%}svg.art *{mix-blend-mode:multiply}
.dark{position:fixed;inset:0;background:radial-gradient(circle var(--r) at var(--x) var(--y),rgba(255,170,90,.08) 0,transparent 30%,rgba(5,3,2,.3) 62%,rgba(5,3,2,.86) 100%);pointer-events:none}

<div class="dark" id="d" style="--x:40%;--y:45%;--r:240px"></div><div class="t">Grotte d’Arkaig · c. 30,000 BP · move the torch</div>
<script>
const svg=document.querySelector('svg.art');for(let i=0;i<34;i++){const e=document.createElementNS('http://www.w3.org/2000/svg','path');const X=40+Math.random()*1120,Y=80+Math.random()*560;e.setAttribute('d',`M${X} ${Y}c-14-4-18 10-12 20 4 8 4 20 2 30 10 0 18-6 20-14 4 2 10 0 10-6-4-6-10-12-20-30z`);e.setAttribute('fill',['#7a2a16','#2a1a12','#b8642a'][i%3]);e.setAttribute('opacity','.5');e.setAttribute('transform',`rotate(${Math.random()*40-20} ${X} ${Y}) scale(.9)`);if(i<8)svg.appendChild(e)}
const d=document.getElementById('d');let tx=.4,ty=.45,cx=.4,cy=.45,user=false;addEventListener('pointermove',e=>{user=true;tx=e.clientX/innerWidth;ty=e.clientY/innerHeight});
function f(t){if(!user){tx=.5+.32*Math.sin(t*.0004);ty=.48+.2*Math.sin(t*.0007)}cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;const fl=Math.min(innerWidth,innerHeight)*(.62+.03*Math.sin(t*.02)+.02*Math.sin(t*.053));d.style.setProperty('--x',cx*100+'%');d.style.setProperty('--y',cy*100+'%');d.style.setProperty('--r',fl+'px');requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
