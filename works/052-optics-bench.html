<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispersion Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:wght@400;600&family=Red+Hat+Display:wght@900&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#0b0b0e}canvas{display:block;width:100%;height:100%;cursor:ns-resize}
.r{position:fixed;left:24px;top:22px;color:#d7d7e0;font:12px/1.8 'Red Hat Mono',monospace}.r b{font:900 clamp(22px,3vw,40px)/1 'Red Hat Display',sans-serif;display:block;margin-bottom:10px;color:#fff;letter-spacing:-.01em}.r span{color:#ffd36a}</style></head><body>
<canvas id="c"></canvas><div class="r"><b>Dispersion Bench</b>crown glass prism · apex 60°<br>angle of incidence <span id="ai">48.0°</span><br>deviation (589 nm) <span id="dv">—</span><br>drag up / down to aim the beam</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H,aim=.0,ta=.0;
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')ta=(e.clientY/innerHeight-.5)*.5});
const nOf=l=>1.5046+4200/(l*l);const wl=[];for(let l=400;l<=700;l+=6)wl.push(l);
function rgb(l){let r=0,g=0,b=0;if(l<440){r=-(l-440)/40;b=1}else if(l<490){g=(l-440)/50;b=1}else if(l<510){g=1;b=-(l-510)/20}else if(l<580){r=(l-510)/70;g=1}else if(l<645){r=1;g=-(l-645)/65}else r=1;return[r*255|0,g*255|0,b*255|0]}
function inter(p,d,a,b){const ex=b[0]-a[0],ey=b[1]-a[1];const den=d[0]*ey-d[1]*ex;if(Math.abs(den)<1e-9)return null;const t=((a[0]-p[0])*ey-(a[1]-p[1])*ex)/den,u=((a[0]-p[0])*d[1]-(a[1]-p[1])*d[0])/den;return t>1e-6&&u>=0&&u<=1?[p[0]+d[0]*t,p[1]+d[1]*t,t]:null}
function refr(d,n,r){let cs=-(n[0]*d[0]+n[1]*d[1]);if(cs<0){n=[-n[0],-n[1]];cs=-cs}const k=1-r*r*(1-cs*cs);if(k<0)return null;const q=r*cs-Math.sqrt(k);return[r*d[0]+q*n[0],r*d[1]+q*n[1]]}
function f(){aim+=(ta-aim)*.08;x.fillStyle='#0b0b0e';x.fillRect(0,0,W,H);const S=Math.min(W,H)*.32,cx=W*.46,cy=H*.56;
const A=[cx,cy-S*.95],B=[cx-S*.82,cy+S*.47],C=[cx+S*.82,cy+S*.47];
x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=dpr;for(let i=0;i<W;i+=40*dpr){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
const src=[0,cy+S*.45+aim*H*.5];const tgt=[(A[0]+B[0])/2,(A[1]+B[1])/2];let d=[tgt[0]-src[0],tgt[1]-src[1]];const L=Math.hypot(...d);d=[d[0]/L,d[1]/L];
const p1=inter(src,d,A,B);x.globalCompositeOperation='lighter';
if(p1){x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=4*dpr;x.shadowColor='#fff';x.shadowBlur=20*dpr;x.beginPath();x.moveTo(...src);x.lineTo(p1[0],p1[1]);x.stroke();x.shadowBlur=0;
const e1=[B[0]-A[0],B[1]-A[1]],n1=[e1[1],-e1[0]],nl=Math.hypot(...n1);const N1=[n1[0]/nl,n1[1]/nl];const ai=Math.acos(Math.abs(d[0]*N1[0]+d[1]*N1[1]))*180/Math.PI;document.getElementById('ai').textContent=ai.toFixed(1)+'°';
const e2=[C[0]-A[0],C[1]-A[1]],n2=[-e2[1],e2[0]],n2l=Math.hypot(...n2),N2=[n2[0]/n2l,n2[1]/n2l];
for(const l of wl){const n=nOf(l);const d2=refr(d,N1,1/n);if(!d2)continue;const p2=inter([p1[0],p1[1]],d2,A,C)||inter([p1[0],p1[1]],d2,B,C);if(!p2)continue;const d3=refr(d2,N2,n);const [r,g,b]=rgb(l);
x.strokeStyle=`rgba(${r},${g},${b},.18)`;x.lineWidth=2*dpr;x.beginPath();x.moveTo(p1[0],p1[1]);x.lineTo(p2[0],p2[1]);x.stroke();if(!d3)continue;
const far=[p2[0]+d3[0]*W,p2[1]+d3[1]*W];const wx=W*.92;const tt=(wx-p2[0])/d3[0];const hit=tt>0?[wx,p2[1]+d3[1]*tt]:far;x.strokeStyle=`rgba(${r},${g},${b},.55)`;x.lineWidth=3*dpr;x.beginPath();x.moveTo(p2[0],p2[1]);x.lineTo(hit[0],hit[1]);x.stroke();
if(tt>0){x.fillStyle=`rgba(${r},${g},${b},.9)`;x.fillRect(wx,hit[1]-4*dpr,10*dpr,8*dpr);if(l%60===40||l===700-((700-400)%6)){x.globalCompositeOperation='source-over';x.fillStyle='#8a8a99';x.font=`${10*dpr}px "Red Hat Mono"`;x.fillText(l+' nm',wx+16*dpr,hit[1]+3*dpr);x.globalCompositeOperation='lighter'}
if(l===586){const dev=Math.acos(d[0]*d3[0]+d[1]*d3[1])*180/Math.PI;document.getElementById('dv').textContent=dev.toFixed(1)+'°'}}}}
x.globalCompositeOperation='source-over';x.fillStyle='rgba(180,220,255,.08)';x.strokeStyle='rgba(220,240,255,.7)';x.lineWidth=1.5*dpr;x.beginPath();x.moveTo(...A);x.lineTo(...B);x.lineTo(...C);x.closePath();x.fill();x.stroke();
x.fillStyle='#1c1c24';x.fillRect(W*.92-4*dpr,H*.1,4*dpr,H*.8);requestAnimationFrame(f)}f();
</script></body></html>
