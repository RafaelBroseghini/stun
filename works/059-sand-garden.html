<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sand Jar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#2b2135;display:flex;align-items:center;justify-content:center;gap:24px;font-family:'Pixelify Sans',monospace;color:#f4e3c8;touch-action:none}
.jar{height:min(90vh,120vw);aspect-ratio:.66;border:6px solid rgba(220,240,255,.5);border-top:0;border-radius:0 0 36px 36px;background:rgba(255,255,255,.05);box-shadow:inset 10px 0 30px rgba(255,255,255,.08);overflow:hidden;max-width:70vw}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair}
.ui{display:flex;flex-direction:column;gap:10px}.ui h1{font-weight:700;font-size:28px;line-height:1}.ui button{display:flex;align-items:center;gap:10px;padding:8px 12px;font:400 15px 'Pixelify Sans';background:#3c2f4a;color:#f4e3c8;border:2px solid transparent;border-radius:8px;cursor:pointer}.ui button.on{border-color:#f4e3c8}.ui i{width:18px;height:18px;border-radius:4px}
@media(max-width:640px){body{flex-direction:column;gap:8px}.ui{flex-direction:row;flex-wrap:wrap}.ui h1{display:none}.jar{height:72vh}}</style></head><body>
<div class="jar"><canvas id="c"></canvas></div><div class="ui" id="ui"><h1>Sand<br>Jar</h1></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const W=120,H=180;c.width=W;c.height=H;const G=new Uint8Array(W*H),Cc=new Uint32Array(W*H);
const M=[['Dune','#e8b04a',1],['Coral','#f07167',1],['Lagoon','#00afb9',1],['Lilac','#b388eb',1],['Ink','#2a2240',1],['Water','#5fa8ff',2],['Stone','#8d8a99',3],['Eraser','#2b2135',0]];let cur=0;
const ui=document.getElementById('ui');M.forEach((m,i)=>{const b=document.createElement('button');b.innerHTML=`<i style="background:${m[1]}"></i>${m[0]}`;b.className=i?'':'on';b.onclick=()=>{cur=i;[...ui.querySelectorAll('button')].forEach(o=>o.classList.toggle('on',o===b))};ui.appendChild(b)});
const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255]};
function put(X,Y,m){if(X<0||Y<0||X>=W||Y>=H)return;const i=Y*W+X;if(m===7){G[i]=0;return}if(G[i])return;G[i]=M[m][2];const [r,g,b]=hex(M[m][1]);const j=.85+Math.random()*.3;Cc[i]=(255<<24)|(Math.min(255,b*j)<<16)|(Math.min(255,g*j)<<8)|Math.min(255,r*j)}
let dn=false,px=0,py=0;const pos=e=>{const r=c.getBoundingClientRect();px=Math.floor((e.clientX-r.left)/r.width*W);py=Math.floor((e.clientY-r.top)/r.height*H)};
c.addEventListener('pointerdown',e=>{dn=true;pos(e)});c.addEventListener('pointermove',pos);addEventListener('pointerup',()=>dn=false);
function mv(a,b){G[b]=G[a];Cc[b]=Cc[a];G[a]=0}
function step(){for(let y=H-2;y>=0;y--){const lr=Math.random()<.5;for(let k=0;k<W;k++){const X=lr?k:W-1-k,i=y*W+X,t=G[i];if(t!==1&&t!==2)continue;const b=i+W;
if(G[b]===0){mv(i,b);continue}if(t===1&&G[b]===2){const tg=G[b],tc=Cc[b];mv(i,b);G[i]=tg;Cc[i]=tc;continue}const d=Math.random()<.5?-1:1;
if(X+d>=0&&X+d<W&&G[b+d]===0){mv(i,b+d);continue}if(X-d>=0&&X-d<W&&G[b-d]===0){mv(i,b-d);continue}if(t===2){if(X+d>=0&&X+d<W&&G[i+d]===0)mv(i,i+d);else if(X-d>=0&&X-d<W&&G[i-d]===0)mv(i,i-d)}}}}
const img=x.createImageData(W,H),u32=new Uint32Array(img.data.buffer);let auto=0;
function f(){if(dn)for(let k=0;k<6;k++)put(px+((Math.random()-.5)*6|0),py+((Math.random()-.5)*6|0),cur);
if(auto<1400){auto++;const m=Math.floor(auto/200)%5;const ax=Math.floor(W*(.3+.4*Math.sin(auto*.01)));for(let k=0;k<3;k++)put(ax+((Math.random()-.5)*4|0),2,m)}
step();step();for(let i=0;i<W*H;i++)u32[i]=G[i]?Cc[i]:0;x.putImageData(img,0,0);requestAnimationFrame(f)}
for(let i=0;i<500;i++){auto++;const m=Math.floor(auto/200)%5;const ax=Math.floor(W*(.3+.4*Math.sin(auto*.01)));for(let k=0;k<3;k++)put(ax+((Math.random()-.5)*4|0),2,m);step();step()}f();
</script></body></html>
