<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lighthouse at Skerry Point</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500&family=Alegreya:ital@1&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#07101f;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.t{position:fixed;left:5vw;top:6vh;color:#e6edf5;font:500 clamp(22px,3vw,40px)/1.1 'Alegreya SC',serif;letter-spacing:.06em;pointer-events:none;text-shadow:0 2px 20px #000}.t small{display:block;font:italic 15px Alegreya,serif;letter-spacing:.06em;opacity:.75;margin-top:10px}
.ui{position:fixed;left:5vw;bottom:5vh;display:flex;gap:8px;align-items:center;color:#c8d4e2;font:500 12px 'Alegreya SC';letter-spacing:.2em}.ui button{font:500 12px 'Alegreya SC';letter-spacing:.16em;color:#e6edf5;background:rgba(255,255,255,.06);border:1px solid rgba(230,237,245,.35);padding:6px 12px;cursor:pointer}.ui button.on{background:#e6edf5;color:#07101f}
.log{position:fixed;right:5vw;bottom:5vh;color:#9fb0c4;font:italic 14px Alegreya,serif;text-align:right;line-height:1.6;pointer-events:none}</style></head><body>
<canvas id="c"></canvas><div class="t">Skerry Point Light<small>Fl W 10s · 28 m · 18 nautical miles — hold anywhere to aim the beam and sound the horn</small></div>
<div class="ui"><span>WEATHER</span><button data-w="0" class="on">Clear</button><button data-w="1">Mist</button><button data-w="2">Storm</button></div><div class="log" id="log">vessels in sight · 3</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let dpr,W,H,HZ,LX,LY,sky,fog,stars,bc;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;HZ=H*.68;LX=W*(innerWidth<700?.6:.7);LY=H*.34;build()}
function build(){bc=document.createElement('canvas');bc.width=W;bc.height=H;sky=document.createElement('canvas');sky.width=W;sky.height=H;const g=sky.getContext('2d');const sg=g.createLinearGradient(0,0,0,HZ);sg.addColorStop(0,'#030814');sg.addColorStop(.7,'#0f2042');sg.addColorStop(1,'#1d3358');g.fillStyle=sg;g.fillRect(0,0,W,HZ+2);
stars=Array.from({length:300},()=>[Math.random()*W,Math.random()*HZ*.9,Math.random()]);
// fog texture: soft fractal blobs, scrolled through the beam
fog=document.createElement('canvas');fog.width=512;fog.height=256;const f=fog.getContext('2d');for(let i=0;i<260;i++){const X=Math.random()*512,Y=Math.random()*256,r=10+Math.random()*60,gr=f.createRadialGradient(X,Y,0,X,Y,r);gr.addColorStop(0,`rgba(255,255,255,${.08+Math.random()*.26})`);gr.addColorStop(1,'rgba(255,255,255,0)');f.fillStyle=gr;for(const [dx,dy] of [[0,0],[512,0],[-512,0]])f.fillRect(X-r+dx,Y-r+dy,r*2,r*2)}}
size();addEventListener('resize',size);
// ---------- state ----------
let ang=0,aim=null,lt=performance.now(),weather=0,wv=0,flash=0,bolt=null;
const ships=[{x:.15,d:.55,v:.000006,k:'trawler'},{x:.45,d:.9,v:-.000004,k:'liner'},{x:.85,d:.35,v:.00001,k:'yacht'}];const gulls=[];let rain=[];
const buttons=[...document.querySelectorAll('.ui button')];buttons.forEach(b=>b.onclick=e=>{e.stopPropagation();weather=+b.dataset.w;buttons.forEach(o=>o.classList.toggle('on',o===b))});
// ---------- audio ----------
let A=null,horn=null;function AC(){if(!A)try{A=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return A}
function hornOn(){const a=AC();if(!a||horn)return;const t=a.currentTime,g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=520;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.24,t+.3);f.connect(g).connect(a.destination);const os=[180,180.8,360].map(fq=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(fq,t);o.connect(f);o.start(t);return o});horn={g,os,f}}
function hornOff(){if(!horn||!A)return;const h=horn,t=A.currentTime;h.os.forEach(o=>{o.frequency.cancelScheduledValues(t);o.frequency.setValueAtTime(o.frequency.value,t);o.frequency.exponentialRampToValueAtTime(o.frequency.value*.62,t+.35)});h.g.gain.cancelScheduledValues(t);h.g.gain.setValueAtTime(h.g.gain.value,t);h.g.gain.linearRampToValueAtTime(.26,t+.2);h.g.gain.linearRampToValueAtTime(0,t+1);h.os.forEach(o=>o.stop(t+1.05));horn=null}
function thunder(){const a=AC();if(!a)return;const len=a.sampleRate*3,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+.04*(Math.random()*2-1))/1.04;d[i]=l*7*Math.pow(1-i/len,2)}const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=260;g.gain.value=.7;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+.6)}
const aimAt=e=>{const v=Math.max(-1,Math.min(1,(e.clientX*dpr-LX)/(W*.45)));const fwd=e.clientY*dpr>LY+H*.1?1:-1;aim=Math.atan2(fwd*Math.sqrt(1-v*v),v)};
c.addEventListener('pointerdown',e=>{aimAt(e);hornOn()});addEventListener('pointermove',e=>{if(aim!==null)aimAt(e)});addEventListener('pointerup',()=>{aim=null;hornOff()});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();hornOn();setTimeout(hornOff,1400)}if(e.key>='1'&&e.key<='3')buttons[+e.key-1].click()});
// ---------- drawing helpers ----------
function seaY(X,k,t){return HZ+k*H*.055+Math.sin(X*.006/dpr+t*.0008*(k+1)+k)*(5+wv*10)*dpr*(k+1)*.5+Math.sin(X*.017/dpr-t*.0013*(k+1))*(2+wv*4)*dpr}
function ship(s,t,lit){const X=s.x*W,sc=(.4+s.d*.8)*dpr,Y=HZ+(1-s.d)*H*.015+Math.sin(t*.0012+s.x*9)*2*sc;x.save();x.translate(X,Y);x.scale(sc*(s.v<0?-1:1),sc);x.rotate(Math.sin(t*.001+s.x*5)*.03*(1+wv*2));
const hull=lit?`rgb(${40+lit*120|0},${48+lit*120|0},${62+lit*110|0})`:'#0a1222';x.fillStyle=hull;
if(s.k==='liner'){x.beginPath();x.moveTo(-70,0);x.lineTo(76,0);x.lineTo(66,-14);x.lineTo(-66,-14);x.fill();x.fillRect(-46,-26,80,12);x.fillRect(-24,-36,34,10);x.fillRect(-10,-50,10,14);x.fillStyle='rgba(255,220,140,.9)';for(let k=0;k<12;k++)x.fillRect(-60+k*10,-9,4,3);for(let k=0;k<7;k++)x.fillRect(-40+k*10,-21,4,3)}
else if(s.k==='trawler'){x.beginPath();x.moveTo(-30,0);x.lineTo(34,0);x.lineTo(40,-12);x.lineTo(-34,-10);x.fill();x.fillRect(-10,-24,20,14);x.fillRect(-1,-48,2,24);x.strokeStyle=hull;x.lineWidth=1;x.beginPath();x.moveTo(0,-46);x.lineTo(-30,-10);x.stroke();x.fillStyle='rgba(255,220,140,.9)';x.fillRect(-6,-20,4,3);x.fillRect(2,-20,4,3)}
else{x.beginPath();x.moveTo(-20,0);x.lineTo(22,0);x.lineTo(26,-6);x.lineTo(-22,-6);x.fill();x.beginPath();x.moveTo(0,-8);x.lineTo(0,-56);x.lineTo(18,-10);x.fill();x.beginPath();x.moveTo(-2,-50);x.lineTo(-16,-10);x.lineTo(-2,-10);x.fill()}
const blink=.6+.4*Math.sin(t*.004+s.x*20);x.fillStyle=`rgba(255,255,240,${blink})`;x.beginPath();x.arc(s.k==='liner'?-5:0,s.k==='liner'?-52:s.k==='yacht'?-58:-50,1.8,0,7);x.fill();x.fillStyle='#ff3a3a';x.beginPath();x.arc(-20,-8,1.6,0,7);x.fill();x.fillStyle='#3aff7a';x.beginPath();x.arc(20,-8,1.6,0,7);x.fill();x.restore()}
// ---------- frame ----------
function f(t){const dt=Math.min(60,t-lt);lt=t;wv+=(weather-wv)*.01;
if(aim===null)ang+=dt/20000*Math.PI*2;else{const d=Math.atan2(Math.sin(aim-ang),Math.cos(aim-ang));ang+=d*.08}
x.globalCompositeOperation='source-over';x.drawImage(sky,0,0);
const starA=Math.max(0,1-wv*.8);for(const [sx,sy,b] of stars){x.globalAlpha=b*.8*starA*(.6+.4*Math.sin(t*.002+sx));x.fillStyle='#fff';x.fillRect(sx,sy,dpr,dpr)}x.globalAlpha=1;
if(wv>.05){x.fillStyle=`rgba(60,72,96,${wv*.35})`;x.fillRect(0,0,W,HZ)}
// storm lightning
if(weather===2&&Math.random()<.004&&!bolt){bolt={x:Math.random()*W*.6,l:1,pts:[]};let X=bolt.x,Y=0;while(Y<HZ){X+=(Math.random()-.5)*60*dpr;Y+=(20+Math.random()*30)*dpr;bolt.pts.push([X,Y])}flash=1;thunder()}
// distant headland
x.fillStyle='#0a1426';x.beginPath();x.moveTo(0,HZ);for(let X=0;X<=W*.4;X+=W/80)x.lineTo(X,HZ-H*.03-Math.sin(X/W*9)*H*.012-Math.sin(X/W*31)*H*.004);x.lineTo(W*.4,HZ);x.fill();
// ships (lit when the beam sweeps over them)
const c1=Math.cos(ang),s1=Math.sin(ang);for(const s of ships){s.x+=s.v*dt;if(s.x>1.1)s.x=-.1;if(s.x<-.1)s.x=1.1;let lit=0;for(const side of [1,-1]){const cx=c1*side,sx2=(s.x*W-LX)/(W*.6);if(Math.sign(sx2)===Math.sign(cx)){const k=Math.abs(cx)-Math.min(1,Math.abs(sx2));lit=Math.max(lit,Math.max(0,1-Math.abs(Math.abs(cx)-Math.min(1,Math.abs(sx2)))*6))}}ship(s,t,lit*.8)}
// the beam: two opposite lamps, foreshortened by how much they face us
const fogA=.35+wv*.5;for(const side of [1,-1]){const dir=ang+(side<0?Math.PI:0),cx=Math.cos(dir),toward=Math.sin(dir);const L=Math.max(W,H)*1.3*(.12+Math.abs(cx)*.88),spread=.07+Math.max(0,toward)*.25;const ex=LX+Math.sign(cx||1)*L,br=toward>0?1:.4;
const b=bc.getContext('2d');b.globalCompositeOperation='source-over';b.clearRect(0,0,W,H);b.save();b.beginPath();b.moveTo(LX,LY);b.lineTo(ex,LY-L*spread*(1.1+toward*.3));b.lineTo(ex,LY+L*spread*(.7-toward*.2));b.closePath();b.clip();
b.fillStyle=`rgba(255,246,210,${.26*br})`;b.fillRect(0,0,W,H);const off=(t*.012)%512;b.globalAlpha=Math.min(1,fogA*br*1.1);for(let k=0;k<3;k++){const sc=(1+k*.7)*H/256,o=-(off*sc*(k+1)*.5)%(512*sc);for(let r=0;r<4;r++)b.drawImage(fog,o+r*512*sc,k*30*dpr,512*sc,256*sc)}b.globalAlpha=1;b.restore();
b.globalCompositeOperation='destination-in';const m=b.createLinearGradient(LX,LY,ex,LY);m.addColorStop(0,'rgba(0,0,0,1)');m.addColorStop(.6,'rgba(0,0,0,.45)');m.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=m;b.fillRect(0,0,W,H);
x.globalCompositeOperation='lighter';x.drawImage(bc,0,0);x.globalCompositeOperation='source-over'}
x.globalCompositeOperation='lighter';
// glare when a lamp faces the viewer
const face=Math.max(Math.pow(Math.max(0,s1),10),Math.pow(Math.max(0,-s1),10)*.0);const glare=Math.pow(Math.max(0,s1),12);const rg=x.createRadialGradient(LX,LY,0,LX,LY,(50+glare*420)*dpr);rg.addColorStop(0,'rgba(255,252,230,1)');rg.addColorStop(.2,`rgba(255,246,210,${.4+glare*.5})`);rg.addColorStop(1,'rgba(255,240,200,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);
if(glare>.05){x.fillStyle=`rgba(200,220,255,${glare*.5})`;x.fillRect(0,LY-1.5*dpr,W,3*dpr);const lg=x.createLinearGradient(0,LY,W,LY);x.fillStyle=`rgba(255,250,235,${glare*.25})`;x.fillRect(0,0,W,H)}
x.globalCompositeOperation='source-over';
// headland & lighthouse
x.fillStyle='#0b1220';x.beginPath();x.moveTo(LX-W*.36,HZ+4*dpr);x.quadraticCurveTo(LX-W*.06,HZ-H*.13,LX+W*.06,HZ-H*.11);x.quadraticCurveTo(LX+W*.2,HZ-H*.07,LX+W*.42,HZ+4*dpr);x.fill();
x.fillStyle='#141e30';x.fillRect(LX-W*.1,HZ-H*.125,W*.05,H*.03);x.beginPath();x.moveTo(LX-W*.105,HZ-H*.125);x.lineTo(LX-W*.075,HZ-H*.15);x.lineTo(LX-W*.045,HZ-H*.125);x.fill();x.fillStyle='rgba(255,210,120,.9)';x.fillRect(LX-W*.085,HZ-H*.115,W*.008,H*.012);
const tw=H*.035,base=HZ-H*.105,top=LY+H*.04;const tg=x.createLinearGradient(LX-tw*1.4,0,LX+tw*1.4,0);tg.addColorStop(0,'#9aa4b4');tg.addColorStop(.45,'#e8ecf2');tg.addColorStop(1,'#6a7484');x.fillStyle=tg;x.beginPath();x.moveTo(LX-tw*1.4,base);x.lineTo(LX-tw*.9,top);x.lineTo(LX+tw*.9,top);x.lineTo(LX+tw*1.4,base);x.fill();
x.fillStyle='#b3261e';for(const k of [.3,.65]){const y=top+(base-top)*k,w=tw*(.9+.5*k);x.fillRect(LX-w,y,w*2,H*.03)}x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.moveTo(LX+tw*.3,top);x.lineTo(LX+tw*.9,top);x.lineTo(LX+tw*1.4,base);x.lineTo(LX+tw*.5,base);x.fill();
x.fillStyle='rgba(255,220,140,.8)';x.fillRect(LX-tw*.12,top+(base-top)*.5,tw*.24,H*.012);
x.fillStyle='#1a1a1a';x.fillRect(LX-tw*1.25,LY+H*.03,tw*2.5,H*.012);x.strokeStyle='#1a1a1a';x.lineWidth=dpr;for(let k=-4;k<=4;k++){x.beginPath();x.moveTo(LX+k*tw*.3,LY+H*.03);x.lineTo(LX+k*tw*.3,LY+H*.012);x.stroke()}
x.fillStyle=`rgba(255,240,190,${.75+glare*.25})`;x.fillRect(LX-tw*.7,LY-H*.025,tw*1.4,H*.055);x.strokeStyle='rgba(60,50,30,.6)';for(let k=1;k<4;k++){x.beginPath();x.moveTo(LX-tw*.7+k*tw*.35,LY-H*.025);x.lineTo(LX-tw*.7+k*tw*.35,LY+H*.03);x.stroke()}
x.fillStyle='#1a1a1a';x.beginPath();x.moveTo(LX-tw*.95,LY-H*.025);x.lineTo(LX,LY-H*.065);x.lineTo(LX+tw*.95,LY-H*.025);x.fill();x.fillRect(LX-1*dpr,LY-H*.085,2*dpr,H*.02);
// sea
for(let k=0;k<6;k++){const sh=20+k*5;x.fillStyle=`rgb(${sh},${38+k*7},${64+k*9})`;x.beginPath();x.moveTo(0,H);for(let X=0;X<=W;X+=8*dpr)x.lineTo(X,seaY(X,k,t));x.lineTo(W,H);x.fill();
x.strokeStyle=`rgba(200,220,240,${.05+wv*.08})`;x.lineWidth=dpr;x.beginPath();for(let X=0;X<=W;X+=8*dpr){const y=seaY(X,k,t);X?x.lineTo(X,y):x.moveTo(X,y)}x.stroke()}
// reflection of the lamp and of the beams on the water
x.globalCompositeOperation='lighter';const refl=.08+glare*.5;for(let k=0;k<40;k++){const y=HZ+k*H*.008;if(y>H)break;const w=(20+k*12)*dpr*(.3+glare*1.2)*(1+Math.sin(t*.003+k)*.2);x.fillStyle=`rgba(255,246,210,${refl*(1-k/40)})`;x.fillRect(LX-w/2+Math.sin(t*.002+k*1.3)*10*dpr,y,w,(1.5+k*.05)*dpr)}
for(const side of [1,-1]){const cx=Math.cos(ang+(side<0?Math.PI:0));if(Math.abs(cx)<.2)continue;const X=LX+cx*W*.45;for(let k=0;k<10;k++){const y=HZ+k*H*.01;x.fillStyle=`rgba(255,246,210,${.06*Math.abs(cx)*(1-k/10)})`;x.fillRect(X-(40+k*10)*dpr,y,(80+k*20)*dpr,2*dpr)}}
x.globalCompositeOperation='source-over';
// gulls drift through
if(Math.random()<.003&&gulls.length<5)gulls.push({x:Math.random()<.5?-20:W+20,y:H*(.15+Math.random()*.3),v:(Math.random()<.5?1:-1)*(.6+Math.random())*dpr,p:Math.random()*6});
for(let i=gulls.length-1;i>=0;i--){const g=gulls[i];if(g.v>0&&g.x<0)g.v=Math.abs(g.v);g.x+=g.v;g.p+=.15;g.y+=Math.sin(g.p*.3)*.3*dpr;const near=Math.abs(g.y-LY)<H*.2?Math.max(0,1-Math.abs(Math.cos(ang)*W*.6-(g.x-LX))/(W*.25)):0;x.strokeStyle=near>.1?`rgba(255,250,230,${.5+near*.5})`:'rgba(10,16,30,.9)';x.lineWidth=1.6*dpr;const w=Math.sin(g.p)*5*dpr;x.beginPath();x.moveTo(g.x-9*dpr,g.y-w);x.quadraticCurveTo(g.x-4*dpr,g.y-3*dpr,g.x,g.y);x.quadraticCurveTo(g.x+4*dpr,g.y-3*dpr,g.x+9*dpr,g.y-w);x.stroke();if(g.x<-40||g.x>W+40)gulls.splice(i,1)}
// mist hanging on the water, rain for storms
if(wv>.05){const mg=x.createLinearGradient(0,HZ-H*.12,0,H);mg.addColorStop(0,'rgba(150,170,195,0)');mg.addColorStop(.3,`rgba(150,170,195,${wv*.18})`);mg.addColorStop(1,`rgba(150,170,195,${wv*.08})`);x.fillStyle=mg;x.fillRect(0,0,W,H)}
if(weather===2){for(let i=0;i<8;i++)rain.push([Math.random()*W*1.2,-10,(14+Math.random()*8)*dpr]);}x.strokeStyle='rgba(180,200,230,.35)';x.lineWidth=dpr;x.beginPath();rain=rain.filter(r=>{r[0]-=r[2]*.3;r[1]+=r[2];x.moveTo(r[0],r[1]);x.lineTo(r[0]+r[2]*.3,r[1]-r[2]*1.4);return r[1]<H});x.stroke();
if(bolt){x.strokeStyle=`rgba(230,240,255,${bolt.l})`;x.lineWidth=2.5*dpr;x.shadowColor='#bcd';x.shadowBlur=20*dpr;x.beginPath();x.moveTo(bolt.x,0);bolt.pts.forEach(([X,Y])=>x.lineTo(X,Y));x.stroke();x.shadowBlur=0;bolt.l-=.08;if(bolt.l<=0)bolt=null}
if(flash>.01){x.fillStyle=`rgba(200,215,240,${flash*.35})`;x.fillRect(0,0,W,H);flash*=.85}
requestAnimationFrame(f)}requestAnimationFrame(f);
setInterval(()=>{const vis=ships.filter(s=>s.x>0&&s.x<1).length;document.getElementById('log').innerHTML=`vessels in sight · ${vis}<br>${['visibility good','visibility moderate, mist','gale warning in force'][weather]}`},1000);
</script></body></html>
