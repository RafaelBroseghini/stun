<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lighthouse at Skerry Point</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#07101f}canvas{display:block;width:100%;height:100%}
.t{position:fixed;left:5vw;top:6vh;color:#e6edf5;font:500 clamp(22px,3vw,40px)/1.1 'Alegreya SC',serif;letter-spacing:.06em}.t small{display:block;font-size:13px;letter-spacing:.3em;opacity:.7;margin-top:8px}</style></head><body>
<canvas id="c"></canvas><div class="t">Skerry Point Light<small>Fl W 10s · 28 m · 18 NM</small></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H,stars;function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;stars=Array.from({length:260},()=>[Math.random()*W,Math.random()*H*.6,Math.random()])}size();addEventListener('resize',size);
function f(t){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050b18');g.addColorStop(.6,'#13264a');g.addColorStop(.7,'#1d3358');g.addColorStop(1,'#07101f');x.fillStyle=g;x.fillRect(0,0,W,H);
for(const [sx,sy,b] of stars){x.globalAlpha=b*.8*(.6+.4*Math.sin(t*.002+sx));x.fillStyle='#fff';x.fillRect(sx,sy,dpr,dpr)}x.globalAlpha=1;
const hz=H*.7,lx=W*.72,ly=H*.36;const a=(t/10000)*Math.PI*2;const facing=Math.cos(a);
x.globalCompositeOperation='lighter';for(const side of [1,-1]){const dir=a+(side<0?Math.PI:0);const len=Math.max(W,H)*1.4,spread=.09;const ex=Math.cos(dir)*Math.abs(Math.cos(dir)),k=Math.sin(dir);
const vis=Math.abs(Math.cos(dir));const L=len*(.25+vis*.75);const g2=x.createLinearGradient(lx,ly,lx+Math.sign(Math.cos(dir))*L,ly);const fr=Math.sin(dir)>0?1:.35;g2.addColorStop(0,`rgba(255,246,210,${.55*fr})`);g2.addColorStop(1,'rgba(255,246,210,0)');x.fillStyle=g2;
x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+Math.sign(Math.cos(dir))*L,ly-L*spread*(1+k*.3));x.lineTo(lx+Math.sign(Math.cos(dir))*L,ly+L*spread*(1-k*.3)*.8);x.closePath();x.fill()}
const glow=Math.pow(Math.max(0,Math.sin(a)),8);const rg=x.createRadialGradient(lx,ly,0,lx,ly,(60+glow*280)*dpr);rg.addColorStop(0,'rgba(255,250,220,.95)');rg.addColorStop(1,'rgba(255,250,220,0)');x.fillStyle=rg;x.fillRect(lx-400*dpr,ly-400*dpr,800*dpr,800*dpr);x.globalCompositeOperation='source-over';
x.fillStyle='#0b1220';x.beginPath();x.moveTo(lx-W*.35,hz);x.quadraticCurveTo(lx-W*.05,hz-H*.12,lx+W*.06,hz-H*.1);x.quadraticCurveTo(lx+W*.2,hz-H*.06,lx+W*.4,hz);x.fill();
const tw=H*.035;x.fillStyle='#e8ecf2';x.beginPath();x.moveTo(lx-tw*1.4,hz-H*.095);x.lineTo(lx-tw*.9,ly+H*.04);x.lineTo(lx+tw*.9,ly+H*.04);x.lineTo(lx+tw*1.4,hz-H*.095);x.fill();
x.fillStyle='#b3261e';for(const k of [.3,.65]){const y=ly+H*.04+(hz-H*.095-ly-H*.04)*k,w=tw*(.9+.5*k);x.fillRect(lx-w,y,w*2,H*.03)}
x.fillStyle='#1a1a1a';x.fillRect(lx-tw*1.2,ly+H*.03,tw*2.4,H*.012);x.fillStyle=`rgba(255,240,190,${.7+glow*.3})`;x.fillRect(lx-tw*.7,ly-H*.025,tw*1.4,H*.055);x.fillStyle='#1a1a1a';x.beginPath();x.moveTo(lx-tw*.9,ly-H*.025);x.lineTo(lx,ly-H*.06);x.lineTo(lx+tw*.9,ly-H*.025);x.fill();
for(let k=0;k<5;k++){x.fillStyle=`rgba(${20+k*6},${40+k*8},${70+k*10},1)`;x.beginPath();x.moveTo(0,H);for(let X=0;X<=W;X+=8*dpr){const y=hz+k*H*.06+Math.sin(X*.006/dpr+t*.0008*(k+1)+k)*6*dpr*(k+1)*.6;x.lineTo(X,y)}x.lineTo(W,H);x.fill()}
x.globalCompositeOperation='lighter';x.fillStyle=`rgba(255,246,210,${.06+glow*.25})`;for(let k=0;k<28;k++){const y=hz+k*H*.011;const w=(30+k*14)*dpr*(.3+glow);x.fillRect(lx-w/2+Math.sin(t*.002+k)*10*dpr,y,w,2*dpr)}x.globalCompositeOperation='source-over';requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
