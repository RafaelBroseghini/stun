<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbour Fireworks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#05060f}canvas{display:block;width:100%;height:100%;cursor:pointer}
.t{position:fixed;left:0;right:0;top:6vh;text-align:center;font:italic 700 clamp(26px,4vw,56px) 'Bodoni Moda',serif;color:#fff3e0;pointer-events:none}.t small{display:block;font:400 11px system-ui,sans-serif;letter-spacing:.4em;margin-top:10px;opacity:.6;font-style:normal}</style></head><body>
<canvas id="c"></canvas><div class="t">Midsummer over the Harbour<small>CLICK THE SKY TO LAUNCH</small></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H,hz,R=[],S=[],city=[];
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;hz=H*.74;city=[];let X=0;while(X<W){const w=(20+Math.random()*60)*dpr,h=(20+Math.random()*120)*dpr*(Math.abs(X-W/2)<W*.2?1.4:1);city.push([X,w,h,Array.from({length:12},()=>Math.random()<.4)]);X+=w}}size();addEventListener('resize',size);
function launch(tx,ty){const hue=Math.random()*360;R.push({x:W*(.2+Math.random()*.6),y:hz,tx,ty,hue,k:Math.random()*3|0})}
c.addEventListener('pointerdown',e=>launch(e.clientX*dpr,Math.min(e.clientY*dpr,hz*.8)));
function burst(r){const n=r.k===2?60:140;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(r.k===1?(i%2?3:6):Math.random()*6+1)*dpr;S.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:r.k===1&&i%2?r.hue+60:r.hue,d:.008+Math.random()*.01,g:r.k===2})}}
setInterval(()=>{if(Math.random()<.8)launch(W*(.15+Math.random()*.7),H*(.12+Math.random()*.35))},450);
function f(){x.globalCompositeOperation='source-over';x.fillStyle='rgba(5,6,15,.12)';x.fillRect(0,0,W,hz);x.globalCompositeOperation='lighter';
for(let i=R.length-1;i>=0;i--){const r=R[i];r.x+=(r.tx-r.x)*.04;r.y+=(r.ty-r.y)*.08;x.fillStyle=`hsl(${r.hue},100%,80%)`;x.fillRect(r.x,r.y,2*dpr,4*dpr);if(Math.abs(r.y-r.ty)<4*dpr){burst(r);R.splice(i,1)}}
for(let i=S.length-1;i>=0;i--){const p=S[i];p.vx*=.97;p.vy=p.vy*.97+.05*dpr;p.x+=p.vx;p.y+=p.vy;p.l-=p.d;if(p.l<=0||p.y>hz){S.splice(i,1);continue}x.fillStyle=`hsla(${p.h},100%,${62+p.l*30}%,${Math.min(1,p.l*1.4)})`;const s=(p.g?3.4:3)*dpr;x.fillRect(p.x,p.y,s,s);if(p.g&&Math.random()<.2){x.fillStyle=`hsla(45,100%,80%,${p.l})`;x.fillRect(p.x+(Math.random()-.5)*6,p.y+Math.random()*8,dpr,dpr)}}
x.globalCompositeOperation='source-over';for(const [X,w,h,lit] of city){x.fillStyle='#0a0b18';x.fillRect(X,hz-h,w,h);lit.forEach((o,k)=>{if(o){x.fillStyle='rgba(255,200,120,.7)';x.fillRect(X+4*dpr+(k%3)*w/3.4,hz-h+8*dpr+Math.floor(k/3)*h/5,3*dpr,4*dpr)}})}
x.save();x.translate(0,hz*2);x.scale(1,-1);x.globalAlpha=.45;x.drawImage(c,0,0,W,hz,0,0,W,hz);x.restore();x.globalAlpha=1;const g=x.createLinearGradient(0,hz,0,H);g.addColorStop(0,'rgba(5,6,15,.3)');g.addColorStop(1,'rgba(5,6,15,.95)');x.fillStyle=g;x.fillRect(0,hz,W,H-hz);
x.fillStyle='rgba(255,255,255,.06)';for(let i=0;i<30;i++)x.fillRect(Math.random()*W,hz+Math.random()*(H-hz),Math.random()*60*dpr,dpr);requestAnimationFrame(f)}
for(let i=0;i<5;i++){launch(W*(.15+i*.17),H*(.18+Math.random()*.25));R[R.length-1].y=H*(.25+Math.random()*.2)}f();
</script></body></html>
