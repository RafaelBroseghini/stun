<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier Okto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@300;600&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{min-height:100%}body{background:#d7d5d0;color:#161616;font-family:Geist,Helvetica,sans-serif;overflow-x:hidden}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 20px;padding-inline:max(16px,3vw)}.m{font:400 11px/1.6 'Geist Mono',monospace;letter-spacing:.04em;text-transform:uppercase}
header{border-bottom:1px solid #161616;padding-block:16px}header .m:nth-child(1){grid-column:1/4}header .m:nth-child(2){grid-column:4/8}header .m:nth-child(3){grid-column:8/13;text-align:right}
.hero{padding-block:6vh 4vh}.hero h1{grid-column:1/13;font-weight:300;font-size:clamp(60px,14vw,230px);line-height:.8;letter-spacing:-.06em}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.04em}.hero h1 .ln span{display:inline-block;animation:up 1.1s cubic-bezier(.2,.8,.2,1) backwards}.hero h1 .ln:nth-child(2) span{animation-delay:.12s}@keyframes up{from{transform:translateY(100%)}}
.hero h1 b{font-weight:600;background:linear-gradient(100deg,#ff4d00 30%,#ffb36b 48%,#ff4d00 66%);background-size:300% 100%;background-position:var(--lp,50%) 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.main{border-top:1px solid #161616}.list{grid-column:1/6;padding-block:16px}.view{grid-column:6/13;border-left:1px solid #161616;min-height:66vh;position:relative;cursor:grab;touch-action:pan-y;overflow:hidden}.view:active{cursor:grabbing}
.row{position:relative;display:grid;grid-template-columns:3em 1fr auto;gap:10px;padding:16px 0 16px 0;border-bottom:1px solid #16161633;cursor:pointer;align-items:baseline;transition:padding .4s cubic-bezier(.2,.8,.2,1)}
.row::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:0;background:#ff4d00;transition:width .6s cubic-bezier(.2,.8,.2,1)}.row.on::before{width:100%}.row.on{padding-left:14px}
.row h3{font-weight:600;font-size:clamp(18px,1.9vw,28px);letter-spacing:-.025em;transition:color .3s}.row.on h3{color:#ff4d00}.row:hover{background:#cfcdc7}
.row .ar{position:absolute;left:-4px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#ff4d00;transform:scale(0);transition:transform .4s cubic-bezier(.2,.9,.3,1.6)}.row.on .ar{transform:scale(1)}
svg#s{position:absolute;inset:5% 4% 16%;width:92%;height:79%;overflow:visible}svg#s *{vector-effect:non-scaling-stroke;stroke-linejoin:round}
.cap{position:absolute;left:20px;bottom:16px;right:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;pointer-events:none}
.sun{position:absolute;left:20px;right:20px;bottom:52px;display:flex;align-items:center;gap:14px;cursor:default}.sun input{flex:1;accent-color:#ff4d00}.sun button{font:400 11px 'Geist Mono';border:1px solid #161616;background:none;padding:5px 10px;cursor:pointer;letter-spacing:.06em}.sun button[aria-pressed=true]{background:#161616;color:#d7d5d0}
.hint{position:absolute;right:20px;top:16px;text-align:right;opacity:.6}
.desc{grid-column:1/6;padding-block:8px 40px;font-weight:300;font-size:16px;line-height:1.6;max-width:42ch;min-height:7em}
.desc p{animation:fi .7s backwards}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
footer{border-top:1px solid #161616;padding-block:16px}footer .m:nth-child(1){grid-column:1/7}footer .m:nth-child(2){grid-column:7/13;text-align:right}
@media(max-width:800px){.list,.view,.desc{grid-column:1/13}.view{border-left:0;border-top:1px solid #161616;min-height:62vh}header .m:nth-child(2){display:none}header .m:nth-child(3){grid-column:4/13}}</style></head><body>
<header class="g"><span class="m">Atelier Okto</span><span class="m">Architecture · Landscape · Research</span><span class="m" id="clk">Porto · Basel — est. 2011</span></header>
<section class="g hero"><h1><span class="ln"><span>Buildings</span></span><span class="ln"><span>for slow <b id="lt">light</b>.</span></span></h1></section>
<section class="g main"><div class="list" id="l"></div><div class="view" id="vw"><svg id="s" viewBox="-270 -235 540 390"></svg><div class="hint m">drag to orbit<br>↑ ↓ projects</div>
<div class="sun m"><span>SUN</span><input type="range" id="hr" min="6" max="20" step=".05" value="15"><span id="hl">15:00</span><button id="pl" aria-pressed="false">▶ DAY</button></div>
<div class="cap m"><span id="c1"></span><span id="c2"></span></div></div><div class="desc" id="ds"></div></section>
<footer class="g"><span class="m">© Atelier Okto 2026 · Rua do Sol 14, Porto</span><span class="m">Shadows computed for latitude 41°N</span></footer>
<script>
const P=[{n:'Casa Tramontana',y:'2024',t:'Residence',m:'Lamego, PT · 210 m² · rammed earth',d:'A long earth house set against the north wind. Its single courtyard is sized so winter sun reaches the kitchen floor at noon.',b:[[0,0,0,120,60,70],[-60,40,0,60,40,40]]},
{n:'Quiet Library',y:'2022',t:'Civic',m:'Aarau, CH · 1,840 m² · timber frame',d:'Three stacked reading rooms, each stepping back so the one below keeps a terrace of afternoon light.',b:[[0,0,0,180,90,40],[0,0,40,120,60,40],[0,0,80,60,30,40]]},
{n:'Salt Pavilion',y:'2021',t:'Cultural',m:'Aveiro, PT · 90 m² · lime + steel',d:'A low lime plinth and a lifted roof. Between them, a slot of horizon that turns copper an hour before sunset.',b:[[0,0,0,140,140,24],[-20,-20,24,100,100,60]]},
{n:'Tower for Swifts',y:'2019',t:'Ecology',m:'Ticino, CH · 14 m tall · brick',d:'Six hundred nesting cavities in a hollow brick shaft. Its shadow is the sundial for the village square.',b:[[0,0,0,40,40,170],[0,0,0,90,90,6]]},
{n:'Bath House Vila',y:'2018',t:'Wellness',m:'Gerês, PT · 640 m² · granite',d:'Granite pools under three volumes of different heights, tuned so steam is lit from the side all morning.',b:[[0,0,0,160,60,30],[60,30,0,60,110,50],[-60,-50,0,50,50,70]]}];
const s=document.getElementById('s'),NS='http://www.w3.org/2000/svg';let cur=1,az=0,vaz=0,hour=15,play=false,grow=[],dirty=true;
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
function sunVec(h){const t=(h-13)/7*Math.PI/2;const alt=Math.max(.06,Math.cos(t)*1.05),azs=-Math.PI*.75+t*1.25;return[Math.cos(alt)*Math.cos(azs),Math.cos(alt)*Math.sin(azs),Math.sin(alt),alt]}
const lerp=(a,b,t)=>a+(b-a)*t;
function hull(pts){pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];for(const p of pts){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}for(const p of pts.reverse()){while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}return lo.slice(0,-1).concat(up.slice(0,-1))}
function render(){const ca=Math.cos(az),sa=Math.sin(az);const R=(x,y)=>[x*ca-y*sa,x*sa+y*ca];const iso=(x,y,z)=>{const [a,b]=R(x,y);return[(a-b)*.866,(a+b)*.5-z]};
const [sx,sy,sz,alt]=sunVec(hour);const warm=Math.max(0,1-alt/.7);s.innerHTML='';
// ground + grid
const gnd=[[-165,-165],[165,-165],[165,165],[-165,165]].map(([x,y])=>iso(x,y,0).join(',')).join(' ');s.appendChild(el('polygon',{points:gnd,style:`fill:rgb(${lerp(226,236,warm)|0},${lerp(224,214,warm)|0},${lerp(219,196,warm)|0});stroke:none`}));
let d='';for(let k=-5;k<=5;k++){d+=`M${iso(k*30,-150,0)}L${iso(k*30,150,0)}M${iso(-150,k*30,0)}L${iso(150,k*30,0)}`}s.appendChild(el('path',{d,style:'fill:none;stroke:#161616;stroke-opacity:.1'}));
const p=P[cur],boxes=p.b.map((b,i)=>{const g=grow[i]||0;return[b[0],b[1],b[2]*g,b[3],b[4],b[5]*g,i]});
// shadows (union, so overlaps do not double)
const sg=el('g',{opacity:(.12+.16*Math.min(1,alt*2)).toFixed(3)});for(const [ox,oy,oz,w,dd,h] of boxes){if(h<.5)continue;const pts=[];for(const [a,b] of [[-w/2,-dd/2],[w/2,-dd/2],[w/2,dd/2],[-w/2,dd/2]])for(const z of [oz,oz+h]){const k=z/sz;pts.push([ox+a-sx*k,oy+b-sy*k])}
sg.appendChild(el('polygon',{points:hull(pts).map(([x,y])=>iso(x,y,0).join(',')).join(' '),style:'fill:#2a1e18;stroke:none'}))}s.appendChild(sg);
// boxes, far to near
boxes.sort((A,B)=>{const a=R(A[0],A[1]),b=R(B[0],B[1]);return(a[0]+a[1])-(b[0]+b[1])||A[2]-B[2]});
const shade=(n)=>{const l=Math.max(0,n[0]*sx+n[1]*sy+n[2]*sz);const v=.5+.5*l;return`rgb(${Math.min(255,lerp(150,250,v)+warm*18*l)|0},${Math.min(255,lerp(147,246,v)+warm*4*l)|0},${Math.min(255,lerp(140,238,v)-warm*22*l)|0})`};
const FC=[];const dep=(x,y,z)=>{const [a,b]=R(x,y);return a+b+z*1.25};
for(const [ox,oy,oz,w,dd,h,i] of boxes){if(h<.5)continue;const X0=ox-w/2,X1=ox+w/2,Y0=oy-dd/2,Y1=oy+dd/2,Z0=oz,Z1=oz+h;
const sides=[[[X1,Y0],[X1,Y1],[1,0]],[[X1,Y1],[X0,Y1],[0,1]],[[X0,Y1],[X0,Y0],[-1,0]],[[X0,Y0],[X1,Y0],[0,-1]]];
for(const [a,b,n] of sides){const rn=R(n[0],n[1]);if(rn[0]+rn[1]<=0)continue;const q=[iso(a[0],a[1],Z0),iso(b[0],b[1],Z0),iso(b[0],b[1],Z1),iso(a[0],a[1],Z1)];
const gF=el('g',{});gF.appendChild(el('polygon',{points:q.map(v=>v.join(',')).join(' '),style:`fill:${shade([n[0],n[1],0])};stroke:#161616;stroke-width:1.1`}));FC.push([dep((a[0]+b[0])/2,(a[1]+b[1])/2,(Z0+Z1)/2),gF]);
const L=Math.hypot(b[0]-a[0],b[1]-a[1]),nm=Math.max(2,Math.round(L/22));let md='';for(let k=1;k<nm;k++){const t=k/nm,x=lerp(a[0],b[0],t),y=lerp(a[1],b[1],t);md+=`M${iso(x,y,Z0+4)}L${iso(x,y,Z1-4)}`}if(h>20)gF.appendChild(el('path',{d:md,style:'fill:none;stroke:#161616;stroke-opacity:.3'}))}
const top=[[X0,Y0],[X1,Y0],[X1,Y1],[X0,Y1]].map(([x,y])=>iso(x,y,Z1).join(',')).join(' ');const last=i===p.b.length-1;FC.push([dep(ox,oy,Z1)-.01,el('polygon',{points:top,style:`fill:${shade([0,0,1])};stroke:${last?'#ff4d00':'#161616'};stroke-width:${last?2:1.1}`})])}
FC.sort((a,b)=>a[0]-b[0]).forEach(f=>s.appendChild(f[1]));
// north arrow + sun disc
const cx=-235,cy=-200;const nn=iso(0,-26,0),n0=iso(0,0,0);s.appendChild(el('g',{transform:`translate(${cx},${cy})`})).innerHTML=`<circle r="22" style="fill:none;stroke:#161616;stroke-opacity:.4"/><line x1="0" y1="0" x2="${(nn[0]-n0[0])*.8}" y2="${(nn[1]-n0[1])*.8}" style="stroke:#161616;stroke-width:1.4"/><text x="${(nn[0]-n0[0])*1.15}" y="${(nn[1]-n0[1])*1.15+3}" style="font:9px 'Geist Mono';text-anchor:middle;fill:#161616">N</text>`;
const sp=iso(sx*150,sy*150,0);const sv=[sp[0]*.9,sp[1]*.9-alt*110];s.appendChild(el('circle',{cx:sv[0],cy:sv[1],r:9,style:`fill:${warm>.5?'#ff7a2a':'#ffb36b'};stroke:none;opacity:.9`}));s.appendChild(el('line',{x1:sv[0],y1:sv[1],x2:sv[0],y2:sv[1]+alt*110,style:'stroke:#ff4d00;stroke-dasharray:2 3;stroke-opacity:.6'}));
const hh=Math.floor(hour),mm=Math.round((hour-hh)*60)%60;document.getElementById('hl').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
document.getElementById('c1').textContent=`Fig. ${cur+1} — axonometric · sun ${Math.round(alt*57.3)}° alt`;document.getElementById('c2').textContent=p.m;
document.getElementById('lt').style.setProperty('--lp',(hour-6)/14*100+'%')}
function show(i){if(i===cur&&grow.length)return;cur=(i+P.length)%P.length;grow=P[cur].b.map(()=>0);const t0=performance.now();P[cur].b.forEach((b,k)=>{const st=n=>{const t=Math.min(1,(n-t0-k*160)/900);if(t>0){const e=1-Math.pow(1-t,4);grow[k]=t<1?e+Math.sin(t*Math.PI)*.04:1;dirty=true}if(t<1)requestAnimationFrame(st)};requestAnimationFrame(st)});
document.querySelectorAll('.row').forEach((r,k)=>r.classList.toggle('on',k===cur));document.getElementById('ds').innerHTML=`<p>${P[cur].d}</p>`;dirty=true}
const l=document.getElementById('l');P.forEach((p,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<i class="ar"></i><span class="m">${String(i+1).padStart(2,'0')}</span><h3>${p.n}</h3><span class="m">${p.t} · ${p.y}</span>`;r.onmouseenter=r.onclick=()=>show(i);l.appendChild(r)});
cur=-1;show(1);
// orbit
const vw=document.getElementById('vw');let drag=null;vw.addEventListener('pointerdown',e=>{if(e.target.closest('.sun'))return;drag={x:e.clientX,a:az,t:performance.now()};vaz=0;vw.setPointerCapture(e.pointerId)});
vw.addEventListener('pointermove',e=>{if(!drag)return;const na=drag.a+(e.clientX-drag.x)*.008;vaz=na-az;az=na;dirty=true});vw.addEventListener('pointerup',()=>drag=null);vw.addEventListener('pointercancel',()=>drag=null);
vw.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){az+=e.deltaX*.004;dirty=true}},{passive:true});
const hr=document.getElementById('hr');hr.oninput=()=>{hour=+hr.value;dirty=true};
document.getElementById('pl').onclick=e=>{play=!play;e.target.setAttribute('aria-pressed',play);e.target.textContent=play?'■ DAY':'▶ DAY'};
addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();show(cur+1)}if(e.key==='ArrowUp'){e.preventDefault();show(cur-1)}if(e.key==='ArrowLeft'){az-=.2;dirty=true}if(e.key==='ArrowRight'){az+=.2;dirty=true}});
let idle=performance.now();function loop(t){if(!drag&&Math.abs(vaz)>.0004){az+=vaz;vaz*=.94;dirty=true}
if(play){hour+=.02;if(hour>20)hour=6;hr.value=hour;dirty=true}
if(dirty){render();dirty=false}requestAnimationFrame(loop)}requestAnimationFrame(loop);
setInterval(()=>{const d=new Date();document.getElementById('clk').textContent='Porto '+d.toLocaleTimeString('en-GB',{timeZone:'Europe/Lisbon',hour:'2-digit',minute:'2-digit'})+' · Basel — est. 2011'},1000);
</script></body></html>
