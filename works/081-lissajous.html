<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lissajous Scope</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#c9c3b6;display:grid;place-items:center;font-family:'B612 Mono',monospace;color:#2b2a27}
.dev{display:grid;grid-template-columns:auto 230px;gap:22px;background:linear-gradient(#5d6a72,#46525a);padding:24px;border-radius:12px;box-shadow:0 30px 60px rgba(0,0,0,.4),inset 0 1px 0 #8a99a3;max-width:96vw}
.scr{width:min(70vh,62vw);aspect-ratio:1.1;background:#08121a;border-radius:18px;border:10px solid #1b2329;position:relative;overflow:hidden;box-shadow:inset 0 0 40px #000}.scr canvas{width:100%;height:100%;display:block}
.scr::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(140,200,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(140,200,255,.12) 1px,transparent 1px);background-size:10% 12.5%;background-position:-1px -1px;pointer-events:none}
.pn{display:flex;flex-direction:column;gap:16px;color:#e8eef0;font-size:11px;letter-spacing:.12em}.pn h1{font-size:15px;letter-spacing:.2em}.pn label{display:grid;gap:6px}.pn input{accent-color:#f2b134}.pn b{color:#f2b134}
.pn button{padding:10px;border-radius:6px;border:0;background:#f2b134;color:#2b2a27;font:12px 'B612 Mono';letter-spacing:.15em;cursor:pointer}.pr{display:flex;flex-wrap:wrap;gap:6px}.pr button{flex:1;padding:6px;background:#2b3338;color:#e8eef0}
@media(max-width:760px){.dev{grid-template-columns:1fr}.scr{width:86vw}}</style></head><body>
<div class="dev"><div class="scr"><canvas id="c"></canvas></div><div class="pn"><h1>XY MODE · CH1/CH2</h1>
<label>CH1 FREQ <b id="va">3</b><input id="a" type="range" min="1" max="9" value="3"></label><label>CH2 FREQ <b id="vb">2</b><input id="b" type="range" min="1" max="9" value="2"></label><label>PHASE DRIFT <b id="vp">0.20</b><input id="p" type="range" min="0" max="100" value="20"></label>
<div class="pr" id="pr"></div><button id="snd">▶ LISTEN (L/R)</button><div style="opacity:.7;line-height:1.6">Each channel drives one deflection axis. Integer ratios close the curve.</div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,ph=0;function size(){W=c.width=c.clientWidth*2;H=c.height=c.clientHeight*2}size();addEventListener('resize',size);
const v=id=>+document.getElementById(id).value;['a','b','p'].forEach(id=>document.getElementById(id).oninput=()=>{document.getElementById('v'+id).textContent=id==='p'?(v('p')/100).toFixed(2):v(id);upd()});
[[1,1],[1,2],[3,2],[5,4],[3,4],[7,6]].forEach(([a,b])=>{const e=document.createElement('button');e.textContent=a+':'+b;e.onclick=()=>{document.getElementById('a').value=a;document.getElementById('b').value=b;document.getElementById('va').textContent=a;document.getElementById('vb').textContent=b;upd()};document.getElementById('pr').appendChild(e)});
let A=null,oL,oR;function upd(){if(!A)return;oL.frequency.value=110*v('a');oR.frequency.value=110*v('b')+v('p')/100}
document.getElementById('snd').onclick=e=>{if(A){A.close();A=null;e.target.textContent='▶ LISTEN (L/R)';return}A=new AudioContext();const m=A.createChannelMerger(2),g=A.createGain();g.gain.value=.08;oL=A.createOscillator();oR=A.createOscillator();oL.connect(m,0,0);oR.connect(m,0,1);m.connect(g);g.connect(A.destination);oL.start();oR.start();upd();e.target.textContent='■ STOP'};
function f(){ph+=v('p')/100*.03;x.fillStyle='rgba(8,18,26,.22)';x.fillRect(0,0,W,H);const a=v('a'),b=v('b');x.lineWidth=3;x.strokeStyle='rgba(170,230,255,.9)';x.shadowColor='#7fd4ff';x.shadowBlur=18;x.beginPath();
for(let i=0;i<=2000;i++){const t=i/2000*Math.PI*2;const X=W/2+Math.sin(a*t+ph)*W*.4,Y=H/2+Math.sin(b*t)*H*.4;i?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke();x.shadowBlur=0;requestAnimationFrame(f)}f();
</script></body></html>
