<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanami</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@400&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#cfe6f2;user-select:none;-webkit-user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}#c{cursor:pointer;touch-action:none}
.t{position:fixed;left:7vw;bottom:14vh;font:700 clamp(54px,10vw,150px)/1 'Kaisei Decol',serif;color:#fff;text-shadow:0 4px 30px rgba(214,90,130,.5);z-index:2;pointer-events:none;transition:color 1.2s,text-shadow 1.2s}
.t span{display:inline-block;animation:in 1.6s cubic-bezier(.2,.8,.2,1) both}.t span+span{animation-delay:.2s}@keyframes in{from{opacity:0;transform:translateY(30px) rotate(-6deg)}}
.t small{display:block;font:400 .12em 'Zen Kaku Gothic New',sans-serif;letter-spacing:.6em;color:#a8486a;text-shadow:none;margin-top:1em}
body.night .t{color:#ffe6ef;text-shadow:0 0 40px rgba(255,120,170,.6)}body.night .t small{color:#ffb3cc}
.tg{position:fixed;right:5vw;top:5vh;z-index:3;font:400 12px 'Zen Kaku Gothic New';letter-spacing:.3em;color:#a8486a;background:rgba(255,255,255,.5);border:1px solid rgba(168,72,106,.3);padding:9px 14px;border-radius:99px;cursor:pointer;backdrop-filter:blur(6px)}
body.night .tg{color:#ffe6ef;background:rgba(40,20,50,.5);border-color:rgba(255,200,220,.3)}
.k{position:fixed;left:7vw;bottom:5vh;z-index:2;font:400 11px 'Zen Kaku Gothic New';letter-spacing:.24em;color:#a8486a;opacity:.75;pointer-events:none}body.night .k{color:#ffb3cc}
</style></head><body>
<canvas id="b"></canvas><canvas id="c"></canvas><div class="t"><span>花</span><span>見</span><small>HANAMI · 4 APRIL · KYOTO</small></div>
<button class="tg" id="tg">夜桜 · night</button><div class="k">Sweep the cursor to blow the petals · click to shake the branches</div>
<script>
const b=document.getElementById('b'),bx=b.getContext('2d'),c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);let W,H,P=[],wind=0,tw=0,night=false,shake=0,river=[],ripples=[],lanterns=[],branchC;
function branch(g,px,py,len,ang,w,d,blooms){const nx=px+Math.cos(ang)*len,ny=py+Math.sin(ang)*len;g.strokeStyle=night?'#1a0e18':'#3b2228';g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(px,py);g.quadraticCurveTo(px+Math.cos(ang+.3)*len*.5,py+Math.sin(ang+.3)*len*.5,nx,ny);g.stroke();
if(d>6||w<1){for(let i=0;i<8;i++){const r=(3+Math.random()*6)*dpr,a=Math.random()*7,dd=Math.random()*18*dpr;g.fillStyle=`hsla(${340+Math.random()*15},${70+Math.random()*20}%,${night?70+Math.random()*12:82+Math.random()*12}%,.92)`;g.beginPath();g.arc(nx+Math.cos(a)*dd,ny+Math.sin(a)*dd,r,0,7);g.fill();blooms.push([nx+Math.cos(a)*dd,ny+Math.sin(a)*dd])}return}
const n=d<2?3:2;for(let i=0;i<n;i++)branch(g,nx,ny,len*(.68+Math.random()*.2),ang+(Math.random()-.5)*1.2,w*.68,d+1,blooms)}
let blooms=[];function paint(){W=b.width=c.width=innerWidth*dpr;H=b.height=c.height=innerHeight*dpr;const g=bx.createLinearGradient(0,0,0,H);if(night){g.addColorStop(0,'#120a24');g.addColorStop(.7,'#2a1a40');g.addColorStop(1,'#3a1f3a')}else{g.addColorStop(0,'#cfe6f2');g.addColorStop(1,'#fbe4ec')}bx.fillStyle=g;bx.fillRect(0,0,W,H);
bx.fillStyle=night?'rgba(255,245,220,.9)':'rgba(255,255,255,.5)';bx.beginPath();bx.arc(W*.2,H*.25,Math.min(W,H)*(night?.06:.12),0,7);bx.fill();
// far hills and a pagoda
bx.fillStyle=night?'#1e1430':'#b9c8dc';bx.beginPath();bx.moveTo(0,H*.8);for(let X=0;X<=W;X+=20)bx.lineTo(X,H*.74-Math.sin(X/W*5)*H*.04-Math.sin(X/W*13)*H*.01);bx.lineTo(W,H);bx.lineTo(0,H);bx.fill();
const px=W*.42,py=H*.74;bx.fillStyle=night?'#140c22':'#8fa0ba';for(let i=0;i<4;i++){const w2=(40-i*7)*dpr,yy=py-i*22*dpr;bx.fillRect(px-w2*.35,yy-16*dpr,w2*.7,16*dpr);bx.beginPath();bx.moveTo(px-w2,yy-16*dpr);bx.quadraticCurveTo(px,yy-26*dpr,px+w2,yy-16*dpr);bx.lineTo(px+w2*.6,yy-20*dpr);bx.quadraticCurveTo(px,yy-28*dpr,px-w2*.6,yy-20*dpr);bx.fill()}bx.fillRect(px-1*dpr,py-110*dpr,2*dpr,22*dpr);
blooms=[];branch(bx,W*1.02,H*.08,Math.min(W,H)*.22,Math.PI*.92,22*dpr,0,blooms);branch(bx,W*1.02,H*.45,Math.min(W,H)*.18,Math.PI*1.08,14*dpr,1,blooms);
lanterns=Array.from({length:6},(_,i)=>{const bl=blooms[Math.floor((i+.5)/6*blooms.length)]||[W*.7,H*.3];return{x:bl[0],y:bl[1]+20*dpr,p:Math.random()*6}})}
paint();addEventListener('resize',paint);
document.getElementById('tg').onclick=e=>{e.stopPropagation();night=!night;document.body.classList.toggle('night',night);document.getElementById('tg').textContent=night?'昼 · day':'夜桜 · night';paint();chime(night?0:4)};
let lx=null,mx=-1,my=-1,mvx=0;
c.addEventListener('pointermove',e=>{const X=e.clientX*dpr,Y=e.clientY*dpr;if(lx!==null){mvx=X-lx[0];tw=Math.max(-4,Math.min(4,tw+mvx*.003));for(const p of P){const d=Math.hypot(p.x-X,p.y-Y);if(d<90*dpr){const k=(1-d/(90*dpr));p.x+=(X-lx[0])*k*.6;p.y+=(Y-lx[1])*k*.6;p.vr+=k*.05}}}lx=[X,Y];mx=X;my=Y});
c.addEventListener('pointerdown',()=>{shake=1;for(let i=0;i<60;i++){const bl=blooms[Math.random()*blooms.length|0];if(bl)P.push(np(false,bl[0],bl[1]))}chime(Math.random()*5|0)});
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();c.dispatchEvent(new PointerEvent('pointerdown'))}if(e.key==='n')document.getElementById('tg').click()});
let ac;function chime(k){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const sc=[0,2,5,7,9,12,14];[0,2,4].forEach((o,i)=>{const n=sc[(k+o)%7],t=ac.currentTime+i*.12;const os=ac.createOscillator(),g=ac.createGain();os.type='triangle';os.frequency.value=660*Math.pow(2,n/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+1.8);os.connect(g).connect(ac.destination);os.start(t);os.stop(t+1.9)})}catch(e){}}
for(let i=0;i<170;i++)P.push(np(true));function np(any,px,py){return{x:px??Math.random()*innerWidth*dpr*1.2,y:py??(any?Math.random()*innerHeight*dpr:-20),s:(4+Math.random()*6)*dpr,r:Math.random()*7,vr:(Math.random()-.5)*.06,ph:Math.random()*7,v:.5+Math.random()}}
function petal(p,t,a=1){x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(Math.sin(t*.003+p.ph),1);x.globalAlpha=a;x.fillStyle=night?'#ffc4d8':'#f7b8cc';if(night){x.shadowColor='rgba(255,150,190,.8)';x.shadowBlur=6*dpr}x.beginPath();x.moveTo(0,-p.s);x.bezierCurveTo(p.s*.9,-p.s*.6,p.s*.6,p.s*.7,0,p.s);x.bezierCurveTo(-p.s*.6,p.s*.7,-p.s*.9,-p.s*.6,0,-p.s);x.fill();x.shadowBlur=0;x.fillStyle='rgba(214,90,130,.35)';x.beginPath();x.ellipse(0,p.s*.5,p.s*.2,p.s*.4,0,0,7);x.fill();x.restore();x.globalAlpha=1}
function f(t){wind+=(tw-wind)*.02;tw*=.99;shake*=.94;x.clearRect(0,0,W,H);const ry=H*.86;
// river
const rg=x.createLinearGradient(0,ry,0,H);rg.addColorStop(0,night?'rgba(40,24,60,.95)':'rgba(170,205,225,.95)');rg.addColorStop(1,night?'rgba(20,12,34,1)':'rgba(140,180,210,1)');x.fillStyle=rg;x.fillRect(0,ry,W,H-ry);
x.strokeStyle=night?'rgba(255,200,220,.15)':'rgba(255,255,255,.35)';x.lineWidth=dpr;x.beginPath();for(let i=0;i<14;i++){const yy=ry+(i/14)*(H-ry);const xx=((i*137+t*.03*(1+i*.1))%(W+200))-100;x.moveTo(xx,yy);x.lineTo(xx+40*dpr,yy)}x.stroke();
for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.a-=.015;r.r+=.6*dpr;if(r.a<=0){ripples.splice(i,1);continue}x.strokeStyle=`rgba(255,255,255,${r.a*.5})`;x.beginPath();x.ellipse(r.x,r.y,r.r,r.r*.3,0,0,7);x.stroke()}
for(let i=river.length-1;i>=0;i--){const p=river[i];p.x+=(.6+wind*.3)*dpr;p.y+=Math.sin(t*.002+p.ph)*.1*dpr;p.r+=.004;if(p.x>W+30){river.splice(i,1);continue}petal(p,t,.85)}if(river.length>140)river.shift();
// lanterns at night
if(night)lanterns.forEach(L=>{const sw=Math.sin(t*.002+L.p)*4*dpr+wind*3*dpr;const X=L.x+sw,Y=L.y;const g=x.createRadialGradient(X,Y,0,X,Y,70*dpr);g.addColorStop(0,'rgba(255,170,90,.5)');g.addColorStop(1,'rgba(255,170,90,0)');x.fillStyle=g;x.fillRect(X-70*dpr,Y-70*dpr,140*dpr,140*dpr);x.strokeStyle='#1a0e18';x.lineWidth=dpr;x.beginPath();x.moveTo(L.x,Y-30*dpr);x.lineTo(X,Y-12*dpr);x.stroke();x.fillStyle='#ff9a4a';x.beginPath();x.ellipse(X,Y,9*dpr,13*dpr,0,0,7);x.fill();x.fillStyle='#3a1a1a';x.fillRect(X-7*dpr,Y-14*dpr,14*dpr,3*dpr);x.fillRect(X-7*dpr,Y+11*dpr,14*dpr,3*dpr)});
for(const p of P){p.y+=p.v*dpr*(1+shake);p.x+=(Math.sin(t*.001+p.ph)*.6-.6+wind)*dpr;p.r+=p.vr;p.vr*=.99;p.vr+=(Math.random()-.5)*.002;
if(p.y>ry+Math.random()*(H-ry)*.4&&p.y<H){ripples.push({x:p.x,y:p.y,r:2*dpr,a:1});river.push({...p});Object.assign(p,np(false));continue}if(p.x<-30||p.x>W+60)Object.assign(p,np(false));petal(p,t)}
if(P.length>260)P.splice(0,P.length-260);
requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
