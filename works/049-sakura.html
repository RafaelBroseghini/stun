<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanami</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#cfe6f2}canvas{position:fixed;inset:0;width:100%;height:100%}
.t{position:fixed;left:7vw;bottom:9vh;font:700 clamp(54px,10vw,150px)/1 'Kaisei Decol',serif;color:#fff;text-shadow:0 4px 30px rgba(214,90,130,.5);z-index:2}.t small{display:block;font-size:.14em;letter-spacing:.6em;color:#a8486a;text-shadow:none;margin-top:.6em}</style></head><body>
<canvas id="b"></canvas><canvas id="c"></canvas><div class="t">花見<small>HANAMI · 4 APRIL · KYOTO</small></div>
<script>
const b=document.getElementById('b'),bx=b.getContext('2d'),c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H,P=[],wind=0,tw=0;
function branch(px,py,len,ang,w,d){const nx=px+Math.cos(ang)*len,ny=py+Math.sin(ang)*len;bx.strokeStyle='#3b2228';bx.lineWidth=w;bx.lineCap='round';bx.beginPath();bx.moveTo(px,py);bx.quadraticCurveTo(px+Math.cos(ang+.3)*len*.5,py+Math.sin(ang+.3)*len*.5,nx,ny);bx.stroke();
if(d>6||w<1){for(let i=0;i<8;i++){const r=(3+Math.random()*6)*dpr,a=Math.random()*7,dd=Math.random()*18*dpr;bx.fillStyle=`hsla(${340+Math.random()*15},${70+Math.random()*20}%,${82+Math.random()*12}%,.9)`;bx.beginPath();bx.arc(nx+Math.cos(a)*dd,ny+Math.sin(a)*dd,r,0,7);bx.fill()}return}
const n=d<2?3:2;for(let i=0;i<n;i++)branch(nx,ny,len*(.68+Math.random()*.2),ang+(Math.random()-.5)*1.2,w*.68,d+1)}
function size(){W=b.width=c.width=innerWidth*dpr;H=b.height=c.height=innerHeight*dpr;const g=bx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#cfe6f2');g.addColorStop(1,'#fbe4ec');bx.fillStyle=g;bx.fillRect(0,0,W,H);
bx.fillStyle='rgba(255,255,255,.5)';bx.beginPath();bx.arc(W*.2,H*.25,Math.min(W,H)*.12,0,7);bx.fill();branch(W*1.02,H*.08,Math.min(W,H)*.22,Math.PI*.92,22*dpr,0);branch(W*1.02,H*.45,Math.min(W,H)*.18,Math.PI*1.08,14*dpr,1)}
size();addEventListener('resize',size);addEventListener('pointermove',e=>tw=(e.clientX/innerWidth-.5)*3);
for(let i=0;i<160;i++)P.push(np(true));function np(any){return{x:Math.random()*innerWidth*dpr*1.2,y:any?Math.random()*innerHeight*dpr:-20,s:(4+Math.random()*6)*dpr,r:Math.random()*7,vr:(Math.random()-.5)*.06,ph:Math.random()*7,v:.5+Math.random()}}
function f(t){wind+=(tw-wind)*.02;x.clearRect(0,0,W,H);for(const p of P){p.y+=p.v*dpr;p.x+=(Math.sin(t*.001+p.ph)*.6-.6+wind)*dpr;p.r+=p.vr;if(p.y>H+20||p.x<-30)Object.assign(p,np(false));
x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(Math.sin(t*.003+p.ph),1);x.fillStyle='#f7b8cc';x.beginPath();x.moveTo(0,-p.s);x.bezierCurveTo(p.s*.9,-p.s*.6,p.s*.6,p.s*.7,0,p.s);x.bezierCurveTo(-p.s*.6,p.s*.7,-p.s*.9,-p.s*.6,0,-p.s);x.fill();x.fillStyle='rgba(214,90,130,.35)';x.beginPath();x.ellipse(0,p.s*.5,p.s*.2,p.s*.4,0,0,7);x.fill();x.restore()}requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
