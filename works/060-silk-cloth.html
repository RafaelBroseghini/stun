<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tearable Silk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@700&family=Karla&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#1a1416;touch-action:none}canvas{display:block;width:100%;height:100%;cursor:grab}
.t{position:fixed;left:24px;bottom:22px;color:#e9d8c4;font:13px Karla,sans-serif;letter-spacing:.06em}.t b{display:block;font:700 26px 'Playfair Display SC',serif;letter-spacing:.06em;margin-bottom:4px}</style></head><body>
<canvas id="c"></canvas><div class="t"><b>Tearable Silk</b>Drag to pull the fabric · hold Shift (or right-drag) to cut · double-click to rehang</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H,P,S,cols=42,rows=26,sp;let m={x:0,y:0,px:0,py:0,dn:false,cut:false};
function build(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;sp=Math.min(W*.7/cols,H*.65/rows);const ox=(W-sp*(cols-1))/2,oy=H*.1;P=[];S=[];
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){P.push({x:ox+i*sp,y:oy+j*sp,px:ox+i*sp,py:oy+j*sp,pin:j===0&&i%4===0});if(i)S.push([P.length-2,P.length-1,sp]);if(j)S.push([P.length-1-cols,P.length-1,sp])}}
build();addEventListener('resize',build);c.addEventListener('dblclick',build);c.addEventListener('contextmenu',e=>e.preventDefault());
c.addEventListener('pointerdown',e=>{m.dn=true;m.cut=e.shiftKey||e.button===2;m.x=m.px=e.clientX*dpr;m.y=m.py=e.clientY*dpr});addEventListener('pointerup',()=>m.dn=false);
c.addEventListener('pointermove',e=>{m.px=m.x;m.py=m.y;m.x=e.clientX*dpr;m.y=e.clientY*dpr});
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-ax-dx*t,py-ay-dy*t)}
function f(t){const wind=Math.sin(t*.0007)*.15+Math.sin(t*.0019)*.08;
for(const p of P){if(p.pin)continue;const vx=(p.x-p.px)*.99,vy=(p.y-p.py)*.99;p.px=p.x;p.py=p.y;p.x+=vx+wind*dpr;p.y+=vy+.35*dpr;
if(m.dn&&!m.cut){const d=Math.hypot(p.x-m.x,p.y-m.y);if(d<50*dpr){p.px=p.x-(m.x-m.px)*.9;p.py=p.y-(m.y-m.py)*.9}}if(p.y>H){p.y=H;p.py=H}}
for(let k=0;k<4;k++)for(let i=S.length-1;i>=0;i--){const s=S[i],a=P[s[0]],b=P[s[1]];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;if(d>s[2]*4.5){S.splice(i,1);continue}const df=(d-s[2])/d*.5;if(!a.pin){a.x+=dx*df;a.y+=dy*df}if(!b.pin){b.x-=dx*df;b.y-=dy*df}}
if(m.dn&&m.cut)for(let i=S.length-1;i>=0;i--){const a=P[S[i][0]],b=P[S[i][1]];if(segD((a.x+b.x)/2,(a.y+b.y)/2,m.px,m.py,m.x,m.y)<8*dpr)S.splice(i,1)}
x.fillStyle='#1a1416';x.fillRect(0,0,W,H);x.lineWidth=1.3*dpr;
for(const s of S){const a=P[s[0]],b=P[s[1]];const j=Math.floor(s[1]/cols),i=s[1]%cols;const stretch=Math.hypot(b.x-a.x,b.y-a.y)/s[2];const band=Math.floor(i/6)%2^Math.floor(j/6)%2;const hue=band?348:38;const light=Math.max(25,Math.min(80,(band?52:62)-(stretch-1)*60+(b.x-a.x)/s[2]*6));x.strokeStyle=`hsl(${hue},${band?62:70}%,${light}%)`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
x.fillStyle='#e9d8c4';for(const p of P)if(p.pin){x.beginPath();x.arc(p.x,p.y,4*dpr,0,7);x.fill()}x.strokeStyle='#6b5b4a';x.lineWidth=4*dpr;x.beginPath();x.moveTo(P[0].x-20*dpr,P[0].y);x.lineTo(P[cols-1].x+20*dpr,P[0].y);x.stroke();requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
