<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snow Globe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Cormorant+Garamond:ital@1&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(circle at 50% 38%,#4a2a57,#1a0f24 60%,#0c0610);display:grid;place-items:center;font-family:'Mountains of Christmas',cursive;color:#ffe9c9}
body::before{content:"";position:fixed;left:50%;top:50%;width:90vmin;height:90vmin;transform:translate(-50%,-56%);background:radial-gradient(circle,rgba(255,200,140,.16),transparent 60%);pointer-events:none}
.g{position:relative;width:min(68vmin,540px);aspect-ratio:1/1.16;touch-action:none}
.sph{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;cursor:grab;transform-origin:50% 120%}.sph:active{cursor:grabbing}
canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.gl{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.6),rgba(255,255,255,0) 14%),radial-gradient(ellipse 18% 9% at 68% 18%,rgba(255,255,255,.22),transparent),radial-gradient(circle at 50% 50%,transparent 62%,rgba(180,200,255,.18) 70%,rgba(255,255,255,.35) 72%,transparent 73%);box-shadow:inset 0 0 40px rgba(255,255,255,.35),inset -14px -26px 50px rgba(120,160,255,.18),inset 16px 10px 30px rgba(255,220,190,.12),0 0 80px rgba(255,200,150,.18)}
.gl::after{content:"";position:absolute;left:18%;top:12%;width:22%;height:30%;border-radius:40%;border:2px solid rgba(255,255,255,.18);border-right:0;border-bottom:0;transform:rotate(-10deg)}
.base{position:absolute;left:6%;right:6%;bottom:0;height:23%;cursor:pointer;z-index:2}
.base .w{position:absolute;inset:0;background:linear-gradient(90deg,#3a140c,#7a3220 18%,#b5562e 42%,#d8784a 50%,#8a3a22 70%,#3a140c);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);border-radius:0 0 14px 14px;box-shadow:inset 0 6px 10px rgba(0,0,0,.4)}
.base .w::before{content:"";position:absolute;left:0;right:0;top:0;height:14%;background:linear-gradient(90deg,#6a4a1c,#f6dc9a 45%,#c9a15a 60%,#6a4a1c)}
.base .w::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px)}
.plate{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);padding:.2em 1em;background:linear-gradient(#f6dc9a,#b8893a);border-radius:4px;box-shadow:0 2px 0 #5a3a10,inset 0 1px 0 #fff6d6;font-size:clamp(14px,2.4vw,24px);color:#4a2a08;white-space:nowrap}
.key{position:absolute;right:-5%;top:36%;width:11%;aspect-ratio:1;transform-origin:15% 50%}.key i{position:absolute;inset:0;border:5px solid #c9a15a;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;box-shadow:0 2px 4px rgba(0,0,0,.5)}.key::before{content:"";position:absolute;left:-40%;top:42%;width:50%;height:16%;background:#c9a15a}
.shadow{position:absolute;left:4%;right:4%;bottom:-3%;height:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(4px);z-index:-1}
.h{position:fixed;bottom:3.5vh;left:0;right:0;text-align:center;font:italic 16px 'Cormorant Garamond',serif;letter-spacing:.14em;opacity:.75}</style></head><body>
<div class="g" id="g"><div class="shadow"></div><div class="base" id="base"><div class="w"></div><div class="plate">Vinterby · 1927</div><div class="key" id="key"><i></i></div></div>
<div class="sph" id="sph"><canvas id="c"></canvas><div class="gl"></div></div></div>
<div class="h">grab the globe and shake it · wind the key for music</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),sph=document.getElementById('sph');let S,dpr,scene,P=[];
const R=(a,b)=>a+Math.random()*(b-a);
const ground=u=>.79+Math.cos((u-.5)*3.2)*-.035+Math.sin(u*14)*.006;
// ---------- static scene ----------
const houses=[[.24,.775,.11,.085,'#a8323e'],[.4,.755,.13,.15,'#2d5d8a'],[.58,.765,.1,.1,'#c98a2e'],[.72,.78,.09,.075,'#5a8a4a']];
const trees=[[.16,.79,.09],[.33,.78,.06],[.5,.79,.05],[.84,.79,.11],[.67,.795,.05],[.9,.81,.06],[.1,.81,.06]];
function build(){dpr=Math.min(devicePixelRatio||1,2);S=c.width=c.height=Math.round(c.clientWidth*dpr);scene=document.createElement('canvas');scene.width=scene.height=S;const g=scene.getContext('2d');
const sk=g.createLinearGradient(0,0,0,S);sk.addColorStop(0,'#0f1a40');sk.addColorStop(.55,'#3a4f94');sk.addColorStop(.8,'#8a8fc8');g.fillStyle=sk;g.fillRect(0,0,S,S);
for(let i=0;i<120;i++){g.fillStyle=`rgba(255,255,240,${R(.2,.9)})`;g.beginPath();g.arc(Math.random()*S,Math.random()*S*.55,R(.4,1.3)*dpr,0,7);g.fill()}
const mg=g.createRadialGradient(S*.72,S*.22,0,S*.72,S*.22,S*.2);mg.addColorStop(0,'rgba(255,248,220,.5)');mg.addColorStop(1,'rgba(255,248,220,0)');g.fillStyle=mg;g.fillRect(0,0,S,S);g.fillStyle='#fff6dc';g.beginPath();g.arc(S*.72,S*.22,S*.045,0,7);g.fill();g.fillStyle='rgba(200,190,170,.35)';g.beginPath();g.arc(S*.73,S*.215,S*.01,0,7);g.arc(S*.705,S*.235,S*.007,0,7);g.fill();
// distant hills
for(const [y,col,a] of [[.6,'#5a6aa8',.9],[.66,'#7a86c0',.95]]){g.fillStyle=col;g.globalAlpha=a;g.beginPath();g.moveTo(0,S);for(let u=0;u<=1;u+=.02)g.lineTo(u*S,S*(y+Math.sin(u*9+y*20)*.03+Math.sin(u*23)*.008));g.lineTo(S,S);g.fill()}g.globalAlpha=1;
for(let i=0;i<14;i++)tree(g,R(.05,.95)*S,S*(.64+R(0,.04)),S*R(.03,.05),'#2a4a6a');
// snowfield
const sf=g.createLinearGradient(0,S*.74,0,S);sf.addColorStop(0,'#f4f6ff');sf.addColorStop(1,'#b8c0e8');g.fillStyle=sf;g.beginPath();g.moveTo(0,S);for(let u=0;u<=1.001;u+=.01)g.lineTo(u*S,ground(u)*S);g.lineTo(S,S);g.fill();
for(const [u,v,w,h,col] of houses)house(g,u*S,v*S,w*S,h*S,col);for(const [u,v,s] of trees)tree(g,u*S,v*S,s*S,'#1f5a3a',1);
// track
g.strokeStyle='rgba(90,60,40,.6)';g.lineWidth=2*dpr;g.beginPath();g.ellipse(S*.5,S*.86,S*.3,S*.04,0,0,7);g.stroke()}
function house(g,X,Y,w,h,col){g.fillStyle=col;g.fillRect(X,Y-h,w,h);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(X+w*.7,Y-h,w*.3,h);g.fillStyle='#4a2a1a';g.fillRect(X+w*.65,Y-h-w*.5,w*.12,w*.3);
g.fillStyle='#f4f4ff';g.beginPath();g.moveTo(X-w*.14,Y-h+2);g.lineTo(X+w/2,Y-h-w*.58);g.lineTo(X+w*1.14,Y-h+2);g.quadraticCurveTo(X+w/2,Y-h+w*.08,X-w*.14,Y-h+2);g.fill();
g.fillStyle='#5a3a2a';g.fillRect(X+w*.4,Y-h*.38,w*.2,h*.38)}
function tree(g,X,Y,s,col,snow){g.fillStyle='#3a2416';g.fillRect(X-s*.05,Y-s*.2,s*.1,s*.2);for(let k=0;k<3;k++){const yb=Y-s*.15-k*s*.32,w=s*(.48-k*.11);g.fillStyle=col;g.beginPath();g.moveTo(X,yb-s*.5);g.lineTo(X-w,yb);g.lineTo(X+w,yb);g.fill();if(snow){g.fillStyle='#f4f6ff';g.beginPath();g.moveTo(X,yb-s*.5);g.lineTo(X-w*.4,yb-s*.3);g.quadraticCurveTo(X,yb-s*.24,X+w*.4,yb-s*.3);g.fill();g.beginPath();g.moveTo(X-w,yb);g.quadraticCurveTo(X,yb-s*.1,X+w,yb);g.quadraticCurveTo(X,yb+s*.04,X-w,yb);g.fill()}}}
function seed(){P=[];for(let i=0;i<520;i++){const u=Math.random();P.push({x:u,y:ground(u)-.002,vx:0,vy:0,z:R(.4,1),r:R(.0025,.007),set:true,rot:R(0,6)})}}
build();seed();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,150)});
function stir(ax,ay,k){for(const p of P){if(p.set&&k<.25&&Math.random()>k*3)continue;p.set=false;p.vx+=ax*R(.6,1.4)+R(-1,1)*k*.012;p.vy+=ay*R(.6,1.4)-R(0,1)*k*.02}}
// ---------- drag to shake ----------
let pos={x:0,y:0},vel={x:0,y:0},drag=null,prevV={x:0,y:0};
sph.addEventListener('pointerdown',e=>{A();sph.setPointerCapture(e.pointerId);drag={x:e.clientX-pos.x,y:e.clientY-pos.y,t:performance.now(),moved:0}});
sph.addEventListener('pointermove',e=>{if(!drag)return;const nx=e.clientX-drag.x,ny=e.clientY-drag.y;drag.moved+=Math.hypot(nx-pos.x,ny-pos.y);pos.x=nx;pos.y=ny});
addEventListener('pointerup',()=>{if(!drag)return;if(drag.moved<6){vel.x+=R(-1,1)*26;vel.y-=16;stir(0,-.02,1);swish()}drag=null});
addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();vel.x+=R(-1,1)*30;vel.y-=20;stir(0,-.02,1);swish()}});
// ---------- audio: music box ----------
let ac,wind=0,step=0,nextT=0;function A(){if(!ac)try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tine(f,t,v){const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain();o.frequency.value=f;o2.frequency.value=f*4.02;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);g2.gain.setValueAtTime(v*.4,t);g2.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(ac.destination);o2.connect(g2).connect(ac.destination);o.start(t);o2.start(t);o.stop(t+1.7);o2.stop(t+.3)}
function swish(){if(!ac)return;const t=ac.currentTime,b=ac.createBuffer(1,ac.sampleRate*.8,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/d.length);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=700;f.Q.value=.7;g.gain.value=.12;s.connect(f).connect(g).connect(ac.destination);s.start(t)}
const MEL=[76,79,83,81,79,76,74,76,79,76,72,74,76,79,84,83,81,79,81,83,79,76,74,72],BASS=[52,55,57,55,52,55,50,52];
const mf=m=>440*Math.pow(2,(m-69)/12);
document.getElementById('base').addEventListener('click',()=>{A();wind=Math.min(1,wind+.5);if(ac&&nextT<ac.currentTime)nextT=ac.currentTime+.05;if(ac){const t=ac.currentTime;for(let k=0;k<3;k++){const b=ac.createBuffer(1,600,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<600;i++)d[i]=(Math.random()*2-1)*(1-i/600);const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=.15;s.connect(g).connect(ac.destination);s.start(t+k*.07)}}});
let keyA=0;
// ---------- frame ----------
const smoke=[];let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
if(!drag){vel.x+=-pos.x*60*dt;vel.y+=-pos.y*60*dt;vel.x*=Math.pow(.02,dt);vel.y*=Math.pow(.02,dt);pos.x+=vel.x*dt*10;pos.y+=vel.y*dt*10}
// the fluid lags behind the glass: flakes feel the opposite of its acceleration
const vx=(pos.x-(frame.px||0))/Math.max(dt,.001),vy=(pos.y-(frame.py||0))/Math.max(dt,.001);frame.px=pos.x;frame.py=pos.y;const ax=(vx-prevV.x),ay=(vy-prevV.y);prevV={x:vx,y:vy};
const am=Math.hypot(ax,ay);if(am>40)stir(-ax/S*dpr*.0016,-ay/S*dpr*.0016,Math.min(1,am/900));
sph.style.transform=`translate(${pos.x}px,${pos.y}px) rotate(${pos.x*.06}deg)`;
x.drawImage(scene,0,0);
// glowing windows flicker
for(const [u,v,w,h] of houses){const X=u*S,Y=v*S,W2=w*S,H2=h*S;for(const ox of [.18,.6]){const fl=.85+.15*Math.sin(now*.01+ox*20+u*30)*Math.random();x.fillStyle=`rgba(255,${200+30*fl|0},110,${fl})`;x.shadowColor='#ffb04a';x.shadowBlur=12*dpr;x.fillRect(X+W2*ox,Y-H2*.72,W2*.2,W2*.2)}x.shadowBlur=0;
if(Math.random()<.2)smoke.push({x:X+W2*.71,y:Y-H2-W2*.5,r:W2*.06,a:.35})}
for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.y-=.25*dpr;s.x+=.15*dpr+Math.sin(now*.002+i)*.1*dpr-pos.x*.002*dpr;s.r+=.08*dpr;s.a*=.985;if(s.a<.02){smoke.splice(i,1);continue}x.fillStyle=`rgba(220,220,240,${s.a})`;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}
// little train circles the village
const ta=now*.0004;for(let k=2;k>=0;k--){const a=ta-k*.18,X=S*.5+Math.cos(a)*S*.3,Y=S*.86+Math.sin(a)*S*.04,sc=.8+Math.sin(a)*.2,w=S*.045*sc,h=S*.028*sc;x.fillStyle=k?['#2d5d8a','#a8323e'][k-1]:'#222';x.fillRect(X-w/2,Y-h,w,h);x.fillStyle='#111';x.beginPath();x.arc(X-w*.3,Y,h*.22,0,7);x.arc(X+w*.3,Y,h*.22,0,7);x.fill();if(!k){x.fillStyle='#222';x.fillRect(X+w*.15*Math.sign(-Math.sin(a)),Y-h*1.5,w*.15,h*.5);x.fillStyle='rgba(255,230,140,.9)';x.beginPath();x.arc(X+w*.5*Math.sign(-Math.sin(a)||1),Y-h*.5,h*.15,0,7);x.fill()}else{x.fillStyle='rgba(255,220,120,.85)';x.fillRect(X-w*.3,Y-h*.75,w*.6,h*.3)}}
// snow
for(const p of P){if(!p.set){p.vy+=.00016*(.6+p.z*.5);p.vx*=.982;p.vy*=.982;p.vx+=Math.sin(now*.0011+p.rot*3)*.00002;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vx*20;
const dx=p.x-.5,dy=p.y-.5,d=Math.hypot(dx,dy);if(d>.48){p.x=.5+dx/d*.48;p.y=.5+dy/d*.48;const n=(p.vx*dx+p.vy*dy)/d;if(n>0){p.vx-=n*dx/d*1.6;p.vy-=n*dy/d*1.6}}
const gy=ground(p.x)-.002;if(p.y>gy&&p.vy>0){p.y=gy-Math.random()*.004;p.vy=0;p.vx=0;p.set=true}}
const r=p.r*S*(.6+p.z*.6);x.globalAlpha=p.set?.95:.55+p.z*.45;x.fillStyle='#fff';x.beginPath();x.arc(p.x*S,p.y*S,r,0,7);x.fill()}x.globalAlpha=1;
// inner vignette for the curve of the glass
const vg=x.createRadialGradient(S/2,S/2,S*.3,S/2,S/2,S*.5);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,10,40,.45)');x.fillStyle=vg;x.fillRect(0,0,S,S);
// music box
if(ac&&wind>0){const bpm=60+wind*110,beat=60/bpm/2;while(nextT<ac.currentTime+.1&&wind>0){const m=MEL[step%MEL.length];tine(mf(m),nextT,.08*Math.min(1,wind*3));if(step%3===0)tine(mf(BASS[(step/3|0)%BASS.length]),nextT,.05*Math.min(1,wind*3));step++;nextT+=beat*(1+(1-wind)*.6);wind=Math.max(0,wind-.006)}keyA+=wind*dt*240}
document.getElementById('key').style.transform=`rotateY(${keyA}deg)`;
requestAnimationFrame(frame)}requestAnimationFrame(frame);
setTimeout(()=>{stir(0,-.02,1)},400);
</script></body></html>
