<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corkboard of Summers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#b98a5a;background-image:radial-gradient(#a0703f 1px,transparent 1.5px),radial-gradient(#d0a273 1px,transparent 1.5px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;font-family:Caveat,cursive;box-shadow:inset 0 0 0 18px #6b4423,inset 0 0 60px rgba(0,0,0,.4)}
.pol{position:absolute;width:clamp(130px,17vw,230px);background:#fbfaf6;padding:4% 4% 0;box-shadow:0 8px 18px rgba(40,20,0,.35);cursor:grab;touch-action:none;user-select:none;transition:box-shadow .2s}
.pol:active{cursor:grabbing;box-shadow:0 24px 40px rgba(40,20,0,.45)}.ph{aspect-ratio:1;position:relative;overflow:hidden;filter:saturate(.85) contrast(1.05) sepia(.12)}
.ph::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse,transparent 55%,rgba(60,30,0,.35));}
.cap{font-weight:500;font-size:clamp(16px,1.6vw,22px);color:#2a2a5a;text-align:center;padding:6% 0 9%;line-height:1}
.pin{position:absolute;left:50%;top:-8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,var(--p) 40%,#000 130%);box-shadow:2px 4px 4px rgba(0,0,0,.4);z-index:2}
.note{position:absolute;right:6vw;bottom:8vh;width:clamp(160px,18vw,240px);background:#fff27a;padding:18px;font:700 clamp(18px,1.8vw,24px)/1.1 Caveat,cursive;color:#5a3a00;transform:rotate(4deg);box-shadow:0 8px 14px rgba(40,20,0,.3)}</style></head><body>
<div class="note">drag the photos around ♥<br><br>— best summer ever, don't forget it</div>
<script>
const P=[['Porto, the blue tiles','linear-gradient(#7ec8f2 0 45%,#2f6fb5 45% 47%,#f2e6cf 47%)','radial-gradient(circle at 70% 25%,#fff6b0 0 8%,transparent 9%)'],['ferry at dawn','linear-gradient(#ffb38a,#ff7a8a 50%,#3a4a8a 50%,#1f2a5a)','radial-gradient(circle at 50% 50%,#ffe4a0 0 12%,transparent 13%)'],['the lavender field','linear-gradient(#a9d6ff 0 40%,#8a6bd1 40%,#5a3aa1)','repeating-linear-gradient(90deg,transparent 0 8px,rgba(255,255,255,.15) 8px 10px)'],['grandma’s lemons','radial-gradient(circle at 35% 45%,#ffe14d 0 16%,transparent 17%),radial-gradient(circle at 62% 60%,#ffd21a 0 18%,transparent 19%),linear-gradient(#3d7a3a,#2a5a2a)',''],['night market','linear-gradient(#1a1030,#3a1a40)','radial-gradient(circle at 20% 40%,#ffb03b 0 4%,transparent 5%),radial-gradient(circle at 50% 30%,#ff5f7e 0 4%,transparent 5%),radial-gradient(circle at 75% 45%,#ffe14d 0 4%,transparent 5%),radial-gradient(circle at 35% 60%,#7fe3ff 0 3%,transparent 4%)'],['cliff jump!!','linear-gradient(#5ac8ff 0 30%,#c9a273 30% 55%,#1a7ab5 55%)',''],['us, sunburnt','linear-gradient(#ffd8a8,#ff9a6e)','radial-gradient(circle at 38% 55%,#7a4a2a 0 14%,transparent 15%),radial-gradient(circle at 64% 52%,#3a2a1a 0 15%,transparent 16%)'],['last sunset','linear-gradient(#2a1a4a,#ff6a5a 55%,#ffb35c 62%,#1a1030 62%)','']];
const pins=['#e33','#36f','#3b3','#fc0','#f6a'];let z=10;
P.forEach(([cap,bg,ov],i)=>{const e=document.createElement('div');e.className='pol';const cols=4;const X=8+(i%cols)*(84/cols)+Math.random()*4,Y=8+Math.floor(i/cols)*44+Math.random()*6;e.style.left=X+'vw';e.style.top=Y+'vh';e.style.transform=`rotate(${(Math.random()-.5)*16}deg)`;
e.innerHTML=`<span class="pin" style="--p:${pins[i%5]}"></span><div class="ph" style="background:${ov?ov+',':''}${bg}"></div><div class="cap">${cap}</div>`;document.body.appendChild(e);
e.addEventListener('pointerdown',ev=>{e.setPointerCapture(ev.pointerId);e.style.zIndex=++z;const sx=ev.clientX-e.offsetLeft,sy=ev.clientY-e.offsetTop;const rot=e.style.transform;e.style.transform=rot.replace(/rotate\(([-\d.]+)deg\)/,(m,a)=>`rotate(${a*.4}deg) scale(1.05)`);
e.onpointermove=m=>{e.style.left=(m.clientX-sx)+'px';e.style.top=(m.clientY-sy)+'px'};e.onpointerup=()=>{e.onpointermove=null;e.style.transform=`rotate(${(Math.random()-.5)*14}deg)`}})});
</script></body></html>
