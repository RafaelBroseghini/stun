<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corkboard of Summers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{background:#b98a5a;background-image:radial-gradient(#a0703f 1px,transparent 1.5px),radial-gradient(#d0a273 1px,transparent 1.5px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;font-family:Caveat,cursive;box-shadow:inset 0 0 0 18px #6b4423,inset 0 0 0 20px #4a2c14,inset 0 0 80px rgba(0,0,0,.45);user-select:none;-webkit-user-select:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 40% 30%,rgba(255,230,180,.18),transparent 70%)}
.pol{position:absolute;left:0;top:0;width:clamp(130px,15vw,210px);background:#fbfaf6;padding:clamp(8px,.8vw,12px) clamp(8px,.8vw,12px) 0;box-shadow:0 8px 18px rgba(40,20,0,.35);cursor:grab;touch-action:none;will-change:transform;transition:box-shadow .2s}
.pol.lift{cursor:grabbing;box-shadow:0 30px 50px rgba(40,20,0,.45)}
.ph{aspect-ratio:1;position:relative;overflow:hidden;background:#222}.ph svg{width:100%;height:100%;display:block;filter:saturate(.9) contrast(1.05) sepia(.1);transition:filter 3.5s ease-out}
.dev .ph svg{filter:brightness(2.2) sepia(1) contrast(.25) blur(3px)}
.ph::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse,transparent 55%,rgba(60,30,0,.35)),linear-gradient(135deg,rgba(255,255,255,.18),transparent 40%);pointer-events:none}
.cap{font-weight:500;font-size:clamp(16px,1.6vw,22px);color:#2a2a5a;text-align:center;padding:10px 0 14px;line-height:1;min-height:2.2em}
.pin{position:absolute;left:50%;top:-8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,var(--p) 40%,#000 130%);box-shadow:2px 4px 4px rgba(0,0,0,.4);z-index:2;transition:transform .5s cubic-bezier(.5,-.6,.6,1),opacity .5s}
.pin.pop{transform:translate(40px,-60px) rotate(200deg) scale(.6);opacity:0}
.note{position:absolute;right:3.4vw;bottom:5vh;width:clamp(160px,18vw,240px);background:#fff27a;padding:18px;font:700 clamp(18px,1.8vw,24px)/1.1 Caveat,cursive;color:#5a3a00;transform:rotate(4deg);box-shadow:0 8px 14px rgba(40,20,0,.3);z-index:1}
.note::before{content:"";position:absolute;left:40%;top:-10px;width:60px;height:22px;background:rgba(255,255,255,.55);transform:rotate(-4deg)}
.tix{position:absolute;left:58vw;top:62vh;width:150px;padding:10px 12px;background:#ffd5c2;border:2px dashed rgba(160,60,30,.4);font:700 18px/1 Caveat;color:#a03c1e;transform:rotate(-8deg);box-shadow:0 6px 10px rgba(40,20,0,.25);z-index:1}.tix small{display:block;font-size:13px;margin-top:4px}
.cam{position:fixed;left:3.4vw;bottom:5vh;width:clamp(120px,12vw,170px);aspect-ratio:1.1;z-index:999;cursor:pointer}
.cam .bd{position:absolute;inset:18% 0 0;background:linear-gradient(#f2efe6,#d8d3c4);border-radius:10px;box-shadow:0 14px 24px rgba(40,20,0,.4),inset 0 -6px 0 rgba(0,0,0,.08)}
.cam .bd::before{content:"";position:absolute;left:0;right:0;top:48%;height:10%;background:repeating-linear-gradient(90deg,#e33 0 16%,#f90 16% 32%,#fd0 32% 48%,#3b3 48% 64%,#36f 64% 80%,#a3f 80%)}
.cam .ln{position:absolute;left:28%;top:28%;width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5a6a8a,#111 55%,#333 62%,#888 64%,#222 70%);box-shadow:0 4px 8px rgba(0,0,0,.4)}
.cam .fl{position:absolute;right:8%;top:24%;width:20%;height:14%;background:linear-gradient(#fff,#ccc);border-radius:3px}
.cam .sh{position:absolute;left:12%;top:4%;width:16%;height:16%;background:#e33;border-radius:50% 50% 0 0;transition:transform .1s}.cam:active .sh{transform:translateY(4px)}
.cam .sl{position:absolute;left:15%;right:15%;bottom:4%;height:4%;background:#2a2620;border-radius:2px}
.cam span{position:absolute;left:0;right:0;top:-26px;text-align:center;font:700 18px Caveat;color:#fff6e0;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:1000}
</style></head><body>
<div class="note">drag & fling the photos ♥<br>double-click to pin<br><br>— best summer ever, don't forget it</div>
<div class="tix">ADMIT ONE<small>Pier Cinema · Aug 14</small></div>
<div class="cam" id="cam" title="Take a photo"><span>take one!</span><div class="bd"></div><div class="ln"></div><div class="fl"></div><div class="sh"></div><div class="sl"></div></div><div class="flash" id="flash"></div>
<script>
const R=(a,b)=>a+Math.random()*(b-a);let uid=0;
function scene(kind){const id='s'+(uid++);const sun=R(20,80);const S={
beach:`<defs><linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ec8f2"/><stop offset="1" stop-color="#d9f1ff"/></linearGradient></defs><rect width="100" height="55" fill="url(#${id}a)"/><circle cx="${sun}" cy="20" r="8" fill="#fff6b0"/><rect y="55" width="100" height="15" fill="#2f6fb5"/><path d="M0 62q25 -4 50 0t50 0V70H0z" fill="#5aa0d8" opacity=".7"/><rect y="70" width="100" height="30" fill="#f2e6cf"/><path d="M60 70l8 -22 3 1 -7 21z" fill="#5a3a22"/><path d="M50 50q18 -12 30 0z" fill="#e33"/>`,
dawn:`<defs><linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb38a"/><stop offset=".55" stop-color="#ff7a8a"/><stop offset=".55" stop-color="#3a4a8a"/><stop offset="1" stop-color="#1f2a5a"/></linearGradient></defs><rect width="100" height="100" fill="url(#${id}a)"/><circle cx="50" cy="55" r="14" fill="#ffe4a0"/><rect y="55" width="100" height="45" fill="#2a3a7a" opacity=".85"/><path d="M20 70h46l-6 8H26z" fill="#111"/><rect x="34" y="60" width="18" height="10" fill="#111"/><path d="M0 85h100" stroke="#ffe4a0" stroke-width=".6" opacity=".6"/>`,
field:`<rect width="100" height="45" fill="#a9d6ff"/><path d="M0 45q30 -10 60 -2t40 -2V100H0z" fill="#8a6bd1"/>${Array.from({length:40},(_,i)=>`<path d="M${(i*7.3)%100} ${55+(i*13)%45}v-6" stroke="#5a3aa1" stroke-width="1.6"/>`).join('')}<circle cx="80" cy="18" r="6" fill="#fff8d0"/>`,
lemons:`<rect width="100" height="100" fill="#2f5a2a"/>${Array.from({length:9},(_,i)=>`<ellipse cx="${15+(i%3)*32+R(-6,6)}" cy="${20+Math.floor(i/3)*30+R(-6,6)}" rx="11" ry="9" fill="${i%2?'#ffd21a':'#ffe14d'}" transform="rotate(${R(-30,30)} ${15+(i%3)*32} ${20+Math.floor(i/3)*30})"/>`).join('')}<path d="M10 10q20 10 30 0M60 70q15 8 30 -4" stroke="#4a8a3a" stroke-width="3" fill="none"/>`,
night:`<rect width="100" height="100" fill="#1a1030"/>${Array.from({length:18},()=>`<circle cx="${R(5,95)}" cy="${R(20,70)}" r="${R(1.5,4)}" fill="${['#ffb03b','#ff5f7e','#ffe14d','#7fe3ff'][Math.random()*4|0]}" opacity=".9"/>`).join('')}<path d="M0 75h100V100H0z" fill="#0d0820"/><path d="M10 75l6 -10 6 10M40 75l8 -14 8 14M75 75l6 -9 6 9" fill="#2a1a40"/>`,
cliff:`<rect width="100" height="40" fill="#5ac8ff"/><path d="M0 40h55l-8 60H0z" fill="#c9a273"/><path d="M55 40l-8 60h53V40z" fill="#1a7ab5"/><circle cx="66" cy="34" r="2.6" fill="#3a2a1a"/><path d="M66 36l-3 6M66 36l4 5" stroke="#3a2a1a" stroke-width="1.4"/><path d="M60 60q8 -4 16 0" stroke="#fff" stroke-width="1" fill="none" opacity=".7"/>`,
us:`<rect width="100" height="100" fill="#ffd8a8"/><rect y="60" width="100" height="40" fill="#ff9a6e"/><circle cx="38" cy="45" r="12" fill="#7a4a2a"/><rect x="26" y="57" width="24" height="40" rx="10" fill="#e14b2a"/><circle cx="64" cy="43" r="13" fill="#3a2a1a"/><rect x="51" y="56" width="26" height="42" rx="10" fill="#2433a8"/><path d="M32 47q6 4 12 0M58 46q6 4 12 0" stroke="#fff" stroke-width="1.2" fill="none"/>`,
sunset:`<defs><linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a4a"/><stop offset=".55" stop-color="#ff6a5a"/><stop offset=".62" stop-color="#ffb35c"/></linearGradient></defs><rect width="100" height="62" fill="url(#${id}a)"/><circle cx="${sun}" cy="60" r="12" fill="#ffe4a0"/><rect y="62" width="100" height="38" fill="#1a1030"/>${Array.from({length:8},(_,i)=>`<rect x="${sun-10+i%3*3}" y="${65+i*4}" width="${20-i*2}" height="1.4" fill="#ffb35c" opacity="${.8-i*.08}"/>`).join('')}`,
mountain:`<rect width="100" height="100" fill="#cfe4f2"/><path d="M0 70l25 -40 15 20 20 -35 40 55V100H0z" fill="#5a6a8a"/><path d="M55 25l5 -10 8 12z" fill="#fff"/><path d="M0 85q50 -15 100 0V100H0z" fill="#3a5a3a"/>`};return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">${S[kind]}</svg>`}
const P=[['Porto, the blue tiles','beach'],['ferry at dawn','dawn'],['the lavender field','field'],['grandma’s lemons','lemons'],['night market','night'],['cliff jump!!','cliff'],['us, sunburnt','us'],['last sunset','sunset']];
const caps=['that hike','someone’s dog','best ice cream','road trip','hammock nap','the old pier','storm coming','we got lost'],kinds=['beach','dawn','field','lemons','night','cliff','us','sunset','mountain'];
const pins=['#e33','#36f','#3b3','#fc0','#f6a'];let z=10;const items=[];
function make(cap,kind,X,Y,rot,dev){const e=document.createElement('div');e.className='pol'+(dev?' dev':'');e.innerHTML=`<span class="pin" style="--p:${pins[Math.random()*5|0]}"></span><div class="ph">${scene(kind)}</div><div class="cap">${dev?'':cap}</div>`;document.body.appendChild(e);
const it={e,x:X,y:Y,r:rot,vx:0,vy:0,vr:0,drag:false,pinned:true};items.push(it);place(it);
let sx,sy,lx,ly,lt;e.addEventListener('pointerdown',ev=>{e.setPointerCapture(ev.pointerId);e.style.zIndex=++z;it.drag=true;e.classList.add('lift');sx=ev.clientX-it.x;sy=ev.clientY-it.y;lx=ev.clientX;ly=ev.clientY;lt=performance.now();if(it.pinned){it.pinned=false;const pin=e.querySelector('.pin');pin.classList.add('pop');pop()}});
e.addEventListener('pointermove',ev=>{if(!it.drag)return;const now=performance.now(),dt=Math.max(8,now-lt);it.vx=(ev.clientX-lx)/dt*16;it.vy=(ev.clientY-ly)/dt*16;lx=ev.clientX;ly=ev.clientY;lt=now;it.x=ev.clientX-sx;it.y=ev.clientY-sy;it.r+=(it.vx*.6-it.r*.1)*.2;place(it)});
e.addEventListener('pointerup',()=>{it.drag=false;e.classList.remove('lift');it.vr=it.vx*.4});
e.addEventListener('dblclick',()=>{if(it.pinned)return;it.pinned=true;it.vx=it.vy=it.vr=0;const pin=e.querySelector('.pin');pin.classList.remove('pop');pin.style.setProperty('--p',pins[Math.random()*5|0]);thock()});
if(dev){setTimeout(()=>{e.classList.remove('dev');setTimeout(()=>{e.querySelector('.cap').textContent=cap},2000)},300)}return it}
function place(it){it.e.style.transform=`translate(${it.x}px,${it.y}px) rotate(${it.r}deg)`}
const cols=4,w0=Math.min(220,Math.max(130,innerWidth*.16));P.forEach(([cap,kind],i)=>{const X=innerWidth*(.07+(i%cols)*.2)+R(0,30),Y=innerHeight*(.08+Math.floor(i/cols)*.42)+R(0,30);const it=make(cap,kind,X,Y,R(-8,8),false);it.e.style.animation=`none`;it.e.animate([{opacity:0,transform:`translate(${X}px,${Y-40}px) rotate(${it.r+10}deg)`},{opacity:1,transform:`translate(${X}px,${Y}px) rotate(${it.r}deg)`}],{duration:700,delay:i*90,easing:'cubic-bezier(.2,.9,.3,1.2)',fill:'backwards'})});
let ac;function snd(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return ac}
function pop(){const a=snd();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(900,a.currentTime);o.frequency.exponentialRampToValueAtTime(300,a.currentTime+.08);g.gain.setValueAtTime(.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.1);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.12)}
function thock(){const a=snd();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=180;g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.08);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.1)}
function whirr(){const a=snd();if(!a)return;const b=a.createBuffer(1,a.sampleRate*.7,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.4*Math.sin(i/d.length*Math.PI)*(1+Math.sin(i*.05));const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=700;g.gain.value=.2;s.connect(f).connect(g).connect(a.destination);s.start();const o=a.createOscillator(),og=a.createGain();o.type='square';o.frequency.value=2400;og.gain.setValueAtTime(.05,a.currentTime);og.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.04);o.connect(og).connect(a.destination);o.start();o.stop(a.currentTime+.05)}
document.getElementById('cam').addEventListener('click',()=>{const fl=document.getElementById('flash');fl.animate([{opacity:.9},{opacity:0}],{duration:500,easing:'ease-out'});whirr();const r=document.getElementById('cam').getBoundingClientRect();
const it=make(caps[Math.random()*caps.length|0],kinds[Math.random()*kinds.length|0],r.left+r.width*.1,r.bottom-r.height*.3,R(-4,4),true);it.e.style.zIndex=++z;it.pinned=false;it.e.querySelector('.pin').classList.add('pop');it.vx=R(4,9);it.vy=R(-16,-11);it.vr=R(-4,4)});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();document.getElementById('cam').click()}});
(function f(){for(const it of items){if(it.drag||it.pinned)continue;if(Math.abs(it.vx)+Math.abs(it.vy)+Math.abs(it.vr)<.05)continue;it.x+=it.vx;it.y+=it.vy;it.r+=it.vr;it.vx*=.9;it.vy*=.9;it.vr*=.9;const w=it.e.offsetWidth,h=it.e.offsetHeight;if(it.x<10){it.x=10;it.vx*=-.5}if(it.y<10){it.y=10;it.vy*=-.5}if(it.x>innerWidth-w-10){it.x=innerWidth-w-10;it.vx*=-.5}if(it.y>innerHeight-h-10){it.y=innerHeight-h-10;it.vy*=-.5}place(it)}requestAnimationFrame(f)})();
</script></body></html>
