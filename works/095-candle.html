<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Candle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#050302;user-select:none;-webkit-user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.q{position:fixed;top:9vh;left:0;right:0;text-align:center;color:#d9b88a;font:italic clamp(18px,2.4vw,30px)/1.4 'EB Garamond',serif;pointer-events:none;transition:opacity 1.2s;text-shadow:0 0 20px rgba(255,160,60,.25)}.q small{display:block;font-size:.5em;letter-spacing:.3em;font-style:normal;opacity:.6;margin-top:8px}

<canvas id="c"></canvas><div class="q" id="q">“How far that little candle throws his beams.”<small>THE MERCHANT OF VENICE · V.I</small></div>
<div class="h" id="h">sweep the cursor past the flame to make it dance · click the candle to blow it out</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,TY,CX,wall;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;TY=H*.72;CX=W*.5;wall=null}size();addEventListener('resize',size);

// ---------- objects (shape functions draw into a path; shadows reuse them) ----------

if(stems)for(let k=0;k<6;k++){const a=-1.9+k*.16,L=(160+k*26%70)*u;const sx=vx,sy=b-108*u,ex=sx+(k-2.5)*26*u,ey=sy-L;stems.push([sx,sy,(sx+ex)/2+(k-2.5)*8*u,sy-L*.6,ex,ey])}}
// ---------- state ----------

c.addEventListener('pointermove',e=>{const X=e.clientX*dpr,Y=e.clientY*dpr,n=performance.now();if(lastP){const dt=Math.max(1,n-lastP.t),vx=(X-lastP.x)/dt,[wx,wy]=wick();const d=Math.hypot(X-wx,Y-wy+60*U());const f=Math.max(0,1-d/(260*U()));wind+=vx*f*.9}lastP={x:X,y:Y,t:n}});

addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();A();if(lit)blowOut();else if(!match)strike()}});
function blowOut(){lit=false;ember=1;puff();document.getElementById('h').textContent='click the candle again to strike a match';document.getElementById('q').style.opacity=.25;const [wx,wy]=wick();for(let i=0;i<4;i++)smoke.push({x:wx,y:wy,vx:0,vy:-1,a:.5,age:0,seed:Math.random()*10})}

// ---------- audio ----------
let ac;function A(){if(!ac)try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}

// ---------- frame ----------
function frame(now){const t=(now-t0)/1000,u=U();if(!wall)makeWall();
wind*=.9;windT=windT*.92+Math.abs(wind)*.08;lean+=(Math.max(-1.4,Math.min(1.4,wind*.25))-lean)*.15;if(lit&&windT>5.5&&grow>=1)blowOut();
life=Math.max(.25,1-t/1800);flick=lit?(.92+N(t*2.3)*.06+(Math.random()-.5)*.04)*(1-Math.min(.5,windT*.05))*grow:0;ember*=.995;

const [wx,wy]=wick();const L=flick,lx=wx+lean*20*u+N(t*5)*2*u,ly=wy-50*u;
x.globalCompositeOperation='source-over';x.drawImage(wall,0,0);
// moonlight from an unseen window, only noticeable in the dark
x.globalAlpha=.6;const mw=x.createLinearGradient(W*.06,0,W*.32,TY);mw.addColorStop(0,'rgba(120,150,210,.2)');mw.addColorStop(1,'rgba(120,150,210,0)');x.fillStyle=mw;x.beginPath();x.moveTo(W*.08,H*.1);x.lineTo(W*.2,H*.08);x.lineTo(W*.3,TY*.86);x.lineTo(W*.14,TY*.9);x.fill();x.globalAlpha=1;
// objects
const bk=books();for(const [bx2,by,bw,bh,col] of bk){x.fillStyle=col;x.fillRect(bx2,by,bw,bh);x.fillStyle='rgba(255,230,180,.6)';x.fillRect(bx2+bw*.06,by+bh*.25,bw*.02,bh*.5);x.fillStyle='rgba(240,225,190,.9)';x.fillRect(bx2+bw-3*u,by+2*u,3*u,bh-4*u)}
const vp=new Path2D(),stems=[];vase(vp,stems);x.fillStyle='#2a4a5a';x.fill(vp);x.strokeStyle='#3a2a1a';x.lineWidth=2*u;for(const s of stems){x.beginPath();x.moveTo(s[0],s[1]);x.quadraticCurveTo(s[2],s[3],s[4],s[5]);x.stroke();x.fillStyle='#8a5a3a';x.beginPath();x.ellipse(s[4],s[5],7*u,4*u,.5,0,7);x.fill()}
const gp=new Path2D();glassPath(gp);x.fillStyle='rgba(200,220,230,.12)';x.fill(gp);x.fillStyle='rgba(120,20,30,.7)';x.save();x.clip(gp);x.fillRect(CX+150*u,TY-150*u,160*u,72*u);x.restore();x.strokeStyle='rgba(255,240,220,.35)';x.lineWidth=1.5*u;x.stroke(gp);
// candle body, holder and melt pool
const ch=(240*life+60)*u,cw=56*u,top=TY-24*u-ch;const cg=x.createLinearGradient(CX-cw/2,0,CX+cw/2,0);cg.addColorStop(0,'#c8b898');cg.addColorStop(.38,'#fff8e8');cg.addColorStop(.62,'#eadcc0');cg.addColorStop(1,'#a89878');x.fillStyle=cg;x.fillRect(CX-cw/2,top,cw,ch);
x.fillStyle='rgba(255,248,232,.95)';for(const [dx2,len] of [[-.32,.18],[.18,.1],[.4,.26]]){x.beginPath();x.moveTo(CX+cw*dx2-4*u,top);x.lineTo(CX+cw*dx2-4*u,top+ch*len);x.arc(CX+cw*dx2,top+ch*len,4*u,Math.PI,0,true);x.lineTo(CX+cw*dx2+4*u,top);x.fill()}
x.fillStyle=lit?`rgba(255,200,120,${.6*L})`:'rgba(240,230,210,.9)';x.beginPath();x.ellipse(CX,top,cw/2,7*u,0,0,7);x.fill();
const hg=x.createLinearGradient(CX-120*u,0,CX+120*u,0);hg.addColorStop(0,'#5a3a10');hg.addColorStop(.4,'#f6dc9a');hg.addColorStop(.6,'#c9a15a');hg.addColorStop(1,'#4a2a08');x.fillStyle=hg;x.beginPath();x.ellipse(CX,TY-6*u,120*u,18*u,0,0,7);x.fill();x.fillRect(CX-40*u,TY-26*u,80*u,20*u);x.beginPath();x.ellipse(CX,TY-26*u,40*u,8*u,0,0,7);x.fill();
// wick
x.strokeStyle='#1a1008';x.lineWidth=3*u;x.lineCap='round';x.beginPath();x.moveTo(wx,top);x.quadraticCurveTo(wx+lean*4*u,top-10*u,wx+lean*8*u+2*u,top-18*u);x.stroke();if(!lit&&ember>.02){x.fillStyle=`rgba(255,${90+ember*80|0},30,${ember})`;x.shadowColor='#ff5a10';x.shadowBlur=10*dpr*ember;x.beginPath();x.arc(wx+2*u,top-17*u,2.6*u,0,7);x.fill();x.shadowBlur=0}
// darkness, lit from the flame: light falls off with distance
const amb=.06+(lit?0:0);const rad=Math.max(W,H)*(.42+L*.35);const dk=x.createRadialGradient(lx,ly,0,lx,ly,rad);dk.addColorStop(0,`rgba(5,3,2,${1-Math.min(1,L*1.05)})`);dk.addColorStop(.35,`rgba(5,3,2,${1-L*.55})`);dk.addColorStop(1,`rgba(5,3,2,${.97-amb})`);x.fillStyle=dk;x.fillRect(0,0,W,H);
// shadows cast on the wall: each silhouette projected from the flame, swaying with it
if(L>.02){x.save();x.beginPath();x.rect(0,0,W,TY);x.clip();x.filter=`blur(${(6+lean*lean*4)*dpr}px)`;x.fillStyle=`rgba(5,3,2,${.6*L})`;const k=1.55;x.translate(lx,ly);x.scale(k,k*1.05);x.translate(-lx,-ly);x.translate(0,-(TY-ly)*.42);
const sp=new Path2D();books(sp);vase(sp);glassPath(sp);x.fill(sp);x.strokeStyle=`rgba(5,3,2,${.6*L})`;x.lineWidth=3*u;for(const s of stems){x.beginPath();x.moveTo(s[0],s[1]);x.quadraticCurveTo(s[2],s[3],s[4],s[5]);x.stroke()}x.filter='none';x.restore()}
// warm glow
x.globalCompositeOperation='lighter';if(L>.01){const g1=x.createRadialGradient(lx,ly,0,lx,ly,rad*.55);g1.addColorStop(0,`rgba(255,150,60,${.32*L})`);g1.addColorStop(1,'rgba(255,120,40,0)');x.fillStyle=g1;x.fillRect(0,0,W,H)}
// highlights on glass and holder catch the flame
if(L>.01){x.fillStyle=`rgba(255,220,160,${.5*L})`;x.fillRect(CX+230*u-38*u+lean*2*u,TY-180*u,4*u,80*u);x.beginPath();x.ellipse(CX-30*u,TY-8*u,24*u,3*u,0,0,7);x.fill()}
// the flame
if(lit){const fh=(92+N(t*4)*8)*u*grow*(1-Math.min(.4,windT*.04)),fw=26*u*grow,tipx=wx+lean*fh*.75+N(t*6+3)*3*u,tipy=top-16*u-fh,bx=wx+lean*6*u,by=top-12*u;
const halo=x.createRadialGradient(bx,by-fh*.45,0,bx,by-fh*.45,fh*1.8);halo.addColorStop(0,`rgba(255,200,120,${.35*L})`);halo.addColorStop(1,'rgba(255,160,60,0)');x.fillStyle=halo;x.fillRect(bx-fh*2,by-fh*2.4,fh*4,fh*4);
const fp=new Path2D();fp.moveTo(bx,by+6*u);fp.bezierCurveTo(bx-fw*1.1,by-fh*.1,bx-fw*.6+lean*fh*.2,by-fh*.6,tipx,tipy);fp.bezierCurveTo(bx+fw*.6+lean*fh*.2,by-fh*.6,bx+fw*1.1,by-fh*.1,bx,by+6*u);
const fg=x.createRadialGradient(bx,by-fh*.18,0,bx+lean*fh*.2,by-fh*.4,fh*.9);fg.addColorStop(0,'rgba(255,255,250,1)');fg.addColorStop(.25,'rgba(255,240,180,.98)');fg.addColorStop(.55,'rgba(255,170,60,.85)');fg.addColorStop(1,'rgba(255,90,20,0)');x.fillStyle=fg;x.fill(fp);
x.fillStyle='rgba(60,110,255,.55)';x.beginPath();x.ellipse(bx,by,fw*.42,fh*.1,0,0,7);x.fill();x.fillStyle='rgba(120,60,20,.5)';x.beginPath();x.ellipse(bx+lean*3*u,by-fh*.12,fw*.18,fh*.16,lean*.3,0,7);x.fill()}
x.globalCompositeOperation='source-over';
// the match
if(match){const k=(now-match.t)/1000,e=Math.min(1,k/.8),mx=W*.9+(wx+20*u-W*.9)*(1-Math.pow(1-e,3)),my=H*.95+(top-30*u-H*.95)*(1-Math.pow(1-e,3)),fade=k>1.3?Math.max(0,1-(k-1.3)*2):1;x.globalAlpha=fade;
x.save();x.translate(mx,my);x.rotate(-.6);x.fillStyle='#d8b880';x.fillRect(0,-3*u,110*u,6*u);x.fillStyle='#8a2a1a';x.beginPath();x.ellipse(0,0,8*u,5*u,0,0,7);x.fill();x.restore();
x.globalCompositeOperation='lighter';const mg=x.createRadialGradient(mx,my-10*u,0,mx,my-10*u,(60+Math.sin(k*30)*6)*u);mg.addColorStop(0,'rgba(255,230,150,.9)');mg.addColorStop(.3,'rgba(255,150,50,.5)');mg.addColorStop(1,'rgba(255,100,20,0)');x.fillStyle=mg;x.fillRect(mx-80*u,my-90*u,160*u,160*u);x.globalCompositeOperation='source-over';x.globalAlpha=1}
// smoke ribbon from a snuffed wick
if(!lit&&ember>.2&&Math.random()<.9)smoke.push({x:wx+2*u,y:top-18*u,vx:0,vy:-1.2*dpr,a:.4*ember,age:0,seed:Math.random()*10});
for(const s of smoke){s.age++;s.vy*=.995;s.x+=Math.sin(s.age*.05+s.seed)*.5*dpr+s.vx+wind*.1;s.y+=s.vy;s.a*=.988}smoke=smoke.filter(s=>s.a>.01&&s.y>0);
x.lineCap='round';for(let i=1;i<smoke.length;i++){const a=smoke[i-1],b=smoke[i];if(Math.hypot(a.x-b.x,a.y-b.y)>30*dpr)continue;x.strokeStyle=`rgba(200,190,180,${b.a*.6})`;x.lineWidth=(2+b.age*.05)*dpr;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
