<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Candle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@1&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#0b0806;display:grid;place-items:end center;font-family:'EB Garamond',serif}
.room{position:fixed;inset:0;background:radial-gradient(circle at 50% 52%,rgba(255,170,80,.42),rgba(120,60,20,.12) 35%,transparent 60%);animation:gl .15s infinite alternate;transition:opacity .6s}@keyframes gl{to{opacity:.88;transform:scale(1.01)}}
.tbl{position:fixed;left:0;right:0;bottom:0;height:22vh;background:linear-gradient(#2a1a10,#120a06)}
.cd{position:relative;margin-bottom:16vh;width:min(12vh,22vw);height:min(34vh,60vw);background:linear-gradient(90deg,#d8c8a8,#fff8e8 35%,#e8dcc0 60%,#b8a888);border-radius:6px 6px 4px 4px;box-shadow:0 0 40px rgba(255,170,80,.25);cursor:pointer}
.cd::before{content:"";position:absolute;left:0;right:0;top:-4px;height:14px;border-radius:50%;background:radial-gradient(ellipse,#fffaf0,#e8dcc0)}.cd::after{content:"";position:absolute;left:18%;top:2%;width:14%;height:20%;background:linear-gradient(#fff8e8,#e8dcc0);border-radius:0 0 8px 8px}
.wk{position:absolute;left:50%;top:-16px;width:3px;height:16px;margin-left:-1.5px;background:#222;border-radius:2px}
.fl{position:absolute;left:50%;bottom:calc(100% + 8px);width:min(4.4vh,8vw);height:min(11vh,20vw);margin-left:calc(min(4.4vh,8vw)/-2);border-radius:50% 50% 40% 40%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 80%,#fff 0 15%,#ffe08a 30%,#ff9a2a 60%,rgba(255,80,0,0) 75%);filter:blur(.6px);transform-origin:50% 90%;animation:fk 2.2s ease-in-out infinite;transition:opacity .3s,transform .3s}
.fl::after{content:"";position:absolute;left:35%;right:35%;bottom:8%;height:24%;border-radius:50%;background:radial-gradient(#3a7aff,transparent 70%);opacity:.7}
@keyframes fk{0%,100%{transform:scale(1) rotate(-1deg)}25%{transform:scale(1.03,.97) rotate(2deg)}50%{transform:scale(.97,1.05) rotate(-2deg) skewX(2deg)}75%{transform:scale(1.02,.99) rotate(1deg)}}
.out .fl{opacity:0;transform:scale(.2)}.out .room{opacity:0}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.q{position:fixed;top:9vh;left:0;right:0;text-align:center;color:#d9b88a;font:italic clamp(18px,2.4vw,30px)/1.4 'EB Garamond',serif;transition:opacity .6s}.out .q{opacity:.25}
.h{position:fixed;bottom:3vh;left:0;right:0;text-align:center;color:#6a5440;font:italic 14px 'EB Garamond'}</style></head><body>
<div class="room"></div><div class="tbl"></div><canvas id="c"></canvas><div class="q">“How far that little candle throws his beams.”</div>
<div class="cd" id="cd"><div class="wk"></div><div class="fl"></div></div><div class="h">click the candle to blow it out, and again to light it</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let S=[];function size(){c.width=innerWidth;c.height=innerHeight}size();addEventListener('resize',size);
document.getElementById('cd').onclick=()=>{document.body.classList.toggle('out');if(document.body.classList.contains('out')){const r=document.querySelector('.wk').getBoundingClientRect();for(let i=0;i<80;i++)S.push({x:r.left+2,y:r.top,vx:(Math.random()-.5)*.5,vy:-1-Math.random(),a:.5,r:2+Math.random()*3,d:i*3})}};
function f(t){x.clearRect(0,0,c.width,c.height);for(let i=S.length-1;i>=0;i--){const p=S[i];if(p.d-->0)continue;p.x+=p.vx+Math.sin(t*.003+p.y*.02)*.6;p.y+=p.vy;p.r+=.15;p.a*=.985;if(p.a<.01){S.splice(i,1);continue}x.fillStyle=`rgba(180,170,160,${p.a*.3})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
