<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OP-7 Pocket Synth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#d4d2cc;display:grid;place-items:center;font-family:'Space Grotesk',sans-serif;color:#1c1c1c;user-select:none}
.dev{width:min(900px,96vw);background:#e9e7e1;border-radius:18px;padding:22px;box-shadow:0 2px 0 #fff inset,0 30px 60px rgba(0,0,0,.25),0 0 0 1px #bdbab2}
.top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.scr{background:#121412;border-radius:10px;padding:10px;position:relative;height:140px}.scr canvas{width:100%;height:100%;display:block}.scr span{position:absolute;left:14px;top:10px;color:#ff6a1a;font-size:11px;letter-spacing:.2em}
.kn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center}.k{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;letter-spacing:.15em;text-transform:uppercase}
.dial{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fafafa,#c9c6be);box-shadow:0 4px 8px rgba(0,0,0,.25),inset 0 -3px 4px rgba(0,0,0,.1);position:relative;cursor:ns-resize;touch-action:none}.dial::after{content:"";position:absolute;left:50%;top:6px;width:3px;height:14px;margin-left:-1.5px;background:#ff6a1a;border-radius:2px}
.dial.o{background:radial-gradient(circle at 40% 35%,#ff9a5a,#ff6a1a)}.dial.o::after{background:#fff}.dial.b{background:radial-gradient(circle at 40% 35%,#5a6bff,#2236d9)}.dial.b::after{background:#fff}
.wv{display:flex;gap:6px;justify-content:center;grid-column:1/-1}.wv button{flex:1;padding:8px 0;border-radius:6px;border:0;background:#d4d2cc;font:700 11px 'Space Grotesk';letter-spacing:.1em;cursor:pointer}.wv button.on{background:#1c1c1c;color:#ff6a1a}
.keys{position:relative;display:flex;height:180px}.w{flex:1;background:#fbfbf8;border:1px solid #bdbab2;border-radius:0 0 8px 8px;margin:0 1px;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:10px;color:#999}
.w.on{background:#ffd9c2}.bk{position:absolute;top:0;width:calc(100%/14*.62);height:60%;background:#1c1c1c;border-radius:0 0 6px 6px;z-index:2;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:9px;color:#777}.bk.on{background:#ff6a1a}
.brand{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;letter-spacing:.3em}.brand b{font-size:18px;letter-spacing:.1em}
@media(max-width:640px){.top{grid-template-columns:1fr}.keys{height:130px}}</style></head><body>
<div class="dev"><div class="top"><div class="scr"><span id="lbl">OSC · SAWTOOTH · TAP A KEY</span><canvas id="sc"></canvas></div>
<div class="kn"><div class="k"><div class="dial o" data-p="cut" data-v=".6"></div>Cutoff</div><div class="k"><div class="dial" data-p="res" data-v=".3"></div>Reso</div><div class="k"><div class="dial b" data-p="rel" data-v=".35"></div>Release</div>
<div class="wv" id="wv"><button data-w="sine">SIN</button><button data-w="triangle">TRI</button><button class="on" data-w="sawtooth">SAW</button><button data-w="square">SQR</button></div></div></div>
<div class="keys" id="keys"></div><div class="brand"><b>OP-7</b><span>POLYPHONIC POCKET SYNTHESIZER</span><span>KEYS A–K · W E T Y U</span></div></div>
<script>
let A,an,master,filt,wave='sawtooth';const P={cut:.6,res:.3,rel:.35};const map='awsedftgyhujkolp;';
function init(){if(A)return;A=new AudioContext();master=A.createGain();master.gain.value=.25;filt=A.createBiquadFilter();filt.type='lowpass';an=A.createAnalyser();an.fftSize=2048;filt.connect(master);master.connect(an);an.connect(A.destination);upd()}
function upd(){if(!filt)return;filt.frequency.value=80*Math.pow(200,P.cut);filt.Q.value=P.res*18}
const notes=[];const keys=document.getElementById('keys');const whites=[0,2,4,5,7,9,11,12,14,16,17,19,21,23];const labels='A S D F G H J K L ; \' Z X C'.split(' ');
whites.forEach((n,i)=>{const k=document.createElement('div');k.className='w';k.dataset.n=n;k.textContent=['C','D','E','F','G','A','B'][i%7]+(i<7?4:5);keys.appendChild(k);notes[n]=k});
[1,3,6,8,10,13,15,18,20,22].forEach(n=>{const wi=whites.indexOf(n-1);const k=document.createElement('div');k.className='bk';k.dataset.n=n;k.style.left=`calc(${(wi+1)/14*100}% - ${100/14*.31}%)`;keys.appendChild(k);notes[n]=k});
const act={};function on(n){init();if(act[n])return;const o=A.createOscillator(),g=A.createGain();o.type=wave;o.frequency.value=261.63*Math.pow(2,n/12);g.gain.setValueAtTime(0,A.currentTime);g.gain.linearRampToValueAtTime(.8,A.currentTime+.01);o.connect(g);g.connect(filt);o.start();act[n]={o,g};notes[n]&&notes[n].classList.add('on');document.getElementById('lbl').textContent='OSC · '+wave.toUpperCase()+' · '+o.frequency.value.toFixed(1)+' HZ'}
function off(n){const a=act[n];if(!a)return;const r=.05+P.rel*2;a.g.gain.cancelScheduledValues(A.currentTime);a.g.gain.setValueAtTime(a.g.gain.value,A.currentTime);a.g.gain.linearRampToValueAtTime(0,A.currentTime+r);a.o.stop(A.currentTime+r+.05);delete act[n];notes[n]&&notes[n].classList.remove('on')}
keys.addEventListener('pointerdown',e=>{const n=e.target.dataset.n;if(n!==undefined){on(+n);const up=()=>{off(+n);removeEventListener('pointerup',up)};addEventListener('pointerup',up)}});
const km={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,';':16};
addEventListener('keydown',e=>{if(e.repeat)return;const n=km[e.key];if(n!==undefined)on(n)});addEventListener('keyup',e=>{const n=km[e.key];if(n!==undefined)off(n)});
document.querySelectorAll('#wv button').forEach(b=>b.onclick=()=>{wave=b.dataset.w;document.querySelectorAll('#wv button').forEach(o=>o.classList.toggle('on',o===b))});
document.querySelectorAll('.dial').forEach(d=>{const set=()=>d.style.transform=`rotate(${-135+270*P[d.dataset.p]}deg)`;P[d.dataset.p]=+d.dataset.v;set();d.addEventListener('pointerdown',e=>{d.setPointerCapture(e.pointerId);let y=e.clientY;d.onpointermove=ev=>{P[d.dataset.p]=Math.max(0,Math.min(1,P[d.dataset.p]+(y-ev.clientY)/150));y=ev.clientY;set();upd()}});d.addEventListener('pointerup',()=>d.onpointermove=null)});
const sc=document.getElementById('sc'),x=sc.getContext('2d');const buf=new Uint8Array(2048);
function f(t){sc.width=sc.clientWidth*2;sc.height=sc.clientHeight*2;x.strokeStyle='rgba(255,106,26,.15)';x.lineWidth=1;for(let i=0;i<sc.width;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,sc.height);x.stroke()}x.strokeStyle='#ff6a1a';x.lineWidth=3;x.shadowColor='#ff6a1a';x.shadowBlur=12;x.beginPath();
if(an){an.getByteTimeDomainData(buf);for(let i=0;i<sc.width;i++){const v=buf[Math.floor(i/sc.width*1024)]/128-1;const y=sc.height/2+v*sc.height*.42;i?x.lineTo(i,y):x.moveTo(i,y)}}else{for(let i=0;i<sc.width;i++){const y=sc.height/2+Math.sin(i*.03+t*.003)*sc.height*.18*Math.sin(t*.001);i?x.lineTo(i,y):x.moveTo(i,y)}}x.stroke();requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
