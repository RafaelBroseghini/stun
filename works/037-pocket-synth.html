<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OP-7 Pocket Synth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{background:radial-gradient(80% 70% at 50% 30%,#e4e2dc,#c4c1b9);display:grid;place-items:center;font-family:'Space Grotesk',sans-serif;color:#1c1c1c;user-select:none;-webkit-user-select:none;perspective:1600px}
.dev{width:min(920px,96vw);background:linear-gradient(#efede7,#e4e2db);border-radius:18px;padding:20px 22px 16px;box-shadow:0 2px 0 #fff inset,0 -2px 0 rgba(0,0,0,.06) inset,0 40px 70px rgba(0,0,0,.28),0 0 0 1px #bdbab2;transform:rotateX(14deg);transform-origin:50% 80%;transition:transform .6s cubic-bezier(.2,.8,.2,1);animation:in 1s cubic-bezier(.2,.8,.2,1) both}
.dev:hover{transform:rotateX(6deg)}@keyframes in{from{opacity:0;transform:rotateX(40deg) translateY(40px)}}
.top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;margin-bottom:14px}
.scr{background:#121412;border-radius:10px;padding:10px;position:relative;height:150px;box-shadow:inset 0 2px 8px #000}.scr canvas{width:100%;height:100%;display:block}
.scr span{position:absolute;left:14px;top:10px;color:#ff6a1a;font:400 10px 'Space Mono';letter-spacing:.14em}.scr em{position:absolute;right:14px;top:10px;color:#6b7a6b;font:400 10px 'Space Mono';font-style:normal;cursor:pointer}
.kn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;align-content:center}.k{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9px;letter-spacing:.15em;text-transform:uppercase}
.dial{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fafafa,#c9c6be);box-shadow:0 4px 8px rgba(0,0,0,.25),inset 0 -3px 4px rgba(0,0,0,.1);position:relative;cursor:ns-resize;touch-action:none}
.dial::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:12px;margin-left:-1.5px;background:#ff6a1a;border-radius:2px}
.dial.o{background:radial-gradient(circle at 40% 35%,#ff9a5a,#ff6a1a)}.dial.o::after{background:#fff}.dial.b{background:radial-gradient(circle at 40% 35%,#5a6bff,#2236d9)}.dial.b::after{background:#fff}.dial.g{background:radial-gradient(circle at 40% 35%,#5a5a5a,#1c1c1c)}.dial.g::after{background:#ff6a1a}
.k b{font:400 9px 'Space Mono';color:#888;letter-spacing:0}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.wv{display:flex;gap:4px}.btn{padding:7px 10px;border-radius:6px;border:0;background:#d4d2cc;font:700 10px 'Space Grotesk';letter-spacing:.1em;cursor:pointer;box-shadow:0 2px 0 #b8b5ad;transition:transform .08s,box-shadow .08s}.btn:active{transform:translateY(2px);box-shadow:none}.btn.on{background:#1c1c1c;color:#ff6a1a}
.seq{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;flex:1;min-width:260px}.seq i{height:18px;border-radius:4px;background:#d4d2cc;cursor:pointer;position:relative;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}.seq i:nth-child(4n+1){background:#cbc8c0}.seq i.on{background:#ff6a1a}.seq i.now::after{content:"";position:absolute;inset:-3px;border:2px solid #1c1c1c;border-radius:6px}
.oct{font:400 11px 'Space Mono';display:flex;align-items:center;gap:4px}
.keys{position:relative;display:flex;height:170px}.w{flex:1;background:linear-gradient(#fbfbf8,#f1f0ea);border:1px solid #bdbab2;border-radius:0 0 8px 8px;margin:0 1px;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:400 9px 'Space Mono';color:#aaa;transform-origin:top;transition:transform .06s,background .1s;box-shadow:0 4px 0 #cfccc4}
.w.on{background:#ffd9c2;transform:scaleY(.985);box-shadow:0 1px 0 #cfccc4}.bk{position:absolute;top:0;width:calc(100%/14*.62);height:60%;background:linear-gradient(#2a2a2a,#111);border-radius:0 0 6px 6px;z-index:2;cursor:pointer;box-shadow:0 4px 0 #000;transition:transform .06s}.bk.on{background:#ff6a1a;transform:translateY(2px);box-shadow:0 1px 0 #000}
.brand{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;letter-spacing:.3em}.brand b{font-size:18px;letter-spacing:.1em}.led{width:8px;height:8px;border-radius:50%;background:#5a2a10;display:inline-block;margin-right:8px;vertical-align:middle}.led.on{background:#ff6a1a;box-shadow:0 0 10px #ff6a1a}
@media(max-width:700px){.top{grid-template-columns:1fr}.keys{height:120px}.dev{transform:none}.scr{height:110px}}
</style></head><body>
<div class="dev"><div class="top"><div class="scr"><span id="lbl">OSC · SAW · TAP A KEY</span><em id="vm">SCOPE ⇄</em><canvas id="sc"></canvas></div>
<div class="kn"><div class="k"><div class="dial o" data-p="cut" data-v=".6"></div>Cutoff<b id="v-cut"></b></div><div class="k"><div class="dial" data-p="res" data-v=".3"></div>Reso<b id="v-res"></b></div><div class="k"><div class="dial g" data-p="drv" data-v=".2"></div>Drive<b id="v-drv"></b></div>
<div class="k"><div class="dial" data-p="att" data-v=".05"></div>Attack<b id="v-att"></b></div><div class="k"><div class="dial b" data-p="rel" data-v=".35"></div>Release<b id="v-rel"></b></div><div class="k"><div class="dial" data-p="dly" data-v=".25"></div>Echo<b id="v-dly"></b></div></div></div>
<div class="bar"><div class="wv" id="wv"><button class="btn" data-w="sine">SIN</button><button class="btn" data-w="triangle">TRI</button><button class="btn on" data-w="sawtooth">SAW</button><button class="btn" data-w="square">SQR</button></div>
<button class="btn" id="play">▶ SEQ</button><div class="seq" id="seq"></div><div class="oct"><button class="btn" id="om">−</button><span id="ov">OCT 4</span><button class="btn" id="op">+</button></div></div>
<div class="keys" id="keys"></div><div class="brand"><span><i class="led" id="led"></i><b>OP-7</b></span><span>POLYPHONIC POCKET SYNTHESIZER</span><span>KEYS A–; · W E T Y U O P</span></div></div>
<script>
let A,an,master,filt,shaper,dl,fb,wet,wave='sawtooth',oct=0;const P={cut:.6,res:.3,rel:.35,att:.05,dly:.25,drv:.2};
function curve(k){const n=1024,cv=new Float32Array(n);for(let i=0;i<n;i++){const x2=i/n*2-1;cv[i]=(1+k)*x2/(1+k*Math.abs(x2))}return cv}
function init(){if(A)return;A=new (window.AudioContext||window.webkitAudioContext)();master=A.createGain();master.gain.value=.22;filt=A.createBiquadFilter();filt.type='lowpass';shaper=A.createWaveShaper();an=A.createAnalyser();an.fftSize=2048;
dl=A.createDelay(1);dl.delayTime.value=.28;fb=A.createGain();wet=A.createGain();filt.connect(shaper);shaper.connect(master);shaper.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);master.connect(an);an.connect(A.destination);upd()}
function upd(){for(const k in P){const e=document.getElementById('v-'+k);if(e)e.textContent=k==='cut'?Math.round(80*Math.pow(200,P.cut))+'Hz':Math.round(P[k]*100)}if(!filt)return;filt.frequency.setTargetAtTime(80*Math.pow(200,P.cut),A.currentTime,.02);filt.Q.value=P.res*18;shaper.curve=curve(P.drv*40);fb.gain.value=P.dly*.7;wet.gain.value=P.dly*.8}
const notes=[];const keys=document.getElementById('keys');const whites=[0,2,4,5,7,9,11,12,14,16,17,19,21,23];
whites.forEach((n,i)=>{const k=document.createElement('div');k.className='w';k.dataset.n=n;k.dataset.lb=['C','D','E','F','G','A','B'][i%7];keys.appendChild(k);notes[n]=k});
[1,3,6,8,10,13,15,18,20,22].forEach(n=>{const wi=whites.indexOf(n-1);const k=document.createElement('div');k.className='bk';k.dataset.n=n;k.style.left=`calc(${(wi+1)/14*100}% - ${100/14*.31}%)`;keys.appendChild(k);notes[n]=k});
function labels(){whites.forEach((n,i)=>notes[n].textContent=notes[n].dataset.lb+(4+oct+(i<7?0:1)))}labels();
const act={};function on(n,dur){init();if(act[n])off(n,true);const o=A.createOscillator(),o2=A.createOscillator(),g=A.createGain();o.type=wave;o2.type=wave;const f=261.63*Math.pow(2,n/12+oct);o.frequency.value=f;o2.frequency.value=f*1.004;g.gain.setValueAtTime(0,A.currentTime);g.gain.linearRampToValueAtTime(.5,A.currentTime+.005+P.att*1.2);o.connect(g);o2.connect(g);g.connect(filt);o.start();o2.start();act[n]={o,o2,g};notes[n]&&notes[n].classList.add('on');
document.getElementById('lbl').textContent='OSC · '+wave.slice(0,3).toUpperCase()+' · '+f.toFixed(1)+' HZ';if(dur)setTimeout(()=>off(n),dur)}
function off(n,fast){const a=act[n];if(!a)return;const r=fast?.01:.05+P.rel*2;const t=A.currentTime;a.g.gain.cancelScheduledValues(t);a.g.gain.setValueAtTime(a.g.gain.value,t);a.g.gain.linearRampToValueAtTime(0,t+r);a.o.stop(t+r+.05);a.o2.stop(t+r+.05);delete act[n];notes[n]&&notes[n].classList.remove('on')}
keys.addEventListener('pointerdown',e=>{const n=e.target.dataset.n;if(n!==undefined){on(+n);const up=()=>{off(+n);removeEventListener('pointerup',up)};addEventListener('pointerup',up)}});
const km={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,';':16};
addEventListener('keydown',e=>{if(e.repeat)return;const n=km[e.key];if(n!==undefined)on(n);if(e.key===' '){e.preventDefault();toggle()}if(e.key==='z')setOct(-1);if(e.key==='x')setOct(1)});addEventListener('keyup',e=>{const n=km[e.key];if(n!==undefined)off(n)});
document.querySelectorAll('#wv button').forEach(b=>b.onclick=()=>{wave=b.dataset.w;document.querySelectorAll('#wv button').forEach(o=>o.classList.toggle('on',o===b))});
function setOct(d){oct=Math.max(-2,Math.min(2,oct+d));document.getElementById('ov').textContent='OCT '+(4+oct);labels()}document.getElementById('om').onclick=()=>setOct(-1);document.getElementById('op').onclick=()=>setOct(1);
document.querySelectorAll('.dial').forEach(d=>{const set=()=>d.style.transform=`rotate(${-135+270*P[d.dataset.p]}deg)`;P[d.dataset.p]=+d.dataset.v;set();d.addEventListener('pointerdown',e=>{d.setPointerCapture(e.pointerId);let y=e.clientY;d.onpointermove=ev=>{P[d.dataset.p]=Math.max(0,Math.min(1,P[d.dataset.p]+(y-ev.clientY)/150));y=ev.clientY;set();upd()}});d.addEventListener('pointerup',()=>d.onpointermove=null);d.addEventListener('wheel',e=>{e.preventDefault();P[d.dataset.p]=Math.max(0,Math.min(1,P[d.dataset.p]-e.deltaY/1500));set();upd()},{passive:false})});upd();
// 16-step sequencer, a minor-pentatonic phrase by default
const pat=[0,null,7,null,12,10,null,7,3,null,5,null,7,null,10,12];const seqEl=document.getElementById('seq');const scale=[0,3,5,7,10,12,15];
pat.forEach((n,i)=>{const s=document.createElement('i');if(n!==null)s.className='on';s.title='Step '+(i+1);s.onclick=()=>{if(pat[i]===null){pat[i]=scale[Math.random()*scale.length|0];s.classList.add('on')}else{pat[i]=null;s.classList.remove('on')}};seqEl.appendChild(s)});
let playing=false,stp=0,tm;function toggle(){init();playing=!playing;document.getElementById('play').classList.toggle('on',playing);document.getElementById('play').textContent=playing?'■ SEQ':'▶ SEQ';clearInterval(tm);if(playing){stp=0;tm=setInterval(tick,135)}else[...seqEl.children].forEach(s=>s.classList.remove('now'))}
function tick(){[...seqEl.children].forEach((s,i)=>s.classList.toggle('now',i===stp));const n=pat[stp];if(n!==null)on(n,110);const led=document.getElementById('led');led.classList.toggle('on',stp%4===0);stp=(stp+1)%16}
document.getElementById('play').onclick=toggle;
let view=0;document.getElementById('vm').onclick=()=>{view=1-view;document.getElementById('vm').textContent=view?'SPECTRUM ⇄':'SCOPE ⇄'};
const sc=document.getElementById('sc'),x=sc.getContext('2d');const buf=new Uint8Array(2048);
function f(t){const w2=sc.clientWidth*2,h2=sc.clientHeight*2;if(sc.width!==w2){sc.width=w2;sc.height=h2}x.clearRect(0,0,w2,h2);x.strokeStyle='rgba(255,106,26,.12)';x.lineWidth=1;for(let i=0;i<w2;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,h2);x.stroke()}for(let i=0;i<h2;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(w2,i);x.stroke()}
x.strokeStyle='#ff6a1a';x.fillStyle='#ff6a1a';x.lineWidth=3;x.shadowColor='#ff6a1a';x.shadowBlur=12;
if(an&&view){an.getByteFrequencyData(buf);const n=96;for(let i=0;i<n;i++){const v=buf[Math.floor(Math.pow(i/n,1.7)*600)]/255;x.fillRect(i/n*w2+2,h2-v*h2*.9,w2/n-4,v*h2*.9)}}
else{x.beginPath();if(an){an.getByteTimeDomainData(buf);let z=0;for(let i=1;i<1024;i++)if(buf[i-1]<128&&buf[i]>=128){z=i;break}for(let i=0;i<w2;i++){const v=buf[z+Math.floor(i/w2*900)]/128-1;const y=h2/2+v*h2*.42;i?x.lineTo(i,y):x.moveTo(i,y)}}else{for(let i=0;i<w2;i++){const y=h2/2+Math.sin(i*.03+t*.003)*h2*.18*Math.sin(t*.001);i?x.lineTo(i,y):x.moveTo(i,y)}}x.stroke()}x.shadowBlur=0;requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
