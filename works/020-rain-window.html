<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform Four</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;800&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#0a0c14}canvas{position:fixed;inset:0;width:100%;height:100%}
.t{position:fixed;left:6vw;top:8vh;color:#ffd2a1;font-family:'Big Shoulders Display',sans-serif;text-transform:uppercase;z-index:2;text-shadow:0 0 20px rgba(255,160,80,.4)}.t h1{font-weight:800;font-size:clamp(44px,9vw,140px);line-height:.85;letter-spacing:.02em}.t p{font-weight:300;font-size:clamp(14px,1.6vw,22px);letter-spacing:.4em;margin-top:12px;color:#9fb6d9}</style></head><body>
<canvas id="bg"></canvas><canvas id="fog" style="opacity:.55"></canvas><canvas id="c"></canvas><div class="t"><h1>Platform<br>Four</h1><p>23:14 to Halden — delayed · wipe the glass</p></div>
<script>
const bg=document.getElementById('bg'),b=bg.getContext('2d'),c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,1.5);let W,H,drops=[],lights=[];const fg=document.getElementById('fog'),fx=fg.getContext('2d');
function size(){W=bg.width=c.width=fg.width=innerWidth*dpr;H=bg.height=c.height=fg.height=innerHeight*dpr;fx.fillStyle='rgb(140,155,185)';fx.fillRect(0,0,W,H);lights=Array.from({length:70},()=>({x:Math.random()*W,y:H*.35+Math.random()*H*.6,r:(10+Math.random()*50)*dpr,h:[30,20,200,350,45][Math.random()*5|0],a:.15+Math.random()*.4,p:Math.random()*6}))}
size();addEventListener('resize',size);
function drawBg(t){const g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0c14');g.addColorStop(1,'#1c1a2a');b.fillStyle=g;b.fillRect(0,0,W,H);b.globalCompositeOperation='lighter';
for(const l of lights){const a=l.a*(.75+.25*Math.sin(t*.001+l.p));const rg=b.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r);rg.addColorStop(0,`hsla(${l.h},90%,65%,${a})`);rg.addColorStop(.7,`hsla(${l.h},90%,55%,${a*.6})`);rg.addColorStop(1,'hsla(0,0%,0%,0)');b.fillStyle=rg;b.beginPath();b.arc(l.x,l.y,l.r,0,7);b.fill()}b.globalCompositeOperation='source-over'}
let lw=null;addEventListener('pointermove',e=>{const X=e.clientX*dpr,Y=e.clientY*dpr,R=70*dpr;fx.globalCompositeOperation='destination-out';fx.lineCap='round';fx.lineWidth=R*1.6;fx.strokeStyle='rgba(0,0,0,.9)';fx.beginPath();fx.moveTo(...(lw||[X,Y]));fx.lineTo(X,Y);fx.stroke();fx.globalCompositeOperation='source-over';lw=[X,Y];drops=drops.filter(d=>Math.hypot(d.x-X,d.y-Y)>R)});addEventListener('pointerleave',()=>lw=null);
function spawn(big){drops.push({x:Math.random()*W,y:Math.random()*H*(big?1:.9),r:(big?3+Math.random()*7:1+Math.random()*2.2)*dpr,v:0,m:big})}
for(let i=0;i<500;i++)spawn(false);for(let i=0;i<60;i++)spawn(true);
function f(t){drawBg(t);x.clearRect(0,0,W,H);fx.fillStyle='rgba(140,155,185,.0035)';fx.fillRect(0,0,W,H);if(Math.random()<.4)spawn(true);if(Math.random()<.8)spawn(false);
for(let i=drops.length-1;i>=0;i--){const d=drops[i];if(d.m&&d.r>5*dpr&&Math.random()<.02)d.v=Math.max(d.v,1.5);if(d.v>0){d.v+=.05;d.y+=d.v*dpr;d.x+=Math.sin(d.y*.05)*.3;if(Math.random()<.3)drops.push({x:d.x,y:d.y-d.r,r:d.r*.35,v:0,m:false,tr:1});d.r*=.999}
const sx=d.x+(d.x-W/2)*.02,sy=d.y-d.r*3;x.save();x.beginPath();x.arc(d.x,d.y,d.r,0,7);x.clip();x.drawImage(bg,sx-d.r*3,sy-d.r*3,d.r*6,d.r*6,d.x-d.r,d.y-d.r,d.r*2,d.r*2);x.restore();
x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=d.r*.25;x.beginPath();x.arc(d.x,d.y+d.r*.1,d.r*.92,.3,Math.PI-.3);x.stroke();x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.arc(d.x-d.r*.3,d.y-d.r*.35,d.r*.22,0,7);x.fill();
if(d.y>H+20||(d.tr&&Math.random()<.004))drops.splice(i,1)}if(drops.length>1600)drops.splice(0,200);
x.fillStyle='rgba(120,140,180,.05)';x.fillRect(0,0,W,H);requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
