<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shanshui Scroll</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#d8d0bd}canvas{display:block;width:100%;height:100%;cursor:pointer}
.poem{position:fixed;right:6vw;top:7vh;writing-mode:vertical-rl;font:clamp(18px,2.4vw,30px)/1.6 'Ma Shan Zheng',serif;color:#2a2620;letter-spacing:.2em}.seal{position:fixed;right:6vw;top:calc(7vh + 13em);width:34px;height:34px;background:#a82a1d;opacity:.85;border-radius:3px}</style></head><body>
<canvas id="c"></canvas><div class="poem">远山无数叠<br>一舟入烟波</div><div class="seal"></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H;
let P;const fd=t=>t*t*t*(t*(t*6-15)+10),lp=(a,b,t)=>a+t*(b-a),gr=(h,x,y)=>{h&=7;const u=h<4?x:y,v=h<4?y:x;return((h&1)?-u:u)+((h&2)?-2*v:2*v)};
function N(x,y){let X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);const u=fd(x),v=fd(y),a=P[X]+Y,b=P[X+1]+Y;return lp(lp(gr(P[a],x,y),gr(P[b],x-1,y),u),lp(gr(P[a+1],x,y-1),gr(P[b+1],x-1,y-1),u),v)}
function seed(){P=new Uint8Array(512);for(let i=0;i<256;i++)P[i]=i;for(let i=255;i>0;i--){const j=Math.random()*(i+1)|0;[P[i],P[j]]=[P[j],P[i]]}for(let i=0;i<256;i++)P[i+256]=P[i]}
function paper(){x.fillStyle='#d8d0bd';x.fillRect(0,0,W,H);const d=x.getImageData(0,0,W,H);for(let i=0;i<d.data.length;i+=4){const n=(Math.random()-.5)*14;d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n}x.putImageData(d,0,0)}
function ridge(base,amp,freq,ink,k){const pts=[];for(let X=0;X<=W;X+=2*dpr){const u=X/W;let y=base-Math.abs(N(u*freq+k*10,k))*amp-N(u*freq*3,k+3)*amp*.25-Math.pow(Math.max(0,N(u*freq*.5+k,9+k)),2)*amp*1.4;pts.push([X,y])}
for(let i=0;i<pts.length;i++){const [X,y]=pts[i];const g=x.createLinearGradient(0,y,0,y+amp*1.1);g.addColorStop(0,`rgba(30,28,25,${ink})`);g.addColorStop(.25,`rgba(30,28,25,${ink*.55})`);g.addColorStop(1,'rgba(30,28,25,0)');x.fillStyle=g;x.fillRect(X,y,2*dpr+.5,amp*1.1)}
x.strokeStyle=`rgba(20,18,15,${Math.min(.9,ink*1.6)})`;x.lineWidth=1.3*dpr;x.beginPath();pts.forEach(([X,y],i)=>{const j=y+N(X*.05,k)*1.5*dpr;i?x.lineTo(X,j):x.moveTo(X,j)});x.stroke();
for(let i=0;i<pts.length;i+=3){const [X,y]=pts[i];if(Math.random()<.5){x.strokeStyle=`rgba(20,18,15,${ink*.6})`;x.lineWidth=.8*dpr;x.beginPath();x.moveTo(X,y+2*dpr);x.lineTo(X+(Math.random()-.5)*6*dpr,y+(6+Math.random()*amp*.25)*1);x.stroke()}}
for(let i=0;i<pts.length;i+=6){const [X,y]=pts[i];if(N(X*.01,k+5)>.15&&Math.random()<.5){tree(X,y,ink)}}}
function tree(X,y,ink){x.fillStyle=`rgba(20,18,15,${ink*.9})`;const h=(6+Math.random()*10)*dpr;x.fillRect(X,y-h,.9*dpr,h);for(let i=0;i<5;i++){x.beginPath();x.ellipse(X+(Math.random()-.5)*5*dpr,y-h+i*h*.18,(4-i*.5)*dpr,1.4*dpr,0,0,7);x.fill()}}
function mist(y,h){const g=x.createLinearGradient(0,y-h,0,y+h);g.addColorStop(0,'rgba(216,208,189,0)');g.addColorStop(.5,'rgba(216,208,189,.85)');g.addColorStop(1,'rgba(216,208,189,0)');x.fillStyle=g;x.fillRect(0,y-h,W,h*2)}
function paint(){seed();W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;paper();
const L=[[.42,.32,2.2,.12],[.55,.28,2.8,.2],[.66,.24,3.6,.32],[.76,.2,4.5,.5],[.88,.14,5,.75]];L.forEach(([b,a,f,ink],k)=>{ridge(H*b,H*a,f,ink,k+Math.random()*5);mist(H*(b+.03),H*.05)});
x.fillStyle='rgba(216,208,189,.9)';x.fillRect(0,H*.9,W,H*.1);x.strokeStyle='rgba(30,28,25,.25)';x.lineWidth=dpr;for(let i=0;i<14;i++){const y=H*(.91+Math.random()*.08),X=Math.random()*W;x.beginPath();x.moveTo(X,y);x.lineTo(X+(20+Math.random()*60)*dpr,y);x.stroke()}
const bx=W*(.3+Math.random()*.3),by=H*.935;x.fillStyle='#1e1c19';x.beginPath();x.moveTo(bx-14*dpr,by);x.quadraticCurveTo(bx,by+5*dpr,bx+14*dpr,by-2*dpr);x.lineTo(bx-14*dpr,by);x.fill();x.fillRect(bx-1*dpr,by-9*dpr,1.5*dpr,8*dpr);x.beginPath();x.arc(bx-1*dpr,by-10*dpr,2*dpr,0,7);x.fill();
x.fillStyle='rgba(168,42,29,.12)';x.beginPath();x.arc(W*.2,H*.18,Math.min(W,H)*.06,0,7);x.fill()}
paint();addEventListener('resize',paint);c.addEventListener('click',paint);
</script></body></html>
