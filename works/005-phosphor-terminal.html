<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phosphor Terminal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@500;700&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{background:radial-gradient(90% 80% at 50% 30%,#2a2119,#0e0b08);display:grid;place-items:center;font-family:VT323,ui-monospace,monospace;--ph:#ffb000;--gl:#ff8c00;--bg0:#2a1700;--bg1:#120900}
body.green{--ph:#4dff7a;--gl:#00c94a;--bg0:#032a10;--bg1:#011207}body.white{--ph:#e8f0ff;--gl:#8fb4ff;--bg0:#1a1f2a;--bg1:#07090f}
.desk{position:fixed;left:0;right:0;bottom:0;height:16vh;background:linear-gradient(#3a2c20,#1d150f);box-shadow:0 -1px 0 #4c3a2a}
.mon{position:relative;width:min(94vw,1100px);height:min(88vh,790px);display:flex;flex-direction:column;align-items:center;animation:drop 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes drop{from{transform:translateY(20px);opacity:0}}
.bezel{position:relative;width:100%;flex:1;background:linear-gradient(160deg,#cfc4ad,#a99d86 40%,#8c816c);border-radius:26px;padding:clamp(18px,3.2vw,44px) clamp(18px,3.2vw,44px) clamp(40px,6vh,64px);box-shadow:0 40px 80px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -6px 12px rgba(0,0,0,.25)}
.inner{position:relative;width:100%;height:100%;border-radius:22px;background:#191612;padding:10px;box-shadow:inset 0 4px 14px rgba(0,0,0,.9)}
.scr{position:relative;width:100%;height:100%;border-radius:38px/28px;background:radial-gradient(ellipse at center,var(--bg0) 0%,var(--bg1) 75%,#020100 100%);overflow:hidden;box-shadow:inset 0 0 90px #000,inset 0 0 14px #000;cursor:text}
.scr::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(rgba(0,0,0,.38) 0 1px,transparent 1px 3px);pointer-events:none;z-index:2}
.scr::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 35% 25%,rgba(255,255,255,.09),transparent 45%);pointer-events:none;z-index:4;animation:fl .1s infinite}
@keyframes fl{50%{opacity:.82}}
.roll{position:absolute;left:0;right:0;height:18%;background:linear-gradient(transparent,rgba(255,255,255,.035),transparent);z-index:3;pointer-events:none;animation:roll 7s linear infinite}@keyframes roll{from{top:-20%}to{top:110%}}
#o{position:absolute;inset:0;padding:4.2% 5%;color:var(--ph);font-size:clamp(16px,2.3vw,27px);line-height:1.15;white-space:pre-wrap;word-break:break-word;text-shadow:0 0 3px var(--gl),0 0 14px color-mix(in srgb,var(--gl) 55%,transparent),2px 0 0 rgba(255,0,60,.15),-2px 0 0 rgba(0,200,255,.12);overflow:hidden;z-index:1;transform-origin:center;transition:filter .3s}
.cur{display:inline-block;width:.6em;height:1em;background:var(--ph);vertical-align:-.12em;animation:b 1s steps(1) infinite;box-shadow:0 0 10px var(--gl)}@keyframes b{50%{opacity:0}}
.pw{position:absolute;inset:0;z-index:5;background:#000;pointer-events:none;display:grid;place-items:center}
.pw i{width:100%;height:2px;background:#fff;box-shadow:0 0 30px #fff,0 0 80px var(--ph);animation:on 1.1s cubic-bezier(.7,0,.2,1) forwards}
@keyframes on{0%{transform:scaleX(0);opacity:1}40%{transform:scaleX(1);height:2px}70%{height:100%;opacity:.8}100%{height:100%;opacity:0}}
.pw.done{animation:fo .5s forwards}@keyframes fo{to{opacity:0}}
.deg #o{animation:deg 1.2s cubic-bezier(.2,.8,.2,1)}@keyframes deg{0%{transform:scale(1.04) skewX(4deg);filter:hue-rotate(90deg) saturate(3)}30%{transform:scale(.98) skewX(-3deg);filter:hue-rotate(-60deg)}60%{transform:skewX(1deg)}100%{transform:none;filter:none}}
.plate{position:absolute;left:50%;bottom:clamp(12px,2.2vh,22px);transform:translateX(-50%);font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.32em;color:#4b4335;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.led{position:absolute;right:clamp(28px,5vw,64px);bottom:clamp(16px,2.6vh,26px);display:flex;gap:16px;align-items:center}
.led i{width:8px;height:8px;border-radius:50%;background:#3a2e1c;box-shadow:inset 0 1px 2px #000}.led i.on{background:#7dff6a;box-shadow:0 0 8px #7dff6a}.led i.hd.on{background:#ff9d2a;box-shadow:0 0 8px #ff9d2a}
.knob{position:absolute;left:clamp(28px,5vw,64px);bottom:clamp(12px,2.2vh,20px);display:flex;gap:12px}
.knob button{width:22px;height:22px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#6d6352,#2a241b);box-shadow:0 2px 3px rgba(0,0,0,.5);cursor:pointer;position:relative}
.knob button::after{content:"";position:absolute;left:50%;top:3px;width:2px;height:7px;margin-left:-1px;background:#d8cdb4;border-radius:1px}
.knob button:nth-child(2)::after{transform:rotate(90deg);transform-origin:1px 8px}.knob button:nth-child(3)::after{transform:rotate(200deg);transform-origin:1px 8px}
.stand{width:28%;height:4vh;background:linear-gradient(#8c816c,#5f574a);clip-path:polygon(14% 0,86% 0,100% 100%,0 100%)}
input{position:absolute;left:-9999px;opacity:0}
</style></head><body>
<div class="desk"></div>
<div class="mon"><div class="bezel"><div class="inner"><div class="scr" id="scr"><div id="o"></div><div class="roll"></div><div class="pw" id="pw"><i></i></div></div></div>
<div class="knob"><button title="Amber phosphor" aria-label="Amber phosphor" data-c=""></button><button title="Green phosphor" aria-label="Green phosphor" data-c="green"></button><button title="White phosphor" aria-label="White phosphor" data-c="white"></button></div>
<div class="plate">HELIOS · 7</div><div class="led"><i class="hd" id="hd"></i><i class="on"></i></div></div><div class="stand"></div></div>
<input id="k" autocomplete="off" autocapitalize="characters" aria-label="Terminal input">
<script>
const o=document.getElementById('o'),k=document.getElementById('k'),hd=document.getElementById('hd'),scr=document.getElementById('scr');let buf='',ready=false,line='',hist=[],hi=0,busy=false;
let ac;function beep(f=880,d=.08,v=.05,type='square'){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const os=ac.createOscillator(),g=ac.createGain();os.type=type;os.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);os.connect(g).connect(ac.destination);os.start();os.stop(ac.currentTime+d+.02)}catch(e){}}
function tick(){beep(1800+Math.random()*400,.015,.012,'square')}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(){o.innerHTML=esc(buf+(ready&&!busy?'> '+line:''))+'<span class="cur"></span>';let guard=0;while(o.scrollHeight>o.clientHeight+2&&guard++<60){buf=buf.split('\n').slice(1).join('\n');o.innerHTML=esc(buf+(ready&&!busy?'> '+line:''))+'<span class="cur"></span>'}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function type(s,d=12){hd.classList.add('on');for(const ch of s){buf+=ch;render();if(d>4&&ch!==' ')tick();await wait(d)}buf+='\n';render();hd.classList.remove('on')}
const boot=["HELIOS-7 ROM BIOS v2.04  (C) 1983 AMBER SYSTEMS CORP.","","MEMORY TEST ........ 640K OK","DISK 0 ............. 10MB WINCHESTER","CLOCK .............. "+new Date().toTimeString().slice(0,8),"","LOADING KERNEL ░░░░░░░░░░░░░░░░",
"   _  _ ___ _    ___ ___  ___ "," | || | __| |  |_ _/ _ \\/ __|"," | __ | _|| |__ | | (_) \\__ \\"," |_||_|___|____|___\\___/|___/","","TYPE HELP FOR A LIST OF COMMANDS.",""];
(async()=>{await wait(1200);document.getElementById('pw').classList.add('done');beep(60,.6,.08,'sawtooth');for(const l of boot){if(l.startsWith('LOADING')){buf+='LOADING KERNEL ';for(let i=0;i<16;i++){buf+='█';render();beep(220+i*20,.03,.02);await wait(40)}buf+=' 100%\n';continue}await type(l,l.startsWith(' ')?2:9)}ready=true;render()})();
const fort=["THE BEST WAY TO PREDICT THE FUTURE IS TO INVENT IT.","THERE ARE 10 KINDS OF PEOPLE.","BEWARE OF BUGS IN THE ABOVE CODE; I HAVE ONLY PROVED IT CORRECT, NOT TRIED IT.","A CLEAN DISK IS A HAPPY DISK.","PHOSPHOR FADES. IDEAS PERSIST.","SIMPLICITY IS PREREQUISITE FOR RELIABILITY."];
const files={'README.TXT':"WELCOME TO HELIOS-7.\nTHIS MACHINE REMEMBERS NOTHING BUT IS GLAD YOU CAME.\nTRY: COLOR GREEN, MATRIX, DEGAUSS, PLAY.",'LETTER.TXT':"DEAR READER,\nTHE SCREEN GLOWS BECAUSE ELECTRONS STRIKE PHOSPHOR.\nIT KEEPS GLOWING A MOMENT AFTER. SO DO WE.\n                     - THE OPERATOR",'AUTOEXEC.BAT':"@ECHO OFF\nPROMPT $P$G\nPATH C:\\;C:\\DOS\nWIN"};
function setColor(c){document.body.className=c||'';beep(440,.05,.03)}
const cmds={
help:()=>"COMMANDS:\n  HELP  DIR  TYPE <FILE>  DATE  TIME  FORTUNE\n  COLOR AMBER|GREEN|WHITE  MATRIX  DEGAUSS  PLAY\n  ECHO <TEXT>  WHOAMI  CLEAR  REBOOT\n  ↑ ↓ RECALL HISTORY",
dir:()=>" VOLUME IN DRIVE C IS HELIOS\n\n README   TXT      214  11-04-83\n LETTER   TXT      181  11-09-83\n AUTOEXEC BAT       48  11-01-83\n GAMES        <DIR>     10-30-83\n        3 FILE(S)   9,416,704 BYTES FREE",
type:a=>{const f=(a[0]||'').toUpperCase();return files[f]||files[f+'.TXT']||(f?'FILE NOT FOUND - '+f:'REQUIRED PARAMETER MISSING')},
date:()=>new Date().toDateString().toUpperCase(),time:()=>new Date().toTimeString().slice(0,8),
fortune:()=>fort[Math.random()*fort.length|0],whoami:()=>"GUEST@HELIOS-7  (UID 0451)",
color:a=>{const m={amber:'',green:'green',white:'white'}[(a[0]||'').toLowerCase()];if(m===undefined)return'USAGE: COLOR AMBER|GREEN|WHITE';setColor(m);return'PHOSPHOR SET TO '+a[0].toUpperCase()},
clear:()=>{buf='';return null},
degauss:()=>{scr.classList.remove('deg');void scr.offsetWidth;scr.classList.add('deg');beep(50,.9,.12,'sawtooth');return'*THUNK*'},
reboot:async()=>{buf='';ready=false;render();await wait(400);location.reload();return null},
play:async()=>{busy=true;const tune=[523,659,784,1046,784,659,523,392,523];for(const n of tune){beep(n,.14,.04);buf+='♪';render();await wait(150)}busy=false;return' '},
matrix:async()=>{busy=true;const cols=48;for(let r=0;r<22;r++){let s='';for(let i=0;i<cols;i++)s+=Math.random()<.5?String.fromCharCode(0x30+Math.random()*42|0):' ';buf+=s+'\n';render();tick();await wait(45)}busy=false;return'WAKE UP.'}};
async function run(raw){const c=raw.trim(),[w,...r]=c.split(/\s+/);const lw=(w||'').toLowerCase();buf+='> '+raw+'\n';if(c){hist.push(raw);hi=hist.length}render();
let out=lw==='echo'?r.join(' ').toUpperCase():(cmds[lw]?await cmds[lw](r):(c?'BAD COMMAND OR FILE NAME':''));if(out)await type(out,4);render()}
document.addEventListener('click',e=>{if(e.target.closest('.knob'))return;k.focus()});k.focus();
document.querySelectorAll('.knob button').forEach(b=>b.onclick=()=>setColor(b.dataset.c));
document.addEventListener('keydown',async e=>{if(!ready||busy)return;if(e.key==='Enter'){const l=line;line='';busy=true;await run(l);busy=false;render()}else if(e.key==='Backspace'){line=line.slice(0,-1);tick();render()}else if(e.key==='ArrowUp'){if(hi>0){hi--;line=hist[hi].toUpperCase();render()}}else if(e.key==='ArrowDown'){hi=Math.min(hist.length,hi+1);line=(hist[hi]||'').toUpperCase();render()}else if(e.key.length===1&&!e.metaKey&&!e.ctrlKey){line+=e.key.toUpperCase();tick();render()}});
</script></body></html>
