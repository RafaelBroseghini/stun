<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello 1986</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Shrikhand&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
body{--bg:#fdf3e1;--card:#ffd23f;background:var(--bg);background-image:radial-gradient(#1a1a1a 1.5px,transparent 2px);background-size:26px 26px;font-family:'Lilita One',sans-serif;transition:background-color .6s}
.s{position:absolute;left:0;top:0;cursor:grab;will-change:transform;touch-action:none;filter:drop-shadow(5px 5px 0 rgba(26,26,26,.9))}.s:active{cursor:grabbing}.s svg{display:block}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-3deg);background:var(--card);border:5px solid #1a1a1a;box-shadow:16px 16px 0 #1a1a1a;padding:4vh 5vw;text-align:center;z-index:5;transition:transform .4s cubic-bezier(.2,.9,.3,1.6),background .6s;cursor:pointer}
.card:hover{transform:translate(-50%,-52%) rotate(-1deg) scale(1.02)}.card:active{transform:translate(-50%,-48%) rotate(-4deg) scale(.98);box-shadow:8px 8px 0 #1a1a1a}
.card h1{font:400 clamp(48px,11vw,170px)/.85 Shrikhand,cursive;color:#ff5c8a;-webkit-text-stroke:4px #1a1a1a;paint-order:stroke fill;text-shadow:8px 8px 0 #3ec1d3}
.card h1 span{display:inline-block;animation:wig 2.4s ease-in-out infinite}.card h1 span:nth-child(2n){animation-delay:-.6s}@keyframes wig{50%{transform:translateY(-6%) rotate(-4deg)}}
.card p{font-size:clamp(14px,1.6vw,22px);letter-spacing:.2em;margin-top:2vh;color:#1a1a1a}.card p span{background:#1a1a1a;color:var(--bg);padding:2px 10px}
.pal{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:6}.pal button{width:34px;height:34px;border:4px solid #1a1a1a;border-radius:50%;cursor:pointer;box-shadow:4px 4px 0 #1a1a1a;transition:transform .2s}.pal button:hover{transform:translate(-2px,-2px)}
</style></head><body>
<div class="card" id="card"><h1 id="h1">Hello,<br>1986</h1><p>a party for <span>squiggles</span> &amp; shapes</p><p style="font-size:13px;margin-top:10px;opacity:.75">fling the shapes · hold anywhere to call them · click the card to shuffle</p></div>
<div class="pal" id="pal"></div>
<script>
const PALS=[['#ff5c8a','#3ec1d3','#ffd23f','#7d5fff','#1a1a1a','#26de81','#fdf3e1','#ffd23f'],['#ff6b35','#004e89','#f7c548','#1a1a1a','#ef476f','#06d6a0','#fff6e6','#06d6a0'],['#f72585','#4cc9f0','#ffbe0b','#3a0ca3','#1a1a1a','#fb5607','#f1faee','#4cc9f0']];let pi=0;
const pal=document.getElementById('pal');PALS.forEach((p,i)=>{const b=document.createElement('button');b.style.background=`conic-gradient(${p[0]} 0 33%,${p[1]} 0 66%,${p[2]} 0)`;b.setAttribute('aria-label','Palette '+(i+1));b.onclick=()=>setPal(i);pal.appendChild(b)});
const r=a=>a[Math.random()*a.length|0];let C=PALS[0].slice(0,6);
const S=[c=>`<svg width="140" height="50" viewBox="0 0 140 50"><path d="M5 25q15-25 30 0t30 0 30 0 30 0" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/></svg>`,c=>`<svg width="90" height="80"><polygon points="45,5 85,75 5,75" fill="${c}" stroke="#1a1a1a" stroke-width="4"/></svg>`,c=>`<svg width="80" height="80"><circle cx="40" cy="40" r="32" fill="none" stroke="${c}" stroke-width="12"/></svg>`,
c=>`<svg width="70" height="70"><rect x="8" y="8" width="54" height="54" fill="${c}" stroke="#1a1a1a" stroke-width="4"/><path d="M8 26h54M8 44h54" stroke="#1a1a1a" stroke-width="3"/></svg>`,c=>`<svg width="110" height="110"><path d="M10 100A90 90 0 0 1 100 10V100Z" fill="${c}"/><g fill="#1a1a1a"><circle cx="70" cy="70" r="4"/><circle cx="50" cy="80" r="4"/><circle cx="80" cy="45" r="4"/></g></svg>`,c=>`<svg width="60" height="60"><path d="M30 5v50M5 30h50" stroke="${c}" stroke-width="10" stroke-linecap="round"/></svg>`,c=>`<svg width="130" height="40"><path d="M5 35L25 5 45 35 65 5 85 35 105 5 125 35" fill="none" stroke="${c}" stroke-width="7" stroke-linejoin="round"/></svg>`,
c=>`<svg width="90" height="90"><circle cx="45" cy="45" r="38" fill="${c}" stroke="#1a1a1a" stroke-width="4"/><path d="M20 45h50M45 20v50" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="4 5"/></svg>`];
const items=[];let mx=-1e4,my=-1e4,hold=false;
let ac;function boop(f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.8,ac.currentTime+.08);g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.18);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}catch(e){}}
function spawn(X,Y,vx=0,vy=0){const d=document.createElement('div');d.className='s';const si=Math.random()*S.length|0,ci=Math.random()*6|0;d.innerHTML=S[si](C[ci]);d.si=si;d.ci=ci;document.body.appendChild(d);const it={d,x:X,y:Y,vx,vy,a:Math.random()*360,va:(Math.random()-.5)*2,s:.5+Math.random()*.8,drag:false};items.push(it);
d.addEventListener('pointerdown',e=>{e.stopPropagation();d.setPointerCapture(e.pointerId);it.drag=true;it.ox=e.clientX-it.x;it.oy=e.clientY-it.y;it.lx=e.clientX;it.ly=e.clientY;d.style.zIndex=4;boop(300+si*60)});
d.addEventListener('pointermove',e=>{if(!it.drag)return;it.vx=e.clientX-it.lx;it.vy=e.clientY-it.ly;it.lx=e.clientX;it.ly=e.clientY;it.x=e.clientX-it.ox;it.y=e.clientY-it.oy;it.va=it.vx*.6});
d.addEventListener('pointerup',()=>{it.drag=false;d.style.zIndex=''});return it}
for(let i=0;i<34;i++)spawn(Math.random()*innerWidth*.94,Math.random()*innerHeight*.92);
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});addEventListener('pointerdown',e=>{hold=true;mx=e.clientX;my=e.clientY});addEventListener('pointerup',()=>hold=false);
function setPal(i){pi=i;const p=PALS[i];C=p.slice(0,6);document.body.style.setProperty('--bg',p[6]);document.body.style.setProperty('--card',p[7]);items.forEach(it=>it.d.innerHTML=S[it.d.si](C[it.d.ci]));boop(500)}
document.getElementById('card').addEventListener('click',e=>{e.stopPropagation();boop(660);items.forEach(it=>{const a=Math.random()*6.28,s=8+Math.random()*14;it.vx=Math.cos(a)*s;it.vy=Math.sin(a)*s;it.va=(Math.random()-.5)*30});for(let i=0;i<12;i++){const a=Math.random()*6.28;const it=spawn(innerWidth/2,innerHeight/2,Math.cos(a)*16,Math.sin(a)*16);it.temp=true;setTimeout(()=>{it.d.remove();items.splice(items.indexOf(it),1)},5000)}});
document.getElementById('card').addEventListener('pointerdown',e=>e.stopPropagation());
const h1=document.getElementById('h1');h1.innerHTML=h1.innerHTML.split('<br>').map(l=>[...l].map(ch=>`<span>${ch}</span>`).join('')).join('<br>');
addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=3)setPal(n-1);if(e.key===' '){e.preventDefault();document.getElementById('card').click()}});
(function f(t){for(const it of items){if(!it.drag){const dx=it.x-mx,dy=it.y-my,dist=Math.hypot(dx,dy)||1;if(hold){it.vx-=dx/dist*1.2;it.vy-=dy/dist*1.2}else if(dist<200){const k=(200-dist)*.012;it.vx+=dx/dist*k;it.vy+=dy/dist*k}
it.vx+=Math.sin(t*.0007+it.s*9)*.03;it.vy+=Math.cos(t*.0009+it.s*7)*.03;it.vx*=.94;it.vy*=.94;it.va*=.96;it.x+=it.vx;it.y+=it.vy;
const w=it.d.offsetWidth||80,h=it.d.offsetHeight||80;if(it.x<-w*.3){it.x=-w*.3;it.vx*=-.7}if(it.y<-h*.3){it.y=-h*.3;it.vy*=-.7}if(it.x>innerWidth-w*.7){it.x=innerWidth-w*.7;it.vx*=-.7}if(it.y>innerHeight-h*.7){it.y=innerHeight-h*.7;it.vy*=-.7}}
it.a+=it.va+.05;it.d.style.transform=`translate(${it.x}px,${it.y}px) rotate(${it.a}deg) scale(${it.s})`}requestAnimationFrame(f)})(0);
</script></body></html>
