<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello 1986</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Shrikhand&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#fdf3e1;background-image:radial-gradient(#1a1a1a 1.5px,transparent 2px);background-size:26px 26px;font-family:'Lilita One',sans-serif}
.s{position:absolute;animation:fl var(--d) ease-in-out infinite alternate}@keyframes fl{to{transform:translate(var(--tx),var(--ty)) rotate(var(--r))}}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-3deg);background:#ffd23f;border:5px solid #1a1a1a;box-shadow:16px 16px 0 #1a1a1a;padding:4vh 5vw;text-align:center;z-index:5}
.card h1{font:400 clamp(48px,11vw,170px)/.85 Shrikhand,cursive;color:#ff5c8a;-webkit-text-stroke:4px #1a1a1a;paint-order:stroke fill;text-shadow:8px 8px 0 #3ec1d3}
.card p{font-size:clamp(14px,1.6vw,22px);letter-spacing:.2em;margin-top:2vh;color:#1a1a1a}.card p span{background:#1a1a1a;color:#fdf3e1;padding:2px 10px}</style></head><body>
<div class="card"><h1>Hello,<br>1986</h1><p>a party for <span>squiggles</span> &amp; shapes</p></div>
<script>
const C=['#ff5c8a','#3ec1d3','#ffd23f','#7d5fff','#1a1a1a','#26de81'];const r=a=>a[Math.random()*a.length|0];
const S=[c=>`<svg width="140" height="50" viewBox="0 0 140 50"><path d="M5 25q15-25 30 0t30 0 30 0 30 0" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/></svg>`,c=>`<svg width="90" height="80"><polygon points="45,5 85,75 5,75" fill="${c}" stroke="#1a1a1a" stroke-width="4"/></svg>`,c=>`<svg width="80" height="80"><circle cx="40" cy="40" r="32" fill="none" stroke="${c}" stroke-width="12"/></svg>`,
c=>`<svg width="70" height="70"><rect x="8" y="8" width="54" height="54" fill="${c}" stroke="#1a1a1a" stroke-width="4"/><path d="M8 26h54M8 44h54" stroke="#1a1a1a" stroke-width="3"/></svg>`,c=>`<svg width="110" height="110"><path d="M10 100A90 90 0 0 1 100 10V100Z" fill="${c}"/><g fill="#1a1a1a"><circle cx="70" cy="70" r="4"/><circle cx="50" cy="80" r="4"/><circle cx="80" cy="45" r="4"/></g></svg>`,c=>`<svg width="60" height="60"><path d="M30 5v50M5 30h50" stroke="${c}" stroke-width="10" stroke-linecap="round"/></svg>`,c=>`<svg width="130" height="40"><path d="M5 35L25 5 45 35 65 5 85 35 105 5 125 35" fill="none" stroke="${c}" stroke-width="7" stroke-linejoin="round"/></svg>`];
for(let i=0;i<34;i++){const d=document.createElement('div');d.className='s';d.innerHTML=r(S)(r(C));d.style.left=Math.random()*94+'vw';d.style.top=Math.random()*92+'vh';d.style.transform=`rotate(${Math.random()*360}deg) scale(${.5+Math.random()})`;d.style.setProperty('--d',(3+Math.random()*5)+'s');d.style.setProperty('--tx',(Math.random()-.5)*40+'px');d.style.setProperty('--ty',(Math.random()-.5)*40+'px');d.style.setProperty('--r',(Math.random()*360)+'deg');document.body.appendChild(d)}
</script></body></html>
