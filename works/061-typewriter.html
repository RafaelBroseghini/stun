<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letter from Trieste</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#3b4a3a radial-gradient(ellipse at 50% 30%,#55684f,#2a3529);display:flex;flex-direction:column;align-items:center;font-family:'Special Elite',monospace}
.sheet{position:relative;margin-top:4vh;width:min(620px,92vw);height:62vh;background:#fbf8f1;box-shadow:0 10px 30px rgba(0,0,0,.4);padding:44px 54px;overflow:hidden;transition:transform .12s;background-image:linear-gradient(rgba(0,0,0,.025) 1px,transparent 1px);background-size:100% 3px}
#t{font-size:clamp(13px,1.7vw,17px);line-height:1.65;color:#1d1d24;white-space:pre-wrap;word-wrap:break-word}#t span{display:inline-block;white-space:pre}
.car{position:relative;width:min(760px,98vw);height:16vh;margin-top:-2vh;background:linear-gradient(#2a2a2a,#111);border-radius:16px 16px 8px 8px;box-shadow:0 20px 40px rgba(0,0,0,.6),inset 0 2px 0 #444;display:flex;justify-content:center;align-items:center}
.roll{position:absolute;top:-14px;left:3%;right:3%;height:28px;border-radius:14px;background:linear-gradient(#555,#111 60%,#333);box-shadow:0 4px 8px #000}.knob{position:absolute;top:-22px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#666,#111)}
.brand{color:#c9b27a;font-size:clamp(18px,2.6vw,30px);letter-spacing:.4em}.cur{display:inline-block;width:.55em;height:1.1em;background:#b3261e;opacity:.6;vertical-align:-.2em;animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.hint{position:fixed;bottom:2vh;color:#c9d3c0;font-size:12px;letter-spacing:.2em}</style></head><body>
<div class="sheet" id="sh"><div id="t"></div></div><div class="car"><div class="roll"></div><div class="knob" style="left:-10px"></div><div class="knob" style="right:-10px"></div><div class="brand">PALLAS · 1958</div></div><div class="hint">START TYPING — THE MACHINE IS YOURS</div>
<script>
const t=document.getElementById('t'),sh=document.getElementById('sh');const cur=document.createElement('span');cur.className='cur';t.appendChild(cur);
const msg=`Trieste, 14 March\n\nDear Margit,\n\nThe sea has been the colour of pewter all week and I have not left the flat except for bread and the newspaper. I bought a typewriter from the man below — it sticks on the "e", so forgive me.\n\nI think of the summer at the lake more than I should. Write to me. Tell me whether the old boat still floats.\n\nYours, always,\nL.`;
function key(ch){if(ch==='\n'){t.insertBefore(document.createElement('br'),cur);sh.style.transform='translateX(0)';return}const s=document.createElement('span');s.textContent=ch;s.style.transform=`translate(${(Math.random()-.5)*1.2}px,${(Math.random()-.5)*1.4}px) rotate(${(Math.random()-.5)*2}deg)`;s.style.opacity=.72+Math.random()*.28;if(ch==='e'&&Math.random()<.3)s.style.transform+=' translateY(-2px)';t.insertBefore(s,cur);sh.style.transform=`translateX(${-Math.random()*3}px)`;if(t.scrollHeight>sh.clientHeight-80)sh.scrollTop=1e9}
let i=0,user=false;function auto(){if(user||i>=msg.length)return;key(msg[i++]);setTimeout(auto,msg[i-1]==='\n'?380:28+Math.random()*90)}auto();
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey)return;if(!user){user=true}if(e.key==='Enter')key('\n');else if(e.key==='Backspace'){const p=cur.previousSibling;if(p)p.remove()}else if(e.key.length===1)key(e.key);e.preventDefault()});
</script></body></html>
