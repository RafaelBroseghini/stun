<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas of Invented Skies</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=Cormorant:ital@1&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#f4f1ec;color:#141414;font-family:'Cormorant SC',serif;display:grid;grid-template-columns:minmax(0,1fr) 300px}
.chart{display:grid;place-items:center;min-height:0}svg{width:min(94vh,100%);height:auto;max-height:96vh}
aside{border-left:1px solid #141414;padding:5vh 26px;display:flex;flex-direction:column;gap:16px}h1{font-size:30px;line-height:1;font-weight:700}h1 small{display:block;font:italic 16px Cormorant,serif;margin-top:8px}
#info{font:italic 18px/1.4 Cormorant,serif;min-height:8em}#info b{display:block;font:700 22px 'Cormorant SC',serif;font-style:normal;color:#b3261e}
.mag{display:flex;align-items:center;gap:10px;font-size:14px}.mag i{display:inline-block;border-radius:50%;background:#141414}
.cn{cursor:pointer}.cn line{stroke:#141414;stroke-width:.7;transition:stroke .2s,stroke-width .2s}.cn:hover line,.cn.on line{stroke:#b3261e;stroke-width:1.6}.cn text{font-size:7px;letter-spacing:1.5px;fill:#141414}.cn:hover text,.cn.on text{fill:#b3261e}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:1fr auto}aside{border:0;border-top:1px solid #141414;padding:12px 16px}#info{min-height:4em}.mag{display:none}}</style></head><body>
<div class="chart"><svg id="s" viewBox="-220 -220 440 440"></svg></div>
<aside><h1>Atlas Cœli Inventi<small>Plate VII · the northern circle of an imagined sky</small></h1><div id="info">Hover a constellation to read its entry.</div>
<div class="mag"><i style="width:9px;height:9px"></i>1<i style="width:6px;height:6px"></i>2<i style="width:4px;height:4px"></i>3<i style="width:2px;height:2px"></i>4</div><div style="font:italic 14px Cormorant,serif;opacity:.7">Declination circles every 15°; hour circles every 2ʰ.</div></aside>
<script>
const s=document.getElementById('s'),NS='http://www.w3.org/2000/svg';const el=(t,a,p=s)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
el('circle',{r:212,fill:'none',stroke:'#141414','stroke-width':2});el('circle',{r:205,fill:'none',stroke:'#141414','stroke-width':.5});
for(let i=0;i<360;i+=2)el('line',{x1:0,y1:-205,x2:0,y2:i%10?-209:-212,stroke:'#141414','stroke-width':.5,transform:`rotate(${i})`});
for(let d=1;d<=6;d++)el('circle',{r:d*33,fill:'none',stroke:'#141414','stroke-width':.25,'stroke-dasharray':d%2?'1 2':''});
for(let h=0;h<12;h++){el('line',{x1:0,y1:0,x2:0,y2:-205,stroke:'#141414','stroke-width':.25,transform:`rotate(${h*30})`});const a=(h*30-90)*Math.PI/180;el('text',{x:Math.cos(a)*216-4,y:Math.sin(a)*216+3,'font-size':7,'font-family':'Cormorant SC'}).textContent=(h*2)+'ʰ'}
const band=el('path',{d:'',fill:'rgba(20,20,20,.05)'});let dp='';for(let a=0;a<=360;a+=5){const r=130+Math.sin(a*Math.PI/45)*14,t=a*Math.PI/180;dp+=(a?'L':'M')+(Math.cos(t)*r)+' '+(Math.sin(t)*r)}for(let a=360;a>=0;a-=5){const r=100+Math.sin(a*Math.PI/30)*10,t=a*Math.PI/180;dp+='L'+(Math.cos(t)*r)+' '+(Math.sin(t)*r)}band.setAttribute('d',dp+'Z');
for(let i=0;i<700;i++){const r=Math.sqrt(R())*203,a=R()*Math.PI*2,m=Math.pow(R(),3)*2.2+.2;el('circle',{cx:Math.cos(a)*r,cy:Math.sin(a)*r,r:m*.6,fill:'#141414'})}
const C=[['The Lantern Bearer','Lucerna',-80,-60,'Said to rise over harbours on the night a ship is lost, so the families can find the shore.'],['The Heron','Ardea',60,-110,'A long-legged figure wading through the pale band of the sky; its eye is the brightest star of the plate.'],['The Spindle','Fusus',110,40,'Weavers in the old valleys timed their winter work by its turning around the pole.'],['The Twin Keys','Claves',-40,90,'Two short chains of stars, one golden and one blue, that never set.'],['The Sleeping Hare','Lepus Dormiens',-130,20,'Faint and curled, best seen on moonless autumn nights.'],['The Kettle','Ahenum',20,-20,'A small, homely asterism near the pole, beloved of sailors.']];
C.forEach(([n,l,cx,cy,d])=>{const g=el('g',{class:'cn'});const k=5+Math.floor(R()*4);let px=cx,py=cy;const pts=[[px,py]];for(let i=0;i<k;i++){px+=(R()-.5)*60;py+=(R()-.5)*60;pts.push([px,py])}
pts.forEach((p,i)=>{if(i)el('line',{x1:pts[i-1][0],y1:pts[i-1][1],x2:p[0],y2:p[1]},g);if(i>2&&R()<.3){const q=pts[i-2];el('line',{x1:q[0],y1:q[1],x2:p[0],y2:p[1]},g)}});
pts.forEach(p=>{const m=1.2+R()*2.4;el('circle',{cx:p[0],cy:p[1],r:m+1.5,fill:'#f4f1ec'},g);el('circle',{cx:p[0],cy:p[1],r:m,fill:'#141414'},g)});el('text',{x:cx,y:cy-10,'text-anchor':'middle'},g).textContent=l.toUpperCase();
el('rect',{x:Math.min(...pts.map(p=>p[0]))-6,y:Math.min(...pts.map(p=>p[1]))-14,width:Math.max(...pts.map(p=>p[0]))-Math.min(...pts.map(p=>p[0]))+12,height:Math.max(...pts.map(p=>p[1]))-Math.min(...pts.map(p=>p[1]))+20,fill:'transparent'},g);
g.onmouseenter=()=>{document.querySelectorAll('.cn').forEach(o=>o.classList.toggle('on',o===g));document.getElementById('info').innerHTML=`<b>${n}</b>${l} · ${d}`}});
el('text',{x:0,y:4,'text-anchor':'middle','font-size':10,'font-family':'Cormorant SC',fill:'#b3261e'}).textContent='✦ POLUS';
</script></body></html>
