<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Late Neon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neonderthaw&family=Tilt+Neon&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background-color:#2a1a1a;background-image:linear-gradient(90deg,transparent 48%,rgba(0,0,0,.45) 48% 50%,transparent 50%),linear-gradient(rgba(0,0,0,.45) 6%,transparent 6%);background-size:120px 60px,60px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;font-family:'Tilt Neon',sans-serif}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(90deg,#6b3a2e 0 58px,transparent 58px 60px),repeating-linear-gradient(#6b3a2e 0 28px,transparent 28px 30px);opacity:.0;pointer-events:none}
.wall{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,60,140,.28),transparent 60%),radial-gradient(ellipse at 50% 80%,rgba(60,200,255,.18),transparent 50%);pointer-events:none;transition:opacity .3s}
.br{position:fixed;inset:0;z-index:-1;background-color:#5b2f26;background-image:linear-gradient(#2a1a1a 3px,transparent 3px),linear-gradient(90deg,#2a1a1a 3px,transparent 3px),linear-gradient(90deg,#2a1a1a 3px,transparent 3px);background-size:100% 34px,90px 68px,90px 68px;background-position:0 0,0 0,45px 34px;filter:brightness(.55)}
.s1{font:400 clamp(70px,16vw,230px)/1 Neonderthaw,cursive;color:#ffd6ec;text-shadow:0 0 4px #fff,0 0 10px #ff3c8c,0 0 22px #ff3c8c,0 0 44px #ff3c8c,0 0 80px #ff3c8c;animation:fl 6s infinite}
.s2{font-size:clamp(22px,4vw,54px);letter-spacing:.35em;color:#d6f6ff;padding:.3em .8em;border:4px solid #d6f6ff;border-radius:16px;text-shadow:0 0 6px #3cc8ff,0 0 20px #3cc8ff,0 0 40px #3cc8ff;box-shadow:0 0 10px #3cc8ff,0 0 30px #3cc8ff,inset 0 0 20px #3cc8ff}
.s2 i{font-style:normal;animation:fl2 3.3s infinite}
@keyframes fl{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35;text-shadow:none}}@keyframes fl2{0%,40%,44%,100%{opacity:1}42%{opacity:.1}}
.off .s1,.off .s2,.off .s2 i{animation:none;text-shadow:none;box-shadow:none;color:#6b5a60;border-color:#6b5a60}.off .wall{opacity:0}
.sw{position:fixed;right:5vw;bottom:5vh;width:46px;height:80px;background:#ddd;border-radius:6px;box-shadow:0 6px 12px #0008;cursor:pointer;display:grid;place-items:center}.sw i{width:16px;height:34px;background:#999;border-radius:4px;transform:translateY(-12px);transition:.2s}.off .sw i{transform:translateY(12px)}</style></head><body>
<div class="br"></div><div class="wall"></div><div class="s1">open late</div><div class="s2">NOODLES · <i>BAR</i> · 24H</div><div class="sw" id="sw" title="power"><i></i></div>
<script>document.getElementById('sw').onclick=()=>document.body.classList.toggle('off')</script>
</body></html>
