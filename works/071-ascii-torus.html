<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASCII Torus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#2a160d;display:grid;place-items:center;color:#ffb070}
pre{font:700 clamp(7px,1.25vw,15px)/1 'Courier Prime',monospace;letter-spacing:.08em;background:linear-gradient(#ffe0a8,#ff8a3d 50%,#d9452a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px rgba(255,138,61,.35))}
p{position:fixed;left:24px;bottom:20px;font:700 12px 'Courier Prime',monospace;letter-spacing:.2em;color:#a86a48}</style></head><body>
<pre id="o"></pre><p>R1=1 · R2=2 · K2=5 · luminance ramp .,-~:;=!*#$@ · move to spin faster</p>
<script>
const o=document.getElementById('o');let A=0,B=0,sp=1;const cw=88,ch=44;addEventListener('pointermove',e=>sp=.4+e.clientX/innerWidth*2.4);
const R='.,-~:;=!*#$@';
function f(){A+=.04*sp;B+=.02*sp;const z=new Float32Array(cw*ch),b=new Array(cw*ch).fill(' ');const cA=Math.cos(A),sA=Math.sin(A),cB=Math.cos(B),sB=Math.sin(B);
for(let j=0;j<6.28;j+=.07){const ct=Math.cos(j),st=Math.sin(j);for(let i=0;i<6.28;i+=.02){const sp_=Math.sin(i),cp=Math.cos(i);const h=ct+2,D=1/(sp_*h*sA+st*cA+5),t=sp_*h*cA-st*sA;
const X=Math.floor(cw/2+cw*.42*D*(cp*h*cB-t*sB)),Y=Math.floor(ch/2+cw*.29*D*(cp*h*sB+t*cB)),k=X+cw*Y;const N=Math.floor(8*((st*sA-sp_*ct*cA)*cB-sp_*ct*sA-st*cA-cp*ct*sB));
if(Y>=0&&Y<ch&&X>=0&&X<cw&&D>z[k]){z[k]=D;b[k]=R[Math.max(0,Math.min(11,N))]}}}let s='';for(let y=0;y<ch;y++){s+=b.slice(y*cw,y*cw+cw).join('')+'\n'}o.textContent=s;requestAnimationFrame(f)}f();
</script></body></html>
