<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reef Tank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#0a4d68;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none}
.t{position:fixed;left:24px;top:20px;color:#e6fbff;font:500 13px Quicksand,sans-serif;letter-spacing:.1em;text-shadow:0 1px 10px rgba(0,40,60,.6);pointer-events:none;line-height:1.7}.t b{display:block;font-weight:700;font-size:30px;letter-spacing:.02em}
.ui{position:fixed;right:20px;top:20px;display:flex;gap:8px}.ui button{font:700 12px Quicksand;letter-spacing:.1em;color:#e6fbff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(6px)}.ui button[aria-pressed=true]{background:#e6fbff;color:#0a4d68}
.fed{position:fixed;left:24px;bottom:18px;color:#e6fbff;font:500 12px Quicksand;letter-spacing:.14em;opacity:.8;pointer-events:none}</style></head><body>
<canvas id="c"></canvas><div class="t"><b>Reef Tank</b>tap the water to drop food · double-tap to knock on the glass</div>
<div class="ui"><button id="lt" aria-pressed="false">☾ Night</button><button id="sn" aria-pressed="false">♪ Sound</button></div><div class="fed" id="fed">flakes eaten · 0</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let dpr,W,H,SY,reef,glow,cau,cx2,CW,CH;
let F=[],T=[],food=[],bub=[],snow=[],kelp=[],ripples=[],night=0,tnight=0,eaten=0,mouse={x:-1e4,y:-1e4,v:0,t:0};
const R=(a,b)=>a+Math.random()*(b-a);
// ---------- static reef ----------
function branch(g,x0,y0,a,len,w,d,col,tip){if(d<=0||len<2)return;const x1=x0+Math.cos(a)*len,y1=y0+Math.sin(a)*len;g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo((x0+x1)/2+R(-3,3)*dpr,(y0+y1)/2,x1,y1);g.stroke();
if(d===1){g.fillStyle=tip;g.beginPath();g.arc(x1,y1,w*.7,0,7);g.fill()}const n=Math.random()<.3?3:2;for(let i=0;i<n;i++)branch(g,x1,y1,a+R(-.6,.6),len*R(.62,.82),w*.72,d-1,col,tip)}
function fan(g,X,Y,s,col){g.strokeStyle=col;g.lineWidth=1.1*dpr;const rec=(x0,y0,a,l,d)=>{if(d<=0)return;const x1=x0+Math.cos(a)*l,y1=y0+Math.sin(a)*l;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();rec(x1,y1,a-R(.1,.35),l*.8,d-1);rec(x1,y1,a+R(.1,.35),l*.8,d-1)};g.lineWidth=2.4*dpr;rec(X,Y,-Math.PI/2,s*.3,1);g.lineWidth=1*dpr;for(let k=0;k<7;k++)rec(X,Y-s*.25,-Math.PI/2+(k-3)*.22,s*.22,6)}
function brain(g,X,Y,r,col,line){const gr=g.createRadialGradient(X-r*.3,Y-r*.5,0,X,Y,r);gr.addColorStop(0,col[0]);gr.addColorStop(1,col[1]);g.fillStyle=gr;g.beginPath();g.ellipse(X,Y,r,r*.62,0,Math.PI,0);g.fill();g.strokeStyle=line;g.lineWidth=1.4*dpr;for(let k=0;k<9;k++){g.beginPath();const yy=Y-r*.58+k*r*.065;for(let a=0;a<=1;a+=.04){const xx=X-r*.9+a*r*1.8;const lim=r*.62*Math.sqrt(Math.max(0,1-((xx-X)/r)**2));const py=Math.max(Y-lim,yy+Math.sin(a*30+k)*r*.03);a?g.lineTo(xx,py):g.moveTo(xx,py)}g.stroke()}}
function rock(g,X,Y,w,h){g.beginPath();const n=14;for(let i=0;i<=n;i++){const a=Math.PI+i/n*Math.PI,rr=1+R(-.12,.12);g.lineTo(X+Math.cos(a)*w*rr,Y+Math.sin(a)*h*rr)}g.closePath();const gr=g.createLinearGradient(0,Y-h,0,Y);gr.addColorStop(0,'#8a7a6a');gr.addColorStop(1,'#3a3430');g.fillStyle=gr;g.fill();for(let i=0;i<w*h/(60*dpr*dpr);i++){g.fillStyle=`rgba(${R(60,200)|0},${R(60,150)|0},${R(80,170)|0},.35)`;const a=Math.PI+Math.random()*Math.PI,rr=Math.random();g.beginPath();g.arc(X+Math.cos(a)*w*rr,Y+Math.sin(a)*h*rr,R(1,4)*dpr,0,7);g.fill()}}
function build(){dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;SY=H*.88;
reef=document.createElement('canvas');reef.width=W;reef.height=H;glow=document.createElement('canvas');glow.width=W;glow.height=H;const g=reef.getContext('2d'),q=glow.getContext('2d');
// sand
const sg=g.createLinearGradient(0,SY-H*.03,0,H);sg.addColorStop(0,'#e8d3a8');sg.addColorStop(1,'#b89868');g.fillStyle=sg;g.beginPath();g.moveTo(0,H);for(let X=0;X<=W;X+=10*dpr)g.lineTo(X,SY+Math.sin(X*.004/dpr)*H*.015);g.lineTo(W,H);g.fill();
for(let i=0;i<W*.6;i++){g.fillStyle=`rgba(${R(120,255)|0},${R(100,220)|0},${R(70,160)|0},.4)`;g.fillRect(Math.random()*W,SY+Math.random()*(H-SY),dpr,dpr)}
const sc=Math.min(W,H*1.6)/1400;const S=v=>v*sc*dpr/dpr*1;
const rocks=[[.12,.95,.16,.18],[.5,.97,.12,.12],[.8,.95,.2,.2],[.95,.97,.08,.1],[.33,.98,.08,.07]];for(const [u,v,w,h] of rocks)rock(g,u*W,v*H,w*W,h*H);
const cor=[['#ff6fa8','#ffd0e4','#3cff9a'],['#b46cff','#f0d8ff','#ff4fd8'],['#ff9a4a','#ffe0b0','#4ffff0'],['#ff5a6a','#ffd0d0','#a0ff3c']];
const place=[[.08,.82],[.2,.8],[.62,.86],[.74,.78],[.86,.8],[.92,.86],[.44,.88]];place.forEach(([u,v],i)=>{const k=cor[i%cor.length],X=u*W,Y=v*H,len=R(36,60)*dpr*Math.max(.7,sc*1.4);for(let j=0;j<3;j++){const a=-Math.PI/2+R(-.5,.5);branch(g,X+R(-10,10)*dpr,Y,a,len,9*dpr*Math.max(.7,sc*1.4),5,k[0],k[1]);q.globalAlpha=1;branch(q,X+R(-10,10)*dpr,Y,a,len,5*dpr,5,k[2],'#ffffff')}});
fan(g,W*.7,H*.82,H*.34,'rgba(150,60,170,.85)');fan(q,W*.7,H*.82,H*.34,'rgba(255,80,220,.7)');fan(g,W*.16,H*.8,H*.24,'rgba(230,120,60,.8)');fan(q,W*.16,H*.8,H*.24,'rgba(120,255,160,.7)');
brain(g,W*.42,H*.9,H*.09,['#d8c070','#7a6a2a'],'rgba(60,40,10,.45)');brain(q,W*.42,H*.9,H*.09,['rgba(80,255,120,.6)','rgba(0,120,60,.4)'],'rgba(200,255,120,.9)');brain(g,W*.9,H*.88,H*.07,['#a0d0a0','#3a6a4a'],'rgba(10,40,20,.5)');brain(q,W*.9,H*.88,H*.07,['rgba(120,200,255,.6)','rgba(0,60,160,.4)'],'rgba(140,220,255,.9)');
kelp=Array.from({length:7},(_,i)=>({x:(i<4?R(.0,.12):R(.88,1))*W,h:R(.35,.6)*H,w:R(10,18)*dpr,ph:R(0,6),c:Math.random()<.5?'#2f9e6e':'#4cb87a'}));
CW=Math.ceil(W/12);CH=Math.ceil(H/12);cau=document.createElement('canvas');cau.width=CW;cau.height=CH;cx2=cau.getContext('2d');cimg=cx2.createImageData(CW,CH);
snow=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,z:R(.3,1),p:R(0,6)}))}
let cimg;build();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{build();F.forEach(f=>{f.x=Math.min(f.x,W);f.y=Math.min(f.y,SY*.9)});T.forEach(f=>{f.x=Math.min(f.x,W);f.y=Math.min(f.y,SY*.9)})},150)});
// ---------- fish ----------
const SP={clown:{s:20,w:.36,c:['#ffa24a','#ff5a00'],band:1,tail:'#ff6a10'},tang:{s:30,w:.44,c:['#3f7bff','#1238a8'],tail:'#ffd23f',swoosh:1},ytang:{s:26,w:.56,c:['#fff04f','#ffc400'],tail:'#ffd400'},angel:{s:26,w:.52,c:['#f8f4e8','#cfc4a8'],stripes:1,tail:'#e8e0c8',tall:1},wrasse:{s:22,w:.28,c:['#5af0c8','#2a7aff'],tail:'#ff6ad0',lines:1}};
const kinds=['clown','clown','tang','ytang','ytang','angel','wrasse','tang','angel','wrasse'];
kinds.forEach(k=>F.push({sp:SP[k],k,x:R(.1,.9)*W,y:R(.15,.7)*H,vx:R(-1,1),vy:0,z:R(.55,1),ph:R(0,6),tx:0,ty:0,tt:0,turn:0,ang:0,gulp:0}));
for(let i=0;i<46;i++)T.push({x:W*.5+R(-80,80)*dpr,y:H*.4+R(-40,40)*dpr,vx:R(-1,1)*dpr,vy:R(-.5,.5)*dpr,ph:R(0,6)});
function fish(f,t){const sp=f.sp,s=sp.s*dpr*f.z*1.55*Math.max(.75,Math.min(1.5,W/(1300*dpr)));const spd=Math.hypot(f.vx,f.vy);f.ph+=.12+spd*.06/dpr;
x.save();x.translate(f.x,f.y);x.rotate(f.ang);if(Math.cos(f.ang)<0)x.scale(1,-1);
const N=16,top=[],bot=[];const wv=u=>Math.sin(f.ph-u*4)*s*.14*u*u+f.turn*u*u*s*2.2*(Math.cos(f.ang)<0?-1:1);const wd=u=>sp.w*s*Math.sin(Math.PI*Math.min(1,Math.pow(u,.72)*1.02))*(1-.55*Math.pow(u,5));
for(let i=0;i<=N;i++){const u=i/N,X=s-u*1.95*s,Y=wv(u),w=wd(u);top.push([X,Y-w]);bot.push([X,Y+w])}
const ty=wv(1),tx=-s*.95,fl=Math.sin(f.ph*1.2)*s*.06;
// tail and fins first
x.fillStyle=sp.tail;x.globalAlpha=.92;x.beginPath();x.moveTo(tx+s*.08,ty);x.quadraticCurveTo(tx-s*.25,ty-s*.2,tx-s*.42,ty-s*(sp.tall?.5:.38)+fl);x.quadraticCurveTo(tx-s*.28,ty,tx-s*.42,ty+s*(sp.tall?.5:.38)+fl);x.quadraticCurveTo(tx-s*.25,ty+s*.2,tx+s*.08,ty);x.fill();
const dor=sp.tall?.95:.32;x.beginPath();x.moveTo(top[3][0],top[3][1]);x.quadraticCurveTo(top[7][0],top[7][1]-s*dor,top[12][0]-s*(sp.tall?.3:0),top[12][1]-s*dor*(sp.tall?.9:.4));x.lineTo(top[12][0],top[12][1]);x.closePath();x.fillStyle=sp.c[1];x.fill();
if(sp.tall){x.beginPath();x.moveTo(bot[4][0],bot[4][1]);x.quadraticCurveTo(bot[8][0],bot[8][1]+s*.9,bot[12][0]-s*.35,bot[12][1]+s*.85);x.lineTo(bot[12][0],bot[12][1]);x.closePath();x.fill()}x.globalAlpha=1;
// body
const body=new Path2D();top.forEach(([X,Y],i)=>i?body.lineTo(X,Y):body.moveTo(X,Y));for(let i=bot.length-1;i>=0;i--)body.lineTo(bot[i][0],bot[i][1]);body.closePath();
const g=x.createLinearGradient(0,-s*sp.w,0,s*sp.w);g.addColorStop(0,sp.c[1]);g.addColorStop(.45,sp.c[0]);g.addColorStop(1,'#fff8e8');x.fillStyle=g;x.fill(body);
x.save();x.clip(body);
if(sp.band){for(const u of [.18,.5,.82]){const X=s-u*1.95*s,Y=wv(u);x.fillStyle='#111';x.fillRect(X-s*.12,Y-s,s*.24,s*2);x.fillStyle='#fff';x.fillRect(X-s*.08,Y-s,s*.16,s*2)}}
if(sp.stripes){x.fillStyle='rgba(20,20,20,.85)';for(const u of [.28,.5,.72])x.fillRect(s-u*1.95*s-s*.06,-s,s*.12,s*2)}
if(sp.swoosh){x.fillStyle='rgba(5,10,40,.85)';x.beginPath();x.ellipse(-s*.1,wv(.55)-s*.12,s*.55,s*.12,-.1,0,7);x.fill()}
if(sp.lines){x.strokeStyle='rgba(255,120,220,.8)';x.lineWidth=s*.05;for(const o of [-.12,.1]){x.beginPath();for(let i=0;i<=N;i++){const u=i/N;const X=s-u*1.95*s,Y=wv(u)+o*s;i?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke()}}
const sh=x.createLinearGradient(0,-s*sp.w,0,s*sp.w);sh.addColorStop(0,'rgba(255,255,255,.35)');sh.addColorStop(.35,'rgba(255,255,255,0)');x.fillStyle=sh;x.fillRect(-s*2,-s,s*4,s*2);x.restore();
// pectoral fin, eye, mouth
x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.ellipse(s*.25,wv(.38)+s*.1,s*.2,s*.08,.6+Math.sin(f.ph*2)*.4,0,7);x.fill();
const ex=s*.6,ey=wv(.2)-wd(.2)*.25,er=s*(sp.tall?.1:.12);x.fillStyle='#fff';x.beginPath();x.arc(ex,ey,er,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(ex+er*.2,ey,er*.6,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(ex+er*.35,ey-er*.3,er*.2,0,7);x.fill();
if(f.gulp>0){x.fillStyle='rgba(40,10,10,.6)';x.beginPath();x.arc(s*.98,wv(0),s*.06*f.gulp,0,7);x.fill();f.gulp-=.08}
x.restore()}
function tetra(f){const a=Math.atan2(f.vy,f.vx),s=8.5*dpr;x.save();x.translate(f.x,f.y);x.rotate(a);f.ph+=.4;const w=Math.sin(f.ph)*s*.25;
x.fillStyle='rgba(220,230,240,.55)';x.beginPath();x.moveTo(-s,0);x.lineTo(-s*1.7,-s*.4+w);x.lineTo(-s*1.7,s*.4+w);x.fill();x.beginPath();x.ellipse(0,0,s,s*.33,0,0,7);x.fill();
x.fillStyle='#ff3a4a';x.beginPath();x.ellipse(-s*.25,s*.12,s*.6,s*.14,0,0,7);x.fill();x.strokeStyle='#36e8ff';x.lineWidth=s*.16;x.shadowColor='#36e8ff';x.shadowBlur=night*8*dpr;x.beginPath();x.moveTo(s*.7,-s*.06);x.lineTo(-s*.9,-s*.04);x.stroke();x.restore()}
// ---------- audio ----------
let ac,son=false,amb;function A(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}const b=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*4}const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=380;amb=ac.createGain();amb.gain.value=0;s.connect(f).connect(amb).connect(ac.destination);s.start()}
function blip(f0,v=.05,dur=.08){if(!ac||!son)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*2.4,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur*1.4);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur*1.5)}
function knock(){if(!ac||!son)return;const t=ac.currentTime;for(let k=0;k<2;k++){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(180,t+k*.12);o.frequency.exponentialRampToValueAtTime(90,t+k*.12+.08);g.gain.setValueAtTime(.25,t+k*.12);g.gain.exponentialRampToValueAtTime(.0001,t+k*.12+.12);o.connect(g).connect(ac.destination);o.start(t+k*.12);o.stop(t+k*.12+.14)}}
document.getElementById('sn').onclick=e=>{A();son=!son;e.target.setAttribute('aria-pressed',son);if(amb)amb.gain.setTargetAtTime(son?.12:0,ac.currentTime,.3)};
document.getElementById('lt').onclick=e=>{tnight=tnight?0:1;e.target.setAttribute('aria-pressed',!!tnight);e.target.textContent=tnight?'☀ Day':'☾ Night'};
// ---------- input ----------
const pt=e=>[e.clientX*dpr,e.clientY*dpr];
c.addEventListener('pointermove',e=>{const [X,Y]=pt(e),n=performance.now();mouse.v=Math.hypot(X-mouse.x,Y-mouse.y)/Math.max(1,n-mouse.t);mouse.x=X;mouse.y=Y;mouse.t=n});
c.addEventListener('pointerdown',e=>{A();const [X,Y]=pt(e);for(let i=0;i<7;i++)food.push({x:X+R(-24,24)*dpr,y:Math.min(Y,SY-10*dpr),vy:R(.35,.7)*dpr,p:R(0,6),r:R(2,3.4)*dpr,c:Math.random()<.5?'#d8843a':'#c84a2a'});ripples.push({x:X,y:Y,r:0,l:1});blip(500,.03,.06)});
c.addEventListener('dblclick',e=>{const [X,Y]=pt(e);ripples.push({x:X,y:Y,r:0,l:1,k:1});knock();for(const f of [...F,...T]){const dx=f.x-X,dy=f.y-Y,d=Math.hypot(dx,dy)||1,k=Math.min(8,1800*dpr/d);f.vx+=dx/d*k*dpr*.5;f.vy+=dy/d*k*dpr*.5}});
c.addEventListener('pointerleave',()=>{mouse.x=-1e4});
addEventListener('keydown',e=>{if(e.key==='l'||e.key==='L')document.getElementById('lt').click();if(e.key==='Enter'){for(let i=0;i<10;i++)food.push({x:R(.2,.8)*W,y:R(0,.1)*H,vy:R(.35,.7)*dpr,p:R(0,6),r:3*dpr,c:'#d8843a'})}});
// ---------- frame ----------
function steerBig(f,t){let tx,ty,sp=.9;if(food.length){let b=null,bd=1e9;for(const p of food){const d=Math.hypot(p.x-f.x,p.y-f.y);if(d<bd){bd=d;b=p}}if(bd<W*.6){tx=b.x;ty=b.y;sp=2.2;if(bd<f.sp.s*dpr*f.z*.9){food.splice(food.indexOf(b),1);f.gulp=1;eaten++;document.getElementById('fed').textContent='flakes eaten · '+eaten;blip(220,.06,.1)}}}
if(tx===undefined){f.tt-=1;if(f.tt<0||Math.hypot(f.tx-f.x,f.ty-f.y)<30*dpr){f.tx=R(.05,.95)*W;f.ty=R(.12,.75)*H;f.tt=R(200,600)}tx=f.tx;ty=f.ty}
const md=Math.hypot(mouse.x-f.x,mouse.y-f.y);let ax=0,ay=0;if(md<140*dpr){const k=(1-md/(140*dpr))*(.5+Math.min(2,mouse.v))*2;ax-=(mouse.x-f.x)/md*k;ay-=(mouse.y-f.y)/md*k}
const dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy)||1,ms=sp*dpr*f.z*1.2;const dvx=dx/d*ms+ax*dpr,dvy=dy/d*ms*.7+ay*dpr;f.vx+=(dvx-f.vx)*.03;f.vy+=(dvy-f.vy)*.03;
if(f.y>SY-30*dpr)f.vy-=.1*dpr;if(f.y<H*.06)f.vy+=.1*dpr;f.x+=f.vx;f.y+=f.vy;if(f.x<-60*dpr)f.vx+=.2*dpr;if(f.x>W+60*dpr)f.vx-=.2*dpr;
const na=Math.atan2(f.vy,f.vx);let da=na-f.ang;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;if(Math.hypot(f.vx,f.vy)>.05*dpr){f.ang+=da*.12;f.turn+=(da*.5-f.turn)*.1}}
function boids(t){const cx=W*(.5+.3*Math.sin(t*.00013)),cy=H*(.38+.15*Math.sin(t*.00021));const ms=2.4*dpr;
for(const a of T){let sx=0,sy=0,ax=0,ay=0,cxs=0,cys=0,n=0;for(const b of T){if(a===b)continue;const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<(70*dpr)**2){ax+=b.vx;ay+=b.vy;cxs+=b.x;cys+=b.y;n++;if(d2<(14*dpr)**2){sx-=dx;sy-=dy}}}
if(n){a.vx+=(ax/n-a.vx)*.05+(cxs/n-a.x)*.0015;a.vy+=(ay/n-a.vy)*.05+(cys/n-a.y)*.0015}a.vx+=sx*.03+(cx-a.x)*.00012;a.vy+=sy*.03+(cy-a.y)*.00012;
const md=Math.hypot(mouse.x-a.x,mouse.y-a.y);if(md<120*dpr){a.vx-=(mouse.x-a.x)/md*.6*dpr;a.vy-=(mouse.y-a.y)/md*.6*dpr}for(const f of F){const d=Math.hypot(f.x-a.x,f.y-a.y);if(d<f.sp.s*dpr*1.8){a.vx-=(f.x-a.x)/d*.3*dpr;a.vy-=(f.y-a.y)/d*.3*dpr}}
