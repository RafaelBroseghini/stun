<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reef Tank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#0a4d68}canvas{display:block;width:100%;height:100%;cursor:pointer}
.t{position:fixed;left:24px;top:20px;color:#e6fbff;font:500 13px Quicksand,sans-serif;letter-spacing:.1em}.t b{display:block;font-weight:700;font-size:28px;letter-spacing:.02em}</style></head><body>
<canvas id="c"></canvas><div class="t"><b>Reef Tank</b>tap the water to drop food</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H,F=[],food=[],bub=[],weed=[];
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;weed=Array.from({length:22},()=>({x:Math.random()*W,h:(80+Math.random()*220)*dpr,c:Math.random()<.5?'#2f9e6e':'#57c785',ph:Math.random()*6}))}size();addEventListener('resize',size);
const cols=[['#ff7b54','#ffd56b'],['#ffd23f','#3a86ff'],['#f15bb5','#fee440'],['#00bbf9','#00f5d4'],['#ff595e','#ffffff'],['#9b5de5','#f15bb5']];
for(let i=0;i<16;i++)F.push({x:Math.random()*innerWidth*dpr,y:(.15+Math.random()*.6)*innerHeight*dpr,vx:(Math.random()-.5)*2,vy:0,s:(12+Math.random()*22)*dpr,c:cols[i%cols.length],ph:Math.random()*6,tx:0,ty:0,t:0});
c.addEventListener('pointerdown',e=>{for(let i=0;i<8;i++)food.push({x:e.clientX*dpr+(Math.random()-.5)*30*dpr,y:e.clientY*dpr,vy:.4+Math.random()*.4})});
function fish(f,t){const a=Math.atan2(f.vy,f.vx);x.save();x.translate(f.x,f.y);x.rotate(a);const s=f.s,w=Math.sin(t*.012*(1+Math.hypot(f.vx,f.vy)*.3)+f.ph)*.35;
x.fillStyle=f.c[1];x.beginPath();x.moveTo(-s*.8,0);x.lineTo(-s*1.5,-s*.55+w*s);x.lineTo(-s*1.35,w*s*.5);x.lineTo(-s*1.5,s*.55+w*s);x.closePath();x.fill();
const g=x.createLinearGradient(0,-s*.5,0,s*.5);g.addColorStop(0,f.c[0]);g.addColorStop(1,f.c[1]);x.fillStyle=g;x.beginPath();x.moveTo(s,0);x.bezierCurveTo(s*.6,-s*.65,-s*.6,-s*.6,-s*.9,0);x.bezierCurveTo(-s*.6,s*.6,s*.6,s*.65,s,0);x.fill();
x.fillStyle='rgba(255,255,255,.75)';x.fillRect(-s*.1,-s*.45,s*.12,s*.9);x.fillStyle='#fff';x.beginPath();x.arc(s*.55,-s*.12,s*.13,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(s*.58,-s*.12,s*.07,0,7);x.fill();x.restore()}
function f(t){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2fb6d6');g.addColorStop(.5,'#0a6b8a');g.addColorStop(1,'#053b4f');x.fillStyle=g;x.fillRect(0,0,W,H);
x.globalCompositeOperation='lighter';for(let i=0;i<6;i++){const X=W*(i/6)+Math.sin(t*.0003+i)*W*.05;const lg=x.createLinearGradient(X,0,X+W*.1,H);lg.addColorStop(0,'rgba(200,250,255,.12)');lg.addColorStop(1,'rgba(200,250,255,0)');x.fillStyle=lg;x.beginPath();x.moveTo(X,0);x.lineTo(X+W*.05,0);x.lineTo(X+W*.2,H);x.lineTo(X+W*.08,H);x.fill()}x.globalCompositeOperation='source-over';
x.fillStyle='#e8d3a8';x.beginPath();x.moveTo(0,H);for(let X=0;X<=W;X+=20)x.lineTo(X,H*.92+Math.sin(X*.004)*H*.02);x.lineTo(W,H);x.fill();
for(const w of weed){x.strokeStyle=w.c;x.lineWidth=7*dpr;x.lineCap='round';x.beginPath();x.moveTo(w.x,H*.94);for(let k=1;k<=10;k++){const y=H*.94-w.h*k/10;x.lineTo(w.x+Math.sin(t*.0015+w.ph+k*.5)*k*3*dpr,y)}x.stroke()}
for(let i=food.length-1;i>=0;i--){const p=food[i];p.y+=p.vy*dpr;x.fillStyle='#c9844a';x.fillRect(p.x,p.y,3*dpr,3*dpr);if(p.y>H*.92)food.splice(i,1)}
for(const fi of F){let tx,ty;if(food.length){let b=null,bd=1e9;for(const p of food){const d=Math.hypot(p.x-fi.x,p.y-fi.y);if(d<bd){bd=d;b=p}}tx=b.x;ty=b.y;if(bd<fi.s*.8)food.splice(food.indexOf(b),1)}else{fi.t-=1;if(fi.t<0){fi.tx=Math.random()*W;fi.ty=H*(.12+Math.random()*.68);fi.t=200+Math.random()*300}tx=fi.tx;ty=fi.ty}
const dx=tx-fi.x,dy=ty-fi.y,d=Math.hypot(dx,dy)||1,sp=food.length?.12:.03;fi.vx+=dx/d*sp*dpr;fi.vy+=dy/d*sp*dpr;fi.vx*=.97;fi.vy*=.97;fi.x+=fi.vx;fi.y+=fi.vy;fish(fi,t)}
if(Math.random()<.15)bub.push({x:W*.85+Math.random()*20,y:H*.93,r:(2+Math.random()*5)*dpr});x.strokeStyle='rgba(230,251,255,.7)';x.lineWidth=1.2*dpr;for(let i=bub.length-1;i>=0;i--){const b=bub[i];b.y-=(1+b.r*.15);b.x+=Math.sin(b.y*.03)*.6;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.stroke();if(b.y<0)bub.splice(i,1)}requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
