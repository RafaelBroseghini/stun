<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thunderhead</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;600&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#0c1018;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.t{position:fixed;right:5vw;top:6vh;text-align:right;color:#cfd8e8;font:300 15px Teko,sans-serif;letter-spacing:.3em;pointer-events:none}.t b{display:block;font-weight:600;font-size:clamp(40px,7vw,110px);letter-spacing:.04em;line-height:.9}
.ct{position:fixed;left:5vw;bottom:6vh;color:#cfd8e8;font:400 14px Teko;letter-spacing:.3em;pointer-events:none}.ct b{display:block;font:300 clamp(40px,5vw,70px)/1 Teko;letter-spacing:.02em;font-variant-numeric:tabular-nums}.ct span{opacity:.65}
.ch{position:fixed;left:50%;top:50%;width:80px;height:80px;margin:-40px;border-radius:50%;pointer-events:none;border:2px solid rgba(200,220,255,.7);opacity:0;box-shadow:0 0 20px rgba(170,200,255,.6)}
</style></head><body>
<canvas id="c"></canvas><div class="t"><b>THUNDER<br>HEAD</b>CLICK TO CALL DOWN A STRIKE · HOLD TO CHARGE</div>
<div class="ct"><span>FLASH TO BANG</span><b id="n">—</b><span id="km">count the seconds · ÷3 for km</span></div><div class="ch" id="ch"></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio||1,1.5);let W,H,flash=0,fx=0,bolts=[],rain=[],puddles=[],trees=[];
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;rain=Array.from({length:600},()=>[Math.random()*W,Math.random()*H,.6+Math.random()*.6]);puddles=Array.from({length:7},()=>[Math.random()*W,H*(.9+Math.random()*.08),(30+Math.random()*80)*dpr]);trees=Array.from({length:9},(_,i)=>[W*(i/9+Math.random()*.06),(40+Math.random()*60)*dpr,Math.random()*6])}size();addEventListener('resize',size);
const clouds=Array.from({length:60},(_,i)=>({x:Math.random()*1.2,y:Math.random()*.3,r:.06+Math.random()*.14,s:.00002+Math.random()*.00004,d:Math.random()}));
function bolt(x0,y0,x1,y1,w,d){const seg=[];let px=x0,py=y0;const n=22;for(let i=1;i<=n;i++){const t=i/n;const nx=x0+(x1-x0)*t+(Math.random()-.5)*W*.035*(1-t*.5),ny=y0+(y1-y0)*t;seg.push([px,py,nx,ny,w]);if(d<2&&Math.random()<.11){seg.push(...bolt(nx,ny,nx+(Math.random()-.5)*W*.25,ny+H*(.08+Math.random()*.2),w*.45,d+1))}px=nx;py=ny}return seg}
let ac,rg;function audio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(2,ac.sampleRate*3,ac.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let l=0;for(let i=0;i<d.length;i++){l=(l+.03*(Math.random()*2-1))/1.03;d[i]=l*3+(Math.random()*2-1)*.03}}const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=2200;rg=ac.createGain();rg.gain.value=0;rg.gain.linearRampToValueAtTime(.35,ac.currentTime+2);s.connect(f).connect(rg).connect(ac.destination);s.start()}catch(e){}}
function thunder(delay,power){if(!ac)return;const t=ac.currentTime+delay;const len=3+power*2,b=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+.05*(Math.random()*2-1))/1.05;const e=Math.min(1,i/(ac.sampleRate*.05))*Math.pow(1-i/d.length,2)*(1+.6*Math.sin(i/ac.sampleRate*9)*Math.random());d[i]=l*e*8}
const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=180+power*200;g.gain.value=.5+power*.4;s.connect(f).connect(g).connect(ac.destination);s.start(t)}
let timer=null;
function strike(X,power=1){X=X??W*(.15+Math.random()*.7);const dist=.4+Math.random()*3.6*(1.2-power*.4);bolts.push({s:bolt(X,H*.12,X+(Math.random()-.5)*W*.2,H*.88,(2.6+power*2)*dpr,0),l:1,x:X});flash=1;fx=X;
const sec=dist*3;thunder(Math.min(6,sec*.5),power);const t0=performance.now();clearInterval(timer);const n=document.getElementById('n'),km=document.getElementById('km');timer=setInterval(()=>{const e=(performance.now()-t0)/1000;if(e>=sec*.5){clearInterval(timer);n.textContent=sec.toFixed(1)+' s';km.textContent=`≈ ${dist.toFixed(1)} km away`}else n.textContent=(e*2).toFixed(1)+' s'},50)}
let hold=null;const ch=document.getElementById('ch');
c.addEventListener('pointerdown',e=>{audio();hold={t:performance.now(),x:e.clientX*dpr};ch.style.left=e.clientX+'px';ch.style.top=e.clientY+'px'});
c.addEventListener('pointerup',()=>{if(!hold)return;const p=Math.min(1,(performance.now()-hold.t)/1500);strike(hold.x,.6+p);hold=null;ch.style.opacity=0});
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();audio();strike()}});
setInterval(()=>{if(Math.random()<.45)strike(undefined,.6)},3400);
function f(t){const fl=flash*.6;const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${20+fl*120},${26+fl*130},${40+fl*160})`);g.addColorStop(1,`rgb(${12+fl*60},${16+fl*70},${24+fl*90})`);x.fillStyle=g;x.fillRect(0,0,W,H);
// clouds lit from the strike point
for(const cl of clouds){cl.x=(cl.x+cl.s)%1.3;const cx=(cl.x-.1)*W,cy=cl.y*H,r=cl.r*Math.max(W,H);const near=Math.exp(-Math.pow((cx-fx)/(W*.25),2));const lit=fl*(.4+near*1.2);const gg=x.createRadialGradient(cx,cy+r*.2,0,cx,cy,r);gg.addColorStop(0,`rgba(${50+lit*160},${55+lit*160},${70+lit*170},${.5+cl.d*.2})`);gg.addColorStop(1,'rgba(20,26,40,0)');x.fillStyle=gg;x.fillRect(cx-r,cy-r,r*2,r*2)}
if(hold){const p=Math.min(1,(performance.now()-hold.t)/1500);ch.style.opacity=.3+p*.7;ch.style.transform=`scale(${1.2-p*.6})`;x.strokeStyle=`rgba(200,220,255,${p*.6})`;x.lineWidth=dpr;for(let k=0;k<3;k++){const ax=hold.x+(Math.random()-.5)*60*dpr;x.beginPath();x.moveTo(ax,H*.15);x.lineTo(ax+(Math.random()-.5)*30*dpr,H*.15+Math.random()*60*dpr);x.stroke()}}
for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];x.globalCompositeOperation='lighter';x.lineCap='round';for(const [a,bb,cc,d,w] of b.s){x.strokeStyle=`rgba(170,200,255,${b.l*.3})`;x.lineWidth=w*5;x.beginPath();x.moveTo(a,bb);x.lineTo(cc,d);x.stroke();x.strokeStyle=`rgba(255,255,255,${b.l})`;x.lineWidth=w;x.beginPath();x.moveTo(a,bb);x.lineTo(cc,d);x.stroke()}
const gl=x.createRadialGradient(b.x,H*.88,0,b.x,H*.88,140*dpr);gl.addColorStop(0,`rgba(200,220,255,${b.l*.5})`);gl.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gl;x.fillRect(b.x-140*dpr,H*.88-140*dpr,280*dpr,280*dpr);x.globalCompositeOperation='source-over';b.l-=.03+Math.random()*.04;if(b.l>.3&&Math.random()<.1)b.l=1;if(b.l<=0)bolts.splice(i,1)}
flash*=.88;
// land, wind-bent trees, cottage
x.fillStyle='#05070b';x.beginPath();x.moveTo(0,H);for(let X=0;X<=W;X+=10)x.lineTo(X,H*.86-Math.sin(X*.003)*H*.03-Math.sin(X*.011)*H*.01);x.lineTo(W,H);x.fill();
for(const [tx2,th,p] of trees){const by=H*.86-Math.sin(tx2*.003)*H*.03-Math.sin(tx2*.011)*H*.01;const bend=Math.sin(t*.002+p)*8*dpr-10*dpr;x.strokeStyle='#05070b';x.lineWidth=4*dpr;x.beginPath();x.moveTo(tx2,by);x.quadraticCurveTo(tx2+bend*.3,by-th*.5,tx2+bend,by-th);x.stroke();x.fillStyle='#05070b';x.beginPath();x.ellipse(tx2+bend,by-th,th*.35,th*.45,bend*.01,0,7);x.fill()}
const tx=W*.72,ty=H*.85;x.fillStyle='#05070b';x.fillRect(tx-30*dpr,ty-50*dpr,60*dpr,50*dpr);x.beginPath();x.moveTo(tx-40*dpr,ty-50*dpr);x.lineTo(tx,ty-80*dpr);x.lineTo(tx+40*dpr,ty-50*dpr);x.fill();const flick=flash>.8?0:.8;x.fillStyle=`rgba(255,200,110,${flick})`;x.fillRect(tx-14*dpr,ty-36*dpr,12*dpr,14*dpr);
// puddles mirror the flash
for(const [px,py,pw] of puddles){x.fillStyle=`rgba(${60+fl*180},${70+fl*190},${90+fl*200},${.25+fl*.5})`;x.beginPath();x.ellipse(px,py,pw,pw*.12,0,0,7);x.fill()}
x.strokeStyle='rgba(170,190,220,.35)';x.lineWidth=dpr;x.beginPath();for(const r of rain){r[1]+=18*r[2]*dpr;r[0]-=3*dpr;if(r[1]>H){r[1]=-20;r[0]=Math.random()*W*1.1}x.moveTo(r[0],r[1]);x.lineTo(r[0]+3*dpr,r[1]-16*dpr*r[2])}x.stroke();
requestAnimationFrame(f)}
strike();requestAnimationFrame(f);
</script></body></html>
