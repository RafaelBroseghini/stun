<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gear Train</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Text:wght@700&family=Overpass+Mono&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}body{background:#0b2224;font-family:'Overpass Mono',monospace;color:#e9c79a}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.t{position:fixed;left:4vw;top:5vh;pointer-events:none}.t h1{font:700 clamp(30px,5vw,72px)/.9 'Big Shoulders Stencil Text',sans-serif;letter-spacing:.04em;text-shadow:0 4px 20px rgba(0,0,0,.5)}.t p{font-size:12px;letter-spacing:.12em;margin-top:10px;opacity:.85;line-height:1.8}
.ctl{position:fixed;right:4vw;bottom:5vh;display:flex;flex-direction:column;gap:8px;align-items:flex-end;font-size:11px;letter-spacing:.2em}.ctl input{width:220px;accent-color:#e08a4a}
.ctl button{font:11px 'Overpass Mono';letter-spacing:.16em;background:rgba(233,199,154,.08);border:1px solid #e9c79a66;color:#e9c79a;padding:6px 12px;cursor:pointer}.ctl button[aria-pressed=true]{background:#e9c79a;color:#0b2224}
.tip{position:fixed;pointer-events:none;font-size:11px;letter-spacing:.1em;background:rgba(11,34,36,.85);border:1px solid #e9c79a55;padding:6px 10px;line-height:1.6;opacity:0;transition:opacity .2s;white-space:nowrap}
.hint{position:fixed;left:4vw;bottom:5vh;font-size:11px;letter-spacing:.16em;opacity:.65;line-height:1.8}</style></head><body>
<canvas id="c"></canvas>
<div class="t"><h1>GEAR TRAIN<br>NO. 6</h1><p id="r">driver 12 rpm</p></div>
<div class="ctl"><label for="sp">MOTOR SPEED · <span id="sv">12</span> RPM</label><input id="sp" type="range" min="-60" max="60" value="12"><div style="display:flex;gap:8px"><button id="bp" aria-pressed="false">BLUEPRINT</button><button id="sn" aria-pressed="false">♪ SOUND</button></div></div>
<div class="hint">drag any gear or the crank · B blueprint · space stop</div><div class="tip" id="tip"></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,S,OX,OY,bgc=null;const M=8;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;if(BB){const bw=BB[2]-BB[0],bh=BB[3]-BB[1],narrow=innerWidth<760;const aw=W*(narrow?.94:.74),ah=H*(narrow?.62:.78);S=Math.min(aw/bw,ah/bh);const cx=narrow?W/2:W*.58,cy=narrow?H*.52:H*.5;OX=cx-(BB[0]+bw/2)*S;OY=cy-(BB[1]+bh/2)*S}bgc=null}let BB=null;addEventListener('resize',size);
const MET={brass:['#f6dc9a','#c9a15a','#6a4a1c'],copper:['#f8b48a','#c0703a','#5a2a10'],steel:['#eef2f4','#9aa4ac','#3a4248'],bronze:['#e0b070','#8a6030','#3a240c']};
function tooth(z){const r=z*M/2,ra=r+M,rf=r-1.25*M,p=new Path2D(),t=Math.PI*2/z;for(let i=0;i<z;i++){const a=i*t;const P=[[rf,a-t*.5],[rf,a-t*.3],[r*.99,a-t*.22],[ra,a-t*.12],[ra,a+t*.12],[r*.99,a+t*.22],[rf,a+t*.3]];P.forEach(([R,A],k)=>{const X=Math.cos(A)*R,Y=Math.sin(A)*R;(i||k)?p.lineTo(X,Y):p.moveTo(X,Y)})}p.closePath();return p}
const G=[{z:36,x:-180,y:40,m:'brass',crank:true}];
function addTo(g,z,ang,m){const d=(g.z+z)*M/2;const n={z,x:g.x+Math.cos(ang)*d,y:g.y+Math.sin(ang)*d,m,par:g,a:ang};G.push(n);return n}
const g1=addTo(G[0],18,-.5,'steel'),g2=addTo(g1,48,-.2,'copper'),g3=addTo(g2,14,1.2,'brass'),g4=addTo(G[0],24,2.4,'bronze'),g5=addTo(g4,12,2.9,'steel'),g6=addTo(g2,22,.45,'brass'),g7=addTo(g3,30,1.2,'steel');
BB=[1e9,1e9,-1e9,-1e9];G.forEach(g=>{const r=g.z*M/2+M+4;BB[0]=Math.min(BB[0],g.x-r);BB[1]=Math.min(BB[1],g.y-r);BB[2]=Math.max(BB[2],g.x+r);BB[3]=Math.max(BB[3],g.y+r)});size();
G.forEach((g,i)=>{g.P=tooth(g.z);g.r=g.z*M/2;g.i=i;g.ratio=g.par?-g.par.ratio*g.par.z/g.z:1;g.spokes=g.z>=22?(g.z>40?6:5):0});
// angle propagation: each child's angle follows from its parent so the teeth always mesh
let root=0,vel=0;function solve(){for(const g of G){if(!g.par){g.th=root;continue}const p=g.par,r=p.z/g.z;g.th=-(p.th-g.a)*r+g.a+Math.PI+Math.PI/g.z}}
function rootFor(g,th){while(g.par){const p=g.par,r=p.z/g.z;th=g.a-(th-g.a-Math.PI-Math.PI/g.z)/r;g=p}return th}
// ---------- background plate ----------
function plate(){bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;const g=bgc.getContext('2d');const rg=g.createRadialGradient(W*.5,H*.4,0,W*.5,H*.4,Math.max(W,H)*.8);rg.addColorStop(0,'#1e4a4c');rg.addColorStop(1,'#071a1c');g.fillStyle=rg;g.fillRect(0,0,W,H);
g.strokeStyle='rgba(233,199,154,.05)';g.lineWidth=dpr;const st=40*S;for(let X=OX%st;X<W;X+=st){g.beginPath();g.moveTo(X,0);g.lineTo(X,H);g.stroke()}for(let Y=OY%st;Y<H;Y+=st){g.beginPath();g.moveTo(0,Y);g.lineTo(W,Y);g.stroke()}
for(let i=0;i<4000;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.025})`;g.fillRect(Math.random()*W,Math.random()*H,dpr,dpr)}
for(const [u,v] of [[.03,.06],[.97,.06],[.03,.94],[.97,.94]]){const X=u*W,Y=v*H,r=9*dpr;const sg=g.createRadialGradient(X-r*.3,Y-r*.3,0,X,Y,r);sg.addColorStop(0,'#cfd6da');sg.addColorStop(1,'#3a4248');g.fillStyle=sg;g.beginPath();g.arc(X,Y,r,0,7);g.fill();g.strokeStyle='#1a2226';g.lineWidth=2*dpr;g.beginPath();g.moveTo(X-r*.6,Y-r*.2);g.lineTo(X+r*.6,Y+r*.2);g.stroke()}}
// ---------- audio ----------
let ac,son=false,hum,hg;function A(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}hum=ac.createOscillator();hum.type='sawtooth';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=600;hg=ac.createGain();hg.gain.value=0;hum.connect(f).connect(hg).connect(ac.destination);hum.start()}
function tick(k){if(!ac||!son)return;const t=ac.currentTime,b=ac.createBuffer(1,ac.sampleRate*.02|0,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);const s=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;bp.type='bandpass';bp.frequency.value=2200+k*300;bp.Q.value=4;g.gain.value=.25;s.connect(bp).connect(g).connect(ac.destination);s.start(t)}
// ---------- interaction ----------
const sp=document.getElementById('sp');let motor=12,drag=null,blue=false,hovG=null;sp.oninput=()=>{motor=+sp.value;document.getElementById('sv').textContent=motor};
const W2=(e)=>[(e.clientX*dpr-OX)/S,(e.clientY*dpr-OY)/S];
function hit(px,py){for(let i=G.length-1;i>=0;i--){const g=G[i];if(Math.hypot(px-g.x,py-g.y)<g.r+M)return g}const g=G[0],ca=crankPos();if(Math.hypot(px-ca[0],py-ca[1])<22)return g;return null}
function crankPos(){const g=G[0],L=g.r*.78;return[g.x+Math.cos(g.th)*L,g.y+Math.sin(g.th)*L]}
c.addEventListener('pointerdown',e=>{A();const [px,py]=W2(e),g=hit(px,py);if(!g)return;c.setPointerCapture(e.pointerId);drag={g,pa:Math.atan2(py-g.y,px-g.x),th:g.th,lt:performance.now(),lr:root};vel=0;c.style.cursor='grabbing'});
c.addEventListener('pointermove',e=>{const [px,py]=W2(e);if(drag){const g=drag.g;let a=Math.atan2(py-g.y,px-g.x),da=a-drag.pa;if(da>Math.PI)da-=Math.PI*2;if(da<-Math.PI)da+=Math.PI*2;drag.th+=da;drag.pa=a;const nr=rootFor(g,drag.th),now=performance.now();vel=(nr-root)/Math.max(8,now-drag.lt)*1000;drag.lt=now;root=nr;return}
const g=hit(px,py);hovG=g;c.style.cursor=g?'grab':'default';const tip=document.getElementById('tip');if(g){tip.style.opacity=1;tip.style.left=e.clientX+16+'px';tip.style.top=e.clientY+14+'px';tip.innerHTML=`${g.z} TEETH · ${g.m.toUpperCase()}<br>RATIO ${(Math.abs(g.ratio)).toFixed(3)} : 1 ${g.ratio<0?'↺':'↻'}<br>${(curRpm*g.ratio).toFixed(1)} RPM`}else tip.style.opacity=0});
addEventListener('pointerup',()=>{if(drag){drag=null;c.style.cursor='default'}});
document.getElementById('bp').onclick=e=>{blue=!blue;e.target.setAttribute('aria-pressed',blue)};document.getElementById('sn').onclick=e=>{A();son=!son;e.target.setAttribute('aria-pressed',son);if(hg)hg.gain.setTargetAtTime(0,ac.currentTime,.05)};
addEventListener('keydown',e=>{if(e.key==='b'||e.key==='B')document.getElementById('bp').click();if(e.key===' '){e.preventDefault();sp.value=0;sp.oninput();vel=0}if(e.key==='Enter'){vel+=6}});
// ---------- render ----------
let last=performance.now(),curRpm=12,teethPassed=0;solve();
function gear(g){const [hi,mid,lo]=MET[g.m];const X=OX+g.x*S,Y=OY+g.y*S,sc=S;
x.save();x.translate(X,Y);x.scale(sc,sc);
// drop shadow
x.save();x.translate(6/sc*dpr,10/sc*dpr);x.rotate(g.th);x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=16*dpr;x.fillStyle='rgba(0,0,0,.4)';x.fill(g.P);x.restore();
x.save();x.rotate(g.th);
// body with cut-outs
const body=new Path2D();body.addPath(g.P);const r=g.r;if(g.spokes){const n=g.spokes;for(let k=0;k<n;k++){const a0=k/n*Math.PI*2+.18,a1=(k+1)/n*Math.PI*2-.18,ri=r*.3,ro=r*.7;const h=new Path2D();h.moveTo(Math.cos(a0)*ri,Math.sin(a0)*ri);h.arc(0,0,ro,a0,a1);h.lineTo(Math.cos(a1)*ri,Math.sin(a1)*ri);h.arc(0,0,ri,a1,a0,true);h.closePath();body.addPath(h)}}
x.fillStyle=mid;x.fill(body,'evenodd');x.clip(body,'evenodd');x.rotate(-g.th);
// fixed light: brushed conic sheen and a diagonal key light that do not spin with the gear
if(x.createConicGradient){const cg=x.createConicGradient(-.6,0,0);[[0,'rgba(255,255,255,.0)'],[.08,'rgba(255,255,255,.35)'],[.16,'rgba(255,255,255,0)'],[.5,'rgba(0,0,0,.15)'],[.58,'rgba(255,255,255,.25)'],[.66,'rgba(255,255,255,0)'],[1,'rgba(255,255,255,0)']].forEach(([o,cc])=>cg.addColorStop(o,cc));x.fillStyle=cg;x.fillRect(-r-M,-r-M,(r+M)*2,(r+M)*2)}
const lg=x.createLinearGradient(-r,-r,r,r);lg.addColorStop(0,hi);lg.addColorStop(.5,'rgba(0,0,0,0)');lg.addColorStop(1,lo);x.globalAlpha=.55;x.fillStyle=lg;x.fillRect(-r-M,-r-M,(r+M)*2,(r+M)*2);x.globalAlpha=1;x.rotate(g.th);
// engraved rings, rim bevel, tooth outline
x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1.4;x.beginPath();x.arc(0,0,r-1.6*M,0,7);x.stroke();x.strokeStyle='rgba(255,255,255,.25)';x.beginPath();x.arc(0,0,r-1.6*M-1.4,0,7);x.stroke();
x.restore();x.save();x.rotate(g.th);x.strokeStyle='rgba(20,10,0,.6)';x.lineWidth=1.4;x.stroke(g.P);
x.fillStyle='rgba(0,0,0,.45)';x.font='600 7px "Overpass Mono"';x.textAlign='center';if(g.z>=18)x.fillText('Z'+g.z,0,-(g.spokes?r*.82:r*.55)+2);
// hub
const hr=Math.max(8,r*.18);let hg2=x.createRadialGradient(-hr*.3,-hr*.3,0,0,0,hr);hg2.addColorStop(0,'#eef2f4');hg2.addColorStop(1,'#3a4248');x.fillStyle=hg2;x.beginPath();x.arc(0,0,hr,0,7);x.fill();x.strokeStyle='#1a2226';x.lineWidth=1;x.stroke();
x.fillStyle='#1a2226';for(let k=0;k<(hr>10?6:4);k++){const a=k/(hr>10?6:4)*Math.PI*2;x.beginPath();x.arc(Math.cos(a)*hr*.62,Math.sin(a)*hr*.62,1.4,0,7);x.fill()}x.beginPath();x.arc(0,0,hr*.28,0,7);x.fill();
x.restore();
if(g===hovG&&!drag){x.strokeStyle='rgba(233,199,154,.7)';x.setLineDash([4,4]);x.lineWidth=1.2;x.beginPath();x.arc(0,0,r+M+6,0,7);x.stroke();x.setLineDash([])}
x.restore()}
function crank(){const g=G[0],[cx,cy]=crankPos();const X=OX+g.x*S,Y=OY+g.y*S,KX=OX+cx*S,KY=OY+cy*S;x.save();x.lineCap='round';x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=16*S;x.beginPath();x.moveTo(X+6*dpr,Y+10*dpr);x.lineTo(KX+6*dpr,KY+10*dpr);x.stroke();
const lg=x.createLinearGradient(X,Y,KX,KY);lg.addColorStop(0,'#3a4248');lg.addColorStop(.5,'#cfd6da');lg.addColorStop(1,'#5a6268');x.strokeStyle=lg;x.lineWidth=12*S;x.beginPath();x.moveTo(X,Y);x.lineTo(KX,KY);x.stroke();
const kg=x.createRadialGradient(KX-5*S,KY-6*S,0,KX,KY,16*S);kg.addColorStop(0,'#a8542a');kg.addColorStop(1,'#3a1408');x.fillStyle=kg;x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=10*dpr;x.shadowOffsetY=6*dpr;x.beginPath();x.arc(KX,KY,15*S,0,7);x.fill();x.restore()}
function blueprint(){x.save();x.strokeStyle='rgba(160,220,255,.7)';x.fillStyle='rgba(160,220,255,.85)';x.lineWidth=dpr;x.font=`${10*dpr}px "Overpass Mono"`;
for(const g of G){const X=OX+g.x*S,Y=OY+g.y*S;x.setLineDash([6*dpr,4*dpr]);x.beginPath();x.arc(X,Y,g.r*S,0,7);x.stroke();x.setLineDash([2*dpr,3*dpr]);x.beginPath();x.moveTo(X-(g.r+20)*S,Y);x.lineTo(X+(g.r+20)*S,Y);x.moveTo(X,Y-(g.r+20)*S);x.lineTo(X,Y+(g.r+20)*S);x.stroke();x.setLineDash([]);
if(g.par){const P=g.par;x.beginPath();x.moveTo(OX+P.x*S,OY+P.y*S);x.lineTo(X,Y);x.stroke()}x.fillText(`Z${g.z} · m${M} · ${(g.ratio).toFixed(2)}`,X+(g.r*.7)*S,Y-(g.r*.7)*S-6*dpr)}x.restore()}
function f(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!bgc)plate();
if(!drag){const target=motor/60*Math.PI*2;vel+=(target-vel)*Math.min(1,dt*1.6);root+=vel*dt}
curRpm=vel/(Math.PI*2)*60;solve();
const tp=Math.floor(root/(Math.PI*2/G[0].z));if(tp!==teethPassed){const rate=Math.abs(vel)/(Math.PI*2)*G[0].z;if(rate<26)tick(Math.random()*2);teethPassed=tp}
if(hg&&son){const rate=Math.abs(vel)/(Math.PI*2)*G[0].z;hum.frequency.setTargetAtTime(Math.max(20,rate*2),ac.currentTime,.05);hg.gain.setTargetAtTime(rate>26?Math.min(.05,(rate-26)*.002):0,ac.currentTime,.1)}
x.drawImage(bgc,0,0);for(const g of G)gear(g);crank();if(blue)blueprint();
const out=G[G.length-1];document.getElementById('r').innerHTML=`driver ${curRpm.toFixed(1)} rpm<br>output ${(curRpm*out.ratio).toFixed(1)} rpm · ratio ${Math.abs(out.ratio).toFixed(3)} : 1`;
requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
