<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dawn Voyage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Courier+Prime&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#ffd3b0}canvas{display:block;width:100%;height:100%}
.log{position:fixed;left:5vw;top:7vh;color:#1d2f4a}.log h1{font:400 clamp(34px,5.5vw,84px)/.95 'Young Serif',serif}.log p{font:14px/1.6 'Courier Prime',monospace;margin-top:14px;max-width:34ch}</style></head><body>
<canvas id="c"></canvas><div class="log"><h1>Day 41,<br>at dawn</h1><p>42°17′N 31°04′W · wind WSW force 4 · the swell has softened and the gulls are back.<br>Sea state <b id="ss">3</b> — move the cursor to change the weather.</p></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H;
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);
const L=[['#f28f86',.6,.9,.5],['#c86b85',.64,1.1,.7],['#6d5a8f',.69,1.4,1],['#3f5b8f',.75,1.8,1.4],['#25457a',.82,2.3,1.9],['#1d2f4a',.9,3,2.6]];
let sea=1,ts=1,bxT=.42,bxx=.42;addEventListener('pointermove',e=>{ts=.3+(e.clientY/innerHeight)*2.4;bxT=.15+e.clientX/innerWidth*.7});const wave=(X,k,t)=>sea*(Math.sin(X*.004/dpr*(1+k*.2)+t*(.6+k*.15)+k)*(6+k*5)*dpr+Math.sin(X*.011/dpr+t*1.3+k*2)*(2+k*1.5)*dpr);
function f(t){t/=1000;sea+=(ts-sea)*.03;bxx+=(bxT-bxx)*.01;document.getElementById('ss').textContent=Math.max(1,Math.round(sea*2.6));const g=x.createLinearGradient(0,0,0,H*.62);g.addColorStop(0,'#8fb3e0');g.addColorStop(.5,'#ffc6a8');g.addColorStop(1,'#ffe3b8');x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle='#fff4dc';x.beginPath();x.arc(W*.72,H*.6,Math.min(W,H)*.11,0,7);x.fill();x.fillStyle='rgba(255,244,220,.25)';x.beginPath();x.arc(W*.72,H*.6,Math.min(W,H)*.16,0,7);x.fill();
x.strokeStyle='#1d2f4a';x.lineWidth=1.5*dpr;for(let b=0;b<3;b++){const bx=W*(.3+b*.06)+Math.sin(t*.5+b)*20*dpr,by=H*(.25+b*.03)+Math.sin(t*1.3+b)*6*dpr,w=Math.sin(t*4+b)*4*dpr;x.beginPath();x.moveTo(bx-10*dpr,by-w);x.quadraticCurveTo(bx-4*dpr,by-6*dpr,bx,by);x.quadraticCurveTo(bx+4*dpr,by-6*dpr,bx+10*dpr,by-w);x.stroke()}
L.forEach(([col,base,_,sp],k)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,H);for(let X=0;X<=W;X+=6*dpr)x.lineTo(X,H*base+wave(X,k,t*sp*.5));x.lineTo(W,H);x.fill();
x.strokeStyle='rgba(255,244,220,.55)';x.lineWidth=1.2*dpr;x.beginPath();for(let X=0;X<=W;X+=6*dpr){const y=H*base+wave(X,k,t*sp*.5);if(Math.sin(X*.02/dpr+k*7+t)>.6){x.moveTo(X,y+3*dpr);x.lineTo(X+10*dpr,y+3*dpr)}}x.stroke();
if(k===3){const bx=W*bxx+Math.sin(t*.1)*W*.02,by=H*base+wave(bx,k,t*sp*.5),by2=H*base+wave(bx+30*dpr,k,t*sp*.5),ang=Math.atan2(by2-by,30*dpr),s=Math.min(W,H)/700;x.save();x.translate(bx,by-2*dpr);x.rotate(ang);x.scale(s,s);
x.fillStyle='#1d2f4a';x.beginPath();x.moveTo(-60,0);x.lineTo(60,0);x.lineTo(44,18);x.lineTo(-48,18);x.fill();x.fillRect(-2,-120,4,120);x.fillStyle='#fff4dc';x.beginPath();x.moveTo(4,-116);x.quadraticCurveTo(60,-60,54,-8);x.lineTo(4,-8);x.fill();x.beginPath();x.moveTo(-4,-104);x.quadraticCurveTo(-40,-50,-48,-8);x.lineTo(-4,-8);x.fill();x.fillStyle='#f28f86';x.beginPath();x.moveTo(2,-120);x.lineTo(24,-126);x.lineTo(2,-132);x.fill();x.restore()}});
requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
