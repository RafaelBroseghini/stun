<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kettle Mk II Blueprint</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Overpass+Mono:wght@400;700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#123d7a;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);background-size:20px 20px,20px 20px,100px 100px,100px 100px;display:grid;place-items:center}
svg{width:96vw;height:94vh}svg *{fill:none;stroke:#e8f1ff;stroke-width:1.4;vector-effect:non-scaling-stroke}
.d{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dr 3.5s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.dim{stroke:#9fc3ff;stroke-width:.8}.hid{stroke-dasharray:6 4}.ctr{stroke-dasharray:18 4 3 4;stroke:#9fc3ff;stroke-width:.7}
text{fill:#e8f1ff;stroke:none;font-family:'Overpass Mono',monospace;font-size:13px}.hand{font-family:'Architects Daughter',cursive;font-size:18px;fill:#fff}.tb text{font-size:11px}svg>g{cursor:pointer}svg>g:hover *{stroke:#ffd36a}svg>g:hover text{fill:#ffd36a}.tb .big{font-size:20px;font-weight:700}</style></head><body>
<svg viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet">
<rect x="20" y="20" width="1160" height="720"/><rect x="28" y="28" width="1144" height="704" class="dim"/>
<g transform="translate(330,400)"><path class="d" d="M-150 160H150L170 60C175 -20 120 -90 0 -95C-120 -90 -175 -20 -170 60Z"/><path class="d" d="M-60 -95C-60 -130 60 -130 60 -95"/><path class="d" d="M-20 -128h40v-14h-40z"/><path class="d" d="M170 40c60 0 110-40 140-100l12 6c-30 70-80 120-150 124"/><path class="d" d="M-170 0c-70 0-80 120 0 120M-170 20c-45 0-50 80 0 80"/>
<path class="hid" d="M-140 150H140L158 60C162 -10 110 -80 0 -84C-110 -80 -162 -10 -158 60Z"/><path class="ctr" d="M0 -170V200M-220 40H360"/><path class="d" d="M-120 160v18h240v-18"/>
<path class="dim" d="M-150 210H150M-150 200v20M150 200v20"/><text x="-26" y="230">Ø 300</text><path class="dim" d="M220 160V-95M210 160h20M210 -95h20"/><text x="230" y="40" transform="rotate(-90 230 40)">255</text>
<text class="hand" x="-140" y="-190">fig. 1 — elevation, spout E</text><path class="dim" d="M300 -70l60-60h90"/><text x="370" y="-136">spout: 18° rake</text></g>

<g transform="translate(0,190)"><path class="d" d="M-90 0h180l-14 40h-152z"/><path class="d" d="M-60 40v30h120v-30"/><text x="100" y="30">B — heating base</text><path class="ctr" d="M0 -40v130"/></g><text x="80" y="-80">A — lid assembly</text></g>
<g class="tb" transform="translate(790,560)"><rect width="370" height="160"/><path d="M0 40h370M0 80h370M0 120h370M200 40v120"/><text x="12" y="28" class="big">ORBITAL KETTLE · MK II</text><text x="12" y="64">DRAWN: E. HALVORSEN</text><text x="212" y="64">SCALE 1 : 2.5</text><text x="12" y="104">MATERIAL: 304 STAINLESS</text><text x="212" y="104">SHEET 3 OF 7</text><text x="12" y="144">CAPACITY 1.7 L · 2.2 kW</text><text x="212" y="144">REV. C · 11/2026</text></g>
<text class="hand" x="60" y="712" style="font-size:15px;opacity:.8">hover a figure to trace it · click the sheet to redraw</text><text class="hand" x="60" y="80">NB: handle insulated — check with Ingrid re: cork vs. walnut</text></svg>
<script>const ds=document.querySelectorAll('.d');ds.forEach((p,i)=>p.style.animationDelay=(i*.18)+'s');document.querySelector('svg').addEventListener('click',()=>{ds.forEach(p=>{p.style.animation='none';p.getBoundingClientRect();p.style.animation=''})})</script>
</body></html>
