<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Minute Hourglass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#20303a;display:grid;place-items:center;font-family:'Tenor Sans',sans-serif;color:#e8dcc8}
.w{position:relative;height:min(86vh,130vw);aspect-ratio:.55;cursor:pointer;transition:transform 1.2s cubic-bezier(.6,0,.3,1)}canvas{width:100%;height:100%;display:block}
.t{position:fixed;left:6vw;top:50%;transform:translateY(-50%)}.t b{display:block;font-size:clamp(50px,9vw,130px);font-weight:400;font-variant-numeric:tabular-nums;line-height:1}.t span{font-size:12px;letter-spacing:.4em}
@media(max-width:700px){.t{top:auto;bottom:3vh;transform:none}.t b{font-size:40px}}</style></head><body>
<div class="t"><b id="tm">60</b><span>SECONDS · CLICK TO TURN</span></div><div class="w" id="w"><canvas id="c"></canvas></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,t0=performance.now(),rot=0,flipping=false,grains=[];const D=60000;
function size(){const d=Math.min(devicePixelRatio,2);W=c.width=c.clientWidth*d;H=c.height=c.clientHeight*d}size();addEventListener('resize',size);
document.getElementById('w').onclick=()=>{if(flipping)return;flipping=true;rot+=180;document.getElementById('w').style.transform=`rotate(${rot}deg)`;setTimeout(()=>{flipping=false;const el=performance.now()-t0;t0=performance.now()-Math.max(0,D-Math.min(D,el));document.getElementById('w').style.transition='none';rot=0;document.getElementById('w').style.transform='none';void c.offsetWidth;document.getElementById('w').style.transition=''},1250)};
const half=y=>{const u=Math.abs(y)/(H*.42);return W*.36*Math.pow(Math.min(1,u),.75)+W*.018};
function f(now){const p=Math.min(1,(now-t0)/D);document.getElementById('tm').textContent=Math.ceil(60*(1-p));x.clearRect(0,0,W,H);const cx=W/2,cy=H/2;
x.fillStyle='#5a3a22';x.fillRect(W*.04,0,W*.92,H*.05);x.fillRect(W*.04,H*.95,W*.92,H*.05);x.fillStyle='#7a5232';for(const X of [W*.08,W*.88])x.fillRect(X,H*.05,W*.04,H*.9);
x.save();x.beginPath();for(let y=-H*.43;y<=H*.43;y+=2)x.lineTo(cx-half(y),cy+y);for(let y=H*.43;y>=-H*.43;y-=2)x.lineTo(cx+half(y),cy+y);x.closePath();x.fillStyle='rgba(200,230,255,.08)';x.fill();x.clip();
const top=1-p;const ty=-H*.43*(1-Math.pow(1-top,.7))*.0+0;const topLevel=-H*.02-H*.38*Math.sqrt(top);
x.fillStyle='#e9c48a';x.beginPath();x.moveTo(cx-W,topLevel);if(top>0){for(let X=-W*.5;X<=W*.5;X+=4)x.lineTo(cx+X,topLevel+Math.pow(Math.abs(X)/(W*.4),2)*-H*.0+(1-Math.abs(X)/(W*.5))*H*.03)}x.lineTo(cx+W,topLevel);x.lineTo(cx+W,-1);x.lineTo(cx-W,-1);
x.rect(cx-W,topLevel,W*2,cy-topLevel-H*.005);if(top<=0)x.rect(0,0,0,0);x.fill();
if(top>0){x.fillRect(cx-1.5,cy,3,H*.43);}const pile=H*.4*Math.sqrt(p);x.beginPath();x.moveTo(cx-W*.45,cy+H*.43);x.lineTo(cx-W*.45,cy+H*.43-pile*.55);x.quadraticCurveTo(cx,cy+H*.43-pile*1.25,cx+W*.45,cy+H*.43-pile*.55);x.lineTo(cx+W*.45,cy+H*.43);x.fill();
x.restore();x.strokeStyle='rgba(230,240,255,.6)';x.lineWidth=3;x.beginPath();for(let y=-H*.43;y<=H*.43;y+=2)x.lineTo(cx-half(y),cy+y);x.stroke();x.beginPath();for(let y=-H*.43;y<=H*.43;y+=2)x.lineTo(cx+half(y),cy+y);x.stroke();
x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=6;x.beginPath();for(let y=-H*.38;y<=-H*.1;y+=2)x.lineTo(cx-half(y)*.75,cy+y);x.stroke();requestAnimationFrame(f)}requestAnimationFrame(f);t0=performance.now()-14000;
</script></body></html>
