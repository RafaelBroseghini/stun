<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Midnight Mittens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
body{background:#f3ead3 radial-gradient(circle,rgba(0,0,0,.08) 1px,transparent 1.5px) 0 0/10px 10px;display:grid;place-items:center;font-family:'Comic Neue',cursive}
.view{position:relative;height:min(96vh,150vw);aspect-ratio:.68;max-width:98vw}
.pg{position:absolute;inset:0;background:#fffdf5;padding:2.2%;display:grid;grid-template:.5fr 1.1fr 1fr 1.25fr/1fr 1fr 1fr;gap:1.6%;box-shadow:0 20px 40px rgba(0,0,0,.25);transform-origin:0 0;transition:transform .8s cubic-bezier(.6,0,.2,1)}
.p{position:relative;border:3px solid #111;overflow:hidden;opacity:0;transform:scale(.96);animation:in .5s forwards;cursor:zoom-in;transition:box-shadow .3s}@keyframes in{to{opacity:1;transform:none}}
.p:hover{box-shadow:6px 6px 0 #111}.focus .p{cursor:pointer}.p.dim{filter:brightness(.55) saturate(.5)}
.ht{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(0,0,0,.22) 30%,transparent 32%);background-size:8px 8px}
.bub{position:absolute;background:#fff;border:2.5px solid #111;border-radius:50%/46%;padding:.6em .9em;font-size:min(1.7vh,2.4vw);line-height:1.15;text-align:center;text-transform:uppercase;z-index:2;transform-origin:30% 110%}.bub::after{content:"";position:absolute;bottom:-14px;left:30%;border:8px solid transparent;border-top:14px solid #111}
.cap{position:absolute;left:0;top:0;background:#ffe14d;border:0 solid #111;border-width:0 3px 3px 0;padding:.4em .7em;font-size:min(1.5vh,2.1vw);text-transform:uppercase;z-index:2}
.fx{position:absolute;font:400 min(9vh,13vw)/1 Bangers,cursive;color:#ffe14d;-webkit-text-stroke:3px #111;paint-order:stroke fill;transform:rotate(-12deg);letter-spacing:.04em;text-shadow:6px 6px 0 #e63946;z-index:2;animation:pop .6s 1.3s both}@keyframes pop{from{transform:rotate(-12deg) scale(0)}70%{transform:rotate(-12deg) scale(1.2)}}
.burst{position:absolute;left:4%;top:12%;width:62%;aspect-ratio:1;background:#fff;clip-path:polygon(50% 0,58% 30%,85% 10%,70% 38%,100% 40%,72% 55%,95% 80%,62% 66%,55% 100%,45% 68%,15% 92%,30% 60%,0 52%,28% 40%,10% 14%,40% 30%);opacity:.9;z-index:1;animation:pop .5s 1.2s both}
.title{grid-column:1/-1;display:flex;align-items:center;justify-content:center;background:#1d3557}.title h1{font:400 min(5.6vh,8vw)/1 Bangers,cursive;color:#ffe14d;-webkit-text-stroke:2px #111;letter-spacing:.06em;text-shadow:5px 5px 0 #e63946;z-index:2}
.moon{position:absolute;right:8%;top:12%;width:24%;aspect-ratio:1;border-radius:50%;background:#ffe9a8;box-shadow:0 0 30px #ffe9a8}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw 2s infinite alternate}@keyframes tw{to{opacity:.2}}
.cat{position:absolute;width:30%;aspect-ratio:1}.cat::before{content:"";position:absolute;inset:20% 10% 0;background:#111;border-radius:50% 50% 40% 40%}.cat::after{content:"";position:absolute;left:14%;right:14%;top:4%;height:30%;background:linear-gradient(135deg,transparent 50%,#111 50%) left/50% 100% no-repeat,linear-gradient(-135deg,transparent 50%,#111 50%) right/50% 100% no-repeat}
.cat .tail{position:absolute;right:-18%;bottom:6%;width:40%;height:14%;border:6px solid #111;border-color:#111 #111 transparent transparent;border-radius:0 100% 0 0;transform-origin:0 100%;animation:tail 1.4s ease-in-out infinite alternate}@keyframes tail{to{transform:rotate(-24deg)}}
.cat .ey{position:absolute;top:38%;width:9%;height:9%;background:#ffe14d;border-radius:50%;z-index:2;animation:blink 4s infinite}.cat .ey:nth-child(2){left:34%}.cat .ey:nth-child(3){left:56%}@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eye{position:absolute;width:5%;aspect-ratio:1;background:#ffe14d;border-radius:50%;z-index:2;animation:blink 3s infinite}
.sky{background:linear-gradient(#1d3557,#457b9d)}.red{background:#e63946}.cyan{background:#a8dadc}
.gem{position:absolute;width:16%;aspect-ratio:1;background:linear-gradient(135deg,#7fffd4,#00a6a6);transform:rotate(45deg);box-shadow:0 0 30px #7fffd4;animation:gl 2s ease-in-out infinite alternate}@keyframes gl{to{box-shadow:0 0 60px #b8fff0;filter:brightness(1.3)}}
.las{position:absolute;inset:-20%;background:repeating-linear-gradient(60deg,transparent 0 30px,rgba(255,40,60,.85) 30px 33px),repeating-linear-gradient(-50deg,transparent 0 44px,rgba(255,40,60,.85) 44px 47px);animation:sw 3s ease-in-out infinite alternate}@keyframes sw{to{transform:translate(20px,-12px) rotate(3deg)}}
.dog{position:absolute;left:4%;bottom:0;width:26%;aspect-ratio:1;opacity:0;transition:opacity .4s,transform .5s cubic-bezier(.2,.9,.3,1.4);transform:translateY(30%)}.dog.on{opacity:1;transform:none}
.dog::before{content:"";position:absolute;inset:30% 0 0 10%;background:#111;border-radius:40% 40% 10% 10%}.dog::after{content:"";position:absolute;left:0;top:14%;width:44%;height:36%;background:#111;border-radius:50% 50% 40% 40%;box-shadow:-10px 4px 0 -4px #111}
.nav{position:fixed;left:50%;bottom:1.6vh;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font:400 16px Bangers;letter-spacing:.08em;z-index:5}
.nav button{font:400 16px Bangers;letter-spacing:.08em;background:#ffe14d;border:3px solid #111;box-shadow:3px 3px 0 #111;padding:4px 12px;cursor:pointer}.nav button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111}
.focus .view{overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.25)}@media (max-height:640px){.nav{bottom:4px}}
</style></head><body>
<div class="view" id="view"><div class="pg" id="pg"><div class="p title" style="animation-delay:0s"><div class="ht" style="opacity:.4"></div><h1>Midnight Mittens!</h1><small style="position:absolute;right:10px;bottom:6px;z-index:2;color:#fff;font-size:min(1.3vh,1.8vw);letter-spacing:.08em">ISSUE #1 · 10¢</small></div>
<div class="p sky" style="grid-column:span 2;animation-delay:.15s"><div class="ht"></div><i class="star" style="left:12%;top:18%"></i><i class="star" style="left:30%;top:10%;animation-delay:-1s"></i><i class="star" style="left:52%;top:30%;animation-delay:-.5s"></i><div class="moon"></div><div class="cap">Gallery district. 2:14 a.m.</div><div class="cat" style="left:12%;bottom:0"><i class="ey"></i><i class="ey"></i><i class="tail"></i></div><div class="bub" style="left:44%;top:22%">The Duchess Emerald… all alone. Purr-fect.</div></div>
<div class="p cyan" style="animation-delay:.3s"><div class="ht"></div><div class="gem" style="left:40%;top:40%"></div><div class="cap">Room 7</div></div>
<div class="p red" style="animation-delay:.45s"><div class="ht" style="opacity:.6"></div><div class="eye" style="left:30%;top:40%"></div><div class="eye" style="left:42%;top:40%"></div><div class="bub" style="left:10%;top:62%;font-size:min(1.4vh,2vw)">Wait. Lasers?!</div></div>
<div class="p" style="grid-column:span 2;background:#111;animation-delay:.6s"><div class="las"></div><div class="cat" style="left:38%;bottom:10%;transform:rotate(-30deg)" id="leap"><i class="ey"></i><i class="ey"></i><i class="tail"></i></div><div class="cap">One leap. One chance.</div></div>
<div class="p sky" style="grid-column:span 3;animation-delay:.75s" id="last"><div class="ht"></div><div class="burst"></div><div class="fx" style="left:8%;top:28%">KRA-KOOM!</div><div class="dog" id="dog"></div><div class="cat" style="right:10%;bottom:0;width:22%"><i class="ey"></i><i class="ey"></i><i class="tail"></i></div><div class="gem" style="right:16%;top:20%;width:9%"></div><div class="bub" style="right:30%;top:14%">…did someone order a SECURITY DOG?</div><div class="cap" style="left:auto;right:0;top:auto;bottom:0;border-width:3px 0 0 3px">To be continued!</div></div></div></div>
<div class="nav"><button id="pv">◀</button><span id="lb">TAP A PANEL TO READ</span><button id="nx">▶</button><button id="ov">PAGE</button></div>
<script>
const pg=document.getElementById('pg'),view=document.getElementById('view');const panels=[...pg.querySelectorAll('.p')];let cur=-1;
let ac;function A(){if(!ac)try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return ac}
const SFX=[()=>blip(660,.1),()=>{blip(400,.3,'sine');blip(500,.3,'sine',.15)},()=>{for(let i=0;i<5;i++)blip(1600+i*200,.05,'sine',i*.05)},()=>{blip(1200,.08,'square');blip(900,.08,'square',.1)},()=>{for(let i=0;i<3;i++)blip(1800,.04,'sawtooth',i*.09)},()=>boom()];
function blip(f,d,type='triangle',w=0){const a=A();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+w;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function boom(){const a=A();if(!a)return;const b=a.createBuffer(1,a.sampleRate*.8,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=500;g.gain.value=.7;s.connect(f).connect(g).connect(a.destination);s.start();blip(220,.4,'square',.05)}
function go(i){cur=Math.max(-1,Math.min(panels.length-1,i));if(cur<0){pg.style.transform='';panels.forEach(p=>p.classList.remove('dim'));document.body.classList.remove('focus');document.getElementById('lb').textContent='TAP A PANEL TO READ';return}
document.body.classList.add('focus');const p=panels[cur];const V=view.getBoundingClientRect(),P=pg.getBoundingClientRect();const pr=p.getBoundingClientRect();const cur0=pg.style.transform;const s0=P.width/V.width;
const px=(pr.left-P.left)/s0,py=(pr.top-P.top)/s0,pw=pr.width/s0,ph=pr.height/s0;const s=Math.min(V.width/pw,V.height/ph)*.94;const tx=(V.width-pw*s)/2-px*s,ty=(V.height-ph*s)/2-py*s;pg.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
panels.forEach((q,k)=>q.classList.toggle('dim',k!==cur));document.getElementById('lb').textContent=`PANEL ${cur+1} / ${panels.length}`;act(cur)}
function act(i){const p=panels[i];SFX[i]&&SFX[i]();p.querySelectorAll('.fx,.bub,.burst').forEach(e=>e.animate([{scale:0},{scale:1.2},{scale:1}],{duration:500,easing:'cubic-bezier(.2,.9,.3,1.4)'}));
if(i===4){const c=document.getElementById('leap');c.animate([{transform:'rotate(-30deg) translate(0,0)'},{transform:'rotate(-10deg) translate(60%,-60%)'},{transform:'rotate(10deg) translate(120%,0)'}],{duration:900,easing:'ease-in-out'})}
if(i===5){p.animate([{translate:'0 0'},{translate:'-8px 5px'},{translate:'7px -6px'},{translate:'-4px 2px'},{translate:'0 0'}],{duration:420});setTimeout(()=>document.getElementById('dog').classList.add('on'),600)}}
panels.forEach((p,i)=>p.addEventListener('click',()=>{A();if(cur===i)go(i+1>=panels.length?-1:i+1);else go(i)}));
document.getElementById('nx').onclick=()=>{A();go(cur+1>=panels.length?-1:cur+1)};document.getElementById('pv').onclick=()=>go(cur-1);document.getElementById('ov').onclick=()=>go(-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();A();go(cur+1>=panels.length?-1:cur+1)}if(e.key==='ArrowLeft')go(cur-1);if(e.key==='Escape')go(-1)});
addEventListener('resize',()=>{if(cur>=0)go(cur)});
</script>
</body></html>
