<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Midnight Mittens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#f3ead3;display:grid;place-items:center;font-family:'Comic Neue',cursive}
.pg{height:min(96vh,150vw);aspect-ratio:.68;max-width:98vw;background:#fffdf5;padding:2.2%;display:grid;grid-template:.5fr 1.1fr 1fr 1.25fr/1fr 1fr 1fr;gap:1.6%;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.p{position:relative;border:3px solid #111;overflow:hidden;opacity:0;transform:scale(.96);animation:in .5s forwards}@keyframes in{to{opacity:1;transform:none}}.p{cursor:pointer;transition:scale .35s cubic-bezier(.2,.9,.3,1.4),rotate .35s,box-shadow .35s}.p:hover{scale:1.04;rotate:-1deg;z-index:4;box-shadow:8px 8px 0 #111}
.ht{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(0,0,0,.22) 30%,transparent 32%);background-size:8px 8px}
.bub{position:absolute;background:#fff;border:2.5px solid #111;border-radius:50%/46%;padding:.6em .9em;font-size:min(1.7vh,2.4vw);line-height:1.15;text-align:center;text-transform:uppercase;z-index:2}.bub::after{content:"";position:absolute;bottom:-14px;left:30%;border:8px solid transparent;border-top:14px solid #111}
.cap{position:absolute;left:0;top:0;background:#ffe14d;border:0 solid #111;border-width:0 3px 3px 0;padding:.4em .7em;font-size:min(1.5vh,2.1vw);text-transform:uppercase;z-index:2}
.fx{position:absolute;font:400 min(9vh,13vw)/1 Bangers,cursive;color:#ffe14d;-webkit-text-stroke:3px #111;paint-order:stroke fill;transform:rotate(-12deg);letter-spacing:.04em;text-shadow:6px 6px 0 #e63946;z-index:2;animation:pop .6s 1.3s both}@keyframes pop{from{transform:rotate(-12deg) scale(0)}70%{transform:rotate(-12deg) scale(1.2)}}
.title{grid-column:1/-1;display:flex;align-items:center;justify-content:center;background:#1d3557}.title h1{font:400 min(5.6vh,8vw)/1 Bangers,cursive;color:#ffe14d;-webkit-text-stroke:2px #111;letter-spacing:.06em;text-shadow:5px 5px 0 #e63946;z-index:2}
.moon{position:absolute;right:8%;top:12%;width:24%;aspect-ratio:1;border-radius:50%;background:#ffe9a8;box-shadow:0 0 30px #ffe9a8}
.cat{position:absolute;width:30%;aspect-ratio:1}.cat::before{content:"";position:absolute;inset:20% 10% 0;background:#111;border-radius:50% 50% 40% 40%}.cat::after{content:"";position:absolute;left:14%;right:14%;top:4%;height:30%;background:linear-gradient(135deg,transparent 50%,#111 50%) left/50% 100% no-repeat,linear-gradient(-135deg,transparent 50%,#111 50%) right/50% 100% no-repeat}
.eye{position:absolute;width:5%;aspect-ratio:1;background:#ffe14d;border-radius:50%;z-index:2}.sky{background:linear-gradient(#1d3557,#457b9d)}.red{background:#e63946}.cyan{background:#a8dadc}.gem{position:absolute;width:16%;aspect-ratio:1;background:linear-gradient(135deg,#7fffd4,#00a6a6);transform:rotate(45deg);box-shadow:0 0 30px #7fffd4}</style></head><body>
<div class="pg"><div class="p title" style="animation-delay:0s"><div class="ht" style="opacity:.4"></div><h1>Midnight Mittens!</h1><small style="position:absolute;right:10px;bottom:6px;z-index:2;color:#fff;font-size:min(1.3vh,1.8vw);letter-spacing:.08em">HOVER &amp; TAP THE PANELS</small></div>
<div class="p sky" style="grid-column:span 2;animation-delay:.15s"><div class="ht"></div><div class="moon"></div><div class="cap">Gallery district. 2:14 a.m.</div><div class="cat" style="left:12%;bottom:0"></div><div class="bub" style="left:44%;top:22%">The Duchess Emerald… all alone. Purr-fect.</div></div>
<div class="p cyan" style="animation-delay:.3s"><div class="ht"></div><div class="gem" style="left:40%;top:40%"></div><div class="cap">Room 7</div></div>
<div class="p red" style="animation-delay:.45s"><div class="ht" style="opacity:.6"></div><div class="eye" style="left:30%;top:40%"></div><div class="eye" style="left:42%;top:40%"></div><div class="bub" style="left:10%;top:62%;font-size:min(1.4vh,2vw)">Wait. Lasers?!</div></div>
<div class="p" style="grid-column:span 2;background:#111;animation-delay:.6s"><div style="position:absolute;inset:0;background:repeating-linear-gradient(60deg,transparent 0 30px,rgba(255,40,60,.8) 30px 33px),repeating-linear-gradient(-50deg,transparent 0 44px,rgba(255,40,60,.8) 44px 47px)"></div><div class="cat" style="left:38%;bottom:10%;transform:rotate(-30deg)"></div><div class="cap">One leap. One chance.</div></div>
<div class="p sky" style="grid-column:span 3;animation-delay:.75s"><div class="ht"></div><div class="fx" style="left:8%;top:28%">KRA-KOOM!</div><div class="cat" style="right:10%;bottom:0;width:22%"></div><div class="gem" style="right:16%;top:20%;width:9%"></div><div class="bub" style="right:30%;top:14%">…did someone order a SECURITY DOG?</div><div class="cap" style="left:auto;right:0;top:auto;bottom:0;border-width:3px 0 0 3px">To be continued!</div></div></div>
<script>
document.querySelectorAll('.p').forEach(p=>p.addEventListener('click',()=>{p.animate([{translate:'0 0'},{translate:'-7px 4px'},{translate:'6px -5px'},{translate:'-3px 2px'},{translate:'0 0'}],{duration:380});p.querySelectorAll('.fx,.bub').forEach(e=>e.animate([{scale:0},{scale:1.2},{scale:1}],{duration:500,easing:'cubic-bezier(.2,.9,.3,1.4)'}))}));
</script>
</body></html>
