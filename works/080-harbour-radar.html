<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARPA Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(80% 70% at 40% 50%,#0c1e2e,#04090f);display:flex;align-items:center;justify-content:center;gap:3vw;font-family:Oxanium,monospace;color:#5fe3ff}
.scope{position:relative;width:min(84vmin,760px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 10px #12273a,0 0 0 12px #2a4a66,0 0 0 30px #0b1724,0 0 0 32px #2a4a66,0 30px 60px #000;overflow:hidden;animation:in 1s ease backwards}@keyframes in{from{filter:brightness(0)}}
canvas{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.glass{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(40% 30% at 30% 22%,rgba(255,255,255,.08),transparent 70%),radial-gradient(circle,transparent 60%,rgba(0,0,0,.5))}
.side{width:280px;font-size:12px;line-height:1.7;letter-spacing:.06em}.side h1{font-size:22px;letter-spacing:.1em;margin-bottom:10px;color:#fff}
.side table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:10px}.side td{padding:3px 4px;border-bottom:1px solid #16334a;cursor:pointer}.side tr.n td{color:#ff9a3c}.side tr.sel td{background:rgba(95,227,255,.12)}
.btn{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.btn button{font:600 11px Oxanium;letter-spacing:.1em;color:#5fe3ff;background:#0b1724;border:1px solid #2a4a66;padding:6px 10px;cursor:pointer}.btn button[aria-pressed="true"]{background:#5fe3ff;color:#07131f}
.al{color:#ff4a4a;font-weight:700;animation:bl .5s steps(1) infinite;visibility:hidden}.al.on{visibility:visible}@keyframes bl{50%{opacity:.2}}
.ro{font-variant-numeric:tabular-nums;color:#bff4ff}
@media(max-width:820px){.side{display:none}}
</style></head><body>
<div class="scope"><canvas id="c"></canvas><div class="glass"></div></div>
<div class="side"><h1>ARPA · <span id="rn">6</span> NM</h1>OWN SHIP 054.0° · 11.2 KN<br>GAIN 72 · SEA 18 · RAIN 04
<div class="btn" id="rg"><button data-r="3">3 NM</button><button data-r="6" aria-pressed="true">6 NM</button><button data-r="12">12 NM</button><button id="gz" aria-pressed="false">GUARD</button><button id="sd">SOUND</button></div>
<div class="ro">EBL <span id="eb">—</span> · VRM <span id="vr">—</span></div><div class="al" id="al">⚠ GUARD ZONE BREACH</div>
<span style="color:#ff9a3c">Click to plot a contact · drag to lay EBL/VRM · click a row to track</span><table id="tb"></table></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let S,R;function size(){S=c.width=c.height=Math.min(c.clientWidth,1000)*Math.min(devicePixelRatio||1,2);R=S/2;mkPh()}
let ph,px;function mkPh(){ph=document.createElement('canvas');ph.width=ph.height=S;px=ph.getContext('2d')}size();addEventListener('resize',size);
let range=6,guard=false,sound=false,sel=-1;const T=Array.from({length:9},(_,i)=>({id:'T'+(i+1).toString().padStart(2,'0'),r:.2+Math.random()*.75,a:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.0004,va:(Math.random()-.5)*.0008,seen:0,hist:[]}));
let uk=0,ebl=null,drag=null;const pos=e=>{const b=c.getBoundingClientRect();const dx=(e.clientX-b.left)/b.width-.5,dy=(e.clientY-b.top)/b.height-.5;return{r:Math.hypot(dx,dy)*2,a:Math.atan2(dy,dx)}};
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={p:pos(e),moved:0}});c.addEventListener('pointermove',e=>{if(!drag)return;drag.moved++;if(drag.moved>3)ebl=pos(e)});
c.addEventListener('pointerup',e=>{if(drag&&drag.moved<=3){const p=pos(e);if(p.r<.97&&p.r>.06){T.push({id:'U'+String(++uk).padStart(2,'0'),r:p.r,a:p.a,vr:(Math.random()-.5)*.0004,va:(Math.random()-.5)*.0008,seen:0,hist:[]});if(T.length>14)T.splice(9,1)}}drag=null});
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{range=+b.dataset.r;document.querySelectorAll('[data-r]').forEach(o=>o.setAttribute('aria-pressed',o===b));document.getElementById('rn').textContent=range;px.clearRect(0,0,S,S)});
document.getElementById('gz').onclick=e=>{guard=!guard;e.target.setAttribute('aria-pressed',guard)};document.getElementById('sd').onclick=e=>{sound=!sound;e.target.setAttribute('aria-pressed',sound);if(sound)audio()};
let ac;function audio(){if(!ac)try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function ping(f,v=.03,d=.15){if(!ac||!sound)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02)}
const land=[];for(let a=3.6;a<5.4;a+=.012)land.push([a,.72+Math.sin(a*9)*.06+Math.sin(a*23)*.03]);const rain=Array.from({length:3},()=>({a:Math.random()*6.28,r:.3+Math.random()*.5,s:.08+Math.random()*.06}));
let sw=0,last=performance.now(),alarm=false;
function f(now){const dt=now-last;last=now;const prev=sw;sw=(sw+dt*.0016)%(Math.PI*2);const k=6/range;
// phosphor afterglow layer fades slowly
px.globalCompositeOperation='destination-out';px.fillStyle='rgba(0,0,0,.018)';px.fillRect(0,0,S,S);px.globalCompositeOperation='source-over';
const inSweep=a=>{a=(a+Math.PI*2)%(Math.PI*2);return prev<=sw?(a>=prev&&a<sw):(a>=prev||a<sw)};
px.save();px.translate(R,R);
for(const [a,r] of land)if(inSweep(a)&&r*k<1){px.fillStyle='rgba(120,240,255,.55)';for(let q=0;q<6;q++){const rr=(r+q*.03)*k*R;if(rr<R)px.fillRect(Math.cos(a)*rr,Math.sin(a)*rr,4,4)}}
for(let q=0;q<8;q++){const a=prev+Math.random()*(sw-prev||.01),rr=Math.pow(Math.random(),3)*R*.22;px.fillStyle='rgba(120,240,255,.3)';px.fillRect(Math.cos(a)*rr,Math.sin(a)*rr,2,2)}
for(const rn of rain){if(inSweep(rn.a)){for(let q=0;q<30;q++){const a=rn.a+(Math.random()-.5)*rn.s*2,rr=(rn.r+(Math.random()-.5)*rn.s)*k*R;if(rr<R){px.fillStyle='rgba(95,227,255,.18)';px.fillRect(Math.cos(a)*rr,Math.sin(a)*rr,3,3)}}}rn.a+=.0002*dt}
alarm=false;T.forEach((t,i)=>{t.r=Math.max(.08,Math.min(.95,t.r+t.vr*dt*.05));t.a+=t.va*dt*.05;if(guard&&t.r<.3)alarm=true;if(inSweep(t.a)){t.seen=now;t.hist.push([t.r,t.a]);if(t.hist.length>8)t.hist.shift();const rr=t.r*k;if(rr<1){const X=Math.cos(t.a)*rr*R,Y=Math.sin(t.a)*rr*R;px.fillStyle='#ffb36a';px.beginPath();px.arc(X,Y,6,0,7);px.fill();ping(i===sel?1320:880,.02,.08)}}});
px.restore();
// display
x.fillStyle='#04101a';x.fillRect(0,0,S,S);x.drawImage(ph,0,0);x.save();x.translate(R,R);
x.strokeStyle='rgba(95,227,255,.22)';x.lineWidth=1;x.font=`${11*S/700}px Oxanium`;x.fillStyle='rgba(95,227,255,.55)';for(let q=1;q<=6;q++){x.beginPath();x.arc(0,0,R*q/6.2,0,7);x.stroke();x.fillText((range*q/6).toFixed(range<6?1:0),4,-R*q/6.2+12)}for(let q=0;q<36;q++){const a=q*Math.PI/18;x.beginPath();x.moveTo(Math.cos(a)*R*(q%3?.96:.92),Math.sin(a)*R*(q%3?.96:.92));x.lineTo(Math.cos(a)*R,Math.sin(a)*R);x.stroke()}for(let q=0;q<12;q++){x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(q*Math.PI/6)*R,Math.sin(q*Math.PI/6)*R);x.stroke()}
if(guard){x.strokeStyle=alarm?'rgba(255,74,74,.8)':'rgba(255,154,60,.45)';x.setLineDash([6,6]);x.beginPath();x.arc(0,0,R*.3*k,0,7);x.stroke();x.setLineDash([])}
const g=x.createConicGradient?x.createConicGradient(sw-1.2,0,0):null;if(g){g.addColorStop(0,'rgba(95,227,255,0)');g.addColorStop(1.2/(Math.PI*2),'rgba(95,227,255,.3)');g.addColorStop(1.2/(Math.PI*2)+.001,'rgba(95,227,255,0)');x.fillStyle=g;x.beginPath();x.arc(0,0,R,0,7);x.fill()}
x.strokeStyle='#bff4ff';x.lineWidth=2;x.shadowColor='#5fe3ff';x.shadowBlur=10;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(sw)*R,Math.sin(sw)*R);x.stroke();x.shadowBlur=0;
// contact symbols with vectors
T.forEach((t,i)=>{const rr=t.r*k;if(rr>=1||!t.seen)return;const age=(now-t.seen)/4000;if(age>1)return;const X=Math.cos(t.a)*rr*R,Y=Math.sin(t.a)*rr*R;x.globalAlpha=1-age*.6;x.strokeStyle=i===sel?'#fff':'#ff9a3c';x.lineWidth=1.5;x.strokeRect(X-12,Y-12,24,24);
const vx=(Math.cos(t.a+t.va*800)*(t.r+t.vr*800)*k*R)-X,vy=(Math.sin(t.a+t.va*800)*(t.r+t.vr*800)*k*R)-Y;x.beginPath();x.moveTo(X,Y);x.lineTo(X+vx,Y+vy);x.stroke();x.fillStyle=x.strokeStyle;x.fillText(t.id,X+16,Y-12);
x.fillStyle='rgba(255,154,60,.4)';t.hist.forEach(([hr,ha])=>{x.fillRect(Math.cos(ha)*hr*k*R-1.5,Math.sin(ha)*hr*k*R-1.5,3,3)});x.globalAlpha=1});
if(ebl){x.strokeStyle='#7dff7a';x.setLineDash([8,6]);x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(ebl.a)*R,Math.sin(ebl.a)*R);x.stroke();x.beginPath();x.arc(0,0,Math.min(1,ebl.r)*R,0,7);x.stroke();x.setLineDash([]);document.getElementById('eb').textContent=((ebl.a*180/Math.PI+90+360)%360).toFixed(1)+'°';document.getElementById('vr').textContent=(Math.min(1,ebl.r)*range).toFixed(2)+' NM'}
x.fillStyle='#fff';x.beginPath();x.moveTo(0,-10);x.lineTo(6,8);x.lineTo(-6,8);x.fill();x.strokeStyle='rgba(255,255,255,.4)';x.beginPath();x.moveTo(0,0);x.lineTo(0,-R);x.stroke();x.restore();
document.getElementById('al').classList.toggle('on',alarm);if(alarm&&Math.floor(now/500)%2===0&&Math.floor((now-dt)/500)%2===1)ping(440,.05,.2);
requestAnimationFrame(f)}requestAnimationFrame(f);
function table(){document.getElementById('tb').innerHTML='<tr><td>ID</td><td>BRG</td><td>RNG</td><td>CPA</td></tr>'+T.map((t,i)=>{const brg=((t.a*180/Math.PI+90+360)%360).toFixed(0).padStart(3,'0');const rng=(t.r*6).toFixed(2);const cpa=(t.r*6*Math.abs(Math.sin(t.a))).toFixed(1);return `<tr data-i="${i}" class="${cpa<1?'n':''} ${i===sel?'sel':''}"><td>${t.id}</td><td>${brg}°</td><td>${rng}</td><td>${cpa}</td></tr>`}).join('');document.querySelectorAll('#tb tr[data-i]').forEach(r=>r.onclick=()=>{sel=+r.dataset.i;table()})}
setInterval(table,800);table();
</script></body></html>
