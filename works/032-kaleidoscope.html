<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brass Kaleidoscope</title>
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{background:#120d08;display:grid;place-items:center}
.tube{width:min(94vmin,900px);aspect-ratio:1;border-radius:50%;padding:3.5%;background:conic-gradient(from 30deg,#8a5a1f,#f0c472,#8a5a1f,#5a3a12,#d9a54f,#8a5a1f);box-shadow:0 0 80px rgba(240,196,114,.25),0 30px 60px #000}
canvas{width:100%;height:100%;border-radius:50%;display:block;box-shadow:inset 0 0 40px #000}
p{position:fixed;bottom:3vh;color:#d9a54f;font:italic 14px Georgia,serif;letter-spacing:.08em}</style></head><body>
<div class="tube"><canvas id="c"></canvas></div><p>Move to turn the barrel · click to shake the glass</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let S,R,w=document.createElement('canvas'),wx=w.getContext('2d'),bits=[],rot=0,tr=0;const SEG=12;
function size(){S=c.width=c.height=Math.min(c.clientWidth,1200)*Math.min(devicePixelRatio,2);R=S/2;w.width=R;w.height=R}size();addEventListener('resize',size);
const hues=[350,30,48,170,200,265,310];
function shake(){bits=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),r:.02+Math.random()*.09,h:hues[Math.random()*hues.length|0],k:Math.random()*3|0,a:Math.random()*7,vx:(Math.random()-.5)*.0015,vy:(Math.random()-.5)*.0015,va:(Math.random()-.5)*.02}))}shake();c.onclick=shake;
addEventListener('pointermove',e=>tr=(e.clientX/innerWidth-.5)*Math.PI*1.5+(e.clientY/innerHeight-.5));
function f(t){rot+=(tr-rot)*.04;wx.globalCompositeOperation='source-over';wx.fillStyle='#0d0805';wx.fillRect(0,0,R,R);wx.globalCompositeOperation='lighter';
for(const b of bits){b.x=(b.x+b.vx+1)%1;b.y=(b.y+b.vy+1)%1;b.a+=b.va;const px=b.x*R,py=b.y*R,r=b.r*R;wx.save();wx.translate(px,py);wx.rotate(b.a+rot);
const g=wx.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,`hsla(${b.h},95%,75%,.95)`);g.addColorStop(1,`hsla(${b.h+20},90%,45%,.6)`);wx.fillStyle=g;wx.beginPath();
if(b.k===0)wx.arc(0,0,r,0,7);else if(b.k===1){wx.moveTo(0,-r);wx.lineTo(r*.87,r*.5);wx.lineTo(-r*.87,r*.5)}else{wx.ellipse(0,0,r*1.4,r*.35,0,0,7)}wx.fill();wx.strokeStyle='rgba(255,255,255,.5)';wx.lineWidth=1;wx.stroke();wx.restore()}
x.clearRect(0,0,S,S);x.save();x.translate(R,R);x.rotate(rot*.3);const ang=Math.PI*2/SEG;
for(let i=0;i<SEG;i++){x.save();x.rotate(i*ang);if(i%2)x.scale(1,-1);x.beginPath();x.moveTo(0,0);x.arc(0,0,R*1.02,-ang/2-.01,ang/2+.01);x.closePath();x.clip();x.rotate(-ang/2);x.drawImage(w,0,0);x.restore()}x.restore();
const v=x.createRadialGradient(R,R,R*.6,R,R,R);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.7)');x.fillStyle=v;x.fillRect(0,0,S,S);requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
