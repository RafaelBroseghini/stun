<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Unwritten Library</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital@0;1&family=Libre+Franklin:wght@400;700&display=swap">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{--lx:50%;--ly:20%;background:#2b1d14;font-family:'Libre Franklin',sans-serif;color:#f2e3cc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:4vh 16px;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(40% 50% at var(--lx) var(--ly),rgba(255,190,110,.28),transparent 70%),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 3px,transparent 3px 120px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.55))}
h1{position:relative;z-index:1;font:400 clamp(30px,4.5vw,64px) 'Libre Caslon Display',serif;text-align:center;line-height:1}h1 small{display:block;font:400 12px 'Libre Franklin';letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-top:12px}
.shelves{position:relative;z-index:1;display:flex;flex-direction:column;gap:0;max-width:100%}
.shelf{display:flex;align-items:flex-end;gap:3px;padding:44px 22px 0;perspective:1200px;border-bottom:20px solid #6b4423;box-shadow:0 20px 0 #3b2413,0 36px 36px rgba(0,0,0,.5);max-width:100%;overflow-x:auto;overflow-y:visible;scrollbar-width:none;background:linear-gradient(#1d130c,#24170f)}
.shelf::-webkit-scrollbar{display:none}
.b{position:relative;flex:none;width:var(--w);height:var(--h);transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer;animation:slot .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes slot{from{transform:translateY(-40px);opacity:0}}
.b:hover{transform:translateY(-22px) translateZ(30px) rotateY(-18deg)}
.b.tilt{transform:rotate(-7deg);transform-origin:bottom left;margin-left:10px}.b.tilt:hover{transform:rotate(-7deg) translateY(-14px)}
.sp{position:absolute;inset:0;background:var(--c);display:flex;align-items:center;writing-mode:vertical-rl;transform:rotate(180deg);font:700 11px 'Libre Franklin';letter-spacing:.12em;text-transform:uppercase;color:var(--t);box-shadow:inset 3px 0 6px rgba(255,255,255,.15),inset -4px 0 8px rgba(0,0,0,.35);padding:12px 0;justify-content:space-between;border-radius:2px}
.sp i{font-style:normal;font:400 11px 'Libre Caslon Display',serif;letter-spacing:.05em;text-transform:none;opacity:.85}
.sp::before,.sp::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--t);opacity:.5}.sp::before{top:12%}.sp::after{bottom:12%}
.prop{flex:none;align-self:flex-end;margin:0 10px}
/* reading room */
.room{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(20,13,8,.78);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s;perspective:2000px}
.room.on{opacity:1;pointer-events:auto}
.bk{position:relative;width:min(300px,40vw);aspect-ratio:.68;transform-style:preserve-3d;transform:rotateY(-25deg) rotateX(8deg) translateX(0);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.room.open .bk{transform:rotateY(0) rotateX(0) translateX(50%)}
.pg{position:absolute;inset:3px 3px 3px 0;background:linear-gradient(90deg,#e8dcc3,#f6eedd 6%,#f6eedd);color:#2b1d14;padding:9% 10%;font:400 clamp(11px,1.15vw,14px)/1.6 'Libre Caslon Text',serif;box-shadow:inset 6px 0 10px rgba(0,0,0,.12);overflow:hidden}
.pg em{display:block;font:700 9px 'Libre Franklin';letter-spacing:.24em;text-transform:uppercase;opacity:.6;margin-bottom:10px;font-style:normal}.pg h3{font:400 1.5em 'Libre Caslon Display';margin-bottom:10px;line-height:1.1}.pg p+p{margin-top:.8em}.pg .fl::first-letter{font:400 3.2em/0.8 'Libre Caslon Display';float:left;margin:.08em .08em 0 0;color:var(--c)}
.cov{position:absolute;inset:0;transform-origin:left;transform-style:preserve-3d;transition:transform 1.1s .15s cubic-bezier(.6,0,.2,1)}.room.open .cov{transform:rotateY(-170deg)}
.cov>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:2px 6px 6px 2px}
.front{background:var(--c);color:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12% 10%;text-align:center;box-shadow:inset 8px 0 12px rgba(0,0,0,.3),inset -2px 0 4px rgba(255,255,255,.1),0 30px 60px rgba(0,0,0,.5)}
.front h2{font:400 clamp(20px,2.2vw,30px)/1.08 'Libre Caslon Display',serif}.front em{font:700 10px 'Libre Franklin';letter-spacing:.3em;text-transform:uppercase;font-style:normal}.front svg{width:55%;height:auto}
.inside{background:#efe3c8;transform:rotateY(180deg);box-shadow:inset -8px 0 12px rgba(0,0,0,.15);display:grid;place-items:center;color:#6b4a2a;font:italic 400 13px 'Libre Caslon Text';padding:12%;text-align:center}
.close{position:fixed;right:24px;top:20px;font:400 11px 'Libre Franklin';letter-spacing:.24em;text-transform:uppercase;color:#f2e3cc;background:none;border:1px solid rgba(242,227,204,.35);padding:9px 14px;cursor:pointer;z-index:11}
.hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;font:italic 14px 'Libre Caslon Text';color:#cdb898;z-index:11}
@media (max-width:640px){.bk{width:44vw}.room.open .bk{transform:translateX(48%)}}
</style></head><body>
<h1>The Unwritten Library<small>Books that should exist · choose one to read</small></h1>
<div class="shelves" id="shelves"></div>
<div class="room" id="room"><button class="close" id="cl">Return it · Esc</button><div class="bk" id="bk"><div class="pg" id="pg"></div><div class="cov"><div class="front" id="fr"></div><div class="inside" id="ins"></div></div></div><div class="hint" id="hint">Click the book to open it</div></div>
<script>
const B=[['A Field Guide to Puddles','O. Marsh','#2f5d50','#e6d3a3','Every puddle in one Welsh village, catalogued over forty wet years, with notes on depth, mood and visiting birds.','The first puddle of the year forms on the third Tuesday of October, outside the post office, and it is always shallower than you remember.'],['The Lighthouse Keeper’s Cookbook','I. Varga','#b5452c','#f2e3cc','Recipes for one, written by storm-light, from a woman who fed herself for twenty winters on a rock in the Adriatic.','Begin with the bread, because the bread takes all night, and the night is the one thing out here you have plenty of.'],['Quiet Machines','T. Okafor','#1f2a44','#d8b25a','An engineer’s love letter to the things that work without being noticed: hinges, valves, the escapement of a clock.','Consider the door hinge, which has opened for you perhaps forty thousand times and has never once asked to be thanked.'],['Small Hours','R. Lindqvist','#e3c35b','#2b1d14','Poems written between 2 and 5 a.m. over a single sleepless year in Malmö.','At three the fridge begins its sermon. / I am the only one awake to hear it, / and I agree with every word.'],['How Rivers Change Their Minds','D. Achebe','#4f6d8f','#f2e3cc','Meanders, oxbows and floods: the long, slow decisions of water.','A river never decides anything quickly, except, once a century, everything at once.'],['Notes on Fog','P. Dumont','#9aa3a0','#1f2a44','A meteorologist and a painter trade letters about the same grey morning for a decade.','Dear Hélène — this morning the fog came in at 6:40, which I know will mean nothing to you, and everything to me.'],['The Museum of Lost Umbrellas','K. Sato','#6b2d5c','#f0c9e0','A catalogue of 412 umbrellas left on the Tokyo metro, and the stories invented for each.','No. 1. Black, sixteen ribs, a single bite mark on the handle. Recovered from the Ginza line, platform three.'],['Moss','A. Brennan','#5c7a3a','#e9efd8','Slow botany for impatient people.','Lie down. No, closer. Moss does not reward anyone who is standing up.'],['Instructions for Leaving','M. Haddad','#c9783a','#2b1d14','A novel told entirely through notes left on kitchen tables.','Milk is off. Keys under the blue pot. I meant what I said, but not the way I said it.'],['Atlas of Imaginary Islands','J. Ferreira','#2a6f8f','#f6e7c1','Two hundred islands that appeared on maps and then vanished, with the sailors who swore by them.','Hy-Brasil was last seen in 1872 by a ship’s cook who described it, with great precision, as “green, and closer than you’d like”.'],['The Patience of Stones','E. Novak','#7d6a5a','#f2e3cc','A geologist reads the history of Europe in the walls of one farmhouse.','The third stone from the left in the north wall was once the floor of a warm sea.'],['Bread & Weather','L. Moreau','#d9b380','#3a2615','A baker’s almanac: how humidity, wind and moon change the crumb.','On mornings when the mistral blows, add a little less water and a little more patience.'],['Night Swimmers','S. Iqbal','#13213a','#8fc7ff','Seven friends, one lake, a summer of 1987 that none of them agree about.','Everyone remembers the lake was warm. Nobody remembers who suggested it first.'],['Lessons from Crows','H. Zielinski','#222','#cfcfcf','Ten years observing a crow family from a Warsaw balcony.','The crows learned my face in four days. It took me two years to learn theirs.'],['The Last Cartographer','N. Oyelaran','#8a2b2b','#f2d9a8','A mapmaker is hired to draw a city that is still deciding where to be.','The commission arrived by pigeon, which should have told me something about the client.'],['Tea for Insomniacs','Y. Chen','#3f5a4a','#f0e6c8','Forty blends, forty sleepless writers, one long night.','Steep for four minutes, or until the thought you were avoiding finally arrives.'],['Unfinished Symphonies','G. Aurelio','#4a3a6a','#e9d8ff','The pieces composers abandoned, and what they were doing instead.','Schubert stopped after two movements. He had, it seems, said what he needed to say.'],['The Seed Vault Diaries','F. Halvorsen','#cfd8dc','#2b3a42','A year inside the Arctic mountain that keeps the world’s gardens.','Today I counted barley. Tomorrow, if I am brave, sorghum.']];
const shelves=document.getElementById('shelves');const per=Math.ceil(B.length/2);
for(let s=0;s<2;s++){const sh=document.createElement('div');sh.className='shelf';shelves.appendChild(sh);B.slice(s*per,(s+1)*per).forEach((b,j)=>{const i=s*per+j;const e=document.createElement('div');e.className='b'+(i===6||i===15?' tilt':'');const h=170+((i*37)%7)*13,w=32+((i*53)%5)*7;e.style.cssText=`--h:${h}px;--w:${w}px;--c:${b[2]};--t:${b[3]};animation-delay:${i*.04}s`;e.innerHTML=`<div class="sp"><span>${b[0].length>24?b[0].slice(0,22)+'…':b[0]}</span><i>${b[1]}</i></div>`;e.onclick=()=>open(i);sh.appendChild(e);if(j===3){const p=document.createElement('div');p.className='prop';p.innerHTML='<svg width="46" height="60" viewBox="0 0 46 60"><path d="M8 58h30l-4-30H12z" fill="#7a5a3a"/><path d="M23 30c-10-8-14-18-8-26 4 8 10 10 8 26zM23 30c8-10 18-10 20-20-10 0-16 6-20 20z" fill="#4f7a4a"/></svg>';sh.appendChild(p)}})}
const room=document.getElementById('room'),bk=document.getElementById('bk');let cur=-1;
function orn(i){const n=5+i%5,r=40;let d='';for(let k=0;k<n*2;k++){const a=k/(n*2)*Math.PI*2,rr=k%2?r*.45:r;d+=(k?'L':'M')+(50+Math.cos(a)*rr).toFixed(1)+' '+(50+Math.sin(a)*rr).toFixed(1)}return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1"/><path d="${d}Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="50" cy="50" r="${6+i%4*2}" fill="currentColor"/></svg>`}
function open(i){cur=i;const b=B[i];bk.style.setProperty('--c',b[2]);bk.style.setProperty('--t',b[3]);document.getElementById('fr').innerHTML=`<em>${b[1]}</em>${orn(i)}<h2>${b[0]}</h2>`;document.getElementById('ins').textContent='ex libris · the unwritten library · no. '+(100+i*7);
document.getElementById('pg').innerHTML=`<em>Chapter one</em><h3>${b[0]}</h3><p class="fl">${b[5]}</p><p>${b[4]}</p>`;room.classList.remove('open');room.classList.add('on');document.getElementById('hint').textContent='Click the book to open it'}
function close(){room.classList.remove('open');setTimeout(()=>room.classList.remove('on'),room.classList.contains('open')?500:0);cur=-1}
bk.onclick=e=>{e.stopPropagation();room.classList.toggle('open');document.getElementById('hint').textContent=room.classList.contains('open')?'← → to browse · Esc to shelve':'Click the book to open it'};
room.onclick=e=>{if(e.target===room)close()};document.getElementById('cl').onclick=close;
addEventListener('keydown',e=>{if(e.key==='Escape')close();if(cur>=0&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const n=(cur+(e.key==='ArrowRight'?1:B.length-1))%B.length;open(n);setTimeout(()=>room.classList.add('open'),60)}});
addEventListener('pointermove',e=>{document.body.style.setProperty('--lx',e.clientX/innerWidth*100+'%');document.body.style.setProperty('--ly',e.clientY/innerHeight*100+'%')});
</script></body></html>
