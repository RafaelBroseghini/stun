<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Unwritten Library</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Franklin:wght@400;700&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{min-height:100%}body{background:#2b1d14 radial-gradient(ellipse at 50% 0,#5a3a24,transparent 70%);font-family:'Libre Franklin',sans-serif;color:#f2e3cc;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:3vh;overflow-x:hidden;padding:4vh 16px}
h1{font:400 clamp(30px,4.5vw,64px) 'Libre Caslon Display',serif;text-align:center;line-height:1}h1 small{display:block;font:400 12px 'Libre Franklin';letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-top:10px}
.shelf{display:flex;align-items:flex-end;gap:3px;padding:0 20px;perspective:1200px;border-bottom:22px solid #6b4423;box-shadow:0 22px 0 #3b2413,0 40px 40px rgba(0,0,0,.5);flex-wrap:nowrap;max-width:100%;overflow-x:auto;overflow-y:visible;padding-top:60px}
.b{position:relative;flex:none;width:var(--w);height:var(--h);transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.b:hover,.b.op{transform:translateY(-26px) translateZ(40px) rotateY(-22deg)}
.sp{position:absolute;inset:0;background:var(--c);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font:700 12px 'Libre Franklin';letter-spacing:.12em;text-transform:uppercase;color:var(--t);box-shadow:inset 3px 0 6px rgba(255,255,255,.15),inset -4px 0 8px rgba(0,0,0,.35);padding:10px 0;justify-content:space-between}
.sp i{font-style:normal;font:400 11px 'Libre Caslon Display',serif;letter-spacing:.05em;text-transform:none;opacity:.85}
.sp::before,.sp::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--t);opacity:.5}.sp::before{top:14%}.sp::after{bottom:14%}
.cv{position:absolute;left:100%;top:0;width:150px;height:100%;background:var(--c);transform-origin:left;transform:rotateY(90deg);filter:brightness(.8)}
.card{max-width:540px;min-height:110px;background:#f2e3cc;color:#2b1d14;padding:20px 24px;border-radius:2px;box-shadow:0 20px 40px rgba(0,0,0,.4);text-align:left}.card h2{font:400 26px 'Libre Caslon Display',serif}.card p{font-size:14px;line-height:1.55;margin-top:8px}.card em{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;font-style:normal}</style></head><body>
<h1>The Unwritten Library<small>Books that should exist · hover and choose one</small></h1><div class="shelf" id="sh"></div><div class="card" id="card"></div>
<script>
const B=[['A Field Guide to Puddles','O. Marsh','#2f5d50','#e6d3a3','Every puddle in one Welsh village, catalogued over forty wet years, with notes on depth, mood and visiting birds.'],['The Lighthouse Keeper’s Cookbook','I. Varga','#b5452c','#f2e3cc','Recipes for one, written by storm-light, from a woman who fed herself for twenty winters on a rock in the Adriatic.'],['Quiet Machines','T. Okafor','#1f2a44','#d8b25a','An engineer’s love letter to the things that work without being noticed: hinges, valves, the escapement of a clock.'],['Small Hours','R. Lindqvist','#e3c35b','#2b1d14','Poems written between 2 and 5 a.m. over a single sleepless year in Malmö.'],['How Rivers Change Their Minds','D. Achebe','#4f6d8f','#f2e3cc','Meanders, oxbows and floods: the long, slow decisions of water.'],['Notes on Fog','P. Dumont','#9aa3a0','#1f2a44','A meteorologist and a painter trade letters about the same grey morning for a decade.'],['The Museum of Lost Umbrellas','K. Sato','#6b2d5c','#f0c9e0','A catalogue of 412 umbrellas left on the Tokyo metro, and the stories invented for each.'],['Moss','A. Brennan','#5c7a3a','#e9efd8','Slow botany for impatient people.'],['Instructions for Leaving','M. Haddad','#c9783a','#2b1d14','A novel told entirely through notes left on kitchen tables.'],['Atlas of Imaginary Islands','J. Ferreira','#2a6f8f','#f6e7c1','Two hundred islands that appeared on maps and then vanished, with the sailors who swore by them.'],['The Patience of Stones','E. Novak','#7d6a5a','#f2e3cc','A geologist reads the history of Europe in the walls of one farmhouse.'],['Bread & Weather','L. Moreau','#d9b380','#3a2615','A baker’s almanac: how humidity, wind and moon change the crumb.'],['Night Swimmers','S. Iqbal','#13213a','#8fc7ff','Seven friends, one lake, a summer of 1987 that none of them agree about.'],['Lessons from Crows','H. Zielinski','#222','#cfcfcf','Ten years observing a crow family from a Warsaw balcony.']];
const sh=document.getElementById('sh'),card=document.getElementById('card');
function show(b,el){card.innerHTML=`<em>${b[1]}</em><h2>${b[0]}</h2><p>${b[4]}</p>`;document.querySelectorAll('.b').forEach(o=>o.classList.toggle('op',o===el))}
B.forEach((b,i)=>{const e=document.createElement('div');e.className='b';const h=200+((i*37)%7)*14,w=34+((i*53)%5)*7;e.style.cssText=`--h:${h}px;--w:${w}px;--c:${b[2]};--t:${b[3]}`;e.innerHTML=`<div class="sp"><span>${b[0].length>26?b[0].slice(0,24)+'…':b[0]}</span><i>${b[1]}</i></div><div class="cv"></div>`;e.onmouseenter=()=>show(b,e);e.onclick=()=>show(b,e);sh.appendChild(e)});
show(B[2],sh.children[2]);
</script></body></html>
