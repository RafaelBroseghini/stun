<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGC Imaginary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&display=swap">
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#010104}canvas{display:block;width:100%;height:100%}
.t{position:fixed;right:4vw;bottom:5vh;text-align:right;color:#cfd8ff;font:11px/1.9 Michroma,sans-serif;letter-spacing:.25em}.t b{display:block;font-size:clamp(18px,2.2vw,28px);letter-spacing:.15em;color:#fff;font-weight:400}</style></head><body>
<canvas id="c"></canvas><div class="t"><b>NGC 9001</b>BARRED SPIRAL · SBc<br>DISTANCE 31 MLY · 140,000 STARS<br>MOVE TO TILT</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');const dpr=Math.min(devicePixelRatio,2);let W,H,tilt=.55,tt=.55,rot=0;const N=16000;const S=new Float32Array(N*5);
for(let i=0;i<N;i++){const arm=i%2,r=Math.pow(Math.random(),1.6);const core=Math.random()<.18;const a=core?Math.random()*Math.PI*2:arm*Math.PI+r*6.2+(Math.random()-.5)*(1.3-r*.5);const rr=core?Math.pow(Math.random(),.7)*.2:r+.05+(Math.random()-.5)*.1;
S[i*5]=rr;S[i*5+1]=a;S[i*5+2]=(Math.random()-.5)*.05*(1-rr);S[i*5+3]=core?40+Math.random()*20:Math.random()<.3?210+Math.random()*30:Math.random()<.5?30:300+Math.random()*40;S[i*5+4]=Math.random()}
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}size();addEventListener('resize',size);addEventListener('pointermove',e=>tt=.2+e.clientY/innerHeight*.75);
const bg=Array.from({length:300},()=>[Math.random(),Math.random(),Math.random()]);
function f(){tilt+=(tt-tilt)*.04;rot+=.0012;x.fillStyle='rgba(1,1,4,.5)';x.fillRect(0,0,W,H);x.fillStyle='#fff';for(const b of bg){x.globalAlpha=b[2]*.6;x.fillRect(b[0]*W,b[1]*H,dpr,dpr)}
const R=Math.min(W,H)*.48,cx=W/2,cy=H/2;x.globalCompositeOperation='lighter';
const g=x.createRadialGradient(cx,cy,0,cx,cy,R*.35);g.addColorStop(0,'rgba(255,225,170,.55)');g.addColorStop(.4,'rgba(255,170,110,.12)');g.addColorStop(1,'rgba(0,0,0,0)');x.globalAlpha=1;x.fillStyle=g;x.save();x.translate(cx,cy);x.scale(1,tilt);x.beginPath();x.arc(0,0,R*.35,0,7);x.fill();x.restore();
for(let i=0;i<N;i++){const r=S[i*5],a=S[i*5+1]+rot/(r*1.5+.25);const px=Math.cos(a)*r*R,pz=Math.sin(a)*r*R,py=S[i*5+2]*R;const X=cx+px,Y=cy+pz*tilt+py*(1-tilt);const b=S[i*5+4];
x.globalAlpha=.4+b*.6;x.fillStyle=`hsl(${S[i*5+3]},${r<.2?60:85}%,${60+b*30}%)`;const sz=(b>.95?2.4:1.3)*dpr;x.fillRect(X,Y,sz,sz)}x.globalCompositeOperation='source-over';x.globalAlpha=1;requestAnimationFrame(f)}f();
</script></body></html>
